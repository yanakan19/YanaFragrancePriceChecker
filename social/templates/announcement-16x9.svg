<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Headline line one, last Word. Body line one, about 45 characters at most Body line two.">
  <!-- TEMPLATE: announcement, 16:9, 1920x1080. Copy into social/posts/YYYY-MM-DD-slug/ and replace the text.
       Layout and rules: social/DESIGN-SYSTEM.md. Render with: npm run social:render -->
  <rect width="1920" height="1080" fill="#0A0A0B"/>

  <!-- Wordmark, top left -->
  <g transform="translate(150 140) scale(0.1) translate(-525 -525)">
      <circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/>
      <line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/>
      <g fill="#F7F7F8">
        <rect x="452" y="366" width="52" height="42" rx="9"/>
        <rect x="463" y="402" width="30" height="26"/>
        <rect x="398" y="422" width="160" height="164" rx="34"/>
      </g>
  </g>
  <text x="222" y="160" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="56" letter-spacing="-1.5"><tspan fill="#F7F7F8">Price</tspan><tspan fill="#FF3B41">Sniffs</tspan></text>

  <!-- Headline: two lines, last word in red like "Sniffs" -->
  <g font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="150" letter-spacing="-4">
    <text x="112" y="400" fill="#F7F7F8">Headline line</text>
    <text x="112" y="560"><tspan fill="#F7F7F8">one, last </tspan><tspan fill="#FF3B41">Word</tspan></text>
  </g>

  <!-- Body -->
  <g font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="46" fill="#B9B9C0">
    <text x="120" y="670">Body line one, about 45 characters at most</text>
    <text x="120" y="732">Body line two.</text>
  </g>

  <!-- Call to action pill and address -->
  <rect x="120" y="808" width="400" height="96" rx="48" fill="#FF3B41"/>
  <text x="172" y="871" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="40" fill="#0A0A0B">Click below</text>
  <path d="M462 834 v38 M446 858 l16 16 l16 -16" stroke="#0A0A0B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="568" y="871" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="40" fill="#F7F7F8">pricesniffs.space</text>

  <!-- The mark, large, right -->
  <g transform="translate(1480 540) scale(0.62) translate(-525 -525)">
      <circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/>
      <line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/>
      <g fill="#F7F7F8">
        <rect x="452" y="366" width="52" height="42" rx="9"/>
        <rect x="463" y="402" width="30" height="26"/>
        <rect x="398" y="422" width="160" height="164" rx="34"/>
      </g>
  </g>
</svg>
