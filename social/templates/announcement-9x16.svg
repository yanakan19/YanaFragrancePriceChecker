<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Headline on one Line. Body line one, 28 characters Body line two Body line three. Click below or check the link in the bio.">
  <!-- TEMPLATE (default): announcement, vertical 9:16, 1080x1920. Copy into social/posts/YYYY-MM-DD-slug/ and replace the text.
       Layout and rules: social/DESIGN-SYSTEM.md. Render with: npm run social:render -->
  <rect width="1080" height="1920" fill="#0A0A0B"/>

  <!-- Wordmark, top centre. Everything stays inside the story safe zone, y 250 to 1670 -->
  <g transform="translate(372 300) scale(0.1) translate(-525 -525)">
      <circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/>
      <line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/>
      <g fill="#F7F7F8">
        <rect x="452" y="366" width="52" height="42" rx="9"/>
        <rect x="463" y="402" width="30" height="26"/>
        <rect x="398" y="422" width="160" height="164" rx="34"/>
      </g>
  </g>
  <text x="442" y="320" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="56" letter-spacing="-1.5"><tspan fill="#F7F7F8">Price</tspan><tspan fill="#FF3B41">Sniffs</tspan></text>

  <!-- The mark, large, centre -->
  <g transform="translate(540 720) scale(0.6) translate(-525 -525)">
      <circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/>
      <line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/>
      <g fill="#F7F7F8">
        <rect x="452" y="366" width="52" height="42" rx="9"/>
        <rect x="463" y="402" width="30" height="26"/>
        <rect x="398" y="422" width="160" height="164" rx="34"/>
      </g>
  </g>

  <!-- Headline: one line, last word in red like "Sniffs" -->
  <text x="540" y="1190" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.5" text-anchor="middle"><tspan fill="#F7F7F8">Headline on one </tspan><tspan fill="#FF3B41">Line</tspan></text>

  <!-- Body: three lines at most, about 28 characters a line -->
  <g font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="46" fill="#B9B9C0" text-anchor="middle">
    <text x="540" y="1300">Body line one, 28 characters</text>
    <text x="540" y="1362">Body line two</text>
    <text x="540" y="1424">Body line three.</text>
  </g>

  <!-- Call to action: bold white, two lines at most -->
  <g font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="46" fill="#F7F7F8" text-anchor="middle">
    <text x="540" y="1520">Click below or check</text>
    <text x="540" y="1582">the link in the bio.</text>
  </g>
</svg>
