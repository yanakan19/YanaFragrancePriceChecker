<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Headline one line, last Word. Body line one, 28 characters Body line two Body line three.">
  <!-- TEMPLATE (default): announcement, vertical 9:16, 1080x1920. Copy into social/posts/YYYY-MM-DD-slug/ and replace the text.
       Layout and rules: social/DESIGN-SYSTEM.md. Render with: npm run social:render -->
  <rect width="1080" height="1920" fill="#0A0A0B"/>

  <!-- Wordmark, top centre -->
  <g transform="translate(372 180) scale(0.1) translate(-525 -525)">
      <circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/>
      <line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/>
      <g fill="#F7F7F8">
        <rect x="452" y="366" width="52" height="42" rx="9"/>
        <rect x="463" y="402" width="30" height="26"/>
        <rect x="398" y="422" width="160" height="164" rx="34"/>
      </g>
  </g>
  <text x="442" y="200" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="56" letter-spacing="-1.5"><tspan fill="#F7F7F8">Price</tspan><tspan fill="#FF3B41">Sniffs</tspan></text>

  <!-- The mark, large, centre -->
  <g transform="translate(540 640) scale(0.62) translate(-525 -525)">
      <circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/>
      <line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/>
      <g fill="#F7F7F8">
        <rect x="452" y="366" width="52" height="42" rx="9"/>
        <rect x="463" y="402" width="30" height="26"/>
        <rect x="398" y="422" width="160" height="164" rx="34"/>
      </g>
  </g>

  <!-- Headline: two lines, last word in red like "Sniffs" -->
  <g font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="132" letter-spacing="-3.5" text-anchor="middle">
    <text x="540" y="1150" fill="#F7F7F8">Headline one</text>
    <text x="540" y="1290"><tspan fill="#F7F7F8">line, last </tspan><tspan fill="#FF3B41">Word</tspan></text>
  </g>

  <!-- Body: three lines at most, about 28 characters a line -->
  <g font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="46" fill="#B9B9C0" text-anchor="middle">
    <text x="540" y="1400">Body line one, 28 characters</text>
    <text x="540" y="1462">Body line two</text>
    <text x="540" y="1524">Body line three.</text>
  </g>

  <!-- Call to action pill and address -->
  <rect x="330" y="1630" width="420" height="100" rx="50" fill="#FF3B41"/>
  <text x="514" y="1695" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="42" fill="#0A0A0B" text-anchor="middle">Click below</text>
  <path d="M672 1656 v40 M655 1680 l17 17 l17 -17" stroke="#0A0A0B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="540" y="1820" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="42" fill="#F7F7F8" text-anchor="middle">pricesniffs.space</text>
</svg>
