<!doctype html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; background: #0A0A0B; color: #F7F7F8;
    font-family: 'Liberation Sans', Arial, Helvetica, sans-serif; }
  main { height: 100%; padding: 250px 90px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-evenly; text-align: center; }
  .top, .mid, .bottom { display: flex; flex-direction: column; align-items: center; gap: 28px; width: 100%; }
  .brandline { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 44px; letter-spacing: -1px; }
  .brandline .mark { width: 58px; height: 58px; flex: none; }
  .brandline em { font-style: normal; color: #FF3B41; }
  .date { margin: 0; padding: 10px 22px; border: 2px solid #3A3A40; border-radius: 999px;
    font-size: 28px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #B9B9C0; }
  h1 { margin: 0; font-size: 66px; letter-spacing: -2px; line-height: 1.12; }
  .flag { display: inline-block; vertical-align: -0.06em; width: 73px; height: 36px; border-radius: 6px; }
  .who { display: flex; flex-direction: column; gap: 10px; }
  .name { margin: 0; font-size: 58px; font-weight: 700; line-height: 1.1; letter-spacing: -1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .brand { margin: 0; font-size: 32px; color: #B9B9C0; letter-spacing: 3px; text-transform: uppercase; }
  .photo { position: relative; width: 420px; height: 420px; border-radius: 36px; background: #FFFFFF;
    display: flex; align-items: center; justify-content: center; }
  .photo img { width: 86%; height: 86%; object-fit: contain; border-radius: 12px; }
  .badge { position: absolute; top: -30px; right: -63px;
    width: 150px; height: 150px; border-radius: 50%; background: #FF3B41; color: #FFFFFF;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 0 8px #0A0A0B; transform: rotate(8deg); }
  .badge b { font-size: 51px; line-height: 1; letter-spacing: -1px; }
  .badge span { font-size: 23px; font-weight: 700; letter-spacing: 2px; margin-top: 4px; }
  .boxes { display: flex; gap: 24px; width: 100%; justify-content: center; }
  .box { flex: 0 1 420px; padding: 28px 16px; border-radius: 28px; border: 2px solid #FF3B41; background: #1E0709; }
  .box.best { border-color: #4FB47B; background: #14221B; }
  .label { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #FF6A6E; }
  .amount { margin: 8px 0 0; font-size: 58px; font-weight: 700; color: #FF6A6E; }
  .from { margin: 6px 0 0; font-size: 26px; color: #B9B9C0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .best .label, .best .amount { color: #4FB47B; }
  /* Where the live link sticker goes: a faint centre crosshair, nothing else. */
  .sticker { position: relative; width: 120px; height: 120px; }
  .sticker::before, .sticker::after { content: ''; position: absolute; background: #3A3A40; }
  .sticker::before { left: 59px; top: 0; width: 2px; height: 120px; }
  .sticker::after { top: 59px; left: 0; height: 2px; width: 120px; }
  .sticker i { position: absolute; left: 44px; top: 44px; width: 32px; height: 32px; border: 2px solid #3A3A40; border-radius: 50%; }
  .checked { margin: 0; font-size: 24px; color: #8A8A93; }
</style></head><body><main>
  <div class="top">
    <div class="brandline"><svg class="mark" viewBox="240 240 610 610" aria-hidden="true"><circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/><line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/><g fill="#F7F7F8"><rect x="452" y="366" width="52" height="42" rx="9"/><rect x="463" y="402" width="30" height="26"/><rect x="398" y="422" width="160" height="164" rx="34"/></g></svg><span>Price<em>Sniffs</em></span></div>
    <p class="date">Friday, 2 October 2026</p>
    <h1>And our Deal of the Day<br>today is&hellip; <svg class="flag" viewBox="0 0 60 30" aria-label="UK flag"><clipPath id="s"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg></h1>
  </div>
  <div class="mid">
    <div class="who">
      <p class="name">Yaa Umree 100ml</p>
      <p class="brand">Zimaya</p>
    </div>
    <div class="photo"><img src="https://cdn.shopify.com/s/files/1/0941/4551/1791/files/YaUmreeBottle.jpg?v=1762862914" alt=""><div class="badge"><span>SAVE</span><b>59%</b></div></div>
    <div class="boxes">
      <div class="box"><p class="label">MSRP</p><p class="amount">£45.00</p><p class="from">Brand's Current Price</p></div>
      <div class="box best"><p class="label">Cheapest price</p><p class="amount">£18.25</p><p class="from">from Perfume Click</p></div>
    </div>
  </div>
  <div class="bottom">
    <div class="sticker" aria-hidden="true"><i></i></div>
    <p class="checked">Price incl. delivery, checked 20:08 UK, 1 Oct 2026</p>
  </div>
</main></body></html>
