<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440" role="img" aria-label="Welcome to the Page. We've launched the website and it's live now for you to grab your bargains. Link in bio.">
  <!-- Launch feed post, 2026-10-01. 3:4, 1080x1440. Same design as the story,
       slightly denser, with "Link in bio" instead of the story's call to action.
       Layout and rules: social/DESIGN-SYSTEM.md. Render with: npm run social:render -->
  <rect width="1080" height="1440" fill="#0A0A0B"/>

  <!-- Wordmark, top centre -->
  <g transform="translate(372 220) scale(0.1) translate(-525 -525)">
      <circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/>
      <line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/>
      <g fill="#F7F7F8">
        <rect x="452" y="366" width="52" height="42" rx="9"/>
        <rect x="463" y="402" width="30" height="26"/>
        <rect x="398" y="422" width="160" height="164" rx="34"/>
      </g>
  </g>
  <text x="442" y="240" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="56" letter-spacing="-1"><tspan fill="#F7F7F8">Price</tspan><tspan fill="#FF3B41">Sniffs</tspan></text>

  <!-- The mark, large, centre -->
  <g transform="translate(540 540) scale(0.5) translate(-525 -525)">
      <circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/>
      <line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/>
      <g fill="#F7F7F8">
        <rect x="452" y="366" width="52" height="42" rx="9"/>
        <rect x="463" y="402" width="30" height="26"/>
        <rect x="398" y="422" width="160" height="164" rx="34"/>
      </g>
  </g>

  <!-- Headline: one line, last word in red like "Sniffs" -->
  <text x="540" y="860" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="88" letter-spacing="-1" text-anchor="middle"><tspan fill="#F7F7F8">Welcome to the </tspan><tspan fill="#FF3B41">Page</tspan></text>

  <!-- Body: three lines at most, about 28 characters a line -->
  <g font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-size="44" fill="#B9B9C0" text-anchor="middle">
    <text x="540" y="960">We've launched the website</text>
    <text x="540" y="1020">and it's live now for you</text>
    <text x="540" y="1080">to grab your bargains.</text>
  </g>

  <!-- Feed posts cannot hold a link, so: where to find it -->
  <rect x="380" y="1150" width="320" height="76" rx="38" fill="#18181B" stroke="#3A3A40" stroke-width="2"/>
  <text x="540" y="1199" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="30" letter-spacing="1" fill="#F7F7F8" text-anchor="middle">Link in bio</text>
</svg>
