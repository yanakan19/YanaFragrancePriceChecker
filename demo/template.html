  /* The sold-out placeholder keeps the row height but must not draw a tail
     pointing at a shop that is not named. */
  .sold-by[aria-hidden="true"]::before { display: none; }
  .empty-note { padding: 30px 2px; text-align: center; }

  /* ── page headings and shared panel furniture ──────────────────────────── */
  .page-head {
    display: flex; align-items: baseline; gap: 10px; margin: 4px 0 16px;
  }
  /* Every view's title is its level-one heading (an h1 carrying .t-page);
     the selectors below used to say h2, from before the pages had one. */
  .page-head h1 { margin: 0; }
  .quick-search { display: contents; }
  .count { color: var(--faint); }
  .panel-note { margin: 0 0 14px; }
  /* The search box at the top of the Oils and Sets tabs: the page's own search
     field (input[type=search] above), without the gap that field carries under
     the top bar, and a little room before the controls row. */
  .tab-search { margin: 0 0 4px; }
  .tab-search input[type="search"] { margin-top: 0; }

  /* Sort and filter controls: an icon, then the choice itself. */
  /* One grid on every list page and at every width, so the row reads the same
     everywhere: two equal columns on a phone, as many as fit on a computer.
     It used to be a wrapping flex row, which put Sort and Filters side by side
     on some pages and stacked three controls at three different widths on
     others, depending only on how long each page's labels happened to be. */
  .controls {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr));
    gap: 8px; margin: 6px 0 16px;
  }
  .control {
    display: flex; align-items: center; gap: 6px; min-width: 0; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 12px 0 11px;
    font: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
  }
  /* box-shadow rather than outline: it follows the pill's own border-radius,
     so the ring reads as one smooth rounded shape instead of the browser's
     native (square-cornered) focus box a bare <select> would otherwise draw. */
  .control:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-sf); }
  .control-ico { display: flex; color: var(--faint); }
  .ico { width: 17px; height: 17px; display: block; }
  /* A plain <select> keeps its own native chrome — including, in current
     Chrome, a focus ring painted by the OS/engine itself that `outline: none`
     cannot reach. appearance: none hands the whole control over to this CSS,
     so .control's rounded box-shadow above is the only focus indicator left;
     the chevron beside it (.control-chevron, in the markup) stands in for the
     arrow appearance: none removes. */
  .dropdown {
    flex: 1 1 auto; min-width: 0; text-overflow: ellipsis;
    font: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
    background: none; border: 0; padding: 10px 2px; cursor: pointer;
    appearance: none; -webkit-appearance: none; -moz-appearance: none; outline: none;
  }
  .dropdown::-ms-expand { display: none; }
  .dropdown:focus, .dropdown:focus-visible { outline: none; }
  .control-chevron { display: flex; color: var(--faint); pointer-events: none; margin-left: -2px; }
  /* Half a phone's width leaves a dropdown about 110px of text at 16px, and
     sort labels run to 135px ("Best Saving", "Most Common", "Highest Price").
     The leading mark gives back 23px; the words already say what the control
     is. The Filters button keeps its mark: it is a button, not a dropdown. */
  @media (max-width: 480px) {
    label.control > .control-ico { display: none; }
    .control { padding: 0 10px; }
  }
  .control-chevron .ico { width: 13px; height: 13px; }
  /* "Sort By:" in front of the select, in the box, in the closed state. Real
     text (it names the control for a screen reader), so it keeps the page's
     own muted ink rather than --faint, which is for decoration. The longest
     order ("Smallest to Largest Size") needs about 235px of its own after the
     lead, more than a 160px grid column gives a plain filter, so a sort takes
     two columns where there are columns to take (a little wider ones on a
     computer) and the whole line on a phone, rather than cutting the words
     off. Under 370px even the whole line is too short for the lead and the
     words side by side, so the lead sits above the choice inside the same
     box. The select stays a plain native select throughout. */
  .control-lead { flex: none; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
  .control-sort .dropdown { padding-left: 0; }
  .control-sort { grid-column: span 2; }
  @media (min-width: 900px) {
    .controls { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  }
  @media (max-width: 640px) {
    .control-sort { grid-column: 1 / -1; }
  }
  @media (max-width: 370px) {
    .control-sort {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
      column-gap: 6px; padding-top: 7px;
    }
    .control-sort .control-lead { grid-column: 1 / -1; font-size: 13px; line-height: 1.2; }
    .control-sort .dropdown { padding: 0 0 9px; }
  }
  /* The open dropdown's popup is drawn by the OS, not this stylesheet — the
     closed control above only sets `color`, so the engine is free to pair
     that light (or dark) text with whichever background the platform's own
     light-mode-flavoured popup chrome uses, and in dark mode that pairing
     goes light-on-light. `color-scheme` is the actual signal the platform
     reads to pick a dark-flavoured popup chrome in the first place, so it is
     the root fix; the `background`/`color` on <option> are the belt-and-
     braces half, because a UA that ignores color-scheme (or a forced-colours
     mode) still needs its own explicit pairing rather than one inherited
     property. Same reasoning applies to .field select below. */
  .dropdown, .field select { color-scheme: light dark; }
  .dropdown option, .dropdown optgroup,
  .field select option, .field select optgroup {
    background: var(--surface); color: var(--ink);
  }

  /* ── brands ────────────────────────────────────────────────────────────── */
  .brand-list { list-style: none; margin: 0; padding: 0; }
  .brand-row {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 2px; color: var(--ink);
    transition: color .12s ease;
  }
  .brand-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) {
    .brand-row:hover { color: var(--accent); }
  }
  /* Brand rows: a 32px square mark (logo or initials tile) before the name. */
  .brand-row--mark { display: flex; align-items: center; gap: 12px; }
  .brand-row--mark > .monogram, .brand-row--mark > .org-mark {
    width: 32px; height: 32px; border-radius: 9px; font-size: 12px; flex: none;
  }
  .brand-row--mark > .org-mark.org-mark-failed::after { font-size: 12px; }
  .brand-row-name { min-width: 0; overflow-wrap: anywhere; }
  /* The initial, then a rule running to the end of the column, so a long
     alphabetical list breaks into scannable blocks. */
  .alpha-break {
    display: flex; align-items: center; gap: 10px;
    margin: 18px 0 4px; color: var(--accent);
  }
  .alpha-break:first-child { margin-top: 0; }
  .alpha-break span { font-size: 13px; font-weight: 800; letter-spacing: .04em; }
  .alpha-break i { flex: 1; height: 1px; background: var(--line-firm); }

  /* ── retailers ─────────────────────────────────────────────────────────── */
  /* Initials — the default and the fallback, drawn instead of a shop's or a
     house's real logo whenever we have none on file, or whenever the one we
     do have fails to load (see .org-mark-failed below). Where we DO have a
     logo, docs/LOGOS-PLAN.md §2c/§4a-§4e set out why showing it is fine —
     s.11(2)(c) Trade Marks Act 1994, referential use, never altered, never
     copied except the small Commons public-domain set under /logos/ — and
     it renders on its own tile (.org-mark below), not this one.

     The tint is per-name, not per-brand-identity: --mh (a hue, 0-360) is set
     inline by monogram() in app.ts from a deterministic hash of the name, so
     the same shop always gets the same tile colour and different shops are
     visually distinct at a glance — a real usability win over every tile
     sharing one flat accent colour. It is not a claim about any brand's own
     palette, which this project has no licence to reproduce (the initials
     restriction above, applied to colour too) — falls back to the ordinary
     accent colour if --mh is ever unset. */
  .monogram {
    flex: none; width: 42px; height: 42px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: hsl(var(--mh, 355) var(--mono-sat) var(--mono-bg-l));
    color: hsl(var(--mh, 355) var(--mono-sat) var(--mono-fg-l));
    font-size: 14px; font-weight: 800; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    border: 1px solid hsl(var(--mh, 355) var(--mono-sat) var(--mono-border-l));
  }

  /* A real logo, in place of the monogram above — docs/LOGOS-PLAN.md §4c/§4d.
     The container is ours to style; the artwork inside it is untouched, same
     as the white tile behind feed photography (demo/photo.ts). Two shapes:
     `--square` fills the same 42px/56px box `.monogram` does; `--wordmark`
     only ever appears in the hero (orgMark's `hero` argument), a flexible box
     for a mark that does not fit a square. Three ink variants choose the
     tile's ground from a measurement, not from the page's own theme, so the
     same logo looks identical whichever palette is on screen — `--light` is
     a light tile for dark ink, `--dark` is a dark tile for light ink, `--own`
     is no fill at all for a mark that already carries its own background,
     just the shared border so it still reads as a tile.

     `.org-mark-failed` is the onerror target: the <img> removes itself and
     this class takes over, painting the exact monogram this shop or brand
     would have drawn — same tokens, same hash-derived hue, read from the
     `data-fallback` initials and `--mh` this element was already carrying
     before the image ever had a chance to fail (see orgMark's own comment in
     demo/app.ts for why that is not the "hidden fallback behind every image"
     shape productArt's own header rejects). */
  .org-mark { position: relative; overflow: hidden; box-sizing: border-box; }
  .org-mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .org-mark--square {
    flex: none; width: 42px; height: 42px; border-radius: 11px;
    border: 1px solid var(--org-mark-border);
  }
  /* A wide mark sits centred inside the same square the other logos get
     (the hero sizes every logo box to a square, see .org-hero below). The
     padding keeps it off the border; object-fit keeps its proportions. */
  .org-mark--wordmark {
    flex: none; width: 56px; height: 56px; padding: 6px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--org-mark-border);
  }
  .org-mark--wordmark img { width: 100%; height: 100%; object-fit: contain; }
  .org-mark--light { background: var(--org-mark-light-bg); }
  .org-mark--dark  { background: var(--org-mark-dark-bg); }
  .org-mark--own   { background: none; }
  .org-mark.org-mark-failed {
    background: hsl(var(--mh, 355) var(--mono-sat) var(--mono-bg-l));
    border-color: hsl(var(--mh, 355) var(--mono-sat) var(--mono-border-l));
    display: flex; align-items: center; justify-content: center;
  }
  .org-mark.org-mark-failed::after {
    content: attr(data-fallback);
    color: hsl(var(--mh, 355) var(--mono-sat) var(--mono-fg-l));
    font-size: 14px; font-weight: 800; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  /* The 20px shop mark beside a name in a product's price list. Every row
     carries one, the same box either way: the shop's square logo on its
     tile, or (no square logo, or the logo failed to load) the shop's
     initials on the monogram tint, the same tokens .monogram uses, which are
     contrast tested at every hue in both themes. */
  .offer-mark {
    display: inline-block; width: 20px; height: 20px; border-radius: 5px;
    margin-right: 7px; vertical-align: -4px; box-sizing: border-box;
  }
  .org-mark.offer-mark { border: 1px solid var(--org-mark-border); }
  /* inline-block with overflow hidden, like the logo tile, so both take
     their baseline from the bottom edge and sit at exactly the same height
     beside the name. 18px line height centres the initials inside the
     1px border. */
  .offer-mark--initials {
    overflow: hidden; white-space: nowrap; text-align: center;
    line-height: 18px;
    background: hsl(var(--mh, 355) var(--mono-sat) var(--mono-bg-l));
    color: hsl(var(--mh, 355) var(--mono-sat) var(--mono-fg-l));
    border: 1px solid hsl(var(--mh, 355) var(--mono-sat) var(--mono-border-l));
    font-size: 9px; font-weight: 800; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }

  .shop-list { list-style: none; margin: 0; padding: 0; }
  .shop-row {
    width: 100%; display: flex; align-items: center; gap: 13px; cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 2px; font: inherit; color: var(--ink); text-align: left;
    transition: background-color .12s ease;
  }
  .shop-row:active { background: var(--surface); }
  .shop-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .shop-row-text { flex: 1; min-width: 0; }
  .shop-row-name { display: block; }
  .shop-row-meta { display: block; }
  .shop-row-go { flex: none; color: var(--accent); font-weight: 700; }

  /* Module 7: the account page's own wishlist list. A remove control sits
     beside the row rather than inside it — a <button> cannot nest inside
     another <button>, and the row itself is one (it navigates to the
     fragrance on tap, same as every other .shop-row in this app). */
  .wishlist-row { display: flex; align-items: center; gap: 4px; }
  /* A fall since the day it was saved, in the app's saving colour. */
  .wishlist-change.down { color: var(--ok); }
  .wishlist-row .shop-row { width: auto; flex: 1; min-width: 0; }
  /* The row's end column: Share above Remove, each the same 34px circle, so
     adding Share did not make the row's text any narrower. */
  .wishlist-side { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .wishlist-side .wishlist-share {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 0; background: none;
    color: var(--faint);
  }
  .wishlist-side .wishlist-share .ico { width: 16px; height: 16px; }
  .wishlist-side .wishlist-share:hover, .wishlist-side .wishlist-share:focus-visible { color: var(--accent); }
  .wishlist-side .wishlist-share:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .wishlist-remove {
    flex: none; display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%; border: 0; background: none;
    color: var(--faint); cursor: pointer;
  }
  .wishlist-remove .ico { width: 15px; height: 15px; }
  .wishlist-remove:hover, .wishlist-remove:focus-visible { color: var(--accent); }
  .wishlist-remove:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Price alerts (queue item 4.1): the optional target under each saved
     fragrance, shown once alerts are on, on a line of its own. */
  .wishlist-row { flex-wrap: wrap; }
  .wishlist-target {
    flex-basis: 100%; display: flex; align-items: center; gap: 6px;
    margin: 0 0 10px 12px; color: var(--ink-2);
  }
  .wishlist-target input {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; width: 7.5em; min-height: 40px;
  }
  .wishlist-target input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .alerts-check { width: 100%; max-width: 360px; min-height: 48px; margin-top: 4px; padding-top: 8px; padding-bottom: 8px; }
  .alerts-check .facet-check-label { text-align: left; font-size: 15px; line-height: 1.35; }

  /* Logo left, everything else — name, domain, blurb, delivery — condensed
     into a right column that reads top to bottom. Replaces the old
     everything-centred-and-stacked layout, which spent most of a screen's
     height on a single shop. Shared by the retailer profile and the brand
     profile, so both read as the same kind of page. */
  /* The logo is a square whose side is the height of the title through the
     site button beside it (.org-hero-head), so its top and bottom edges sit
     flush with the heading's top and the button's bottom. The side is
     measured by alignHeroMarks() in demo/app.ts into --hero-side (the text
     wraps differently at every width, so no fixed number can do it); 56px
     is what shows before that runs. Blurb, delivery facts and the Trustpilot
     block sit under that row, full width, and are not part of the aligned
     block. */
  .org-hero {
    display: grid; grid-template-columns: var(--hero-side, 56px) minmax(0, 1fr);
    column-gap: 14px; align-items: start; padding: 6px 0 14px; text-align: left;
  }
  .org-hero > .org-mark, .org-hero > .monogram {
    grid-column: 1; grid-row: 1; box-sizing: border-box; flex: none;
    width: var(--hero-side, 56px); height: var(--hero-side, 56px);
    border-radius: min(15px, 27%);
  }
  .org-hero > .monogram, .org-hero > .org-mark.org-mark-failed::after {
    font-size: clamp(18px, calc(var(--hero-side, 56px) * .32), 30px);
  }
  .org-hero-head { grid-column: 2; grid-row: 1; min-width: 0; align-self: start; }
  .org-hero-head > :first-child { margin-top: 0; }
  .org-hero-head > :last-child { margin-bottom: 0; }
  .org-hero-head .brand-site-link { margin-top: 8px; max-width: 100%; flex-wrap: wrap; gap: 4px 6px; padding: 7px 10px 7px 9px; }
  .org-hero-more { grid-column: 1 / -1; grid-row: 2; min-width: 0; margin-top: 8px; }
  .org-hero-more > :first-child { margin-top: 0; }
  /* No room for a square beside the text (a very narrow phone and a long
     name): the logo goes above it at a fixed size instead. */
  .org-hero--stack { grid-template-columns: minmax(0, 1fr); row-gap: 10px; }
  .org-hero--stack > .org-mark, .org-hero--stack > .monogram { width: 64px; height: 64px; }
  .org-hero--stack .org-hero-head { grid-column: 1; grid-row: 2; }
  .org-hero--stack .org-hero-more { grid-row: 3; }
  .org-hero-name { margin: 0; }
  .org-hero-count { color: var(--faint); }
  .org-hero-domain { margin: 2px 0 0; line-height: 1.3; }
  .org-hero-domain a { color: inherit; }
  .org-hero-blurb { margin: 0; line-height: 1.4; }

  /* The brand's own site: same icon-then-label shape and shading as the
     sort/filter controls (.control) above, so it reads as one more control
     rather than a plain text link — but a fixed destination rather than a
     dropdown, so its own class rather than a literal reuse of .control. */
  .brand-site-link {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 13px 8px 10px; text-decoration: none;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    transition: border-color .12s ease, color .12s ease;
  }
  .brand-site-link .control-ico { transition: color .12s ease; }
  .brand-site-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .brand-site-link:hover { border-color: var(--accent); color: var(--accent); }
    .brand-site-link:hover .control-ico { color: var(--accent); }
  }

  /* Official Site + Fragrantica, under a fragrance's own title block. Same
     .brand-site-link pill as the brand page's own official-site link, so the
     two pages agree on what this kind of link looks like — but this row
     centres itself (2026-08-26), unlike the left-aligned copy on the brand
     page, because it sits inside this hero's own centred column (art, name,
     price boxes) rather than beside a left-aligned heading the way the brand
     page's copy does. `justify-content: center` also covers the one-pill
     case (Official Site absent): a single centred pill still reads as one
     deliberate line, where a single left-aligned one would read as a
     leftover. */
  .frag-links-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    justify-content: center;
  }
  .frag-links-row .brand-site-link { margin-top: 10px; }

  /* Which market the link above actually opens, so a reader knows before
     clicking rather than after landing on it. --ok (green) is this app's
     existing "confirmed fine" token, reused here for "yes, UK" rather than
     invented fresh; Non-UK is deliberately neutral rather than --warn, since
     a brand with only a global site is not a fault, just a fact worth
     flagging (see officialSiteFor's own doc in demo/brandSites.ts). */
  .brand-site-flag {
    margin-left: 2px; padding: 2px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .01em;
    white-space: nowrap;
  }
  .brand-site-flag.is-uk {
    color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent);
  }
  .brand-site-flag.is-nonuk {
    color: var(--faint); background: var(--surface-2);
  }

  .fact-list { list-style: none; margin: 8px 0 6px; padding: 0; }
  .fact-list li {
    font-size: 13px; color: var(--ink-2); padding: 6px 0 6px 14px;
    border-bottom: 1px solid var(--line); position: relative;
  }
  /* The shop page's compact version: tighter lines, no rules, and short
     facts share a row, so the same facts take fewer lines. */
  .fact-list.fact-list--compact { display: flex; flex-wrap: wrap; gap: 0 18px; margin: 6px 0 4px; }
  .fact-list.fact-list--compact li { font-size: 12.5px; line-height: 1.35; padding: 3px 0 3px 12px; border-bottom: 0; }
  .fact-list.fact-list--compact li::before { top: 9px; width: 4px; height: 4px; }
  .fact-list li::before {
    content: ""; position: absolute; left: 0; top: 13px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }

  /* Trustpilot's own widget renders its own star icons and colour once its
     script loads; this only sets the box it lands in. The fallback link
     (shown until the script loads, or forever if it never does) borrows the
     app's ordinary link styling rather than looking like a broken widget. */
  .trustpilot-block { margin-top: 4px; }
  .trustpilot-block .brand-site-link { margin-top: 6px; }
  /* Before the reader asks for the widget: the consent button, the plain
     link, and one line saying what pressing it does. */
  .trustpilot-consent { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .trustpilot-consent .t-caption { flex-basis: 100%; }
  .trustpilot-widget a { font-size: 12.5px; color: var(--accent); text-decoration: none; }
  .trustpilot-widget a:hover { text-decoration: underline; }

  /* ── notes ─────────────────────────────────────────────────────────────── */
  /* Same row as .brand-row (block, one column, alphabetical dividers) — this
     just adds the count on the right, so it needs flex instead of block. */
  .note-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .note-row-count { flex: none; color: var(--faint); }

  /* Top, middle and base, centred (owner's instruction, 2026-08-26).
     Everything in this block shares one centre line: the "Notes" eyebrow, the
     three tier names, the chips under each, and the source credit at the
     foot. On desktop this is not a new alignment at all — `.hero` is already
     `text-align: center` there (see the desktop block near the foot of this
     file), and the notes were the one thing inside it still hanging off a
     left edge; on a phone the block now matches what desktop always showed.

     The stair went with it. Each tier used to be indented 18px past the one
     above and hung off a left rule of its own, drawing a pyramid out of the
     layout rather than out of a triangle graphic. That device is asymmetric
     by construction: an indent measured from the left edge and a centre line
     cannot both hold, and half-honouring it (centred text over indented
     boxes) reads as a mistake rather than as a shape. What the stair carried
     is carried without it — the tiers are three labelled groups in fixed
     document order, top first, and the labels say which is which in words,
     which is also the only version of the shape a screen reader ever had.

     The chips centre by overriding .note-chips's `justify-content` inside
     this block only: the same class is a left-aligned filter row on a note's
     own profile page (.note-chips-profile), which must not move. */
  .notes-block { margin-top: 32px; text-align: center; }
  .note-layer { margin-bottom: 14px; }
  .note-layer-name { margin: 0 0 8px; }
  /* A tier with many notes wraps into several rows of chips; each row is
     centred on its own, so a last row holding one or two chips sits under the
     middle of the row above it rather than hanging off the left. That is the
     common case at 360-390px, where the base tier routinely takes three or
     four rows. */
  .notes-block .note-chips { justify-content: center; }

  /* The layer chips above the Notes list: the note page's own chips, in a row
     with room under it before the list. */
  .note-chips.note-chips-layers { margin: 0 0 14px; }

  /* The list: a bounded, independently scrolling region rather than the
     page's ordinary flow, because the scrubber's whole mechanic (map a
     finger's Y position to a scroll position) only makes sense against a
     viewport with a stable, known height, not a list that keeps growing the
     page underneath it. */
  .notes-browse { position: relative; }
  .notes-browse-scroll {
    max-height: 50vh; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--line-firm) transparent;
    /* Room for the scrubber strip sitting over this same right edge (see
       .alpha-scrubber below) so a row's own count does not sit underneath
       its letters. Harmless dead space on desktop, where the strip is
       hidden — not worth a second, layout-scoped rule just to reclaim it. */
    padding-right: 26px;
  }
  .notes-browse-scroll::-webkit-scrollbar { width: 6px; }
  .notes-browse-scroll::-webkit-scrollbar-track { background: transparent; }
  .notes-browse-scroll::-webkit-scrollbar-thumb { background: var(--line-firm); border-radius: 3px; }

  /* iOS Contacts-style index strip, mobile only. Absolutely positioned over
     the scroll region's own right edge rather than beside it, so it costs no
     layout width from the list itself. */
  .alpha-scrubber {
    position: absolute; top: 0; right: -4px; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 8px; touch-action: none;
  }
  .alpha-scrubber-letter {
    font-size: 9.5px; font-weight: 700; line-height: 1.55; color: var(--faint);
    width: 14px; text-align: center;
  }
  .alpha-scrubber-letter[data-empty] { opacity: .28; }
  :root[data-layout="desktop"] .alpha-scrubber { display: none; }

  /* The magnified letter bubble that tracks the finger while dragging the
     scrubber, mirroring iOS. Only ever inserted/removed by JS, never part
     of the server-rendered markup — see mountAlphaScrubber in app.ts. */
  .alpha-scrubber-bubble {
    position: fixed; z-index: 20; pointer-events: none;
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); color: var(--accent-on);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800;
  }
  .note-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
  .note-chip {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; font: inherit; font-size: 12.5px; color: var(--ink);
    cursor: pointer; transition: border-color .12s ease, color .12s ease;
  }
  .note-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .note-chip:hover { border-color: var(--accent); color: var(--accent); }
  }
  .note-chip.on { background: var(--accent-sf); border-color: var(--accent); color: var(--ink); }
  .note-chips-profile { margin-bottom: 12px; }
  .notes-none { font-size: 13.5px; color: var(--faint); margin: 0; }

  /* ── filters ───────────────────────────────────────────────────────────────
     Owner's revamp, 6 Oct 2026 (demo/filterUi.ts). The Filters button is one
     more cell in the .controls grid. What is chosen sits under that row as
     chips, one tap each to take off, then Clear All. The button opens a native
     <dialog>: a sheet from the bottom of a phone, a panel down the right of a
     computer, every option a real checkbox in a 48px row with its count beside
     it, so several can be chosen at once. It replaced a panel of the browser's
     own dropdowns, one choice per filter, which had replaced a panel of one tap
     pills that ran to 950 to 1,500px on a phone. */
  .facets-toggle { position: relative; text-align: left; }
  .facets-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; margin-left: 2px;
    background: var(--accent); color: var(--accent-on);
    font-size: 11px; font-weight: 700; border-radius: 999px;
  }
  /* Still the account page's price alert checkbox (.alerts-check). */
  .facet-check { gap: 10px; }
  .facet-check input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
  .facet-check-label { flex: 1 1 auto; min-width: 0; }

  .filter-chips {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    list-style: none; margin: -6px 0 16px; padding: 0;
  }
  .filter-chips > li { display: flex; max-width: 100%; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; max-width: 100%;
    padding: 6px 10px 6px 14px; border-radius: 999px;
    border: 1px solid var(--accent); background: var(--accent-sf); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 600; line-height: 1.25; text-align: left; cursor: pointer;
    transition: border-color var(--dur-2) var(--ease-standard), transform var(--dur-1) var(--ease-standard);
  }
  .filter-chip:active { transform: scale(.985); transition-timing-function: var(--ease-exit); }
  .filter-chip .fc-name { font-weight: 500; color: var(--ink-2); }
  .filter-chip .fc-x { display: flex; flex: none; color: var(--ink-2); }
  .filter-chip .fc-x .ico { width: 15px; height: 15px; }
  .filter-chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .filter-chip:hover { border-color: var(--accent-press); }
    .filter-chip:hover .fc-x { color: var(--ink); }
  }
  /* Clear All in the row: the link rank, without the negative margin that lets
     it sit in a line of text, so it keeps its own 44px in a wrapping row. */
  .filter-chips .filters-clear {
    margin: 0; min-height: 44px; padding: 0 8px; font-size: 14px; font-weight: 600;
  }

  .fsheet {
    position: fixed; inset: auto 0 0 0; margin: 0; padding: 0;
    width: 100%; max-width: 100%; max-height: 88vh; max-height: 88dvh;
    border: 0; border-top: 1px solid var(--line-firm); border-radius: 18px 18px 0 0;
    background: var(--surface); color: var(--ink);
    box-shadow: 0 -12px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  /* Movement only, never a fade from nothing: a sheet whose animation never
     ran still shows. */
  .fsheet[open] { display: flex; flex-direction: column; animation: fs-up var(--dur-3) var(--ease-standard); }
  .fsheet::backdrop { background: rgba(0, 0, 0, .6); }
  @keyframes fs-up { from { transform: translateY(40px); } to { transform: none; } }
  @keyframes fs-in { from { transform: translateX(40px); } to { transform: none; } }
  .fs-card { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .fs-head {
    flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 8px 8px 20px; border-bottom: 1px solid var(--line);
  }
  /* Where focus lands when the panel opens (openFilterSheet): it names the
     panel, and is not a control, so it draws no ring. */
  .fs-title { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; outline: none; }
  .fs-x {
    flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 10px; background: none; color: var(--ink); cursor: pointer;
  }
  .fs-x .ico { width: 20px; height: 20px; }
  .fs-x:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  /* The one part that scrolls. contain keeps a fling at its end from scrolling
     the page behind, in Safari and Chrome alike. */
  .fs-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: 0 20px 8px;
  }
  .fs-foot {
    flex: none; display: flex; gap: 10px;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
  }
  .fs-foot .ps-dialog-btn { padding: 6px 14px; line-height: 1.2; }
  .fs-foot .fs-clear { flex: none; white-space: nowrap; }
  .fs-foot .fs-show { flex: 1 1 auto; }
  .fs-foot .fs-clear:disabled { opacity: .45; cursor: default; }
  .fs-flags, .fs-opts { border: 0; margin: 0; padding: 0; min-width: 0; }
  .fs-flags { padding: 12px 0 6px; border-bottom: 1px solid var(--line); }
  .fs-flags > legend { padding: 0; margin: 0 0 2px; }
  .fs-group { border-bottom: 1px solid var(--line); }
  .fs-sum {
    display: flex; align-items: center; gap: 8px; min-height: 52px; cursor: pointer;
    list-style: none;
  }
  .fs-sum::-webkit-details-marker { display: none; }
  .fs-sum::marker { content: ""; }
  .fs-sum:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 8px; }
  .fs-name { font-size: 15px; font-weight: 700; color: var(--ink); }
  .fs-picked {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
    background: var(--accent); color: var(--accent-on); font-size: 12px; font-weight: 700;
  }
  .fs-chev { margin-left: auto; display: flex; color: var(--faint); transition: transform var(--dur-2) var(--ease-standard); }
  .fs-chev .ico { width: 16px; height: 16px; }
  .fs-group[open] > .fs-sum .fs-chev { transform: rotate(180deg); }
  .fs-opts { padding: 0 0 10px; }
  .fs-opt {
    display: flex; align-items: center; gap: 12px; min-height: 48px;
    padding: 2px 6px; margin: 0 -6px; border-radius: 10px; cursor: pointer;
  }
  .fs-opt[hidden] { display: none; }
  .fs-opt input {
    flex: none; width: 22px; height: 22px; margin: 0; cursor: pointer; accent-color: var(--accent);
  }
  .fs-opt input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .fs-opt-label { flex: 1 1 auto; min-width: 0; font-size: 16px; line-height: 1.3; color: var(--ink); }
  .fs-opt-count { flex: none; font-size: 14px; color: var(--faint); font-variant-numeric: tabular-nums; }
  @media (hover: hover) and (pointer: fine) {
    .fs-opt:hover { background: var(--surface-2); }
  }
  .fs-find {
    display: block; width: 100%; min-height: 44px; margin: 0 0 6px; padding: 0 12px;
    font: inherit; font-size: 16px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line-firm); border-radius: 10px;
  }
  .fs-find:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-sf); }
  .fs-none { margin: 4px 0 10px; color: var(--ink-2); }
  .fs-note { margin: 0 0 12px; max-width: 60ch; color: var(--ink-2); }
  .fs-flags .fs-note { margin-top: 6px; }
  .fs-empty { margin: 16px 0; color: var(--ink-2); }
  /* A computer: a panel down the right, the list still in view beside it. */
  @media (min-width: 700px) {
    .fsheet {
      inset: 0 0 0 auto; width: 440px; max-width: 100%;
      height: 100vh; height: 100dvh; max-height: none;
      border-top: 0; border-left: 1px solid var(--line-firm); border-radius: 0;
      box-shadow: -12px 0 40px rgba(0, 0, 0, .35);
    }
    .fsheet[open] { animation-name: fs-in; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fsheet[open] { animation: none; }
  }
  /* The page holds still under the panel (lockPageScroll in demo/app.ts). */
  html.fs-locked, html.fs-locked body { overflow: hidden; }
  .notes-source { margin: 10px 0 0; }
  /* Same icon-then-label shape as .footer-link below, at the notes block's own
     caption size rather than the footer's fixed one, so "As published by X"
     reads as a quiet in-place link rather than a separate control. */
  .notes-source-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: inherit; text-decoration: none; font: inherit;
  }
  .notes-source-link .notes-source-ico { display: inline-flex; }
  .notes-source-link .notes-source-ico .ico { width: 12px; height: 12px; }
  .notes-source-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .notes-source-link:hover { color: var(--accent); }
  }

  /* ── detail ────────────────────────────────────────────────────────────── */
  /* Link rank, at the top of every leaf page. */
  .back {
    display: inline-flex; align-items: center;
    background: none; border: 0; padding: 8px 6px 8px 0; margin-left: -6px;
    cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--accent-ink);
  }
  .back::before { content: "‹"; margin-right: 6px; font-size: 18px; line-height: 1; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .hero { padding: 6px 0 24px; border-bottom: 1px solid var(--line); }
  /* The art sits centred in its own band; the heading below it keeps the same
     left/right split as everywhere else so the product reads consistently. */
  .hero-art { display: flex; justify-content: center; margin-bottom: 16px; }
  /* Only the clamp is the hero's own: the name carries .t-page there and the
     brand and meta carry .t-eyebrow and .t-caption, same as everywhere else. */
  .hero .phead-name { -webkit-line-clamp: 3; }
  .hero-blurb { font-size: 13.5px; color: var(--faint); margin: 9px auto 0; max-width: 32ch; }

  /* Module 7: save a fragrance. Outline heart, unfilled, until .on — never
     shown at all unless accounts are actually configured, see its own
     comment in app.ts. */
  /* Secondary rank: saving is a real action, but it is never what the page
     is for -- that is the price below it. */
  .wishlist-toggle {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    margin: 12px auto 0; padding: 8px 18px;
    border-radius: 12px; border: 1px solid var(--line-firm);
    background: var(--surface-2); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .wishlist-toggle .ico { width: 16px; height: 16px; }
  .wishlist-toggle.on {
    border-color: var(--accent); color: var(--accent); background: var(--accent-sf);
  }
  .wishlist-toggle.on .ico { fill: var(--accent); }
  .wishlist-toggle:active { transform: scale(.96); }
  .wishlist-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wishlist-toggle[disabled] { opacity: .6; cursor: default; }

  /* Share (openShareDialog in app.ts). On a wishlist row it is a small icon
     (.wishlist-share, with the row's rules). On a product page it sits in a row with
     the Save button above, the same pill beside it, so the two read as a
     pair and the price boxes below do not move. The wishlist button's own
     top margin moves to the row. */
  .hero-actions {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 10px; margin: 12px 0 0;
  }
  .hero-actions .wishlist-toggle { margin: 0; }
  .share-btn {
    font: inherit; color: var(--ink); cursor: pointer;
    transition: transform var(--dur-1) var(--ease-standard),
                border-color var(--dur-2) var(--ease-standard),
                color var(--dur-2) var(--ease-standard);
  }
  .share-btn .ico { width: 16px; height: 16px; position: relative; }
  .share-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .share-btn:active { transform: scale(.94); transition-timing-function: var(--ease-exit); }
  .share-page {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 8px 18px;
    border-radius: 12px; border: 1px solid var(--line-firm);
    background: var(--surface-2); font-size: 14px; font-weight: 600;
  }
  @media (hover: hover) and (pointer: fine) {
    .share-page:hover { border-color: var(--accent); color: var(--accent); }
  }

  /* The Share pop-up: the .ps-dialog card (below), holding a link field with
     Copy beside it, then a row of places to share to. */
  .share-body { display: flex; flex-direction: column; gap: 14px; }
  .share-head .ps-dialog-title { margin: 0; }
  .share-product { margin: 2px 0 0; color: var(--faint); overflow-wrap: anywhere; }
  .share-copy { display: flex; align-items: stretch; gap: 8px; }
  .share-link {
    flex: 1; min-width: 0; min-height: 44px; padding: 0 12px;
    font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line-firm); border-radius: 10px; text-overflow: ellipsis;
  }
  .share-link:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .share-copy-btn {
    flex: none; min-height: 44px; min-width: 88px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
    font: inherit; font-size: 15px; font-weight: 650; cursor: pointer;
  }
  .share-copy-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .share-copy-btn:active { transform: scale(.97); }
  .share-copy-ico { display: inline-flex; }
  .share-copy-ico .ico { width: 17px; height: 17px; }
  .share-copy-ico-tick { display: none; }
  .share-copy-btn.is-copied { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .share-copy-btn.is-copied .share-copy-ico-copy { display: none; }
  .share-copy-btn.is-copied .share-copy-ico-tick { display: inline-flex; }
  .share-or { margin: 4px 0 -4px; color: var(--ink-2); }
  .share-targets {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
  }
  /* An odd one out (More, where it is shown) takes the whole last row. */
  .share-targets li:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .share-target {
    width: 100%; min-height: 48px; padding: 6px 12px;
    display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2);
    color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .share-target .ico { width: 22px; height: 22px; flex: none; }
  .share-target:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .share-target:active { transform: scale(.97); }
  @media (hover: hover) and (pointer: fine) {
    .share-target:hover { border-color: var(--accent); color: var(--accent); }
  }
  .share-note { margin: 0; min-height: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .share-note:empty { display: none; }
  .share-body .ps-dialog-actions { margin-top: 2px; }

  /* The one number on the page a reader actually needs, in its own card so
     it cannot be mistaken for just another line of text. The 30px accent
     glow this used to carry is gone: elevation on this site is --shadow-lift,
     which is a real shadow in the light theme and a hairline in the dark one,
     and a bloom no other surface has was the box shouting on top of already
     being the largest type on the page.

     Two boxes now, where there was one: the manufacturer's price on the left
     and the lowest price here on the right, which is the argument this site
     exists to make, made in one glance. See priceBoxRow() in demo/app.ts for
     which of them renders when.

     The row is a flex line and not a two-column grid precisely because the
     left box is usually absent — only 874 of 14,836 products have a house
     price to show. With one child, `justify-content: center` plus the 280px
     cap below leaves the lowest-price box exactly where and how wide it was
     before this change; with two, they share the line. A grid would have had
     to be told about both cases. */
  .price-boxes {
    display: flex; justify-content: center; align-items: stretch;
    gap: 10px; margin: 18px 0 0;
  }
  /* `flex: 1 1 0` on both — equal width, not the 4:5 split this used to be
     (2026-08-26, owner's instruction: the two boxes disagreed on width and on
     their hero number's size, and both were asked to stop). The old split
     gave the wider column to whichever box carried the longer content, which
     was almost always the right one (a shop name beats a fixed four-letter
     label), but "the argument this site exists to make, made in one glance"
     reads as one argument, not a left box and a bigger right one — see the
     comment atop `.price-boxes`. Equal width moves the job of fitting a long
     shop name entirely onto `.price-box-from`'s own sizing below, since the
     column can no longer be widened to make room for one.
     min-width: 0 because a flex item's default `min-width: auto` refuses to
     shrink below its longest word, which is how a long shop name would push
     this row past the viewport. Side padding tightened from 20px to 8px for
     the same reason — every pixel not spent on padding is a pixel
     `.price-box-from` can use — and, unlike the old 430px-only tightening,
     applied at every width: the box is narrower than it used to be
     everywhere now, not just on a phone. */
  .price-box {
    flex: 1 1 0; min-width: 0; max-width: 280px;
    padding: 16px 8px 17px;
    border-radius: 16px; border: 1px solid var(--accent);
    background: var(--accent-sf);
  }
  .price-box-label { margin: 0; color: var(--accent-ink); }
  .price-box-amount { margin: 6px 0 0; color: var(--accent-ink); }
  .price-box-from { margin: 5px 0 0; color: var(--ink-2); }
  /* Green for the number a reader is meant to act on. --ok is already this
     app's "a saving, in stock, new" colour (.off, .now.sale, .tag.new), so
     this is the palette's existing meaning applied to the biggest instance of
     it rather than a new colour language; --ok-sf is its ground, measured in
     the palette block at the top of this file. Red stays on the left box
     because red here is the brand accent and never means "bad" — the note at
     the top of this file. */
  .price-box--best { border-color: var(--ok); background: var(--ok-sf); }
  .price-box--best .price-box-label,
  .price-box--best .price-box-amount { color: var(--ok); }
  /* `.price-box-caveat` lived here until 2026-08-26: the "too close to call"
     line, inside the box, under the number it qualified. The line is no longer
     rendered (owner's instruction — see lowestPriceBox in demo/app.ts), so the
     rule is gone with it rather than left behind matching nothing. The rule it
     described is still enforced, in the label above the number: "Lowest total
     price" instead of "Cheapest price" whenever the verdict is undecided. */
  /* Paired sizing. Until 2026-08-26 only the green box's number ever moved —
     34px alone, 28px beside an MSRP box — while the MSRP figure sat at
     `.t-price`'s own 20px the entire time, so the pair disagreed about how
     big their own headline number was even after the 28px step existed to
     make them agree on everything else. Now both step down together, to the
     same 24px, whenever a house figure is on the page.
     `.price-box--msrp .price-box-amount` needs no sibling combinator on that
     side: `houseCeilingBox()` returns nothing at all when there is no
     `houseCeiling` (demo/app.ts), so this class only ever exists already
     paired with the green box.

     Measured in Chromium, paired, each box is 160px wide (158px of
     `clientWidth`, 142px of content once the padding above is subtracted) at
     360px — narrower than the 173px/171px/155px this row gets at 1280px and
     1440px. That is the one place the old comment's "desktop is always
     tightest" claim needed re-checking rather than repeating: pinning .hero
     at 380px still makes desktop tighter than 768px or 390px, exactly as
     before, but a 360px phone turns out tighter still, by 13px of content,
     so the figures below are taken there rather than assumed from the
     desktop case alone. --font-num is monospace; the widest figure either
     box ever has to show is £745.00, the highest price this catalogue has
     ever presented as a "lowest price" (£220.00, Al Haramain Sheikh for Men,
     is the widest house figure, and renders identically — same seven
     characters). Cloned into a detached `.price-box-amount` at 24px and
     measured directly rather than scaled from the old 28px figure: 81.5px,
     against 142px of content at 360px. That leaves 60.5px to spare — room
     for a five-figure price before anything overflows.

     No stacking at any width. Stacked, the MSRP sits above the lowest price
     and reads as the headline figure, which is the one thing this arrangement
     must never say. */
  .price-box--msrp .price-box-amount,
  .price-box--msrp + .price-box--best .price-box-amount { font-size: 24px; }
  /* Nowrap always: a shop name is the one thing on this page that cannot be
     truncated or ellipsised — a reader has to be able to read which shop it
     is — so "from <shop>" and "Brand's Current Price" are guaranteed one
     line rather than merely observed to fit today's roster. Harmless when
     the green box is alone (up to 280px, the far more common case: 13,962 of
     14,836 products carry no houseCeiling — see houseCeilingBox), where
     `.t-caption`'s ordinary 13px already clears even the longest name with
     room to spare; the size step below only fires once the box is squeezed
     down to share the row with an MSRP box.

     That step: font-size 9.5px, sibling-scoped the same way the amount rule
     above is, and for the same reason (`.price-box--msrp` only exists
     paired). Measured in Chromium against "from The Fragrance Counter" (26
     characters — the longest "from <shop>" the 79-shop registry can
     produce, whether or not that shop is enabled today) at 9.5px: 131.7px of
     actual text, against the same 142px of content the amount figures above
     were measured at — the tightest column this row ever gets — leaving
     10.3px to spare. 11px, tried first, measures 152.8px however wide the
     column is (text width is a function of font-size alone) — 10.8px short
     of that same 142px.

     Deliberately not the class the "delivery not stated" caption carries:
     that branch of lowestPriceBox() is a full sentence explaining an
     absence, not a name, and squeezing a string four times as long onto one
     line would mean a size too small to read for a far less urgent fact. It
     keeps `.price-box-from`'s ordinary wrap; only the two single-line
     captions (`houseCeilingBox`'s, and lowestPriceBox's delivered-price
     branch) carry `--fit` — see demo/app.ts. */
  .price-box-from--fit { white-space: nowrap; }
  .price-box--msrp .price-box-from--fit,
  .price-box--msrp + .price-box--best .price-box-from--fit { font-size: 9.5px; }
  /* Smallest phones still in circulation (iPhone 13 mini is 375px) and, per
     the measurement above, the actual tightest case for this row — the gap
     still gives here on top of the tighter padding both boxes now carry at
     every width. */
  @media (max-width: 430px) {
    .price-boxes { gap: 8px; }
  }

  .hero-price.none { font-size: 19px; font-weight: 600; color: var(--ink-2); letter-spacing: -.01em; margin: 18px 0 0; }

  /* "Available at (N shops)" on the left, the freshness caption on the right —
     merged from two lines into one (owner's instruction, 2026-08-27; the second
     line used to carry the shop count and caption alone, under its own
     standalone "Available at" heading).

     `flex-wrap: wrap` rather than `nowrap`, which was tried first and measured
     worse: the two texts fought for the same line and each one wrapped
     internally, landing "AVAILABLE AT" itself mid-word beside a caption broken
     into three ragged fragments. `wrap` instead drops the caption to its own
     line as a whole — space-between still pins it to the right when it fits on
     the shared line, and to the left, alone, when it drops to its own.

     (6 Oct 2026: the caption is gone altogether, at the owner's request; each
     offer row now ends its facts line with its own short age. The rule stays
     for the label alone.)

     What that rule has to cope with changed on 2026-09-01, when the caption
     went from "delivery included where the shop states it, checked Xh ago" to
     "Updated Xh ago" (see detailView in demo/app.ts for why the dropped clause
     is not information lost). Re-measured off the live DOM at that date
     (Chromium 141, `white-space: nowrap`, no other text competing): the label
     still never exceeds 172.8px ("Available at (8 shops)", the most shops any
     product in the registry carries — see build-demo-catalogue.ts), but the
     caption fell from 386.9px to 111.1px, and stays 111.1px in its longest
     "Updated 30d ago" form. Both side by side now need ~294px including the
     10px column-gap, against the 358px `.detail-offers` measures at a 390px
     viewport and 328px at 360px — so the row that could never share one line
     on a phone now does at every width from 360 up, and only wraps at 320.
     `wrap` is kept exactly as it was: it is what makes 320 degrade instead of
     overflow. Neither shape overflows the viewport at any width measured (a
     wrapped line only grows the row's height, never its width). See
     priceBoxRow's own note for why the caption is dropped to nothing rather
     than reading "0 shops" when there is nothing to be available at. */
  .results-head {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
    row-gap: 4px; column-gap: 10px;
    padding: 18px 2px 8px;
  }
  .results-head .dim { color: var(--faint); }

  /* Every row carries the left edge in transparent, so marking the cheapest
     one recolours two pixels and moves nothing. */
  .offer {
    border-bottom: 1px solid var(--line);
    border-left: 2px solid transparent;
  }
  .offer.best { border-left-color: var(--accent); }
  .offers .offer:last-child { border-bottom: 0; }
  /* No row gap: the shop name and the stock line are one statement about one
     shop and were reading as two, which the price's own second line only made
     worse. The countdown, when there is one, is a separate statement and keeps
     its space via the adjacent-sibling rule below. */
  .offer-link {
    display: flex; flex-direction: column; gap: 3px;
    padding: 14px 10px; text-decoration: none; color: inherit;
  }
  .offer-bot + .offer-bot { margin-top: 4px; }
  .offer-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .offer-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  /* Tinted, not filled: the accent left edge already marks this row, and a
     solid red block beside it made the same point twice and outshouted the
     price it was pointing at. */
  .tag {
    margin-left: 8px; vertical-align: 1px;
    font-size: 10px; font-weight: 700; letter-spacing: .02em;
    color: var(--accent-ink); background: var(--accent-sf); border-radius: 4px; padding: 2px 6px;
  }
  /* "Lowest total" / "Lowest item price": the leading row, on figures that do
     not settle the question. Neutral ink on a plain surface, so it cannot be
     mistaken at a glance for the accent-coloured "Cheapest" it replaces —
     that swap is the entire point, and a tag that looked the same would undo
     it. */
  .tag.unsure { background: var(--surface-2); color: var(--ink-2); }
  /* The point-of-click affiliate marker: quiet, outlined, never the accent
     colour — it is a disclosure, not a badge of merit. */
  .tag.affiliate { background: transparent; color: var(--ink-2); border: 1px solid var(--line-firm); }
  /* `flex-wrap: wrap` lets the struck-through RRP drop above the price instead
     of forcing the row wider than the viewport. `white-space: nowrap` keeps
     each figure whole, so before this the only way a row could fit was for
     .offer-top to grow, and at 320px a shop name with no break opportunity in
     it plus an RRP plus a price simply did not: Zimaya Royal Paragon's
     MyBeauty.Boutique row (an RRP £34.99 beside £24.98) pushed the document's
     scrollWidth to 352 against a 320 clientWidth. MyBeauty.Boutique is the
     unbreakable name the catalogue happens to contain, and .del-note's own
     note above already records it as the case that pushes this row hardest.
     Wrapping is the honest fix: the RRP is the least important figure in the
     group, so it is the one that should move. `justify-content: flex-end`
     keeps both lines on the right edge .now and .del-note already share. On
     any width where the row fits — every viewport from 360 up, measured — no
     wrap happens and nothing about the row changes. */
  .price {
    display: flex; flex-wrap: wrap; justify-content: flex-end;
    align-items: baseline; gap: 8px; white-space: nowrap;
  }
  .was { font-size: 12.5px; color: var(--faint); text-decoration: line-through; font-variant-numeric: tabular-nums; }
  /* .now is a flex item of .price, which blockifies it (a flex item is always
     laid out as a block box, whatever display it was given) and sizes it to
     its own widest line — here, almost always .del-note's, since the note
     text is normally wider than the price digits above it. .del-note is
     right-aligned within that box (see below), but the price digits are a
     plain text node with no alignment of their own, so — absent this rule —
     they sat flush with .now's *left* edge while the note sat flush with its
     right, on a box wider than either line: two prices reading as one
     misaligned column. Measured (Chromium 141, scripts/screenshot.ts) on
     /fragrance/ean-6085010044712 at 1280/1440/1920/390/360: every row now has
     its price and its note sharing one right edge (e.g. Perfume Click's
     "£26.75" and "Includes £2.95 delivery" both end at x=364.0 at 390px);
     before this rule the price sat 15-80px short of that edge depending on
     how much shorter the price text was than the note beside it. */
  .now { text-align: right; }
  /* The house-anchored comparison (demo/app.ts's offerRow, houseAnchorFor) is
     never this shop's own claim, so it is never struck through the way a
     genuine "was" price is — a line-through on a figure the shop never stated
     would read as its own former price, exactly the misattribution this
     exists to avoid. A dotted underline says "reference point" without
     saying "this shop's own history".

     Only .off.anchor is left here. The row's .was.anchor ("£37.99 at Armaf")
     was removed on 2026-08-26 at the owner's request, leaving .price with a
     single child on every row that carries an anchor — which the flex rule
     above already handles, since one item in a flex row simply sits at its
     start and the gap has nothing to apply to. The percentage keeps the
     dotted underline for the same reason it always had it: it is still a
     comparison against a figure this shop never published. */
  .off.anchor { text-decoration: none; border-bottom: 1px dotted var(--faint); padding-bottom: 1px; }
  .now.sale { color: var(--ok); }

  .offer-bot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sep { margin: 0 5px; color: var(--faint); }
  /* The row's second line: what the price contains on the left, how it
     compares on the right (offerRow in demo/app.ts). The comparison never
     shrinks or wraps; the facts wrap instead. */
  .offer-bot .facts { min-width: 0; }
  .offer-bot .facts > span { white-space: nowrap; }
  .offer-bot .off { flex: 0 0 auto; }
  .off { font-size: 11.5px; font-weight: 700; color: var(--ok); white-space: nowrap; }
  /* A shop charging more than the house's own price. Same sentence, same
     figure, opposite direction — so it must not arrive in the saving colour.
     --warn is the ink this stylesheet already uses for "there is something
     here you would not want to miss" (.del-note.excl, .ends) rather than for
     an error, which is exactly the weight this claim carries: it is a fact
     about the price, not a fault. Never --ok, and never green-on-green with
     `.now.sale`, which offerRow withholds from these rows for the same
     reason. */
  .off.over { color: var(--warn); }
  .ends { font-size: 11.5px; color: var(--warn); font-weight: 500; }

  /* Sold out reads as sold out by dropping to --faint, not by fading the
     whole row: opacity on text that is already the quietest ink on the page
     is how a row stops clearing AA. The price goes quiet with it, since it
     is not a price anyone can act on. */
  .offer.unavail .shop, .offer.unavail .now, .offer.unavail .was { color: var(--faint); }
  .offer.unavail .now { font-weight: 600; }
  /* The shops with no listing at all for this fragrance, not even a sold out
     one, as one wrapping line of names (unavailableShopsLine in demo/app.ts).
     This replaced `.offer.unavail-elsewhere`, which gave each of those shops a
     full offer row: 50-plus rows of name-and-a-dash, in the same furniture as
     the real offers above, to say nothing at all about a price.

     Deliberately quieter than .unavail above, which is the same distinction
     the old rows made: a sold out shop is at least confirmed to carry the
     bottle, one of these has never been seen selling it. line-height 1.7
     because this paragraph is a list of link targets and not prose — the
     extra leading is what keeps two wrapped lines of underlined names from
     reading as one block. */
  .unavail-shops {
    margin: 0; color: var(--faint); line-height: 1.7;
  }
  /* Underlined rather than coloured: --faint on --accent would fail contrast,
     and colouring these would make a shop that does not stock the bottle the
     most eye-catching thing under the chart. The underline says "link", the
     ink says "not the point of this page".

     A `<button>` since 2026-08-26 (it now routes to the shop's own retailer
     page rather than out to its homepage — see unavailableShopsLine in
     demo/app.ts), reset back to the plain underlined-text look the old `<a>`
     had: left un-reset, a browser's own button chrome (border, background,
     padding) would turn this comma-separated line into a row of grey boxes. */
  .unavail-shop {
    background: none; border: 0; padding: 0; margin: 0; font: inherit;
    cursor: pointer;
    color: inherit; text-decoration: underline;
    text-decoration-color: var(--line-firm); text-underline-offset: 2px;
  }
  .unavail-shop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .unavail-shop:hover { color: var(--ink-2); text-decoration-color: currentColor; }
  }
  /* A shop with no retailer page to send a reader to (no live offer anywhere
     in the catalogue, or disabled outright) — plain text among the linked
     names rather than a button that would open an empty "0 fragrances here"
     page. Same ink as the rest of the line; the missing underline is the
     only thing that tells the two apart. */
  .unavail-shop-plain { color: inherit; }

  .gone-head {
    margin: 32px 0 16px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  /* "Available at" leads .detail-offers with nothing above it in that
     column — the separator line and the gap it implies both belong between
     two sections, not floating above the first one. Still true now that
     "Available at" shares its element with .results-head (see that rule's
     own comment): the merged row is the same first child the standalone
     heading used to be. */
  .detail-offers > .gone-head:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  /* Why a group of shops is listed at all, where the heading alone would
     otherwise read as a claim about availability. */
  .group-note {
    margin: 7px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--faint);
  }
  /* A gift set's contents under its name (giftSetBlock in demo/app.ts), and
     the line saying its prices are compared only with the same set. */
  .giftset-block { margin: 10px 0 14px; }
  .giftset-contents { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .giftset-label { font-weight: 600; color: var(--ink); }
  .giftset-note { margin: 4px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--faint); }
  .giftset-list { margin: 2px 0 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .giftset-value { margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .giftset-more { margin: 6px 0 0; line-height: 1.6; color: var(--faint); }
  .giftset-block .link-btn { font: inherit; text-align: left; }

  /* ── price history chart ───────────────────────────────────────────────── */
  .history-block { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); }
  /* Heading and range control share a row, control to the right on a wide
     card and wrapping under the heading when there is no room for both. */
  .history-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
  }
  .history-head > .gone-head { margin: 0; padding: 0; border: 0; }
  .history-scopes { display: flex; gap: 4px; }
  .history-scope {
    font: inherit; font-size: 12px; line-height: 1;
    padding: 5px 9px; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--ink-2);
    border: 1px solid var(--line);
  }
  .history-scope:hover:not([disabled]) { border-color: var(--accent); color: var(--ink); }
  .history-scope.is-on {
    background: var(--accent-sf); border-color: var(--accent); color: var(--accent);
    font-weight: 600;
  }
  /* A range this fragrance has too little data to draw is shown and refused,
     rather than hidden — a missing "This week" reads as a bug, a greyed one
     reads as an answer. */
  .history-scope[disabled] { opacity: .4; cursor: not-allowed; }
  /* What sits under the "Price history" heading when there are not two real
     prices to draw a line between (see priceHistoryGapMessage in
     src/services/priceHistoryGaps.ts for the three sentences this shows).
     Same size and colour as .notes-none, the other "we do not have that"
     sentence on this page, so a reader who has seen one recognises the other. */
  .history-empty { font-size: 13.5px; color: var(--faint); margin: 8px 0 0; line-height: 1.5; }
  .history-chart { position: relative; margin-top: 10px; }
  .history-svg { width: 100%; height: 160px; display: block; overflow: visible; }
  /* While the price history is still on its way (it is fetched on demand,
     see demo/priceHistoryStore.ts): the chart's own box at the chart's own
     height, so nothing below moves when the line arrives. The range buttons
     are rendered but invisible, which is what holds the heading row at its
     real height. Quiet on purpose: a faint outline and one caption, no spinner. */
  .history-ghost { visibility: hidden; }
  .history-loading {
    height: 160px; display: flex; align-items: center; justify-content: center;
    box-sizing: border-box; border: 1px dashed var(--line); border-radius: 8px;
  }
  .history-loading-text { margin: 0; font-size: 13.5px; color: var(--faint); }
  /* --chart-band carries its own alpha, so no opacity multiplier: the fill
     under the live line is a named chart token rather than the accent
     surface dimmed by half, which drifted whenever accent-sf moved. */
  .history-area { fill: var(--chart-band); opacity: 1; stroke: none; }
  .history-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  /* HTML buttons laid over the svg, not shapes inside it — see
     priceHistoryChart's own comment for why: the svg stretches non-uniformly
     to fill the card, which warps an SVG circle's fill into an ellipse the
     moment its aspect ratio departs from the viewBox's. A fixed-pixel-sized
     div with border-radius: 50% has no such dependency and stays perfectly
     round at any chart width. */
  .history-dot {
    position: absolute; transform: translate(-50%, -50%);
    width: 8px; height: 8px; border-radius: 50%; padding: 0;
    background: var(--bg); border: 2px solid var(--accent); cursor: pointer;
    outline: none; transition: width .12s ease, height .12s ease; z-index: 2;
  }
  .history-dot:hover, .history-dot:focus-visible { width: 13px; height: 13px; background: var(--accent); }
  /* The live/current price point. Pulses to read as "this one is now", the
     rest of the line as settled history — purely additive, never the only
     way the current point is distinguishable (it is also simply the last,
     rightmost, largest dot). Respects the app-wide reduced-motion rule at
     the bottom of this file, which strips all animation outright. */
  .history-dot-last { width: 11px; height: 11px; background: var(--accent); }
  .history-dot-live { animation: history-pulse 1.8s ease-in-out infinite; }
  /* A day with no price at all. Grey rather than accent, and smaller, so a
     run of them reads as the absence it is and never competes with the real
     line — the colour is the whole signal here, so it also says "No price
     recorded" in its tooltip and its aria-label rather than relying on hue
     alone, which a colour-blind or monochrome reader would lose. Sits on the
     chart floor; that is a position, not a price of zero. */
  .history-dot-nodata { width: 7px; height: 7px; border-color: var(--faint); opacity: .55; }
  .history-dot-nodata:hover, .history-dot-nodata:focus-visible {
    width: 11px; height: 11px; background: var(--faint); opacity: 1;
  }
  /* An older price (last checked over HIDE_OFFER_AFTER_DAYS ago, see
     demo/priceHistoryChart.ts): hollow, with a dashed ring, so it never reads
     as a point on the cheapest line. Its tooltip and aria-label say "Older
     price" too, so the shape is never the only signal. */
  .history-dot-older {
    width: 9px; height: 9px; background: var(--bg);
    border: 2px dashed var(--ink-2); z-index: 1;
  }
  .history-dot-older:hover, .history-dot-older:focus-visible { width: 13px; height: 13px; background: var(--bg); border-style: solid; }
  /* The last price at a shop that was sold out: grey and hollow, labelled
     sold out in words as well. Only drawn when nothing buyable is on record. */
  .history-dot-soldout { width: 9px; height: 9px; border-color: var(--faint); background: var(--bg); }
  .history-dot-soldout:hover, .history-dot-soldout:focus-visible { width: 13px; height: 13px; background: var(--faint); }
  /* An item price at a shop that does not state its delivery cost, on a graph
     of delivered prices (demo/priceHistoryChart.ts): square rather than
     round, and its tooltip, aria label and the caption all say "delivery not
     stated", so the shape is never the only signal. */
  .history-dot-itemonly { border-radius: 2px; }
  /* The one line under the graph that says what is on it. */
  /* At least two lines tall, and the loading placeholder carries an empty
     one, so the common captions (one or two lines) move nothing when the
     graph replaces the placeholder. */
  .history-note { font-size: 12.5px; color: var(--faint); margin: 10px 0 0; line-height: 1.5; min-height: 3em; }
  @keyframes history-pulse {
    0%, 100% { width: 11px; height: 11px; opacity: 1; }
    50% { width: 15px; height: 15px; opacity: .65; }
  }
  .history-tip {
    position: absolute; z-index: 5; pointer-events: none;
    background: var(--surface-2); border: 1px solid var(--line-firm);
    border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.4;
    box-shadow: var(--shadow); white-space: nowrap;
    /* Horizontal position is set directly as `left` in JS (clamped to the
       chart's own bounds — see positionHistoryTip), not centred by transform:
       a dot at either edge of the chart needs the tip to stay put rather than
       overflow. Only the vertical lift above the dot stays a transform. */
    transform: translateY(calc(-100% - 12px));
  }
  .history-tip b { color: var(--ink); font-size: 13px; }
  .history-tip span { display: block; color: var(--faint); }
  /* One label per sampled day, positioned the same way the dots above it
     are — percent left, matched to the same xPct so a label always sits
     directly under the day it names. */
  .history-xaxis { position: relative; height: 16px; margin-top: 4px; }
  /* The y axis does not start at zero (priceDomain in
     demo/priceHistoryChart.ts pads the range so no line sits on the axis),
     so the chart labels the highest and lowest prices it plots, in a gutter
     to the left of the plot, each beside a faint guide line. The chart and
     its x axis both start after that gutter. */
  .history-chart, .history-xaxis { margin-left: 52px; }
  .history-yaxis { position: absolute; top: 0; bottom: 0; right: 100%; width: 52px; pointer-events: none; }
  .history-ylabel {
    position: absolute; right: 6px; transform: translateY(-50%);
    font: 400 11px/1.4 var(--font-num); font-variant-numeric: tabular-nums;
    color: var(--faint); white-space: nowrap;
  }
  .history-guide { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .history-xlabel {
    position: absolute; top: 0; transform: translateX(-50%);
    font: 400 11px/1.4 var(--font-num); font-variant-numeric: tabular-nums;
    color: var(--faint); white-space: nowrap;
  }
  /* The first and last labels sit on the chart's own edges, so centring them
     hung half of each outside it and made the page wider than a phone. */
  .history-xlabel:first-child { transform: none; }
  .history-xlabel:last-child:not(:first-child) { transform: translateX(-100%); }
  /* A one day range: its only label sits centred under its only point. */
  .history-xlabel.history-xlabel-solo { transform: translateX(-50%); }

  /* ── settings and documents ────────────────────────────────────────────── */
  /* The not-found view's escape routes. A row that wraps rather than a
     three-up grid, because there are four of them and the count is the count. */
  .notfound-links {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0;
  }
  .doc { padding: 4px 0 8px; }
  .doc h1 { margin: 8px 0 16px; }
  /* Business details and the storage-key list: a definition list laid out
     as label / value rows, stacking on narrow screens. */
  .biz-details { margin: 0 0 12px; display: grid; gap: 10px; }
  .biz-row { display: grid; grid-template-columns: 12em 1fr; gap: 6px 14px; align-items: baseline; }
  .biz-row dt { color: var(--faint); font-size: 13px; }
  .biz-row dd { margin: 0; }
  /* A definition is body text like the paragraphs around it, not the browser's default 16px. */
  .doc .biz-row dd { font-size: 14px; line-height: 1.62; color: var(--ink-2); }
  .biz-row code { font-size: 12.5px; overflow-wrap: anywhere; }
  @media (max-width: 560px) { .biz-row { grid-template-columns: 1fr; gap: 2px; } }
  .doc h2 { margin: 24px 0 7px; }
  .doc p, .doc li { font-size: 14px; color: var(--ink-2); line-height: 1.62; }
  .doc p { margin: 0 0 11px; }
  .doc ul { margin: 0 0 11px; padding-left: 20px; }
  .doc li { margin-bottom: 6px; }
  .doc a { color: var(--accent); }
  .doc strong { color: var(--ink); font-weight: 650; }
  .doc .meta { font-size: 12.5px; color: var(--faint); margin-top: 22px; }
  /* Bordered all the way round rather than striped down one edge. A left bar
     is the standard callout decoration and it also carries its meaning in
     colour alone; a full border in the same colour states it once, on the
     whole element, the way the box actually is a distinct thing. */
  .doc .draft {
    background: var(--surface); border: 1px solid var(--warn);
    padding: 12px 14px; border-radius: 9px; font-size: 13px;
  }
  .doc .draft strong { color: var(--warn); }
  /* The plain English summary at the top of the privacy notice. Same box as
     .draft, in the neutral hairline colour, since it is not a warning. */
  .doc .summary-box {
    background: var(--surface); border: 1px solid var(--line);
    padding: 12px 16px 2px; border-radius: 9px; margin: 0 0 18px;
  }
  .doc .summary-box h2 { margin: 0 0 8px; }

  /* Settings content sits centred in the available height on both layouts,
     rather than pinned to the top, but never fights scrolling: min-height
     only asks for the space, it never clips content taller than the
     viewport. */
  .settings-doc {
    display: flex; flex-direction: column; align-items: center;
    min-height: calc(100vh - 220px); justify-content: center; text-align: center;
  }
  .settings-doc h1 { align-self: center; }
  .settings-doc h2, .settings-doc .foot-links, .settings-doc .foot-legal { align-self: stretch; }

  .seg-group { width: 100%; max-width: 360px; margin-top: 14px; }
  .seg-label { margin: 0 0 6px; text-align: left; }
  .seg {
    display: flex; background: var(--surface); border: 1px solid var(--line);
    border-radius: 11px; padding: 3px; gap: 3px;
  }
  .seg-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 6px; border: 0; border-radius: 8px; cursor: pointer;
    background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2);
  }
  /* Same "you are here" as the two tab rows: --ink text over a 2px --accent
     edge. Inset rather than a border so the segment keeps its own radius and
     nothing in the track moves as the selection changes. */
  .seg-btn.on {
    background: var(--surface-2); color: var(--ink);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg-btn:active { transform: scale(.97); }
  .seg-icon svg { display: block; }

  .settings-note { margin: 12px 0 0; text-align: center; }

  .contact-form {
    width: 100%; max-width: 360px; margin-top: 12px;
