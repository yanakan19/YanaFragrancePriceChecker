<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#131013" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PriceSniffs" />
<meta name="mobile-web-app-capable" content="yes" />
<title>PriceSniffs</title>
<style>
  /* Dark ground with a red accent, per the brief. One narrow column, centred on
     wider screens, so the phone layout is the only layout to maintain and a
     React Native client can mirror it directly.

     Note on colour: red is the brand accent here, so it cannot also mean "bad".
     Sold out listings use muted grey instead, and only positive states carry
     colour. Otherwise every red pixel would compete for the same meaning. */
  :root, :root[data-mode="dark"] {
    --bg:        #3A353C;
    --surface:   #47414A;
    --surface-2: #524B55;
    --ink:       #F5F1F4;
    --ink-2:     #CFC8CF;
    --faint:     #A79DA8;
    --line:      #5A535D;
    --line-firm: #6B6370;
    --accent:    #E8434C;
    --accent-on: #FFFFFF;
    --accent-sf: #3A1519;
    --ok:        #4FB47B;
    --warn:      #D8A24C;
    --shadow:    0 1px 3px rgba(0,0,0,.4);
  }

  :root[data-mode="light"] {
    --bg:        #F3F1F2;
    --surface:   #F8F6F7;
    --surface-2: #F0EDEF;
    --ink:       #17141A;
    --ink-2:     #55505A;
    --faint:     #8A838F;
    --line:      #E7E3E7;
    --line-firm: #D3CDD3;
    --accent:    #C62630;
    --accent-on: #FFFFFF;
    --accent-sf: #FCEDEE;
    --ok:        #17724B;
    --warn:      #8A5A00;
    --shadow:    0 1px 3px rgba(0,0,0,.18);
  }

  /* "Match my device" follows the OS preference, and also any theme the host
     stamps on the root, so an external toggle keeps working. */
  @media (prefers-color-scheme: light) {
    :root[data-mode="system"] {
      --bg: #F3F1F2; --surface: #F8F6F7; --surface-2: #F0EDEF;
      --ink: #17141A; --ink-2: #55505A; --faint: #8A838F;
      --line: #E7E3E7; --line-firm: #D3CDD3;
      --accent: #C62630; --accent-on: #FFFFFF; --accent-sf: #FCEDEE;
      --ok: #17724B; --warn: #8A5A00; --shadow: 0 1px 3px rgba(0,0,0,.18);
    }
  }
  :root[data-mode="system"][data-theme="light"] {
    --bg: #F3F1F2; --surface: #F8F6F7; --surface-2: #F0EDEF;
    --ink: #17141A; --ink-2: #55505A; --faint: #8A838F;
    --line: #E7E3E7; --line-firm: #D3CDD3;
    --accent: #C62630; --accent-on: #FFFFFF; --accent-sf: #FCEDEE;
    --ok: #17724B; --warn: #8A5A00; --shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  :root[data-mode="system"][data-theme="dark"] {
    --bg: #3A353C; --surface: #47414A; --surface-2: #524B55;
    --ink: #F5F1F4; --ink-2: #CFC8CF; --faint: #A79DA8;
    --line: #5A535D; --line-firm: #6B6370;
    --accent: #E8434C; --accent-on: #FFFFFF; --accent-sf: #3A1519;
    --ok: #4FB47B; --warn: #D8A24C; --shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  :root {
    /* The system UI stack resolves to SF Pro on Apple, Segoe UI Variable on
       Windows and Roboto on Android: smooth, and no webfont to fail loading. */
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
            "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue",
            Arial, sans-serif;
    --col: 460px;
    /* The brand filter sheet stays a comfortable dialog width in both
       layouts. It should not balloon to the desktop page width, so it gets
       its own variable rather than following --col. */
    --sheet-col: 460px;
  }

  /* Desktop is a genuinely different layout, not just a wider mobile column:
     more width, a browse grid instead of a stacked list, and a two column
     detail view. See the [data-layout="desktop"] rules threaded through the
     sections below. Chosen once on first load from a real device signal
     (see demo/app.ts's detectDefaultLayout), then remembered per visitor
     once they pick for themselves. */
  /* No cap: the desktop layout fills the browser window rather than sitting
     in a centred column, so --col only still matters to elements that opt
     back into a narrower measure themselves (.doc, .hero-mission below). */
  :root[data-layout="desktop"] { --col: none; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -.006em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern" 1;
  }

  .app { max-width: var(--col); margin: 0 auto; min-height: 100vh; }

  /* ── top bar ───────────────────────────────────────────────────────────── */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 13px 16px 11px;
  }
  .bar-row { display: flex; align-items: center; gap: 12px; position: relative; }
  /* A thin animated sweep along the top edge of the bar: a "scanning" accent
     that never demands attention, just gives the chrome a pulse of life.
     Reduced motion turns it into a plain static line via the global rule
     below, since it is a standard CSS animation, not a JS-driven one. */
  .bar::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent) 45%, transparent 90%);
    background-size: 240% 100%; opacity: .55;
    animation: scan 7s linear infinite;
  }
  @keyframes scan {
    0%   { background-position: 120% 0; }
    100% { background-position: -120% 0; }
  }
  .brandmark {
    font-size: 18px; font-weight: 800; letter-spacing: -.03em;
    margin: 0; flex: 1; min-width: 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    /* It is a <button>, not an <h1>, so it can act as the "go home" control
       the top corner of a page conventionally is. Reset the button chrome
       browsers add by default. */
    background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
    font-family: inherit; color: var(--ink);
  }
  .brandmark:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .brandmark em, .hero-wordmark em { font-style: normal; color: var(--accent); }

  .navbtn {
    background: none; border: 0; padding: 5px 0; cursor: pointer;
    font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink-2);
    border-bottom: 2px solid transparent; white-space: nowrap;
    transition: color .15s ease, border-color .15s ease, transform .12s ease;
  }
  .navbtn.on { color: var(--ink); border-bottom-color: var(--accent); }
  .navbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .navbtn:active { transform: scale(.94); }

  /* Second level nav, shown only inside Explore and its leaves. Scrolls
     sideways rather than wrapping, so five tabs never push the bar taller on
     a narrow phone. */
  .subnav {
    display: flex; gap: 6px; margin-top: 10px; overflow-x: auto;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .subnav::-webkit-scrollbar { display: none; }
  .subnav[hidden] { display: none; }
  .subnavbtn {
    flex: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 13px; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2);
    transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .12s ease;
  }
  .subnavbtn.on { background: var(--accent-sf); border-color: var(--accent); color: var(--accent); }
  .subnavbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .subnavbtn:active { transform: scale(.95); }

  input[type="search"] {
    width: 100%; margin-top: 11px; padding: 10px 13px;
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    -webkit-appearance: none;
  }
  input[type="search"]::placeholder { color: var(--faint); }
  input[type="search"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* position:relative contains the visually hidden .sr span. Without a
     positioned ancestor it resolves against the viewport and can escape scroll
     clipping, dragging the page sideways. */
  .chip {
    position: relative;
    margin-top: 10px; cursor: pointer; font: inherit; font-size: 13px;
    background: var(--accent-sf); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 3px 12px;
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .notice {
    font-size: 11.5px; color: var(--faint); text-align: center;
    padding: 7px 16px; border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  main { padding: 4px 16px 56px; }

  ul.listing, ul.offers { list-style: none; margin: 0; padding: 0; }

  /* ── intro / hero ──────────────────────────────────────────────────────── */
  .intro { padding: 34px 0 8px; }
  .hero-logo { text-align: center; position: relative; }
  /* A soft, still glow behind the wordmark. Purely a background wash, so it
     stays legible and never competes with the text sitting on top of it. */
  .hero-logo::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 220px; height: 140px; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, var(--accent-sf), transparent 72%);
    opacity: .8; z-index: -1;
  }
  .hero-wordmark {
    margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -.035em; line-height: 1;
  }
  .hero-by {
    margin: 9px 0 0; font-size: 11.5px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--faint);
  }
  .hero-mission {
    margin: 18px auto 0; width: 90%; font-size: 17px; font-weight: 600;
    color: var(--ink); text-align: center; letter-spacing: -.01em;
  }
  .intro-points {
    list-style: none; margin: 26px 0 0; padding: 0;
    display: flex; flex-direction: column; gap: 9px;
  }
  .intro-points li { font-size: 13.5px; color: var(--ink-2); padding-left: 16px; position: relative; }
  .intro-points li::before {
    content: ""; position: absolute; left: 0; top: 8px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  .intro-points span { color: var(--ink); font-weight: 600; }

  /* ── popular rail ──────────────────────────────────────────────────────── */
  .pop-section { margin-top: 32px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .section-head h3 {
    margin: 0; font-size: 11.5px; font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--faint);
  }
  .link-btn {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--accent);
  }
  .link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  /* Negative margin lets cards bleed to the screen edge while the page keeps its
     gutter, so the row reads as scrollable. */
  .pop-rail {
    list-style: none; margin: 14px -16px 0; padding: 2px 16px 16px;
    display: flex; gap: 10px;
    overflow-x: auto; scroll-snap-type: x proximity; scroll-behavior: smooth;
    /* Snapping aligns items to the scrollport, not the padding box, so without
       this the first card snaps flush to the edge and clips its medal. */
    scroll-padding-inline: 16px;
    -webkit-overflow-scrolling: touch;
    /* A visible scrollbar matters more here than almost anywhere else in the
       app: on desktop, with a mouse and no touch swipe, a hidden scrollbar
       left this row looking like it just clipped rather than scrolled. Thin
       and grey so it reads as part of the row, not a browser chrome bolt on. */
    scrollbar-width: thin; scrollbar-color: var(--line-firm) transparent;
  }
  .pop-rail::-webkit-scrollbar { height: 6px; }
  .pop-rail::-webkit-scrollbar-track { background: transparent; }
  .pop-rail::-webkit-scrollbar-thumb {
    background: var(--line-firm); border-radius: 999px; border: 1px solid transparent;
    background-clip: padding-box;
  }
  .pop-rail::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  /* The rail is the one tile-grid context that scrolls horizontally instead of
     wrapping, so its items need a fixed width the grid's own auto-fill columns
     don't have to specify. Everything else about the tile is shared. */
  .pop-item { flex: none; width: 172px; scroll-snap-align: start; }
  .pop-item .tile { height: 100%; }

  /* ── product heading, used in every place a product appears ──────────────
     Brand and name on the left, size and concentration riding smaller and
     quieter on the right, centred against each other rather than hanging off
     the top. One rule so a product reads identically in a rail card, a list
     row and a page heading. */
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .phead-text { min-width: 0; flex: 1; }
  .phead-brand {
    display: block; font-size: 10px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .phead-name {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 14px; font-weight: 600; line-height: 1.25; letter-spacing: -.012em; margin-top: 1px;
  }
  .phead-meta {
    flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
    font-size: 10px; font-weight: 600; color: var(--faint); white-space: nowrap;
  }

  /* ── product image ───────────────────────────────────────────────────────
     A fixed square whatever the source image's own proportions are, so a
     photo, a differently shaped photo and a blank all occupy the same box and
     a future retailer's feed cannot reflow the layout. The white ground is
     ours, sitting behind the image: the licence that lets us show these
     photos also forbids altering them, so the JPEG's own white background is
     matched rather than keyed out. See demo/photo.ts. */
  .art {
    display: block; flex: none; aspect-ratio: 1 / 1; border-radius: 10px;
    overflow: hidden; background: #fff;
  }
  /* Percentages of the tile, not fixed pixels, so the picture stays the
     dominant element at every grid track width rather than a size someone
     picked for one specific tile. 90% is the width to aim for; art-lg goes
     further because the detail hero has nothing else competing with it.

     The ceiling only ever binds at the widest tracks. Three columns across a
     large monitor gives each tile roughly 600px, and 90% of that is a square
     the height of half the window: one tile per screen is a product page,
     not a list. Capping the picture keeps the tile browsable while leaving
     90% in force at every count where it is not silly. */
  .art-sm { width: 90%; }
  .art-md { width: min(90%, 300px); }
  .art-lg { width: 96%; max-width: 340px; }
  .art-img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* Fixed, not theme-driven: the placeholder sits inside a tile that is
     always white now, so it needs a colour that reads the same way whichever
     mode the rest of the page is in. Background matches the tile itself
     (and a real photo's own white ground) so only the mark and caption
     read as content, not the box around them. */
  .art-empty {
    background: #FFFFFF; border: 1px solid #E7E3E7;
    display: flex; align-items: center; justify-content: center; color: #8A838F;
  }
  .art-none { width: 82%; height: 82%; }
  .art-sm .art-none { width: 68%; height: 68%; }

  /* Medals mark the top three by popularity. A real rank, not decoration. */
  .medal {
    position: absolute; top: -2px; left: -4px; z-index: 2;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; box-shadow: var(--shadow);
  }
  .medal.gold   { background: linear-gradient(150deg, #F8DE84, #C8A128); color: #3A2C05; }
  .medal.silver { background: linear-gradient(150deg, #E6E9EE, #A2AAB5); color: #2E3238; }
  .medal.bronze { background: linear-gradient(150deg, #E2AB7C, #A96A31); color: #34200E; }

  /* ── fragrance tile grid ───────────────────────────────────────────────────
     One tile shape, used everywhere a list of fragrances appears (browse,
     search, deals, a retailer's own catalogue) and for the home rail. The
     picture is the point: .art-md fills 90% of the tile's own width rather
     than a fixed pixel size, so it stays the dominant element whatever the
     grid track width happens to be. */
  /* grid-auto-rows: 1fr is what makes every tile the same height: it forces
     all rows to one shared height, and .tile stretching to fill its row means
     a one-line name and a two-line name end up identical. Nothing inside the
     tile needs a hand-tuned height for that to hold — see .tile-art below,
     which takes up whatever slack is left over. */
  .tile-grid {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    grid-auto-rows: 1fr; gap: 12px;
  }
  /* Always white, in both themes: the tile holds the picture, and feed
     photography is already shot on a white ground (see .art below), so a
     white tile lets the two backgrounds disappear into one another instead
     of leaving a visible seam. Because that decouples the tile from
     --surface, its own text can no longer ride the theme's ink variables —
     those are tuned for --surface, which stays theme-dependent for every
     other card in the app, and dark mode's is pale text meant for a dark
     ground. So the tile fixes its text colours too, rather than inheriting. */
  .tile {
    width: 100%; display: flex; flex-direction: column; gap: 8px;
    background: #FFFFFF; border: 1px solid #E7E3E7; border-radius: 14px;
    padding: 12px 13px 14px; cursor: pointer; font: inherit; color: #17141A;
    text-align: left; transition: transform .12s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile:active { transform: scale(.97); }
  @media (hover: hover) and (pointer: fine) {
    .tile:hover { border-color: #D3CDD3; box-shadow: 0 0 0 1px #D3CDD3; }
  }
  .tile .phead-brand, .tile .phead-meta { color: #8A838F; }
  /* Two lines' worth of room whether the name needs one or two, so the picture
     starts at the same offset in every tile and the grid reads as columns
     rather than as tiles that happen to sit near each other. */
  .tile .phead-name { min-height: 2.5em; }
  /* The slack absorber: with every row the same height (grid-auto-rows above),
     whatever height the text does not use ends up here, which keeps the price
     and the shop tag on the tile's bottom edge across the whole row. */
  .tile-art {
    position: relative; flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center; padding: 4px 0;
  }
  /* One value per line, never side by side: price first, then what it was.
     A row that mixes the two invites reading the struck-through number as the
     price being charged. */
  .tile-price {
    font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--accent); text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .tile-price .off {
    font-size: 10.5px; font-weight: 700; color: #17724B;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .tile-price .amt { font-size: 15.5px; }
  .tile-price .amt.none { color: #8A838F; font-weight: 600; font-size: 13.5px; }
  .tile-price .was {
    font-size: 11px; font-weight: 600; color: #8A838F;
    text-decoration: line-through; font-variant-numeric: tabular-nums;
  }
  .from { font-size: 10px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }

  /* Which shop the price is actually from, since we cannot show their logo:
     no comparison site has a licence to reproduce a retailer's trademark, so
     this is a plain text tag using the name instead, the same call already
     made for the Retailers directory's monogram tiles. */
  .sold-by {
    align-self: center; max-width: 100%;
    background: #F0EDEF; color: #55505A; border: 1px solid #E7E3E7;
    font-size: 9px; font-weight: 700; letter-spacing: .03em;
    padding: 3px 8px; border-radius: 999px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .empty-note { color: var(--ink-2); font-size: 14.5px; padding: 30px 2px; text-align: center; }

  /* ── page headings and shared panel furniture ──────────────────────────── */
  .page-head {
    display: flex; align-items: baseline; gap: 10px; margin: 4px 0 12px;
  }
  .page-head h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.025em; }
  .count {
    font-size: 12px; font-weight: 700; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .panel-note { font-size: 12.5px; color: var(--faint); margin: 0 0 14px; line-height: 1.55; }

  /* Sort and filter controls: an icon, then the choice itself. */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 16px; }
  .control {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 0 10px 0 9px;
  }
  .control:focus-within { border-color: var(--accent); }
  .control-ico { display: flex; color: var(--faint); }
  .ico { width: 17px; height: 17px; display: block; }
  .dropdown {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    background: none; border: 0; padding: 8px 2px; cursor: pointer;
  }
  .dropdown:focus-visible { outline: none; }

  /* ── brands ────────────────────────────────────────────────────────────── */
  .brand-list { list-style: none; margin: 0; padding: 0; }
  .brand-row {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 2px; font: inherit; font-size: 15.5px; font-weight: 500; color: var(--ink);
    transition: color .12s ease;
  }
  .brand-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) {
    .brand-row:hover { color: var(--accent); }
  }
  /* The initial, then a rule running to the end of the column, so a long
     alphabetical list breaks into scannable blocks. */
  .alpha-break {
    display: flex; align-items: center; gap: 10px;
    margin: 18px 0 4px; color: var(--accent);
  }
  .alpha-break:first-child { margin-top: 0; }
  .alpha-break span { font-size: 13px; font-weight: 800; letter-spacing: .04em; }
  .alpha-break i { flex: 1; height: 1px; background: var(--line-firm); }

  /* ── retailers ─────────────────────────────────────────────────────────── */
  /* Initials, not a copy of the shop's own logo: reproducing those is a
     trademark question this project has no answer to, and inventing one would
     be worse. */
  .monogram {
    flex: none; width: 42px; height: 42px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-sf); color: var(--accent);
    font-size: 14px; font-weight: 800; letter-spacing: -.02em;
    border: 1px solid var(--accent);
  }
  .shop-list { list-style: none; margin: 0; padding: 0; }
  .shop-row {
    width: 100%; display: flex; align-items: center; gap: 13px; cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 2px; font: inherit; color: var(--ink); text-align: left;
    transition: background-color .12s ease;
  }
  .shop-row:active { background: var(--surface); }
  .shop-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .shop-row-text { flex: 1; min-width: 0; }
  .shop-row-name { display: block; font-size: 15.5px; font-weight: 600; letter-spacing: -.012em; }
  .shop-row-meta { display: block; font-size: 12.5px; color: var(--faint); }
  .shop-row-go { flex: none; color: var(--accent); font-weight: 700; }

  .shop-hero { text-align: center; padding: 6px 0 20px; }
  .shop-hero .monogram { width: 62px; height: 62px; border-radius: 16px; font-size: 20px; margin: 0 auto 12px; }
  .shop-hero-name { font-size: 25px; font-weight: 700; letter-spacing: -.025em; margin: 0; }
  .shop-hero-domain { font-size: 12.5px; color: var(--faint); margin: 3px 0 0; }
  .shop-hero-blurb { font-size: 14px; color: var(--ink-2); margin: 12px auto 0; max-width: 46ch; line-height: 1.6; }

  .fact-list { list-style: none; margin: 0 0 6px; padding: 0; }
  .fact-list li {
    font-size: 13.5px; color: var(--ink-2); padding: 8px 0 8px 16px;
    border-bottom: 1px solid var(--line); position: relative;
  }
  .fact-list li::before {
    content: ""; position: absolute; left: 0; top: 15px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }

  /* ── notes ─────────────────────────────────────────────────────────────── */
  /* Same row as .brand-row (block, one column, alphabetical dividers) — this
     just adds the count on the right, so it needs flex instead of block. */
  .note-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .note-row-count {
    flex: none; font-size: 13px; font-weight: 700; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  .notes-block { margin-top: 26px; }
  .note-layer { margin-bottom: 12px; }
  .note-layer-name {
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 6px;
  }
  .note-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
  .note-chip {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; font: inherit; font-size: 12.5px; color: var(--ink);
    cursor: pointer; transition: border-color .12s ease, color .12s ease;
  }
  .note-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .note-chip:hover { border-color: var(--accent); color: var(--accent); }
  }
  .notes-none { font-size: 13.5px; color: var(--faint); margin: 0; }
  .notes-source { font-size: 11.5px; color: var(--faint); margin: 10px 0 0; }

  /* ── full search ───────────────────────────────────────────────────────── */
  .search-big {
    display: flex; align-items: center; gap: 9px; margin: 4px 0 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 13px;
  }
  .search-big:focus-within { border-color: var(--accent); }
  .search-big .ico { color: var(--faint); flex: none; width: 19px; height: 19px; }
  .search-big input {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; color: var(--ink);
    background: none; border: 0; padding: 12px 0; -webkit-appearance: none;
  }
  .search-big input:focus-visible { outline: none; }

  /* ── detail ────────────────────────────────────────────────────────────── */
  .back {
    background: none; border: 0; padding: 14px 0 8px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--accent);
  }
  .back::before { content: "‹"; margin-right: 6px; font-size: 18px; line-height: 1; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .hero { padding: 6px 0 24px; border-bottom: 1px solid var(--line); }
  /* The art sits centred in its own band; the heading below it keeps the same
     left/right split as everywhere else so the product reads consistently. */
  .hero-art { display: flex; justify-content: center; margin-bottom: 16px; }
  .hero .phead-name { font-size: 22px; -webkit-line-clamp: 3; letter-spacing: -.022em; }
  .hero .phead-brand { font-size: 11px; letter-spacing: .12em; }
  .hero .phead-meta { font-size: 11.5px; }
  .hero-blurb { font-size: 13.5px; color: var(--faint); margin: 9px auto 0; max-width: 32ch; }

  /* The one number on the page a reader actually needs, in its own glowing
     card so it cannot be mistaken for just another line of text. */
  .price-box {
    margin: 18px auto 0; max-width: 260px; padding: 16px 20px 17px;
    border-radius: 16px; border: 1px solid var(--accent);
    background: var(--accent-sf);
    box-shadow: 0 0 30px 2px color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .price-box-label {
    margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent);
  }
  .price-box-amount {
    margin: 6px 0 0; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: -.03em; line-height: 1.1; color: var(--accent);
  }
  .price-box-from { margin: 5px 0 0; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }

  .hero-price.none { font-size: 19px; font-weight: 600; color: var(--ink-2); letter-spacing: -.01em; margin: 18px 0 0; }
  .hero-at { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-top: 4px; letter-spacing: 0; }

  .results-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 18px 2px 8px; font-size: 12px; color: var(--ink-2);
  }
  .results-head .dim { color: var(--faint); }

  .offer { border-bottom: 1px solid var(--line); }
  .offers .offer:last-child { border-bottom: 0; }
  .offer-link {
    display: flex; flex-direction: column; gap: 4px;
    padding: 14px 2px; text-decoration: none; color: inherit;
  }
  .offer-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .offer-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .shop { font-size: 15.5px; font-weight: 600; letter-spacing: -.012em; }
  .tag {
    margin-left: 8px; vertical-align: 1px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--accent-on); background: var(--accent); border-radius: 4px; padding: 2px 6px;
  }
  /* NEW marks a listing this shop added inside the last week. It is deliberately
     a different colour from the accent so it never reads as "cheapest". */
  .tag.new { background: var(--ok); color: #06170F; }
  :root[data-mode="dark"] .tag.new, :root[data-mode="system"] .tag.new { color: #06170F; }
  .price { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .was { font-size: 12.5px; color: var(--faint); text-decoration: line-through; font-variant-numeric: tabular-nums; }
  .now { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .now.sale { color: var(--ok); }
  .now.none { color: var(--faint); font-weight: 500; }

  .offer-bot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .facts { font-size: 12.5px; color: var(--ink-2); }
  .sep { margin: 0 5px; color: var(--faint); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--faint); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.muted, .dot.gone { background: var(--faint); }
  .off { font-size: 11.5px; font-weight: 700; color: var(--ok); white-space: nowrap; }
  .ends { font-size: 11.5px; color: var(--warn); font-weight: 500; }

  .offer.unavail { opacity: .5; }
  /* A shop with no listing at all for this fragrance, not even a sold out
     one. Deliberately quieter than .unavail above: that shop is at least
     confirmed to carry the bottle, this one has never been seen selling it. */
  .offer.unavail-elsewhere { opacity: .4; }
  .offer.unavail-elsewhere .offer-link { cursor: default; padding-block: 10px; }

  .gone-head {
    margin: 26px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 11px; font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; color: var(--faint);
  }

  /* ── settings and documents ────────────────────────────────────────────── */
  .doc { padding: 4px 0 8px; }
  .doc h2 { font-size: 25px; font-weight: 700; letter-spacing: -.025em; margin: 8px 0 16px; }
  .doc h3 { font-size: 14px; font-weight: 650; margin: 24px 0 7px; letter-spacing: -.01em; }
  .doc p, .doc li { font-size: 14px; color: var(--ink-2); line-height: 1.62; }
  .doc p { margin: 0 0 11px; }
  .doc ul { margin: 0 0 11px; padding-left: 20px; }
  .doc li { margin-bottom: 6px; }
  .doc a { color: var(--accent); }
  .doc strong { color: var(--ink); font-weight: 650; }
  .doc .meta { font-size: 12.5px; color: var(--faint); margin-top: 22px; }
  .doc .draft {
    background: var(--surface); border-left: 3px solid var(--warn);
    padding: 12px 14px; border-radius: 0 9px 9px 0; font-size: 13px;
  }
  .doc .draft strong { color: var(--warn); }

  /* Settings content sits centred in the available height on both layouts,
     rather than pinned to the top, but never fights scrolling: min-height
     only asks for the space, it never clips content taller than the
     viewport. */
  .settings-doc {
    display: flex; flex-direction: column; align-items: center;
    min-height: calc(100vh - 220px); justify-content: center; text-align: center;
  }
  .settings-doc h2 { align-self: center; }
  .settings-doc h3, .settings-doc .foot-links, .settings-doc .foot-legal { align-self: stretch; }

  .seg-group { width: 100%; max-width: 360px; margin-top: 14px; }
  .seg-label {
    margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); text-align: left;
  }
  .seg {
    display: flex; background: var(--surface); border: 1px solid var(--line);
    border-radius: 11px; padding: 3px; gap: 3px;
  }
  .seg-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 6px; border: 0; border-radius: 8px; cursor: pointer;
    background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2);
    transition: background-color .15s ease, color .15s ease;
  }
  .seg-btn.on { background: var(--accent-sf); color: var(--accent); }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg-btn:active { transform: scale(.97); }
  .seg-icon svg { display: block; }

  .settings-note { font-size: 12px; color: var(--faint); margin: 12px 0 0; text-align: center; }

  .contact-form {
    width: 100%; max-width: 360px; margin-top: 12px;
    display: flex; flex-direction: column; gap: 12px; text-align: left;
  }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-2); }
  .field select, .field textarea {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; resize: vertical;
  }
  .field select:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .contact-send {

  .contact-send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .social {

  .social summary svg { color: var(--accent); flex: none; }
  .social p { margin: 0; padding: 0 14px 12px 41px; font-size: 13px; }

  /* ── brand sheet ───────────────────────────────────────────────────────── */
  .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; }

  .brand-opt.on { color: var(--accent); font-weight: 650; }
  .brand-opt.on::after { content: " ✓"; }

  .foot-line a { color: var(--accent); }

  @keyframes viewIn {

  :root[data-layout="desktop"] main { padding-inline: 32px; }
  :root[data-layout="desktop"] .intro { padding-top: 56px; }
  :root[data-layout="desktop"] .hero-wordmark { font-size: 46px; }
  /* The page itself now runs edge to edge, but a line of prose stretched

  :root[data-layout="desktop"] .hero-mission { max-width: 640px; }
  :root[data-layout="desktop"] .intro-points {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px 40px; margin: 30px auto 0; max-width: 900px;
  }

  :root[data-layout="desktop"] .pop-item { width: 168px; }

  /* Desktop takes the reader's chosen column count literally: equal tracks
     filling the page width, rather than the narrow layout's "fit as many as

  :root[data-layout="desktop"] .tile-grid {
    grid-template-columns: repeat(var(--per-row, 5), minmax(0, 1fr));

  :root[data-layout="desktop"] .detail-grid {

  }
  :root[data-layout="desktop"] .hero {

    position: sticky; top: 74px;
  }
  :root[data-layout="desktop"] .hero-blurb { margin-inline: auto; }
  :root[data-layout="desktop"] .detail-offers { border-left: 1px solid var(--line); padding-left: 48px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  </p>`,R=[{id:"how-it-works",title:"How PriceSniffs works",short:"How It Works",body:`
      <p>PriceSniffs compares fragrance prices across UK shops so you can see what a
      bottle really costs before you buy it.</p>

      <h3>Delivery is counted</h3>
      <p>Every price includes standard delivery to a UK mainland address, and we
      work out whether your order is large enough to qualify for free postage.
      Boots posts free once you spend \xA325 and charges \xA33.95 below that. Harvey
      Nichols wants \xA3300, which one bottle will never reach, so its listings
      always carry \xA35.95 on top. That is why a bottle priced at \xA324.99 can cost
      you more than one priced at \xA326.</p>

      <h3>Reductions come from the shop</h3>
      <p>When you see a previous price and a percentage saving, that figure is the
      shop's own. We never calculate one ourselves. Percentages round down, so a
      saving of 19.6 per cent shows as 19 per cent and never as 20. A countdown
      appears only when the shop has published a closing time for the offer. We
      never invent one.</p>

      <h3>Membership rates are not the headline</h3>
      <p>Superdrug posts free at \xA320 for Health and Beautycard holders and at \xA325
      for everyone else, so we quote \xA325. The Perfume Shop, The Fragrance Shop,
      Selfridges and LOOKFANTASTIC all run schemes of their own. We mention them,
      but we never build a members only rate into the headline price, because it
      is not a price you can pay unless you have already joined.</p>

      <h3>Sold out stays at the bottom</h3>
      <p>Listings a shop has marked unavailable sit at the end of the results and
      can never be shown as the cheapest option, however low the price. Where we
      could not read the stock figure at all we say so rather than guess, and that
      listing drops below the ones we could confirm.</p>

      <h3>Position is not for sale</h3>
      <p>Results are ordered by availability and then by price. Nothing else. No
      shop can pay to appear higher, and commission never moves a listing. Read
      our <a href="#" data-page="affiliate">affiliate disclosure</a>.</p>`},{id:"affiliate",title:"Affiliate disclosure",short:"Affiliate Disclosure",body:`
      ${F}
      <p>PriceSniffs intends to earn commission when you buy through some of the
      links on this site. It costs you nothing and does not change the price you
      pay.</p>

      <h3>Where things stand today</h3>
      <p>No affiliate programme is running yet. All twelve shops we list pay us
      nothing, and every link goes straight to the shop. Boots, LOOKFANTASTIC and
      Superdrug run their programmes through Awin and we have applied to none of
      them so far. We will update this page when that changes, and links carrying
      tracking will be identifiable.</p>

      <h3>What commission does not touch</h3>
      <p>Commission has no bearing on the order of results, on which shops we
      include, or on the prices we show. Position is decided by stock and by
      delivered price. We will not take payment for placement inside the results.
      If we ever run a paid placement it will sit outside the results and be
      labelled as advertising.</p>

      <h3>Why we tell you this</h3>
      <p>UK advertising rules require affiliate relationships to be obvious before
      you click, not buried in a policy page. That is why the note also appears at
      the bottom of every screen.</p>`},{id:"privacy",title:"Privacy notice",short:"Privacy",body:`
      ${F}
      <p>This notice sets out what personal data ${p.name} collects, why we
      collect it, and what you can ask us to do about it. It is written to meet UK
      GDPR and the Data Protection Act 2018.</p>

      <h3>Who we are</h3>
      <p>The data controller is ${p.legalName}, company number
      ${p.number}, registered at ${p.address}. Our ICO registration
      number is ${p.ico}. You can reach us at
      <a href="mailto:${p.privacyEmail}">${p.privacyEmail}</a>.</p>

      <h3>What we collect</h3>
      <ul>
        <li><strong>Search terms.</strong> Whatever you type into the search box,
        so we can tell which fragrances are popular. Stored with nothing attached
        that would link it back to you.</li>
        <li><strong>Technical data.</strong> Your IP address, browser type and the
        pages you visited, kept in server logs for security and for fixing
        faults.</li>
        <li><strong>Anything you send us.</strong> If you email us, we keep your
        message and your address so that we can reply.</li>
      </ul>
      <p>We do not ask you to create an account and we never see your payment
      details. Buying happens on the shop's own site, under their privacy policy
      rather than ours.</p>

      <h3>Our lawful basis</h3>
      <p>For search counts and security logging we rely on legitimate interests,
      namely running and improving a price comparison service in a way we believe
      you would expect and which carries very little privacy risk. Where we use
      cookies that are not strictly necessary we rely on your consent, and you can
      withdraw it whenever you like.</p>

      <h3>Cookies</h3>
      <p>At present we set only the cookies needed to make the site work. If we
      add analytics or affiliate tracking we will ask you first and list those
      cookies here. Affiliate networks may set cookies of their own once you
      follow a link to a shop, and those fall under that network's policy.</p>

      <h3>Who else sees it</h3>
      <p>We do not sell personal data. We share it only with suppliers acting on
      our instructions, currently [HOSTING PROVIDER], and where the law requires
      us to hand it over.</p>

      <h3>How long we keep it</h3>
      <p>Server logs are held for [RETENTION PERIOD, for example 90 days]. Search
      counts are kept indefinitely because they hold no personal data. Emails are
      kept for [RETENTION PERIOD] after the matter is closed.</p>

      <h3>Your rights</h3>
      <p>You can ask for a copy of your data, ask us to correct or delete it,
      object to what we are doing with it, ask us to restrict it, or ask for it in
      a portable format. Write to
      <a href="mailto:${p.privacyEmail}">${p.privacyEmail}</a> and we
      will reply within one month.</p>
      <p>If you are unhappy with how we have handled your data you can complain to
      the Information Commissioner's Office at
      <a href="https://ico.org.uk" rel="noopener" target="_blank">ico.org.uk</a>
      or by calling 0303 123 1113.</p>

      <p class="meta">Last updated ${p.updated}.</p>`},{id:"terms",title:"Terms of use",short:"Terms",body:`
      ${F}
      <p>Using PriceSniffs means accepting these terms.</p>

      <h3>What PriceSniffs is</h3>
      <p>PriceSniffs is an information service. We do not sell fragrance, hold stock,
      take payments or send parcels. Any purchase is a contract between you and
      the shop, on their terms.</p>

      <h3>How accurate the prices are</h3>
      <p>We work hard to show accurate prices, but we collect them periodically
      and they can change at any moment. Postage costs and the order values needed
      for free delivery are modelled from the published terms of all twelve shops,
      and may not capture every promotion, Highlands surcharge or basket rule.
      <strong>Always check the price on the shop's own site before you buy.</strong>
      Every listing carries the time we last looked, down to the minute.</p>
      <p>We are not liable for losses caused by a price, postage cost or stock
      figure being wrong or out of date, except where the law does not let us
      exclude liability.</p>

      <h3>The shops we list</h3>
      <p>Appearing here is not an endorsement, and being absent is not a
      criticism. We list established UK shops. We do not inspect individual
      parcels and we cannot guarantee the authenticity of goods sold by anyone
      else.</p>

      <h3>Fair use</h3>
      <p>Please do not scrape the site, overload it, try to disrupt it, or copy
      substantial parts of it without asking us first.</p>

      <h3>Our content</h3>
      <p>The design, wording and data compilations belong to ${p.legalName}.
      Brand names, product names and trade marks belong to their owners and appear
      here only to identify products. The bottle images on this site are our own
      drawings. They are not photographs supplied by any brand.</p>

      <h3>Changes and governing law</h3>
      <p>We may revise these terms, and the current version always sits here.
      These terms are governed by the law of England and Wales.</p>

      <p class="meta">Last updated ${p.updated}.</p>`},{id:"contact",title:"Contact and feedback",short:"Contact",body:`
      <p>We would far rather hear about a wrong price than not hear about it. Send
      us the fragrance, the bottle size, the shop and the figure you saw on their
      site, and we will go and check it the same day.</p>

      <h3>Feedback and corrections</h3>
      <p><a href="mailto:${p.feedbackEmail}">${p.feedbackEmail}</a></p>

      <h3>General enquiries</h3>
      <p><a href="mailto:${p.email}">${p.email}</a></p>

      <h3>Privacy and data requests</h3>
      <p><a href="mailto:${p.privacyEmail}">${p.privacyEmail}</a></p>

      <h3>If you run a shop</h3>
      <p>Write to ${p.email} if you want to be listed, corrected or removed,
