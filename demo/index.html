<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#131013" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PriceSniffs" />
<meta name="mobile-web-app-capable" content="yes" />
<title>PriceSniffs</title>
<style>
  /* Dark ground with a red accent, per the brief. One narrow column, centred on
     wider screens, so the phone layout is the only layout to maintain and a
     React Native client can mirror it directly.

     Note on colour: red is the brand accent here, so it cannot also mean "bad".
     Sold out listings use muted grey instead, and only positive states carry
     colour. Otherwise every red pixel would compete for the same meaning. */
  :root, :root[data-mode="dark"] {
    --bg:        #131013;
    --surface:   #1C181D;
    --surface-2: #262029;
    --ink:       #F5F1F4;
    --ink-2:     #B6AEB6;
    --faint:     #857C86;
    --line:      #2E2831;
    --line-firm: #3D3541;
    --accent:    #E8434C;
    --accent-on: #FFFFFF;
    --accent-sf: #3A1519;
    --ok:        #4FB47B;
    --warn:      #D8A24C;
    --shadow:    0 1px 3px rgba(0,0,0,.5);
  }

  :root[data-mode="light"] {
    --bg:        #FFFFFF;
    --surface:   #F8F6F7;
    --surface-2: #F0EDEF;
    --ink:       #17141A;
    --ink-2:     #55505A;
    --faint:     #8A838F;
    --line:      #E7E3E7;
    --line-firm: #D3CDD3;
    --accent:    #C62630;
    --accent-on: #FFFFFF;
    --accent-sf: #FCEDEE;
    --ok:        #17724B;
    --warn:      #8A5A00;
    --shadow:    0 1px 3px rgba(0,0,0,.18);
  }

  /* "Match my device" follows the OS preference, and also any theme the host
     stamps on the root, so an external toggle keeps working. */
  @media (prefers-color-scheme: light) {
    :root[data-mode="system"] {
      --bg: #FFFFFF; --surface: #F8F6F7; --surface-2: #F0EDEF;
      --ink: #17141A; --ink-2: #55505A; --faint: #8A838F;
      --line: #E7E3E7; --line-firm: #D3CDD3;
      --accent: #C62630; --accent-on: #FFFFFF; --accent-sf: #FCEDEE;
      --ok: #17724B; --warn: #8A5A00; --shadow: 0 1px 3px rgba(0,0,0,.18);
    }
  }
  :root[data-mode="system"][data-theme="light"] {
    --bg: #FFFFFF; --surface: #F8F6F7; --surface-2: #F0EDEF;
    --ink: #17141A; --ink-2: #55505A; --faint: #8A838F;
    --line: #E7E3E7; --line-firm: #D3CDD3;
    --accent: #C62630; --accent-on: #FFFFFF; --accent-sf: #FCEDEE;
    --ok: #17724B; --warn: #8A5A00; --shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  :root[data-mode="system"][data-theme="dark"] {
    --bg: #131013; --surface: #1C181D; --surface-2: #262029;
    --ink: #F5F1F4; --ink-2: #B6AEB6; --faint: #857C86;
    --line: #2E2831; --line-firm: #3D3541;
    --accent: #E8434C; --accent-on: #FFFFFF; --accent-sf: #3A1519;
    --ok: #4FB47B; --warn: #D8A24C; --shadow: 0 1px 3px rgba(0,0,0,.5);
  }

  :root {
    /* The system UI stack resolves to SF Pro on Apple, Segoe UI Variable on
       Windows and Roboto on Android: smooth, and no webfont to fail loading. */
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
            "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue",
            Arial, sans-serif;
    --col: 460px;
    /* The brand filter sheet stays a comfortable dialog width in both
       layouts. It should not balloon to the desktop page width, so it gets
       its own variable rather than following --col. */
    --sheet-col: 460px;
  }

  /* Desktop is a genuinely different layout, not just a wider mobile column:
     more width, a browse grid instead of a stacked list, and a two column
     detail view. See the [data-layout="desktop"] rules threaded through the
     sections below. Chosen once on first load from a real device signal
     (see demo/app.ts's detectDefaultLayout), then remembered per visitor
     once they pick for themselves. */
  :root[data-layout="desktop"] { --col: 1180px; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -.006em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern" 1;
  }

  .app { max-width: var(--col); margin: 0 auto; min-height: 100vh; }

  /* ── top bar ───────────────────────────────────────────────────────────── */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 13px 16px 11px;
  }
  .bar-row { display: flex; align-items: center; gap: 12px; position: relative; }
  /* A thin animated sweep along the top edge of the bar: a "scanning" accent
     that never demands attention, just gives the chrome a pulse of life.
     Reduced motion turns it into a plain static line via the global rule
     below, since it is a standard CSS animation, not a JS-driven one. */
  .bar::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent) 45%, transparent 90%);
    background-size: 240% 100%; opacity: .55;
    animation: scan 7s linear infinite;
  }
  @keyframes scan {
    0%   { background-position: 120% 0; }
    100% { background-position: -120% 0; }
  }
  .brandmark {
    font-size: 18px; font-weight: 800; letter-spacing: -.03em;
    margin: 0; flex: 1; min-width: 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    /* It is a <button>, not an <h1>, so it can act as the "go home" control
       the top corner of a page conventionally is. Reset the button chrome
       browsers add by default. */
    background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
    font-family: inherit; color: var(--ink);
  }
  .brandmark:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .brandmark em, .hero-wordmark em { font-style: normal; color: var(--accent); }

  .navbtn {
    background: none; border: 0; padding: 5px 0; cursor: pointer;
    font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink-2);
    border-bottom: 2px solid transparent; white-space: nowrap;
    transition: color .15s ease, border-color .15s ease, transform .12s ease;
  }
  .navbtn.on { color: var(--ink); border-bottom-color: var(--accent); }
  .navbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .navbtn:active { transform: scale(.94); }

  input[type="search"] {
    width: 100%; margin-top: 11px; padding: 10px 13px;
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    -webkit-appearance: none;
  }
  input[type="search"]::placeholder { color: var(--faint); }
  input[type="search"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* position:relative contains the visually hidden .sr span. Without a
     positioned ancestor it resolves against the viewport and can escape scroll
     clipping, dragging the page sideways. */
  .chip {
    position: relative;
    margin-top: 10px; cursor: pointer; font: inherit; font-size: 13px;
    background: var(--accent-sf); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 3px 12px;
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .notice {
    font-size: 11.5px; color: var(--faint); text-align: center;
    padding: 7px 16px; border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  main { padding: 4px 16px 56px; }

  ul.listing, ul.offers { list-style: none; margin: 0; padding: 0; }

  /* ── intro / hero ──────────────────────────────────────────────────────── */
  .intro { padding: 34px 0 8px; }
  .hero-logo { text-align: center; position: relative; }
  /* A soft, still glow behind the wordmark. Purely a background wash, so it
     stays legible and never competes with the text sitting on top of it. */
  .hero-logo::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 220px; height: 140px; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, var(--accent-sf), transparent 72%);
    opacity: .8; z-index: -1;
  }
  .hero-wordmark {
    margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -.035em; line-height: 1;
  }
  .hero-by {
    margin: 9px 0 0; font-size: 11.5px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--faint);
  }
  .hero-mission {
    margin: 18px auto 0; width: 90%; font-size: 17px; font-weight: 600;
    color: var(--ink); text-align: center; letter-spacing: -.01em;
  }
  .intro-points {
    list-style: none; margin: 26px 0 0; padding: 0;
    display: flex; flex-direction: column; gap: 9px;
  }
  .intro-points li { font-size: 13.5px; color: var(--ink-2); padding-left: 16px; position: relative; }
  .intro-points li::before {
    content: ""; position: absolute; left: 0; top: 8px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  .intro-points span { color: var(--ink); font-weight: 600; }

  /* ── popular rail ──────────────────────────────────────────────────────── */
  .pop-section { margin-top: 32px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .section-head h3 {
    margin: 0; font-size: 11.5px; font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--faint);
  }
  .link-btn {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--accent);
  }
  .link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  /* Negative margin lets cards bleed to the screen edge while the page keeps its
     gutter, so the row reads as scrollable. */
  .pop-rail {
    list-style: none; margin: 14px -16px 0; padding: 2px 16px 16px;
    display: flex; gap: 10px;
    overflow-x: auto; scroll-snap-type: x proximity; scroll-behavior: smooth;
    /* Snapping aligns items to the scrollport, not the padding box, so without
       this the first card snaps flush to the edge and clips its medal. */
    scroll-padding-inline: 16px;
    -webkit-overflow-scrolling: touch;
    /* A visible scrollbar matters more here than almost anywhere else in the
       app: on desktop, with a mouse and no touch swipe, a hidden scrollbar
       left this row looking like it just clipped rather than scrolled. Thin
       and grey so it reads as part of the row, not a browser chrome bolt on. */
    scrollbar-width: thin; scrollbar-color: var(--line-firm) transparent;
  }
  .pop-rail::-webkit-scrollbar { height: 6px; }
  .pop-rail::-webkit-scrollbar-track { background: transparent; }
  .pop-rail::-webkit-scrollbar-thumb {
    background: var(--line-firm); border-radius: 999px; border: 1px solid transparent;
    background-clip: padding-box;
  }
  .pop-rail::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  .pop-item { flex: none; scroll-snap-align: start; }

  .pop {
    width: 172px; height: 268px; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 13px 14px; cursor: pointer; font: inherit; color: var(--ink);
    text-align: left; transition: transform .12s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .pop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pop:active { transform: scale(.96); }
  @media (hover: hover) and (pointer: fine) {
    .pop:hover { border-color: var(--line-firm); box-shadow: 0 0 0 1px var(--line-firm); }
  }

  /* Brand, name, size and concentration lead the card; the picture and the
     price follow. Every tile is a fixed height (see .pop above), so the text
     block and art both get a fixed share rather than sizing to content. */
  .pop-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .pop-text { min-width: 0; flex: 1; }
  .pop-brand {
    font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pop-name {
    font-size: 14px; font-weight: 600; line-height: 1.25; letter-spacing: -.012em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.3em; margin-top: 1px;
  }
  .pop-meta {
    flex: none; display: flex; flex-direction: column; align-items: flex-end;
    gap: 1px; font-size: 10px; font-weight: 600; color: var(--faint);
    white-space: nowrap; padding-top: 1px;
  }
  .pop-art {
    position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 4px 0;
  }
  .pop-price {
    font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--accent); text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .pop-price span { font-weight: 800; }

  /* Real product photo vs the plain grey marker used until one is licensed
     for a given retailer — see demo/photo.ts for why there is no third,
     invented option. */
  .bottle { display: block; }
  .bottle-photo { object-fit: contain; border-radius: 8px; background: var(--surface-2); }

  /* Medals mark the top three by popularity. A real rank, not decoration. */
  .medal {
    position: absolute; top: -2px; left: -4px; z-index: 2;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; box-shadow: var(--shadow);
  }
  .medal.gold   { background: linear-gradient(150deg, #F8DE84, #C8A128); color: #3A2C05; }
  .medal.silver { background: linear-gradient(150deg, #E6E9EE, #A2AAB5); color: #2E3238; }
  .medal.bronze { background: linear-gradient(150deg, #E2AB7C, #A96A31); color: #34200E; }

  /* ── browse list ───────────────────────────────────────────────────────── */
  .card {
    width: 100%; display: flex; align-items: center; gap: 14px;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 14px 2px; cursor: pointer; font: inherit; color: var(--ink);
    text-align: left; transition: background-color .12s ease;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Full width rows would clip against the list's edges if scaled on press
     like the compact controls do, so the feedback here is a tint instead. */
  .card:active { background: var(--surface); }
  .card-art { flex: none; display: flex; }
  .card-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .card-brand { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .card-name {
    font-size: 16.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.015em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-meta { font-size: 12.5px; color: var(--ink-2); }
  .card-price { flex: none; text-align: right; display: flex; flex-direction: column; }
  .from { font-size: 10px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
  .amt {
    font-size: 16.5px; font-weight: 700; font-variant-numeric: tabular-nums;
    letter-spacing: -.01em; color: var(--accent);
  }
  .amt.none { color: var(--faint); font-weight: 500; font-size: 13px; }

  .empty-note { color: var(--ink-2); font-size: 14.5px; padding: 30px 2px; text-align: center; }

  /* ── brands ────────────────────────────────────────────────────────────── */
  .brands-head {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px 14px; margin: 6px 0 16px;
  }
  .brands-head h2 { margin: 0; }
  .brands-controls { display: flex; gap: 8px; }
  .dropdown {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 10px; cursor: pointer;
  }
  .dropdown:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .brand-list { list-style: none; margin: 0; padding: 0; }
  .brand-row {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 13px 2px; font: inherit; font-size: 15.5px; font-weight: 500; color: var(--ink);
    transition: color .12s ease;
  }
  .brand-list li:last-child .brand-row { border-bottom: 0; }
  .brand-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) {
    .brand-row:hover { color: var(--accent); }
  }

  /* ── detail ────────────────────────────────────────────────────────────── */
  .back {
    background: none; border: 0; padding: 14px 0 8px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--accent);
  }
  .back::before { content: "‹"; margin-right: 6px; font-size: 18px; line-height: 1; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .hero { text-align: center; padding: 6px 0 24px; border-bottom: 1px solid var(--line); }
  .hero-brand { font-size: 11px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--faint); margin: 12px 0 0; }
  .hero-name { font-size: 28px; font-weight: 700; letter-spacing: -.028em; margin: 3px 0 3px; text-wrap: balance; }
  /* Smaller and right aligned within the hero column, rather than centred
     with the brand and name, so it reads as a spec label, not more title. */
  .hero-meta { font-size: 12px; color: var(--ink-2); margin: 0; text-align: right; }
  .hero-blurb { font-size: 13.5px; color: var(--faint); margin: 9px auto 0; max-width: 32ch; }

  /* The one number on the page a reader actually needs, in its own glowing
     card so it cannot be mistaken for just another line of text. */
  .price-box {
    margin: 18px auto 0; max-width: 260px; padding: 16px 20px 17px;
    border-radius: 16px; border: 1px solid var(--accent);
    background: var(--accent-sf);
    box-shadow: 0 0 30px 2px color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .price-box-label {
    margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent);
  }
  .price-box-amount {
    margin: 6px 0 0; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: -.03em; line-height: 1.1; color: var(--accent);
  }
  .price-box-from { margin: 5px 0 0; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }

  .hero-price.none { font-size: 19px; font-weight: 600; color: var(--ink-2); letter-spacing: -.01em; margin: 18px 0 0; }
  .hero-at { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-top: 4px; letter-spacing: 0; }

  .results-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 18px 2px 8px; font-size: 12px; color: var(--ink-2);
  }
  .results-head .dim { color: var(--faint); }

  .offer { border-bottom: 1px solid var(--line); }
  .offers .offer:last-child { border-bottom: 0; }
  .offer-link {
    display: flex; flex-direction: column; gap: 4px;
    padding: 14px 2px; text-decoration: none; color: inherit;
  }
  .offer-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .offer-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .shop { font-size: 15.5px; font-weight: 600; letter-spacing: -.012em; }
  .tag {
    margin-left: 8px; vertical-align: 1px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--accent-on); background: var(--accent); border-radius: 4px; padding: 2px 6px;
  }
  /* NEW marks a listing this shop added inside the last week. It is deliberately
     a different colour from the accent so it never reads as "cheapest". */
  .tag.new { background: var(--ok); color: #06170F; }
  :root[data-mode="dark"] .tag.new, :root[data-mode="system"] .tag.new { color: #06170F; }
  .price { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .was { font-size: 12.5px; color: var(--faint); text-decoration: line-through; font-variant-numeric: tabular-nums; }
  .now { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .now.sale { color: var(--ok); }
  .now.none { color: var(--faint); font-weight: 500; }

  .offer-bot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .facts { font-size: 12.5px; color: var(--ink-2); }
  .sep { margin: 0 5px; color: var(--faint); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--faint); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.muted, .dot.gone { background: var(--faint); }
  .off { font-size: 11.5px; font-weight: 700; color: var(--ok); white-space: nowrap; }
  .ends { font-size: 11.5px; color: var(--warn); font-weight: 500; }

  .offer.unavail { opacity: .5; }
  /* A shop with no listing at all for this fragrance, not even a sold out
     one. Deliberately quieter than .unavail above: that shop is at least
     confirmed to carry the bottle, this one has never been seen selling it. */
  .offer.unavail-elsewhere { opacity: .4; }
  .offer.unavail-elsewhere .offer-link { cursor: default; padding-block: 10px; }

  .gone-head {
    margin: 26px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 11px; font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; color: var(--faint);
  }

  /* ── settings and documents ────────────────────────────────────────────── */
  .doc { padding: 4px 0 8px; }
  .doc h2 { font-size: 25px; font-weight: 700; letter-spacing: -.025em; margin: 8px 0 16px; }
  .doc h3 { font-size: 14px; font-weight: 650; margin: 24px 0 7px; letter-spacing: -.01em; }
  .doc p, .doc li { font-size: 14px; color: var(--ink-2); line-height: 1.62; }
  .doc p { margin: 0 0 11px; }
  .doc ul { margin: 0 0 11px; padding-left: 20px; }
  .doc li { margin-bottom: 6px; }
  .doc a { color: var(--accent); }
  .doc strong { color: var(--ink); font-weight: 650; }
  .doc .meta { font-size: 12.5px; color: var(--faint); margin-top: 22px; }
  .doc .draft {
    background: var(--surface); border-left: 3px solid var(--warn);
    padding: 12px 14px; border-radius: 0 9px 9px 0; font-size: 13px;
  }
  .doc .draft strong { color: var(--warn); }

  /* Settings content sits centred in the available height on both layouts,
     rather than pinned to the top, but never fights scrolling: min-height
     only asks for the space, it never clips content taller than the
     viewport. */
  .settings-doc {
    display: flex; flex-direction: column; align-items: center;
    min-height: calc(100vh - 220px); justify-content: center; text-align: center;
  }
  .settings-doc h2 { align-self: center; }
  .settings-doc h3, .settings-doc .foot-links, .settings-doc .foot-legal { align-self: stretch; }

  .seg-group { width: 100%; max-width: 360px; margin-top: 14px; }
  .seg-label {
    margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); text-align: left;
  }
  .seg {
    display: flex; background: var(--surface); border: 1px solid var(--line);
    border-radius: 11px; padding: 3px; gap: 3px;
  }
  .seg-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 6px; border: 0; border-radius: 8px; cursor: pointer;
    background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2);
    transition: background-color .15s ease, color .15s ease;
  }
  .seg-btn.on { background: var(--accent-sf); color: var(--accent); }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg-btn:active { transform: scale(.97); }
  .seg-icon svg { display: block; }

  .settings-note { font-size: 12px; color: var(--faint); margin: 12px 0 0; text-align: center; }

  .contact-form {
    width: 100%; max-width: 360px; margin-top: 12px;
    display: flex; flex-direction: column; gap: 12px; text-align: left;
  }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-2); }
  .field select, .field textarea {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; resize: vertical;
  }
  .field select:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .contact-send {
    align-self: flex-start; background: var(--accent); color: var(--accent-on);
    border: 0; border-radius: 10px; padding: 9px 18px; font: inherit; font-size: 14px;
    font-weight: 700; cursor: pointer; transition: transform .12s ease;

  .contact-send:active { transform: scale(.96); }
  .contact-send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .contact-confirm {

  }

  .social {

  .sheet {

    color: var(--faint); margin: 10px 10px 8px;
  }
  .brand-opt {

    background: none; border: 0; border-radius: 9px; padding: 12px 10px;
    font: inherit; font-size: 15.5px; color: var(--ink);

  .brand-opt.on { color: var(--accent); font-weight: 650; }
  .brand-opt.on::after { content: " ✓"; }
  .brand-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ── settings: about (condensed, was a page-wide footer before) ──────────── */
  .foot-line { font-size: 13.5px; color: var(--ink-2); margin: 0 0 14px; }
  .foot-line a { color: var(--accent); }
  .foot-links { display: flex; flex-wrap: wrap; gap: 9px 16px; margin-bottom: 16px; }
  .foot-legal { font-size: 11.5px; color: var(--faint); line-height: 1.65; margin: 0; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .view-fade { animation: viewIn .32s cubic-bezier(.16,.8,.4,1) both; }

  /* ── desktop layout ───────────────────────────────────────────────────────

  :root[data-layout="desktop"] main { padding-inline: 32px; }

  :root[data-layout="desktop"] .hero-wordmark { font-size: 46px; }
  :root[data-layout="desktop"] .intro-points {

  }

  :root[data-layout="desktop"] .listing {

  }
  :root[data-layout="desktop"] .card {

    border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    background: var(--surface);

  :root[data-layout="desktop"] .card:active { background: var(--surface-2); }

  }
  :root[data-layout="desktop"] .card-art { align-self: center; }
  :root[data-layout="desktop"] .card-text { width: 100%; }
  :root[data-layout="desktop"] .card-name { white-space: normal; }
  :root[data-layout="desktop"] .card-price {
    width: 100%; flex-direction: row; align-items: baseline; justify-content: space-between;
  }

  :root[data-layout="desktop"] .pop { width: 168px; }

     keep a comfortable line length instead of stretching the full page width. */
  :root[data-layout="desktop"] .doc { max-width: 640px; }

  :root[data-layout="desktop"] .detail-grid {

  }
  :root[data-layout="desktop"] .hero {

    position: sticky; top: 74px;
  }
  :root[data-layout="desktop"] .hero-blurb { margin-inline: auto; }
  :root[data-layout="desktop"] .detail-offers { border-left: 1px solid var(--line); padding-left: 48px; }

      <p>PriceSniffs compares fragrance prices across UK shops so you can see what a

      <h3>Delivery is counted</h3>
      <p>Every price includes standard delivery to a UK mainland address, and we

      Boots posts free once you spend \xA325 and charges \xA33.95 below that. Harvey
      Nichols wants \xA3300, which one bottle will never reach, so its listings
      always carry \xA35.95 on top. That is why a bottle priced at \xA324.99 can cost
      you more than one priced at \xA326.</p>

      <h3>Reductions come from the shop</h3>
      <p>When you see a previous price and a percentage saving, that figure is the
      shop's own. We never calculate one ourselves. Percentages round down, so a
      saving of 19.6 per cent shows as 19 per cent and never as 20. A countdown
      appears only when the shop has published a closing time for the offer. We
      never invent one.</p>

      <h3>Membership rates are not the headline</h3>
      <p>Superdrug posts free at \xA320 for Health and Beautycard holders and at \xA325
      for everyone else, so we quote \xA325. The Perfume Shop, The Fragrance Shop,
      Selfridges and LOOKFANTASTIC all run schemes of their own. We mention them,
      but we never build a members only rate into the headline price, because it
      is not a price you can pay unless you have already joined.</p>

      <h3>Sold out stays at the bottom</h3>
      <p>Listings a shop has marked unavailable sit at the end of the results and
      can never be shown as the cheapest option, however low the price. Where we
      could not read the stock figure at all we say so rather than guess, and that
      listing drops below the ones we could confirm.</p>

      <h3>Position is not for sale</h3>
