<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScentDay</title>
<style>
  /* Minimal mobile web app. One narrow column, centred on wider screens so the
     phone layout is the only layout — there is no desktop variant to maintain,
     and a React Native client can mirror this structure directly. */
  :root {
    --bg:      #FFFFFF;
    --raise:   #F6F6F8;
    --ink:     #14161A;
    --ink-2:   #5A616E;
    --faint:   #8B93A1;
    --line:    #E7E8EC;
    --accent:  #1F4FA8;
    --ok:      #1B7048;
    --warn:    #8A5A00;
    --bad:     #A93A2E;

    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --col: 460px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1115; --raise: #171A20; --ink: #ECEEF2; --ink-2: #A9B0BC;
      --faint: #7C8493; --line: #242830; --accent: #86ABF3;
      --ok: #56BE86; --warn: #D9A748; --bad: #EA7C6F;
    }
  }
  :root[data-theme="light"] {
    --bg: #FFFFFF; --raise: #F6F6F8; --ink: #14161A; --ink-2: #5A616E;
    --faint: #8B93A1; --line: #E7E8EC; --accent: #1F4FA8;
    --ok: #1B7048; --warn: #8A5A00; --bad: #A93A2E;
  }
  :root[data-theme="dark"] {
    --bg: #0F1115; --raise: #171A20; --ink: #ECEEF2; --ink-2: #A9B0BC;
    --faint: #7C8493; --line: #242830; --accent: #86ABF3;
    --ok: #56BE86; --warn: #D9A748; --bad: #EA7C6F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: var(--col); margin: 0 auto; min-height: 100vh; }

  /* ── top bar ───────────────────────────────────────────────────────────── */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 10px;
  }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .brandmark {
    font-family: var(--serif); font-size: 20px; font-weight: 600;
    letter-spacing: -.01em; margin: 0; flex: 1;
  }
  .brandmark em { font-style: normal; color: var(--accent); }

  .navbtn {
    background: none; border: 0; padding: 6px 2px; cursor: pointer;
    font: inherit; font-size: 14px; color: var(--ink-2);
    border-bottom: 2px solid transparent;
  }
  .navbtn.on { color: var(--ink); border-bottom-color: var(--accent); }
  .navbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  input[type="search"] {
    width: 100%; margin-top: 10px; padding: 9px 12px;
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--raise); border: 1px solid var(--line); border-radius: 9px;
    -webkit-appearance: none;
  }
  input[type="search"]::placeholder { color: var(--faint); }
  input[type="search"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* position:relative contains the visually-hidden .sr span inside. Without a
     positioned ancestor it resolves against the viewport and can escape any
     scroll clipping, dragging the page sideways. */
  .chip {
    position: relative;
    margin-top: 9px; cursor: pointer; font: inherit; font-size: 13px;
    background: var(--raise); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px;
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .notice {
    font-size: 11.5px; color: var(--warn); text-align: center;
    padding: 6px 16px; border-bottom: 1px solid var(--line);
  }

  main { padding: 4px 16px 56px; }

  /* ── home listing ──────────────────────────────────────────────────────── */
  ul.listing, ul.offers { list-style: none; margin: 0; padding: 0; }

  .card {
    width: 100%; display: flex; align-items: center; gap: 13px;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 13px 2px; cursor: pointer; font: inherit; color: var(--ink);
    text-align: left;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .card-art { flex: none; display: flex; }
  .card-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .card-brand { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
  .card-name {
    font-family: var(--serif); font-size: 17px; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-meta { font-size: 12.5px; color: var(--ink-2); }
  .card-price { flex: none; text-align: right; display: flex; flex-direction: column; }
  .from { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
  .amt { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .amt.none { color: var(--faint); font-weight: 400; }

  .empty-note { color: var(--ink-2); font-size: 14.5px; padding: 26px 2px; text-align: center; }

  /* ── intro ─────────────────────────────────────────────────────────────── */
  .intro { padding: 22px 0 6px; }
  .intro h2 {
    font-family: var(--serif); font-size: 28px; font-weight: 600;
    line-height: 1.15; margin: 0 0 8px; text-wrap: balance; letter-spacing: -.015em;
  }
  .intro p { margin: 0; font-size: 15px; color: var(--ink-2); }
  .intro-points { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .intro-points li { font-size: 13.5px; color: var(--ink-2); padding-left: 15px; position: relative; }
  .intro-points li::before {
    content: ""; position: absolute; left: 0; top: 8px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  .intro-points span { color: var(--ink); font-weight: 600; }

  /* ── popular rail ──────────────────────────────────────────────────────── */
  .pop-section { margin-top: 28px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .section-head h3 {
    margin: 0; font-size: 12px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; color: var(--faint);
  }
  .link-btn {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--accent);
  }
  .link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  /* Horizontal rail. Negative margin lets cards bleed to the screen edge while
     the page keeps its 16px gutter, so the row reads as scrollable. */
  .pop-rail {
    list-style: none; margin: 12px -16px 0; padding: 2px 16px 6px;
    display: flex; gap: 10px;
    overflow-x: auto; scroll-snap-type: x proximity;
    /* Snapping aligns items to the scrollport, not the padding box, so without
       this the first card snaps flush to the screen edge and its medal is
       clipped. scroll-padding is the inset snapping actually respects. */
    scroll-padding-inline: 16px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .pop-rail::-webkit-scrollbar { display: none; }
  .pop-item { flex: none; scroll-snap-align: start; }

  .pop {
    width: 132px; display: flex; flex-direction: column; gap: 1px;
    background: var(--raise); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 11px 12px; cursor: pointer; font: inherit; color: var(--ink);
    text-align: left;
  }
  .pop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pop-art { position: relative; display: flex; justify-content: center; padding: 2px 0 8px; }
  .pop-brand {
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pop-name {
    font-family: var(--serif); font-size: 14.5px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.5em;
  }
  .pop-price { font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 4px; }

  /* Medals mark the top three by popularity — a real rank, not decoration. */
  .medal {
    position: absolute; top: -2px; left: -3px; z-index: 2;
    width: 21px; height: 21px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #3A2C05;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .medal.gold   { background: linear-gradient(150deg, #F7DC7E, #C9A227); }
  .medal.silver { background: linear-gradient(150deg, #E4E7EC, #A3ABB6); color: #2E3238; }
  .medal.bronze { background: linear-gradient(150deg, #E0A879, #A9682F); color: #34200E; }

  /* ── detail ────────────────────────────────────────────────────────────── */
  .back {
    background: none; border: 0; padding: 12px 2px 6px; cursor: pointer;
    font: inherit; font-size: 14px; color: var(--accent);
  }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .hero { text-align: center; padding: 6px 0 22px; border-bottom: 1px solid var(--line); }
  .hero-brand { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 10px 0 0; }
  .hero-name { font-family: var(--serif); font-size: 27px; font-weight: 600; margin: 1px 0 2px; text-wrap: balance; }
  .hero-meta { font-size: 13.5px; color: var(--ink-2); margin: 0; }
  .hero-price {
    font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums;
    margin: 16px 0 0; line-height: 1.15;
  }
  .hero-price.none { font-size: 20px; color: var(--ink-2); }
  .hero-at { display: block; font-size: 12.5px; font-weight: 400; color: var(--ink-2); margin-top: 2px; }

  .results-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 16px 2px 8px; font-size: 12px; color: var(--ink-2);
  }
  .results-head .dim { color: var(--faint); }

  .offer { border-bottom: 1px solid var(--line); }
  /* The out-of-stock heading brings its own rule; a trailing row border would
     stack a second line against it. */
  .offers .offer:last-child { border-bottom: 0; }
  .offer-link {
    display: flex; flex-direction: column; gap: 3px;
    padding: 13px 2px; text-decoration: none; color: inherit;
  }
  .offer-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .offer-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .shop { font-size: 15.5px; font-weight: 600; }
  .price { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
  .was { font-size: 12.5px; color: var(--faint); text-decoration: line-through; font-variant-numeric: tabular-nums; }
  .now { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .now.sale { color: var(--ok); }

  .offer-bot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .facts { font-size: 12.5px; color: var(--ink-2); }
  .sep { margin: 0 5px; color: var(--faint); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--faint); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .dot.muted { background: var(--faint); }
  .off { font-size: 11.5px; font-weight: 650; color: var(--ok); white-space: nowrap; }
  .ends { font-size: 11.5px; color: var(--warn); }

  .offer.best .shop::after {
    content: "Cheapest"; margin-left: 7px; vertical-align: 1px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px;
  }
  .offer.gone { opacity: .55; }

  .gone-head {
    margin: 24px 0 0; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 11.5px; font-weight: 650; letter-spacing: .07em;
    text-transform: uppercase; color: var(--bad);
  }

  /* ── brand sheet ───────────────────────────────────────────────────────── */
  .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 30; }
  .sheet {
    position: fixed; z-index: 31; left: 50%; transform: translateX(-50%);
    bottom: 0; width: 100%; max-width: var(--col);
    background: var(--bg); border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; padding: 8px 8px calc(16px + env(safe-area-inset-bottom));
    max-height: 70vh; overflow-y: auto;
  }
  .sheet-title {
    font-size: 11.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
    color: var(--faint); margin: 8px 10px 6px;
  }
  .brand-opt {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-radius: 8px; padding: 11px 10px;
    font: inherit; font-size: 15.5px; color: var(--ink);
  }
  .brand-opt.on { color: var(--accent); font-weight: 600; }
  .brand-opt.on::after { content: " ✓"; }
  .brand-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .hero-blurb { font-size: 13.5px; color: var(--ink-2); margin: 8px auto 0; max-width: 30ch; }

  /* ── legal documents ───────────────────────────────────────────────────── */
  .doc { padding: 4px 0 8px; }
  .doc h2 { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 8px 0 14px; }
  .doc h3 { font-size: 14px; font-weight: 650; margin: 22px 0 6px; }
  .doc p, .doc li { font-size: 14px; color: var(--ink-2); line-height: 1.6; }
  .doc p { margin: 0 0 10px; }
  .doc ul { margin: 0 0 10px; padding-left: 20px; }
  .doc li { margin-bottom: 5px; }
  .doc a { color: var(--accent); }
  .doc strong { color: var(--ink); }
  .doc .meta { font-size: 12.5px; color: var(--faint); margin-top: 20px; }
  .doc .draft {
    background: var(--raise); border-left: 3px solid var(--warn);
    padding: 11px 13px; border-radius: 0 8px 8px 0; font-size: 13px;
  }
  .doc .draft strong { color: var(--warn); }

  /* ── footer ────────────────────────────────────────────────────────────── */
  .foot { margin-top: 40px; padding: 24px 0 12px; border-top: 1px solid var(--line); text-align: center; }
  .foot-mark { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  .foot-mark em { font-style: normal; color: var(--accent); }
  .foot-line { font-size: 13.5px; color: var(--ink-2); margin: 0 0 3px; }
  .foot-mail { margin: 0 0 16px; font-size: 13.5px; }
  .foot-mail a { color: var(--accent); }
  .foot-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin-bottom: 18px; }
  .foot-legal { font-size: 11.5px; color: var(--faint); line-height: 1.6; margin: 0 0 9px; }
  .foot-legal.dimmer { opacity: .8; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <div class="bar">
    <div class="bar-row">
      <h1 class="brandmark">Scent<em>Day</em></h1>
      <button class="navbtn" id="nav-home">Home</button>

    <input type="search" id="search" placeholder="Search fragrances" aria-label="Search fragrances" />

  </div>

  <p class="notice">Demo data — invented prices, not live.</p>

  <main id="view"></main>
</div>

      <p>ScentDay compares fragrance prices across UK retailers so you can see
      what a bottle actually costs before you buy it.</p>

      <h3>We show the delivered price</h3>
      <p>Every price in a comparison includes standard delivery to a UK mainland
      address, and accounts for whether your order clears that retailer's
      free-delivery threshold. A cheaper bottle is often the dearer purchase once
      postage is added, so the headline figure is the one you would actually pay.</p>

      <h3>Discounts come from the retailer</h3>
      <p>Where you see a \u201Cwas\u201D price and a percentage saving, that is the
      retailer's own published reference price \u2014 never a figure we worked out
      ourselves. Percentages are rounded down, so a 19.6% saving is shown as 19%.
      A countdown appears only when the retailer has published an end time for the
      promotion; we never invent one.</p>

      <h3>Membership prices are not the headline</h3>
      <p>Several retailers offer cheaper delivery to loyalty scheme members. We
      note where a scheme exists, but we never use a members-only rate in the
      headline price, because it is not a price you can pay unless you have
      joined.</p>

      <h3>Out of stock stays out of the running</h3>
      <p>Listings a retailer has marked unavailable are grouped at the bottom and
      can never be shown as the cheapest option, however low the price is.</p>

      <h3>Ranking is not for sale</h3>
      <p>Results are ordered by availability and price. Nothing else. No retailer
      can pay to appear higher, and commission never moves a row. See our
      <a href="#" data-page="affiliate">affiliate disclosure</a>.</p>`},{id:"affiliate",title:"Affiliate disclosure",short:"Affiliate disclosure",body:`
      ${D}
      <p>ScentDay intends to earn commission when you buy through some of the
      links on this site. This does not change the price you pay.</p>

      <h3>Current status</h3>
      <p>No affiliate programme is live at the time of writing. Every outbound
      link currently goes directly to the retailer and earns us nothing. This page
      will be updated when that changes, and links that carry tracking will be
      identifiable.</p>

      <h3>What commission does not affect</h3>
      <p>Commission has no influence on the order of results, which retailers are
      included, or the prices shown. Ranking is determined by stock status and
      delivered price alone. We will not accept payment for placement inside the
      comparison. If we ever carry a paid placement, it will sit outside the
      results and be labelled as advertising.</p>

      <h3>Why we disclose this</h3>
      <p>UK advertising rules (the CAP Code, enforced by the ASA) require
      affiliate relationships to be made clear before you click, not buried in a
      policy page. We also flag it in the site footer for that reason.</p>`},{id:"privacy",title:"Privacy notice",short:"Privacy",body:`
      ${D}
      <p>This notice explains what personal data ${i.name} collects, why,
      and what rights you have. It is written to meet UK GDPR and the Data
      Protection Act 2018.</p>

      <h3>Who we are</h3>
      <p>The data controller is ${i.legalName} (company number
      ${i.number}), registered at ${i.address}. Our ICO registration
      number is ${i.ico}. You can contact us at
      <a href="mailto:${i.privacyEmail}">${i.privacyEmail}</a>.</p>

      <h3>What we collect</h3>
      <ul>
        <li><strong>Search terms.</strong> What you type into the search box, so
        we can rank popular fragrances. Stored without any identifier that links
        it to you.</li>
        <li><strong>Technical data.</strong> IP address, browser type and pages
        visited, collected in server logs for security and troubleshooting.</li>
        <li><strong>Messages you send us.</strong> If you email feedback, we keep
        the message and your address so we can reply.</li>
      </ul>
      <p>We do not ask for an account, and we do not collect payment details \u2014
      purchases happen on the retailer's own site under their privacy policy, not
      ours.</p>

      <h3>Why we can use it</h3>
      <p>We rely on <em>legitimate interests</em> for search analytics and
      security logging: operating and improving a price comparison service, in a
      way we consider you would reasonably expect and which has minimal privacy
      impact. Where we use non-essential cookies we rely on your
      <em>consent</em>, which you can withdraw at any time.</p>

      <h3>Cookies</h3>
      <p>We use cookies strictly necessary to make the site work. If we add
      analytics or affiliate tracking cookies, we will ask for your consent first
      and list them here. Affiliate networks may set their own cookies when you
      follow a link to a retailer; those are governed by that network's policy.</p>

      <h3>Sharing</h3>
      <p>We do not sell personal data. We share it only with service providers
      acting on our instructions \u2014 currently [HOSTING PROVIDER] \u2014 and where we are
      required to by law.</p>

      <h3>How long we keep it</h3>
      <p>Server logs are kept for [RETENTION PERIOD, e.g. 90 days]. Aggregated
      search counts are kept indefinitely because they contain no personal data.
      Correspondence is kept for [RETENTION PERIOD] after the matter is closed.</p>

      <h3>Your rights</h3>
      <p>You can ask for a copy of your data, ask us to correct or erase it,
      object to or restrict our processing, and ask for it in a portable format.
      Email <a href="mailto:${i.privacyEmail}">${i.privacyEmail}</a>
      and we will respond within one month.</p>
      <p>If you are unhappy with how we have handled your data you can complain to
      the Information Commissioner's Office at
      <a href="https://ico.org.uk" rel="noopener" target="_blank">ico.org.uk</a>
      or on 0303 123 1113.</p>

      <p class="meta">Last updated ${i.updated}.</p>`},{id:"terms",title:"Terms of use",short:"Terms",body:`
      ${D}
      <p>By using ScentDay you accept these terms.</p>

      <h3>What ScentDay is</h3>
      <p>ScentDay is an information service. We do not sell fragrance, hold stock,
      process payments or fulfil orders. Any purchase is a contract between you
      and the retailer, on their terms.</p>

      <h3>Accuracy of prices</h3>
      <p>We take care to show accurate prices, but they are collected
      periodically and can change at any time. Delivery charges and thresholds are
      modelled from each retailer's published terms and may not reflect
      promotions, regional surcharges or basket-level rules. <strong>Always check
      the price on the retailer's own site before you buy.</strong> Each listing
      shows when we last checked it.</p>
      <p>We are not liable for losses arising from a price, delivery cost or stock
