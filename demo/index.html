       for its own ground, measured rather than guessed:
         #1A1405 on #C8A128  7.49:1

  :root {
    /* The system UI stack resolves to SF Pro on Apple, Segoe UI Variable on
       Windows and Roboto on Android: smooth, and no webfont to fail loading. */
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
            "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue",
            Arial, sans-serif;
    --col: 460px;
    /* The brand filter sheet stays a comfortable dialog width in both
       layouts. It should not balloon to the desktop page width, so it gets
       its own variable rather than following --col. */
    --sheet-col: 460px;
    /* Saturation for the per-brand monogram tint below. Constant across
       themes and hues — only the hue itself (--mh, set per tile) and the
       theme-dependent lightness tokens above vary. */
    --mono-sat: 42%;

    /* The org-mark tile — a shop's or a house's real logo, drawn beside its
       monogram-shaped box rather than inside a themed one (docs/LOGOS-PLAN.md
       §4c). Same tile in both themes and both palettes, because the artwork
       inside is not ours to recolour, and the ground it needs is a property
       of that artwork (measured `ink`), not of which theme happens to be on.
       Two fills, for dark-ink and light-ink marks respectively, and one
       shared border used by all three ink variants — including the third,
       `own`, which carries no fill of its own and relies on the border alone
       to still read as a tile. The border is deliberately one flat grey
       rather than three: #767676 sits inside the narrow luminance band
       (~0.11-0.29) that clears WCAG's 3:1 non-text contrast against BOTH
       #0A0A0B and #FCFCFD at once, so one value works for every ink and every
       theme without per-case tuning. tests/contrast.test.ts holds this. */
    --org-mark-light-bg: #FFFFFF;
    --org-mark-dark-bg: #0A0A0B;
    --org-mark-border: #767676;

    /* --font-sans is an alias for --sans rather than a second stack of its
       own: the design system names the role, the existing token holds the
       value, and one source of truth means the two can never drift apart. */
    --font-sans: var(--sans);
    /* Numerals that must align down a column — prices, counts, axis labels.
       Every use pairs it with font-variant-numeric: tabular-nums. */
    --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    /* Four durations, three curves. Nothing on the site animates for longer
       than --dur-4, and nothing animates a price. */
    --dur-1: 90ms;   /* press and release, colour-only swaps */
    --dur-2: 160ms;  /* hover, chip select, toggle, tab underline */
    --dur-3: 240ms;  /* content entering, sheets, list settle */
    --dur-4: 320ms;  /* theme cross-fade — the longest thing on the site */
    --ease-standard: cubic-bezier(.2,0,0,1);
    --ease-exit:     cubic-bezier(.4,0,1,1);
  }

  /* Desktop is a genuinely different layout, not just a wider mobile column:
     more width, a browse grid instead of a stacked list, and a two column
     detail view. See the [data-layout="desktop"] rules threaded through the
     sections below. Chosen once on first load from a real device signal
     (see demo/app.ts's detectDefaultLayout), then remembered per visitor
     once they pick for themselves. */
  /* No cap: the desktop layout fills the browser window rather than sitting
     in a centred column, so --col only still matters to elements that opt
     back into a narrower measure themselves (.doc, .hero-mission below). */
  :root[data-layout="desktop"] { --col: none; }

  /* ── layout constants ──────────────────────────────────────────────────────
     The page gutter is one value, used by anything that has to line up with
     it -- including the rails that bleed past it and pull it back as their
     own padding. Two of those existed with the 16px written into them by
     hand, which is how a gutter change silently stops being a gutter change. */
  /* The notch, the rounded corners and the home bar, as the device reports
     them. Zero everywhere except a phone showing the page full screen — the
     viewport meta asks for viewport-fit=cover, which is what lets the
     installed web app and the iOS/Android app shells draw edge to edge — so
     on any ordinary screen every rule below lays out exactly as it did. */
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --gutter: 16px; --bar-h: calc(96px + var(--safe-top));
  }
  @media (min-width: 900px) { :root { --gutter: 28px; } }

  /* ── type roles ────────────────────────────────────────────────────────────
     Eight roles, one canonical size/weight/tracking each. These collapse three
     drifts the old stylesheet had accumulated: section headings had three
     competing treatments (uppercase-tracked, 17px bold, accent-underlined) and
     are now one 15px/600 sentence-case rule with space — not decoration —
     separating blocks; card and row titles had four weights at one size and
     are now 600 everywhere, because a fragrance, a brand and a shop are the
     same kind of object and should look it; eyebrows ranged over 9.5–11.5px
     and eight letter-spacings and are now a single 11px/600/.08em, 11px being
     the floor at which uppercase tracking stays readable at 360px. */
  .t-page    { font: 700 26px/1.15 var(--font-sans); letter-spacing: -.022em; color: var(--ink); }
  .t-section { font: 600 15px/1.25 var(--font-sans); letter-spacing: -.005em; color: var(--ink); }
  .t-title   { font: 600 15px/1.3  var(--font-sans); letter-spacing: -.01em;  color: var(--ink); }
  .t-body    { font: 400 14px/1.55 var(--font-sans); color: var(--ink-2); }
  /* Title Case as written, not shouted: the owner asked for every label on
     the site in Title Case (2026-10-03), and capitals set by the stylesheet
     also turned every brand pill (which wears this role) into "MIND GAMES"
     whatever the brand's own spelling. The tracking came down with the
     capitals: .08em was for capitals and spaces out lowercase letters. */
  .t-eyebrow { font: 600 11px/1    var(--font-sans); letter-spacing: .02em;
               color: var(--faint); }
  .t-caption { font: 400 13px/1.4  var(--font-sans); color: var(--faint); }
  .t-count   { font: 600 12px/1    var(--font-num);  letter-spacing: .01em;
               font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .t-price   { font: 700 20px/1.1  var(--font-num);  letter-spacing: -.02em;
               font-variant-numeric: tabular-nums; color: var(--ink); }

  @media (min-width: 900px) { .t-page { font-size: 32px; } }
  .t-price--hero { font-size: 34px; line-height: 1.05; letter-spacing: -.022em; }

  /* ── motion ────────────────────────────────────────────────────────────────
     Seven named behaviours, and nothing animates that is not one of them.
     Motion explains a change of state, never arrival: idle pages are still.
     Transform and opacity only — never width, height, top or left.

     The rule below is the theme cross-fade (behaviour 5): switching mode
     fades ground, ink and border on every element over --dur-4 without
     anything moving or re-laying out. It is deliberately limited to those
     three properties — a blanket `transition: all` would catch transform and
     make every press and hover lag. */
  html, body, * {
    transition: background-color var(--dur-4) var(--ease-standard),
                color var(--dur-4) var(--ease-standard),
                border-color var(--dur-4) var(--ease-standard);
  }

  /* Behaviour 7: focus. Zero duration, deliberately — a focus ring that
     animates is a focus ring that is not there yet when the reader looks. */
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* Behaviour 1: rise — content entering a view. One per block, never nested. */
  @keyframes ps-rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .ps-rise        { animation: ps-rise var(--dur-3) var(--ease-standard) both; }
  /* Behaviour 2: settle — a list re-ordering after a filter change. Staggered
     30ms per item and capped at 8, so the last thing a reader sees lands
     within --dur-3 of the first rather than trickling in indefinitely. */
  .ps-stagger > * { animation: ps-rise var(--dur-3) var(--ease-standard) both; }
  .ps-stagger > *:nth-child(1) { animation-delay: 0ms; }
  .ps-stagger > *:nth-child(2) { animation-delay: 30ms; }
  .ps-stagger > *:nth-child(3) { animation-delay: 60ms; }
  .ps-stagger > *:nth-child(4) { animation-delay: 90ms; }
  .ps-stagger > *:nth-child(5) { animation-delay: 120ms; }
  .ps-stagger > *:nth-child(6) { animation-delay: 150ms; }
  .ps-stagger > *:nth-child(7) { animation-delay: 180ms; }
  .ps-stagger > *:nth-child(8) { animation-delay: 210ms; }
  .ps-stagger > *:nth-child(n+9) { animation-delay: 240ms; }

     the end state still arrives, it just arrives immediately. */

    *, *::before, *::after {

      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
      scroll-behavior: auto !important;
    }

     of what it says about itself:

                  One per screen at most: the thing the screen is for.
       secondary  --surface-2 with a --line-firm edge. A real button, not the
                  point of the page.
       quiet      transparent with a --line edge. Available, unemphasised.
       link       --accent-ink text, no box. --accent-ink rather than --accent

                  page ground are two different colours if both are to clear

     thumb has to hit; link rank reaches it with padding cancelled by an equal
     negative margin, so the target grows without the text moving.

     Behaviour 3, press: the scale down runs on --ease-exit, an accelerating
     curve, so the control reads as getting out from under the finger; the
     release settles back on --ease-standard. --dur-1 both ways, since a press
     that outlasts the tap reads as lag rather than as feedback. */
  .navbtn, .subnavbtn, .link-btn, .contact-send, .back, .wishlist-toggle,
  .seg-btn, .note-chip, .account-entry, .brand-row, .shop-row,
  .offer-link, .control, .tile-body, .brandmark, .grid-more {
    transition: transform var(--dur-1) var(--ease-standard),
                background-color var(--dur-2) var(--ease-standard),
                border-color var(--dur-2) var(--ease-standard),
                color var(--dur-2) var(--ease-standard);
  }
  .navbtn:active, .subnavbtn:active, .link-btn:active, .contact-send:active,
  .back:active, .wishlist-toggle:active, .seg-btn:active,
  .note-chip:active, .account-entry:active, .brand-row:active, .shop-row:active,
  .offer-link:active, .tile-body:active, .brandmark:active {
    transform: scale(.985);
    transition-timing-function: var(--ease-exit);
  }
  /* One comfortable target size for every rank that draws a box. */
  .navbtn, .subnavbtn, .contact-send, .back, .wishlist-toggle, .seg-btn {
    min-height: 44px;
  }
  /* Form controls sit one step above buttons: a field is aimed at, then typed
     into, and the extra height is what keeps a label, a value and a caret from
     crowding each other. */
  .control, .field select, .field textarea, .field input {
    min-height: 48px;
  }

  * { box-sizing: border-box; }

  /* The marquee is stretched to the window's full width (see .marquee), and
     the page must never scroll sideways whatever a browser rounds to, so
     sideways overflow is clipped at the root. clip, not hidden: it makes no
     scroll container, so the sticky bar and every other scroller are
     untouched. */
  html { overflow-x: clip; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -.006em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern" 1;
  }

  /* ── the background behind the page ──────────────────────────────────────
     Flat. It used to be two viewport-sized red radial-gradient fields
     drifting on a 26s loop, which is the ambient glow every generated
     landing page ships, and it was doing three things worth being rid of: it
     put the brand colour behind price figures, where the accent is supposed
     to mean "look here"; it animated forever without a reader having asked
     for anything; and it kept two composited layers alive for decoration on
     a page whose long lists are the thing that has to stay fast.

     What separates the surfaces now is what already separated them: a step
     between --bg and --surface, and a hairline. Nothing moves unless
     somebody did something. */

  .app { max-width: var(--col); margin: 0 auto; min-height: 100vh; position: relative; z-index: 1; }

  /* ── top bar ───────────────────────────────────────────────────────────── */
  .bar {
    position: sticky; top: 0; z-index: 20;
    /* Opaque. The translucent, blurred bar existed so the drifting
       background could show through it; with that gone there is nothing to
       see through to, and a frosted panel over a flat colour is cost without
       a picture. backdrop-filter also makes the compositor re-blur a
       viewport-wide strip on every scroll frame, and this bar sits over the
       longest scrolling lists on the site. */
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    /* Trimmed from 17px/14px now that .navbtn carries a 44px target of its
       own: the padding used to be what gave the row its height, and keeping
       both would have made the sticky bar a fifth of a phone screen. */
    padding: calc(10px + var(--safe-top)) max(18px, var(--safe-right)) 12px max(18px, var(--safe-left));
  }
  .bar-row { display: flex; align-items: center; gap: 20px; position: relative; }
  /* The 7s accent sweep that used to run along the bar's bottom edge is
     gone. The motion section above names seven behaviours and says nothing
     animates that is not one of them; a sweep that repeats forever and
     reports nothing was an eighth. Nothing on the site animates on its own
     any more: the drifting background that used to be the one exception was
     removed with it. The bar keeps its --line border. */
  .brandmark {
    font-size: 21px; font-weight: 800; letter-spacing: -.03em;
    margin: 0; flex: none; white-space: nowrap;
    /* It is a <button>, not an <h1>, so it can act as the "go home" control
       the top corner of a page conventionally is. Reset the button chrome
       browsers add by default. */
    background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
    font-family: inherit; color: var(--ink);
  }
  .brandmark:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .brandmark em, .hero-wordmark em { font-style: normal; color: var(--accent); }

  /* The five nav buttons' own row, separate from the brandmark, so a phone
     too narrow for all five plus the wordmark scrolls this row sideways
     rather than starving the wordmark of space to make room. Until Today's
     Deals joined the bar, four short words and the wordmark always fit
     without help; a thirteen character label does not, and shrinking the
     wordmark to fit it used to leave "PriceS..." on a 375px phone (see the
     old @media rules this replaced) — the brand mark, cut off, on every
     single page load. Scrolling this row instead is the same trick .subnav
     already uses below for the same reason. */
  .nav-items {
    display: flex; align-items: center; gap: 20px; flex: 1 1 auto; min-width: 0;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .nav-items::-webkit-scrollbar { display: none; }
  /* Quiet rank, drawn as a tab: no box at all until it is the current one,
     and then --ink text over a 2px --accent underline. Both levels of
     navigation say "you are here" the same way — see .subnavbtn below. */
  .navbtn {
    display: inline-flex; align-items: center; flex: none;
    background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; font-size: 15.5px; font-weight: 500; color: var(--ink-2);
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .navbtn.on { color: var(--ink); border-bottom-color: var(--accent); }
  .navbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .navbtn:active { transform: scale(.94); }
  @media (max-width: 560px) {
    .bar-row { gap: 13px; }
    .nav-items { gap: 13px; }
    .navbtn { font-size: 14.5px; }
    .brandmark { font-size: 19.5px; }
  }
  /* Smallest phones still in circulation (iPhone 13 mini is 375px). */
  @media (max-width: 430px) {
    .bar-row { gap: 10px; }
    .nav-items { gap: 10px; }
    .navbtn { font-size: 13.5px; }
    .brandmark { font-size: 18px; }
  }

  /* Second level nav, shown only inside Explore and its leaves. Scrolls
     sideways rather than wrapping, so five tabs never push the bar taller on
     a narrow phone. */
  .subnav {
    display: flex; gap: 20px; margin-top: 2px; overflow-x: auto;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .subnav::-webkit-scrollbar { display: none; }
  .subnav[hidden] { display: none; }
  /* Was a row of outlined pills that filled with accent when selected, which
     put a second red "chosen" language on screen beside the top bar's
     underline and beside the best-price marker. It is the same kind of
     control as .navbtn, so it is now the same tab: quiet until current, then
     --ink over a 2px --accent underline. */
  .subnavbtn {
    flex: none; display: inline-flex; align-items: center;
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 0 2px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2);
    white-space: nowrap;
  }
  .subnavbtn.on { color: var(--ink); border-bottom-color: var(--accent); }
  .subnavbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 16px is the one field size on the site: the bar's search, the Search
     page's own field, every dropdown and every form control below all read
     at it, so a form never mixes two. 16 rather than 15 because iPhone Safari
     zooms the whole page in when a field under 16px is tapped, and leaves the
     reader zoomed in after they choose. */
  input[type="search"] {
    width: 100%; min-height: 48px; margin-top: 10px; padding: 11px 14px;
    font: inherit; font-size: 16px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    -webkit-appearance: none;
  }
  input[type="search"]::placeholder { color: var(--faint); }
  input[type="search"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* position:relative contains the visually hidden .sr span. Without a
     positioned ancestor it resolves against the viewport and can escape scroll
     clipping, dragging the page sideways. */
  .chip {
    position: relative;
    margin-top: 10px; cursor: pointer; font: inherit; font-size: 13px;
    background: var(--accent-sf); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 3px 12px;
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { padding: 4px max(var(--gutter), var(--safe-right)) 56px max(var(--gutter), var(--safe-left)); }

  ul.listing, ul.offers { list-style: none; margin: 0; padding: 0; }

  /* ── intro / hero ──────────────────────────────────────────────────────── */
  .intro { padding: 34px 0 0; }
  .hero-logo { text-align: center; position: relative; }
  /* The wordmark used to sit on a wash of its own that breathed in and out
     on a 9s cycle. It went for two reasons: it was a second piece of idle
     motion, and the wordmark sat on the brightest part of it, which is the
     one place text must never go. The drifting background it competed with
     has since gone too, so the greeting now sits on a flat ground. */

  /* ── hero entrance ─────────────────────────────────────────────────────────
     There isn't one any more, and that is the point. Each piece of the
     greeting used to rise separately on a .75s curve of its own with hand
     written .08s/.16s/.26s/.34s/.42s delays -- a second rise keyframe, a
     third easing curve, and five nested animations inside a view that was
     already rising as one block. Behaviour 1 in the motion section is one
     rise per block, never nested, and the block here is the view. */

  .hero-wordmark {
    margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -.035em; line-height: 1;
  }
  .hero-mission {
    margin: 18px auto 0; width: 90%; font-size: 17px; font-weight: 600;
    color: var(--ink); text-align: center; letter-spacing: -.01em;
  }
  /* ── marquee ───────────────────────────────────────────────────────────────
     The scrolling word banner under the hero (demo/marquee.ts), ported from
     the owner's other site. Every colour is one of this site's own tokens,
     so it follows every theme the tokens do (data-mode, a host's data-theme
     and the OS setting) with no theme rules of its own: the band is
     --surface-2, the hairlines --line, the words --ink-2 (9.79:1 dark, 7.85:1
     light on the band) and the marker the brand --accent (4.92:1 and
     5.26:1, well over the 3:1 a graphic needs). The --pm-* values
     left are the ones this site has no token for.

     Owner, 2026-10-04: it scrolls all the time, with no pause of any kind
     (the old pause under the pointer is gone), always on one line, and spans
     the full width of the window on every screen, not just inside the page
     column. The one exception is a reader whose system asks for reduced
     motion: for them it stops and wraps, below.

     FULL BLEED. The band sits inside <main>, inside .app, which is a centred
     column (--col) on the narrow layout and the whole window on the desktop
     one. It is stretched to the window's width from wherever it sits:
       - width: the window's width less the vertical scrollbar. 100vw counts
         the scrollbar, so on a desktop browser with a classic one it would
         be wider than the page and make it scroll sideways. --sbw is that
         scrollbar's width, measured by demo/app.ts (0 where scrollbars float
         over the page, as on a phone), so the band ends exactly at the
         scrollbar's edge.
       - left edge: main's content box is centred in the window except for
         its own side padding, which can differ left and right where a notch
         eats one side (--safe-left, --safe-right). 50% is half that content
         box, so 50% less half the window puts the edge at the window's left
         when the padding is even, and the last term corrects it when it is
         not.
     The text keeps clear of a notch (its fade runs from the safe inset in),
     the band's background does not. html clips sideways overflow as a second
     line of defence, so no rounding can ever make the page scroll sideways. */
  .marquee {
    --pm-gap: 36px; --pm-pad: 12px; --pm-duration: 30s; --pm-size: 14px;
    --pm-fade: clamp(24px, 8vw, 96px);
    position: relative; overflow: hidden; box-sizing: border-box;
    width: calc(100vw - var(--sbw, 0px));
    margin: 28px 0 0
      calc(50% - (100vw - var(--sbw, 0px)) / 2
        + (max(var(--gutter), var(--safe-right)) - max(var(--gutter), var(--safe-left))) / 2);
    padding: var(--pm-pad) 0;
    background: var(--surface-2);
    border-block: 1px solid var(--line);
    --pm-mask: linear-gradient(90deg,
      transparent var(--safe-left),
      #000 calc(var(--safe-left) + var(--pm-fade)),
      #000 calc(100% - var(--safe-right) - var(--pm-fade)),
      transparent calc(100% - var(--safe-right)));
    -webkit-mask-image: var(--pm-mask);
            mask-image: var(--pm-mask);
  }
  @media (min-width: 900px) {
    .marquee { --pm-gap: 56px; --pm-pad: 15px; --pm-duration: 38s; --pm-size: 16px; }
  }
  /* The track holds four copies of the six phrases (the last three hidden
     from screen readers) and slides left by exactly one copy, then starts
     again, which is not a visible jump because the copies are identical.
     Four, not two, so that a window wider than one copy never shows an empty
     stretch at its right edge: one copy is about 1,400 to 1,700px, and four
     fill a window of up to about 4,500px. The gap after the last phrase is
     padding, so the copies are the same width exactly and -25% lands the
     second one where the first began. Always one line: nothing here can
     wrap, and the items do not shrink. */
  .marquee-track {
    display: flex; flex-wrap: nowrap; align-items: center; gap: var(--pm-gap);
    width: max-content;
    padding-right: var(--pm-gap);
    animation: marquee-scroll var(--pm-duration) linear infinite;
    will-change: transform;
  }
  .marquee-item {
    display: inline-flex; align-items: center; gap: .6em; flex: none;
    font: 600 var(--pm-size)/1.25 var(--font-sans); letter-spacing: -.005em;
    color: var(--ink-2); white-space: nowrap;
  }
  /* A drawn square rather than a glyph: it is the same in every font, and a
     screen reader has nothing to read out. */
  .marquee-item::before {
    content: ""; width: 6px; height: 6px; border-radius: 1px;
    background: var(--accent); flex: none;
  }
  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-25%); }
  }
  /* Only for a reader whose system asks for less motion: nothing moves, the
     one copy of the phrases wraps onto as many lines as it needs, and the
     band goes back to the width of the page column. */
  @media (prefers-reduced-motion: reduce) {
    .marquee { -webkit-mask-image: none; mask-image: none; }
    .marquee-track {
      animation: none; width: auto; padding: 0 var(--gutter); will-change: auto;
      flex-wrap: wrap; justify-content: center; gap: 10px 28px;
    }
    .marquee-item[aria-hidden="true"] { display: none; }
  }

  /* ── popular rail ──────────────────────────────────────────────────────── */
  .pop-section { margin-top: 32px; }

  /* ── bottom split: suggestions beside update history ─────────────────────
     Stacked on mobile, with the suggestion box last; side by side once there
     is room for two honest columns rather than one squeezed pair. */
  .bottom-split {
    margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 36px;
  }
  .suggest-section {
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  /* Both headings take .t-section in the markup — the same role the rest of
     the site's section headings take — rather than an 18px size that existed
     only here. Margins stay separate: each still needs its own gap to what
     follows it. */
  /* Section headings are h2 (under each view's h1) carrying .t-section; the
     element selectors below said h3 from before the pages had an h1. */
  .suggest-section h2 { margin: 0 0 6px; }
  .suggest-section .panel-note { margin-top: 0; }

  .updates-section h2 { margin: 0 0 16px; }
  .updates-list {
    list-style: none; margin: 0; padding: 0 4px 0 0; display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--line-firm) transparent;
  }
  .updates-list::-webkit-scrollbar { width: 6px; }
  .updates-list::-webkit-scrollbar-track { background: transparent; }
  .updates-list::-webkit-scrollbar-thumb { background: var(--line-firm); border-radius: 3px; }
  .updates-list::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  /* JS (syncUpdatesHeight) sets the real cap once the suggestion box next to
     it has actually rendered; this is only the pre-JS/no-JS fallback so the
     list never runs unbounded before that. */
  .updates-list { max-height: 420px; }
  :root[data-layout="desktop"] .updates-list { max-height: 480px; }
  /* A neutral rail, not an accent-tinted one. Each entry already names its
     own version in --accent; a coloured bar beside it was the same emphasis
     twice, and an accent stripe down a list is decoration rather than
     information. The rail stays because a run of releases genuinely is a
     thread, and a hairline says so without competing. */
  .update-entry {
    border-left: 2px solid var(--line); padding: 12px 0 12px 14px;
    position: relative;
  }
  .update-entry.prelaunch .update-version::before { content: '● '; font-size: 10px; color: var(--faint); }
  .update-head { margin: 0 0 6px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .update-version { font-weight: 800; font-size: 13px; color: var(--accent); letter-spacing: 0.02em; }
  .update-date { font-size: 11px; color: var(--faint); font-weight: 500; }
  .update-title { margin: 0 0 8px; font-weight: 700; font-size: 13px; line-height: 1.4; }
  .update-points {
    margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px;
    font-size: 12px; color: var(--ink-2); line-height: 1.5;
  }
  .update-points li { margin: 0; }
  /* One line per point (owner, 2026-10-01): each entry is short by rule
     (tests/changelog.test.ts), and anything longer is cut with an ellipsis
     rather than wrapping. */
  .update-title, .update-points li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  :root[data-layout="desktop"] .bottom-split { flex-direction: row; align-items: flex-start; gap: 56px; }
  :root[data-layout="desktop"] .bottom-split > section { flex: 1 1 0; min-width: 0; }
  /* The markup puts "Got an idea?" after Update History so it is the last
     thing on a phone's home page (owner request, 2026-10-03). Side by side
     there is no "last", so it keeps the left column it always had. */
  :root[data-layout="desktop"] .bottom-split > .suggest-section { order: -1; }
  /* "Got an idea?" now centres on desktop too, same as it already does on
     mobile — .suggest-section's own base rule (align-items: center;
     text-align: center) already does this once the desktop override that
     was left-aligning it is removed, so there is nothing to add here. */
  /* One section-heading treatment, replacing three that had drifted apart
     (uppercase-tracked, 17px bold, accent-underlined). Sentence case at
     15px/600, no rule and no accent: separation between blocks is space --
     32px above, 16px below -- never decoration. The markup already reads
     "Most stocked"; it was CSS doing the shouting. */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin: 32px 0 16px;
  }
  .section-head h2 { margin: 0; }
  /* Link rank. The padding is cancelled by an equal negative margin, so the
     tap target reaches 44px without the text shifting on the line it sits in
     -- this appears both beside a section heading and mid-paragraph. */
  .link-btn {
    background: none; border: 0; cursor: pointer;
    padding: 12px 6px; margin: -12px -6px;
    font: inherit; font-size: 13px; color: var(--accent-ink);
  }
  .link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .link-btn.see-top { display: inline-flex; align-items: center; gap: 4px; }

  /* Negative margin lets cards bleed to the screen edge while the page keeps its
     gutter, so the row reads as scrollable. */
  .pop-rail {
    list-style: none; margin: 16px calc(-1 * var(--gutter)) 0;
    padding: 2px var(--gutter) 16px;
    display: flex; gap: 12px;
    overflow-x: auto; scroll-snap-type: x proximity; scroll-behavior: smooth;
    /* Snapping aligns items to the scrollport, not the padding box, so without
       this an edge card snaps flush against the scrollport and clips its
       medal — the first card when the medal sat top-left, the last now that
       it sits top-right (see .medal below). */
    scroll-padding-inline: var(--gutter);
    -webkit-overflow-scrolling: touch;
    /* A visible scrollbar matters more here than almost anywhere else in the
       app: on desktop, with a mouse and no touch swipe, a hidden scrollbar
       left this row looking like it just clipped rather than scrolled. Thin
       and grey so it reads as part of the row, not a browser chrome bolt on. */
    scrollbar-width: thin; scrollbar-color: var(--line-firm) transparent;
  }
  .pop-rail::-webkit-scrollbar { height: 6px; }
  .pop-rail::-webkit-scrollbar-track { background: transparent; }
  .pop-rail::-webkit-scrollbar-thumb {
    background: var(--line-firm); border-radius: 999px; border: 1px solid transparent;
    background-clip: padding-box;
  }
  .pop-rail::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  /* The rail is the one tile-grid context that scrolls horizontally instead of
     wrapping, so its items need a fixed width the grid's own auto-fill columns
     don't have to specify. Everything else about the tile is shared. */
  .pop-item { flex: none; width: 172px; scroll-snap-align: start; }
  .pop-item .tile { height: 100%; }

  /* ── product heading, used in every place a product appears ──────────────
     Name on the left, size and concentration riding smaller and quieter on
     the right, centred against it rather than hanging off the top. One rule
     so a product reads identically in a rail card, a list row and a page
     heading. */
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .phead-text { min-width: 0; flex: 1; }
  /* The brand's own control, sitting just above .phead rather than inside it
     (see brandButton in app.ts). A bordered pill, not a plain label — the
     same outline-says-tap-me language as .sold-by, the retailer pill lower
     down on the same tile, so the one other clickable label on the tile
     already taught the reader what this shape means. Sized to its own text
     (inline-block) rather than the full tile width, and pinned to the
     start edge of the tile's flex column below. */
  .phead-brand {
    display: inline-block; align-self: flex-start; max-width: 100%;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--faint);
    text-align: left; cursor: pointer;
    padding: 3px 10px; margin: 0; border-radius: 999px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: border-color .12s ease, color .12s ease;
  }
  .phead-brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .phead-brand:hover { border-color: var(--accent); color: var(--accent); }
  }
  .phead-name {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    /* All four sides, not only the top: on the detail page this is an h1 (see
       productHead in app.ts) and would otherwise carry the browser's default
       heading margins below it. */
    margin: 1px 0 0;
  }
  .phead-meta {
    flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
    white-space: nowrap;
  }

  /* ── product image ───────────────────────────────────────────────────────
     A fixed square whatever the source image's own proportions are, so a
     photo, a differently shaped photo and a blank all occupy the same box and
     a future retailer's feed cannot reflow the layout. The white ground is
     ours, sitting behind the image: the licence that lets us show these
     photos also forbids altering them, so the JPEG's own white background is
     matched rather than keyed out. See demo/photo.ts. */
  .art {
    display: block; flex: none; aspect-ratio: 1 / 1; border-radius: 10px;
    overflow: hidden; background: #fff;
  }
  /* Percentages of the tile, not fixed pixels, so the picture stays the
     dominant element at every grid track width rather than a size someone
     picked for one specific tile. 90% is the width to aim for; art-lg goes
     further because the detail hero has nothing else competing with it.

     The ceiling only ever binds at the widest tracks. Three columns across a
     large monitor gives each tile roughly 600px, and 90% of that is a square
     the height of half the window: one tile per screen is a product page,
     not a list. Capping the picture keeps the tile browsable while leaving
     90% in force at every count where it is not silly. */
  .art-sm { width: 90%; }
  .art-md { width: min(90%, 300px); }
  .art-lg { width: 96%; max-width: 340px; }
  .art-img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* Fixed, not theme-driven: the placeholder sits inside a tile that is
     always white now, so it needs a colour that reads the same way whichever
     mode the rest of the page is in. Background matches the tile itself
     (and a real photo's own white ground) so only the mark and caption
     read as content, not the box around them. */
  .art-empty {
    background: #FFFFFF; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: var(--faint);
  }
  .art-none { width: 82%; height: 82%; }
  .art-sm .art-none { width: 68%; height: 68%; }

  /* Medals mark the top three by popularity. A real rank, not decoration.
     Top-right corner of the tile, over the art, rather than top-left: left
     put the medal at the exact spot the pop-rail's own edge cards get
     clipped against the scrollport (see the scroll-padding-inline note on
     .pop-rail above), and nothing else sits in the top-right corner of a
     tile to share it with — the wishlist heart lives on the account page's
     wishlist rows and the fragrance detail hero, never on a grid tile.

     Disc-and-ribbon rather than a bare circle: a flat number-in-a-circle at
     22px read as a coloured dot with digit soup inside, not a rank. The
     ribbon tails are two ::before/::after wedges, a shade darker than the
     disc (filter: brightness on the same background — still the one gold/
     silver/bronze token, not a colour invented at the point of use) so they
     read as fabric under the metal rather than a repeat of the disc itself.
     They start under the disc's own curve (top: 56% of --medal-size, inside
     the disc's square bounding box but below the inscribed circle, so the
     join is hidden by the disc's rounded fill) and run to 148%, so very
     nearly half the disc's height hangs clear below it — the first version
     of this only cleared 8% and read as a coin with a notch, not a ribbon.
     Stacked behind the disc (z-index: -1 inside the .medal stacking
     context, which its own position + z-index establish) and V-notched at
     the tip with clip-path so they read as cut ribbon ends rather than
     square tabs. The white ring is a fixed 2px #fff, not a theme colour,
     because .art (below) is unconditionally white in both palettes and the
     ring's job is to cut the disc out of a photo, not out of the theme —
     so it stays correct if the photo is pale near that corner. --medal-size
     drives every other dimension so the two breakpoints below are the only
     numbers that change. */
  /* Refined 2026-10-03 (owner: "something more refined", and the number's
     square showed past the circle). The square came from .medal itself
     painting the metal colour on its whole box, so the corners showed
     around the round disc. The colour is now a custom property that only
     the disc and the ribbon paint, never the .medal box. The look is quieter
     too: a thin inner ring in place of the heavy white halo, shorter and
     narrower ribbon tails, and tabular figures so 1, 2 and 3 sit centred. */
  .medal {
    --medal-size: 24px;
    position: absolute; top: -3px; right: -3px; z-index: 2;
    width: var(--medal-size); height: var(--medal-size);
    font-weight: 700; line-height: 1;
    font-size: calc(var(--medal-size) * 0.48);
    font-variant-numeric: tabular-nums;
    color: var(--medal-on);
  }
  :root[data-layout="desktop"] .medal { --medal-size: 30px; }
  /* The disc is its own element so it paints over the ribbon tails. */
  .medal-disc {
    position: relative; z-index: 1;
    width: 100%; height: 100%; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--medal-bg); color: inherit;
    box-shadow:
      inset 0 0 0 calc(var(--medal-size) * 0.07) rgba(255, 255, 255, .38),
      0 0 0 1.5px #fff,
      0 1px 2px rgba(0, 0, 0, .3);
  }
  .medal::before,
  .medal::after {
    content: ""; position: absolute;
    top: calc(var(--medal-size) * 0.62);
    width: calc(var(--medal-size) * 0.26); height: calc(var(--medal-size) * 0.68);
    background: var(--medal-bg); filter: brightness(0.78);
    clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);
  }
  .medal::before { left: calc(var(--medal-size) * 0.18); transform: rotate(-12deg); transform-origin: top center; }
  .medal::after  { right: calc(var(--medal-size) * 0.18); transform: rotate(12deg); transform-origin: top center; }
  /* Flat, and from tokens. */
  .medal.gold   { --medal-bg: var(--rank-1); --medal-on: var(--rank-1-on); }
  .medal.silver { --medal-bg: var(--rank-2); --medal-on: var(--rank-2-on); }
  .medal.bronze { --medal-bg: var(--rank-3); --medal-on: var(--rank-3-on); }

  /* ── fragrance tile grid ───────────────────────────────────────────────────
     One tile shape, used everywhere a list of fragrances appears (browse,
     search, deals, a retailer's own catalogue) and for the home rail. The
     picture is the point: .art-md fills 90% of the tile's own width rather
     than a fixed pixel size, so it stays the dominant element whatever the
     grid track width happens to be. */
  /* grid-auto-rows: 1fr is what makes every tile the same height: it forces
     all rows to one shared height, and .tile stretching to fill its row means
     a one-line name and a two-line name end up identical. Nothing inside the
     tile needs a hand-tuned height for that to hold — see .tile-art below,
     which takes up whatever slack is left over. */
  /* Two columns, stated rather than derived. auto-fill/minmax(148px) landed
     on two at every width the narrow layout actually reaches, but it landed
     there by arithmetic: a gutter change or a --col change could have moved
     it to three without anything in the stylesheet saying so. The desktop
     layout takes the reader's own column count instead -- see the
     [data-layout="desktop"] rule further down. */
  .tile-grid {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 1fr; gap: 16px;
  }
  /* "…and .tile stretching to fill its row" above was not true of this grid
     until this rule: the <li> is the grid item and does stretch to the track,
     but .tile is a plain block child of it and sat at its own content height
     instead. Nothing showed, because every tile head used to reserve two
     lines for the name whether it needed them or not, so every tile's content
     was the same height anyway. With that reservation removed (see
     .phead-name-wrap) a one-line-name tile is genuinely shorter, and without
     this its price and shop pill rode 19.5px above its neighbours' — measured
     in Chromium 141 on /search at 1440, five per row, against "Club De Nuit
     Intense Man" wrapping beside "9am Dive" not wrapping. The rail has always
     said the same thing for itself, in .pop-item .tile. */
  .tile-grid > li > .tile { height: 100%; }
  /* The tile itself follows the theme; only the image well inside it stays
     white. This narrows an earlier decision that made the whole card white
     in both themes: feed photography is shot on a white ground, so something
     white has to sit behind it or the cut-out leaves a visible seam — but
     that only needs to be the picture's own well (.art below, which already
     carries aspect-ratio 1/1 and a white background), not the card. Keeping
     the card on --surface means its text rides the theme's ink variables
     like every other card in the app, instead of pinning its own colours and
     drifting from them. */
  .tile {
    width: 100%; display: flex; flex-direction: column; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 13px 14px; color: var(--ink);
    transition: border-color var(--dur-2) var(--ease-standard);
  }
  /* Behaviour 4, hover: the border moves --line to --line-firm and nothing
     else. No lift, no shadow, no scale — cards stay on the grid, so a row of
     them does not ripple as the pointer crosses it. */
  @media (hover: hover) and (pointer: fine) {
    .tile:hover { border-color: var(--line-firm); }
  }
  /* The tile's own two controls: the brand label above, and everything else
     (name, art, price, shop) below as one button — see fragranceTile in
     app.ts for why this is two buttons rather than the one it used to be. */
  .tile-body {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
    background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
    font: inherit; color: inherit; text-align: left;
    transition: transform .12s ease;
  }
  .tile-body:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
  /* Behaviour 3, press. .985 rather than the .97 this used to carry: at tile
     size the deeper scale read as the card flinching away from the tap. */
  .tile-body:active { transform: scale(.985); }
  .tile .phead-meta { color: var(--faint); }
  /* Same pill as .sold-by lower down the tile — same background, border and
     ink — so the two read as a matched pair: this is the shop pill's brand
     counterpart, not a differently styled control. */
  .tile .phead-brand {
    background: var(--surface-2); border-color: var(--line); color: var(--ink-2);
  }
  @media (hover: hover) and (pointer: fine) {
    .tile .phead-brand:hover { border-color: var(--accent); color: var(--accent); }
  }
  /* The wrapper the clamped name sits inside. -webkit-box (needed for
     -webkit-line-clamp) does not reliably centre its own content — tested
     -webkit-box-pack: center here and Chromium ignored it — so where the name
     has to sit centred against something beside it (.phead is a row on the
     detail hero and in a list row, with .phead-meta riding on the right) the
     centring happens one level up, on this plain flex wrapper. */
  .phead-name-wrap { display: flex; align-items: center; }
  /* No second line of room is reserved here. This used to carry
     `min-height: 2.5em` on .tile, so a tile always held two lines' worth of
     name whether it needed them or not, plus an `align-items: flex-start`
     to stop that reserved room from centring a one-line name inside itself.
     Both are gone: on a tile .phead is a column (see below), so the reserved
     line had nothing beside it to line up with and simply sat as a blank
     1.25em between the name and the "100ml EDP" meta line under it — visible
     on every one-line name and absent on every two-line one, which is the
     inconsistency the owner reported as making the grid look unprofessional.
     Row height no longer depends on it, but only because the grid was made to
     say so itself: grid-auto-rows: 1fr sizes every row track to the tallest
     tile, `.tile-grid > li > .tile { height: 100% }` (above) makes each tile
     take that whole track, and .tile-art below is flex: 1, so the line a
     one-line name does not use is absorbed as room around the picture instead.
     Measured in Chromium 141: the picture is the same 162.7px square in a
     one-line and a two-line tile, and the price, the shop pill and the tile's
     bottom edge land on the same pixel across the row either way. */
  /* ── the name gets the whole tile, not what the meta leaves it ────────────
     Everywhere else .phead is a row: name on the left, size and concentration
     riding on the right. That is right on a detail heading and on a list row,
     both of which have hundreds of pixels to spend. In a tile it is not: the
     meta column is `flex: none` with `white-space: nowrap`, so it takes the
     width "100ml"/"Extrait" needs *first* and the name clamps into whatever
     is left, minus the 10px gap. On a narrow tile that remainder is a sliver,
     and a two line clamp over a sliver is how three different French Avenue
     products — "Vulcan Black Friday" in two concentrations and "Vulcan Black
     Friday Edition" — all came to read "Vulcan Black..." and nothing else.

     Inside a tile the meta therefore drops underneath the name and becomes a
     single quiet row, which hands the name the tile's full content width
     instead of the remainder. How many more characters that buys was left
     unclaimed when this rule was written, because no browser could be
     installed in that sandbox. One can be now — see scripts/screenshot.ts —
     so the figures are recorded here rather than left as an assertion.

     Chromium 141, headless, the built demo/index.html of 2026-08-25, at the
     15px/19.5px this stack resolves to. Width of the `.phead-name` box, and
     how much of one fixed reference name ("Vulcan Black Friday Edition
     Intense Eau de Parfum Absolu Cologne") survives the two-line clamp,
     measured character by character off Range rects with the room the
     ellipsis takes subtracted. Each row is the densest count the chooser
     offers at that width; "was" is the same layout with this rule reverted
     in the same browser, at the same forced column count:

       viewport  densest   name box      characters of the reference name
       1280      5 / row   132px was 93   28 was 13
       1440      5 / row   152px was 119  40 was 17
       1920      8 / row   137px was 99   28 was 13
       2560     10 / row   151px was 118  40 was 17

     The gain is the meta column plus the 10px gap — 33 to 38px, consistently.
     28 characters is the number that settles the case this rule exists for:
     "Vulcan Black Friday Edition" is 27.

     The counts this rule withdrew were worse than "narrow". At 1280 with 10
     per row the name box measured 3px and at 8 per row 25px; both showed 7
     characters, "Vulcan " and nothing after it, because the box is narrower
     than the first word of the name.

     Scoped to .tile so the detail heading and the list rows, where nothing was
     wrong, keep the side by side arrangement they have always had. */
  .tile .phead { flex-direction: column; align-items: stretch; gap: 2px; }
  .tile .phead-meta { flex-direction: row; align-items: baseline; gap: 6px; }
  /* The slack absorber: with every row the same height (grid-auto-rows above),
     whatever height the text does not use ends up here, which keeps the price
     and the shop tag on the tile's bottom edge across the whole row.

     The picture sits at the bottom of that slack rather than centred in it.
     Centring was the older behaviour and it was invisible while every tile
     head reserved a second line for the name, because then there was no slack
     to centre in. Now that a one-line-name tile really is shorter in the head,
     centring split the difference and left the white image well 10px lower in
     a two-line tile than in its neighbours — plainly visible in dark mode,
     where the well is white against a dark card. Anchoring to the bottom puts
     every well on the same pixel across a row instead (they are all the same
     size — .art-md is a percentage of a tile width the grid makes uniform),
     and the room a missing name line frees up opens above the picture, which
     is where the eye already expects the head to end. */
  .tile-art {
    position: relative; flex: 1; min-height: 0;
    display: flex; align-items: flex-end; justify-content: center; padding: 4px 0;
  }
  /* One value per line, never side by side: price first, then what it was.
     A row that mixes the two invites reading the struck-through number as the
     price being charged. */
  .tile-price {
    font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--accent); text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .tile-price .off {
    font-size: 10.5px; font-weight: 700; color: var(--ok);
    letter-spacing: .01em;
  }
  .tile-price .amt { font-size: 15.5px; }
  .tile-price .amt.none { color: var(--faint); font-weight: 600; font-size: 13.5px; }
  /* "delivery not stated" under a tile price. Quiet, but present: the number
     above it is an item price where every other tile shows a delivered one,
     and leaving that unsaid is what would be dishonest. */
  .tile-price .amt-note {
    font-size: 10.5px; font-weight: 600; color: var(--faint);
    letter-spacing: .01em;
  }
  .tile-price .was {
    font-size: 11px; font-weight: 600; color: var(--faint);
    text-decoration: line-through; font-variant-numeric: tabular-nums;
  }
  /* A house-anchored deal tile (dealsPanel's dealTile) — same reasoning as
     the offer row's .off.anchor further down: never struck through, because
     that figure was never this shop's own claim. The tile is now the only
     place a .was.anchor exists at all; the offer row stopped rendering its
     own on 2026-08-26 (see offerRow in demo/app.ts). */
  .tile-price .was.anchor { text-decoration: none; border-bottom: 1px dotted var(--faint); padding-bottom: 1px; }
  .from { font-size: 10px; font-weight: 600; color: var(--faint); letter-spacing: .02em; }

  /* Which shop the price is actually from: a plain text tag using the name,
     not a logo. This is not the same absence the Retailers directory's
     monogram tiles used to be — docs/LOGOS-PLAN.md §2c/§4c found a real basis
     for showing a logo elsewhere on this site — it is a deliberate exclusion
     of THIS surface specifically. 12px, ellipsised, dozens of these balloons
     on screen in a browse grid at once: too small for a mark to resolve and
     too dense for the reader to read every one as a distinct, identified
     source rather than wallpaper, which is what referential use requires
     (§2c's first condition). See .phead-brand below for the matching call on
     the brand pill, and docs/LOGOS-PLAN.md §2a rows #5/#6 for the reasoning
     in full. */
  .sold-by {
    position: relative; align-self: center; max-width: 100%; margin-top: 6px;
    background: var(--surface-2); color: var(--ink-2);
    font: 600 12px/1 var(--font-sans);
    padding: 6px 10px; border-radius: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* The tail that makes this a balloon rather than another pill: a square
     rotated 45deg, same fill as the body, tucked under its top edge so the
     two read as one shape pointing at the price above. overflow:hidden on
     .sold-by would clip it, so the tail is drawn outside the padding box and
     the clip is scoped to the label text instead. */
  .sold-by { overflow: visible; }
  .sold-by > span {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sold-by::before {
    content: ""; position: absolute; top: -3px; left: 50%; margin-left: -3.5px;
    width: 7px; height: 7px; background: var(--surface-2); transform: rotate(45deg);
  }
  /* The sold-out placeholder keeps the row height but must not draw a tail
     pointing at a shop that is not named. */
  .sold-by[aria-hidden="true"]::before { display: none; }
  .empty-note { padding: 30px 2px; text-align: center; }

  /* ── page headings and shared panel furniture ──────────────────────────── */
  .page-head {
    display: flex; align-items: baseline; gap: 10px; margin: 4px 0 16px;
  }
  /* Every view's title is its level-one heading (an h1 carrying .t-page);
     the selectors below used to say h2, from before the pages had one. */
  .page-head h1 { margin: 0; }
  .quick-search { display: contents; }
  .count { color: var(--faint); }
  .panel-note { margin: 0 0 14px; }

  /* Sort and filter controls: an icon, then the choice itself. */
  /* One grid on every list page and at every width, so the row reads the same
     everywhere: two equal columns on a phone, as many as fit on a computer.
     It used to be a wrapping flex row, which put Sort and Filters side by side
     on some pages and stacked three controls at three different widths on
     others, depending only on how long each page's labels happened to be. */
  .controls {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr));
    gap: 8px; margin: 6px 0 16px;
  }
  .control {
    display: flex; align-items: center; gap: 6px; min-width: 0; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 12px 0 11px;
    font: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
  }
  /* box-shadow rather than outline: it follows the pill's own border-radius,
     so the ring reads as one smooth rounded shape instead of the browser's
     native (square-cornered) focus box a bare <select> would otherwise draw. */
  .control:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-sf); }
  .control-ico { display: flex; color: var(--faint); }
  .ico { width: 17px; height: 17px; display: block; }
  /* A plain <select> keeps its own native chrome — including, in current
     Chrome, a focus ring painted by the OS/engine itself that `outline: none`
     cannot reach. appearance: none hands the whole control over to this CSS,
     so .control's rounded box-shadow above is the only focus indicator left;
     the chevron beside it (.control-chevron, in the markup) stands in for the
     arrow appearance: none removes. */
  .dropdown {
    flex: 1 1 auto; min-width: 0; text-overflow: ellipsis;
    font: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
    background: none; border: 0; padding: 10px 2px; cursor: pointer;
    appearance: none; -webkit-appearance: none; -moz-appearance: none; outline: none;
  }
  .dropdown::-ms-expand { display: none; }
  .dropdown:focus, .dropdown:focus-visible { outline: none; }
  .control-chevron { display: flex; color: var(--faint); pointer-events: none; margin-left: -2px; }
  /* Half a phone's width leaves a dropdown about 110px of text at 16px, and
     sort labels run to 135px ("Best Saving", "Most Common", "Highest Price").
     The leading mark gives back 23px; the words already say what the control
     is. The Filters button keeps its mark: it is a button, not a dropdown. */
  @media (max-width: 480px) {
    label.control > .control-ico { display: none; }
    .control { padding: 0 10px; }
  }
  .control-chevron .ico { width: 13px; height: 13px; }
  /* The open dropdown's popup is drawn by the OS, not this stylesheet — the
     closed control above only sets `color`, so the engine is free to pair
     that light (or dark) text with whichever background the platform's own
     light-mode-flavoured popup chrome uses, and in dark mode that pairing
     goes light-on-light. `color-scheme` is the actual signal the platform
     reads to pick a dark-flavoured popup chrome in the first place, so it is
     the root fix; the `background`/`color` on <option> are the belt-and-
     braces half, because a UA that ignores color-scheme (or a forced-colours
     mode) still needs its own explicit pairing rather than one inherited
     property. Same reasoning applies to .field select below. */
  .dropdown, .field select { color-scheme: light dark; }
  .dropdown option, .dropdown optgroup,
  .field select option, .field select optgroup {
    background: var(--surface); color: var(--ink);
  }

  /* ── brands ────────────────────────────────────────────────────────────── */
  .brand-list { list-style: none; margin: 0; padding: 0; }
  .brand-row {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 2px; color: var(--ink);
    transition: color .12s ease;
  }
  .brand-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) {
    .brand-row:hover { color: var(--accent); }
  }
  /* The initial, then a rule running to the end of the column, so a long
     alphabetical list breaks into scannable blocks. */
  .alpha-break {
    display: flex; align-items: center; gap: 10px;
    margin: 18px 0 4px; color: var(--accent);
  }
  .alpha-break:first-child { margin-top: 0; }
  .alpha-break span { font-size: 13px; font-weight: 800; letter-spacing: .04em; }
  .alpha-break i { flex: 1; height: 1px; background: var(--line-firm); }

  /* ── retailers ─────────────────────────────────────────────────────────── */
  /* Initials — the default and the fallback, drawn instead of a shop's or a
     house's real logo whenever we have none on file, or whenever the one we
     do have fails to load (see .org-mark-failed below). Where we DO have a
     logo, docs/LOGOS-PLAN.md §2c/§4a-§4e set out why showing it is fine —
     s.11(2)(c) Trade Marks Act 1994, referential use, never altered, never
     copied except the small Commons public-domain set under /logos/ — and
     it renders on its own tile (.org-mark below), not this one.

     The tint is per-name, not per-brand-identity: --mh (a hue, 0-360) is set
     inline by monogram() in app.ts from a deterministic hash of the name, so
     the same shop always gets the same tile colour and different shops are
     visually distinct at a glance — a real usability win over every tile
     sharing one flat accent colour. It is not a claim about any brand's own
     palette, which this project has no licence to reproduce (the initials
     restriction above, applied to colour too) — falls back to the ordinary
     accent colour if --mh is ever unset. */
  .monogram {
    flex: none; width: 42px; height: 42px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: hsl(var(--mh, 355) var(--mono-sat) var(--mono-bg-l));
    color: hsl(var(--mh, 355) var(--mono-sat) var(--mono-fg-l));
    font-size: 14px; font-weight: 800; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    border: 1px solid hsl(var(--mh, 355) var(--mono-sat) var(--mono-border-l));
  }

  /* A real logo, in place of the monogram above — docs/LOGOS-PLAN.md §4c/§4d.
     The container is ours to style; the artwork inside it is untouched, same
     as the white tile behind feed photography (demo/photo.ts). Two shapes:
     `--square` fills the same 42px/56px box `.monogram` does; `--wordmark`
     only ever appears in the hero (orgMark's `hero` argument), a flexible box
     for a mark that does not fit a square. Three ink variants choose the
     tile's ground from a measurement, not from the page's own theme, so the
     same logo looks identical whichever palette is on screen — `--light` is
     a light tile for dark ink, `--dark` is a dark tile for light ink, `--own`
     is no fill at all for a mark that already carries its own background,
     just the shared border so it still reads as a tile.

     `.org-mark-failed` is the onerror target: the <img> removes itself and
     this class takes over, painting the exact monogram this shop or brand
     would have drawn — same tokens, same hash-derived hue, read from the
     `data-fallback` initials and `--mh` this element was already carrying
     before the image ever had a chance to fail (see orgMark's own comment in
     demo/app.ts for why that is not the "hidden fallback behind every image"
     shape productArt's own header rejects). */
  .org-mark { position: relative; overflow: hidden; box-sizing: border-box; }
  .org-mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .org-mark--square {
    flex: none; width: 42px; height: 42px; border-radius: 11px;
    border: 1px solid var(--org-mark-border);
  }
  .org-hero .org-mark--square { width: 56px; height: 56px; border-radius: 15px; }
  .org-mark--wordmark {
    flex: none; height: 56px; max-width: 200px; width: auto;
    padding: 6px 10px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--org-mark-border);
  }
  .org-mark--wordmark img { width: auto; height: 100%; }
  .org-mark--light { background: var(--org-mark-light-bg); }
  .org-mark--dark  { background: var(--org-mark-dark-bg); }
  .org-mark--own   { background: none; }
  .org-mark.org-mark-failed {
    background: hsl(var(--mh, 355) var(--mono-sat) var(--mono-bg-l));
    border-color: hsl(var(--mh, 355) var(--mono-sat) var(--mono-border-l));
    display: flex; align-items: center; justify-content: center;
  }
  .org-mark.org-mark-failed::after {
    content: attr(data-fallback);
    color: hsl(var(--mh, 355) var(--mono-sat) var(--mono-fg-l));
    font-size: 14px; font-weight: 800; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .org-hero .org-mark.org-mark-failed::after { font-size: 18px; }
  /* The 20px shop mark beside a name in a product's price list. Every row
     carries one, the same box either way: the shop's square logo on its
     tile, or (no square logo, or the logo failed to load) the shop's
     initials on the monogram tint, the same tokens .monogram uses, which are
     contrast tested at every hue in both themes. */
  .offer-mark {
    display: inline-block; width: 20px; height: 20px; border-radius: 5px;
    margin-right: 7px; vertical-align: -4px; box-sizing: border-box;
  }
  .org-mark.offer-mark { border: 1px solid var(--org-mark-border); }
  /* inline-block with overflow hidden, like the logo tile, so both take
     their baseline from the bottom edge and sit at exactly the same height
     beside the name. 18px line height centres the initials inside the
     1px border. */
  .offer-mark--initials {
    overflow: hidden; white-space: nowrap; text-align: center;
    line-height: 18px;
    background: hsl(var(--mh, 355) var(--mono-sat) var(--mono-bg-l));
    color: hsl(var(--mh, 355) var(--mono-sat) var(--mono-fg-l));
    border: 1px solid hsl(var(--mh, 355) var(--mono-sat) var(--mono-border-l));
    font-size: 9px; font-weight: 800; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }

  .shop-list { list-style: none; margin: 0; padding: 0; }
  .shop-row {
    width: 100%; display: flex; align-items: center; gap: 13px; cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 2px; font: inherit; color: var(--ink); text-align: left;
    transition: background-color .12s ease;
  }
  .shop-row:active { background: var(--surface); }
  .shop-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .shop-row-text { flex: 1; min-width: 0; }
  .shop-row-name { display: block; }
  .shop-row-meta { display: block; }
  .shop-row-go { flex: none; color: var(--accent); font-weight: 700; }

  /* Module 7: the account page's own wishlist list. A remove control sits
     beside the row rather than inside it — a <button> cannot nest inside
     another <button>, and the row itself is one (it navigates to the
     fragrance on tap, same as every other .shop-row in this app). */
  .wishlist-row { display: flex; align-items: center; gap: 4px; }
  .wishlist-row .shop-row { width: auto; flex: 1; min-width: 0; }
  .wishlist-remove {
    flex: none; display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%; border: 0; background: none;
    color: var(--faint); cursor: pointer;
  }
  .wishlist-remove .ico { width: 15px; height: 15px; }
  .wishlist-remove:hover, .wishlist-remove:focus-visible { color: var(--accent); }
  .wishlist-remove:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Price alerts (queue item 4.1): the optional target under each saved
     fragrance, shown once alerts are on, on a line of its own. */
  .wishlist-row { flex-wrap: wrap; }
  .wishlist-target {
    flex-basis: 100%; display: flex; align-items: center; gap: 6px;
    margin: 0 0 10px 12px; color: var(--ink-2);
  }
  .wishlist-target input {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; width: 7.5em; min-height: 40px;
  }
  .wishlist-target input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .alerts-check { width: 100%; max-width: 360px; min-height: 48px; margin-top: 4px; padding-top: 8px; padding-bottom: 8px; }
  .alerts-check .facet-check-label { text-align: left; font-size: 15px; line-height: 1.35; }

  /* Logo left, everything else — name, domain, blurb, delivery — condensed
     into a right column that reads top to bottom. Replaces the old
     everything-centred-and-stacked layout, which spent most of a screen's
     height on a single shop. Shared by the retailer profile and the brand
     profile, so both read as the same kind of page. */
  .org-hero { display: flex; align-items: flex-start; gap: 14px; padding: 6px 0 18px; text-align: left; }
  .org-hero .monogram { flex: none; width: 56px; height: 56px; border-radius: 15px; font-size: 18px; }
  .org-hero-text { flex: 1; min-width: 0; }
  .org-hero-name { margin: 0; }
  .org-hero-count { color: var(--faint); }
  .org-hero-domain { margin: 2px 0 0; }
  .org-hero-domain a { color: inherit; }
  .org-hero-blurb { margin: 8px 0 0; }

  /* The brand's own site: same icon-then-label shape and shading as the
     sort/filter controls (.control) above, so it reads as one more control
     rather than a plain text link — but a fixed destination rather than a
     dropdown, so its own class rather than a literal reuse of .control. */
  .brand-site-link {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 13px 8px 10px; text-decoration: none;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    transition: border-color .12s ease, color .12s ease;
  }
  .brand-site-link .control-ico { transition: color .12s ease; }
  .brand-site-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .brand-site-link:hover { border-color: var(--accent); color: var(--accent); }
    .brand-site-link:hover .control-ico { color: var(--accent); }
  }

  /* Official Site + Fragrantica, under a fragrance's own title block. Same
     .brand-site-link pill as the brand page's own official-site link, so the
     two pages agree on what this kind of link looks like — but this row
     centres itself (2026-08-26), unlike the left-aligned copy on the brand
     page, because it sits inside this hero's own centred column (art, name,
     price boxes) rather than beside a left-aligned heading the way the brand
     page's copy does. `justify-content: center` also covers the one-pill
     case (Official Site absent): a single centred pill still reads as one
     deliberate line, where a single left-aligned one would read as a
     leftover. */
  .frag-links-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    justify-content: center;
  }
  .frag-links-row .brand-site-link { margin-top: 10px; }

  /* Which market the link above actually opens, so a reader knows before
     clicking rather than after landing on it. --ok (green) is this app's
     existing "confirmed fine" token, reused here for "yes, UK" rather than
     invented fresh; Non-UK is deliberately neutral rather than --warn, since
     a brand with only a global site is not a fault, just a fact worth
     flagging (see officialSiteFor's own doc in demo/brandSites.ts). */
  .brand-site-flag {
    margin-left: 2px; padding: 2px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .01em;
    white-space: nowrap;
  }
  .brand-site-flag.is-uk {
    color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent);
  }
  .brand-site-flag.is-nonuk {
    color: var(--faint); background: var(--surface-2);
  }

  .fact-list { list-style: none; margin: 8px 0 6px; padding: 0; }
  .fact-list li {
    font-size: 13px; color: var(--ink-2); padding: 6px 0 6px 14px;
    border-bottom: 1px solid var(--line); position: relative;
  }
  .fact-list li::before {
    content: ""; position: absolute; left: 0; top: 13px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }

  /* Trustpilot's own widget renders its own star icons and colour once its
     script loads; this only sets the box it lands in. The fallback link
     (shown until the script loads, or forever if it never does) borrows the
     app's ordinary link styling rather than looking like a broken widget. */
  .trustpilot-block { margin-top: 4px; }
  /* Before the reader asks for the widget: the consent button, the plain
     link, and one line saying what pressing it does. */
  .trustpilot-consent { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .trustpilot-consent .t-caption { flex-basis: 100%; }
  .trustpilot-widget a { font-size: 12.5px; color: var(--accent); text-decoration: none; }
  .trustpilot-widget a:hover { text-decoration: underline; }

  /* ── notes ─────────────────────────────────────────────────────────────── */
  /* Same row as .brand-row (block, one column, alphabetical dividers) — this
     just adds the count on the right, so it needs flex instead of block. */
  .note-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .note-row-count { flex: none; color: var(--faint); }

  /* Top, middle and base, centred (owner's instruction, 2026-08-26).
     Everything in this block shares one centre line: the "Notes" eyebrow, the
     three tier names, the chips under each, and the source credit at the
     foot. On desktop this is not a new alignment at all — `.hero` is already
     `text-align: center` there (see the desktop block near the foot of this
     file), and the notes were the one thing inside it still hanging off a
     left edge; on a phone the block now matches what desktop always showed.

     The stair went with it. Each tier used to be indented 18px past the one
     above and hung off a left rule of its own, drawing a pyramid out of the
     layout rather than out of a triangle graphic. That device is asymmetric
     by construction: an indent measured from the left edge and a centre line
     cannot both hold, and half-honouring it (centred text over indented
     boxes) reads as a mistake rather than as a shape. What the stair carried
     is carried without it — the tiers are three labelled groups in fixed
     document order, top first, and the labels say which is which in words,
     which is also the only version of the shape a screen reader ever had.

     The chips centre by overriding .note-chips's `justify-content` inside
     this block only: the same class is a left-aligned filter row on a note's
     own profile page (.note-chips-profile), which must not move. */
  .notes-block { margin-top: 32px; text-align: center; }
  .note-layer { margin-bottom: 14px; }
  .note-layer-name { margin: 0 0 8px; }
  /* A tier with many notes wraps into several rows of chips; each row is
     centred on its own, so a last row holding one or two chips sits under the
     middle of the row above it rather than hanging off the left. That is the
     common case at 360-390px, where the base tier routinely takes three or
     four rows. */
  .notes-block .note-chips { justify-content: center; }

  /* The eyebrow role now lives in .t-eyebrow, which this carries in the
     markup; all that is left here is the gap to what follows. */
  .section-label { margin: 0 0 10px; }

  /* Compact horizontally scrolling row rather than a fixed grid: three
     groups today reads fine as a row, and a fourth would only ever need to
     scroll into view rather than force every card narrower to fit. */
  .notes-groups { margin: 4px 0 20px; }
  .notes-groups-row {
    display: flex; gap: 12px; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none;
  }
  .notes-groups-row::-webkit-scrollbar { display: none; }
  .note-group-card {
    flex: none; display: flex; flex-direction: column; gap: 4px;
    min-width: 92px; padding: 12px 14px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
    text-align: left; cursor: pointer; font: inherit; color: var(--ink);
    transition: border-color .12s ease, background .12s ease;
  }
  .note-group-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .note-group-card:hover { border-color: var(--line-firm); }
  }
  .note-group-card.on { background: var(--accent-sf); border-color: var(--accent); }
  .note-group-count { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .note-group-label { font-size: 12px; color: var(--faint); }
  .note-group-card.on .note-group-label { color: var(--ink-2); }

  /* The bottom half: a bounded, independently scrolling region rather than
     the page's ordinary flow. Two things need that — it is what "Browse
     Alphabetically" sitting under a fixed-height group row actually means,
     and the scrubber's whole mechanic (map a finger's Y position to a
     scroll position) only makes sense against a viewport with a stable,
     known height, not a list that keeps growing the page underneath it. */
  .notes-browse { position: relative; }
  .notes-browse-scroll {
    max-height: 50vh; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--line-firm) transparent;
    /* Room for the scrubber strip sitting over this same right edge (see
       .alpha-scrubber below) so a row's own count does not sit underneath
       its letters. Harmless dead space on desktop, where the strip is
       hidden — not worth a second, layout-scoped rule just to reclaim it. */
    padding-right: 26px;
  }
  .notes-browse-scroll::-webkit-scrollbar { width: 6px; }
  .notes-browse-scroll::-webkit-scrollbar-track { background: transparent; }
  .notes-browse-scroll::-webkit-scrollbar-thumb { background: var(--line-firm); border-radius: 3px; }

  /* iOS Contacts-style index strip, mobile only. Absolutely positioned over
     the scroll region's own right edge rather than beside it, so it costs no
     layout width from the list itself. */
  .alpha-scrubber {
    position: absolute; top: 0; right: -4px; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 8px; touch-action: none;
  }
  .alpha-scrubber-letter {
    font-size: 9.5px; font-weight: 700; line-height: 1.55; color: var(--faint);
    width: 14px; text-align: center;
  }
  .alpha-scrubber-letter[data-empty] { opacity: .28; }
  :root[data-layout="desktop"] .alpha-scrubber { display: none; }

  /* The magnified letter bubble that tracks the finger while dragging the
     scrubber, mirroring iOS. Only ever inserted/removed by JS, never part
     of the server-rendered markup — see mountAlphaScrubber in app.ts. */
