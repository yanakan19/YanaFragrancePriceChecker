      <p>PriceSniffs tells you what a bottle of fragrance actually costs across ${ke.length} UK shops, delivery included. Right now that covers ${bi(ee.length)} fragrances.</p>
      <p>Hi, I am Yanny.</p>
      <p>This started because I kept getting caught out. I bought a 100ml bottle of Club de Nuit, felt pleased with myself, and spotted it twelve pounds cheaper four days later. Comparing by hand meant nine tabs open across Boots, Notino and Beauty Base, and half of them hid the postage until I reached checkout.</p>
      <p>So I spent five days building the thing I wanted to use. Go and look at what the shops charge right now, add the delivery they will actually bill you, put the answer on one screen. ${2445} tests keep it honest.</p>
      <h2 class="t-section">What it does</h2>
      <p>Prices are checked every three hours, so 8 times a day. Boots, Selfridges, Superdrug, LOOKFANTASTIC, Escentual and the rest all get looked at on the same clock. Not one of those ${bi(ee.length)} prices is typed in by hand. A fragrance shows up here because a shop was genuinely selling it when we looked, and the number beside it came off that page.</p>
      <p>Delivery terms sit on a slower clock than prices do. Shops rewrite them maybe twice a year, so checking them every three hours would be a great deal of effort for the same answer. Boots posts free once you spend \xA325 and charges \xA33.95 under that. Harvey Nichols wants \xA3300, which one bottle will never reach, so its listings always carry \xA35.95 on top.</p>
      <p>That gap between Boots and Harvey Nichols is the whole point. A bottle at \xA324.99 from Superdrug can cost you more than the same bottle at \xA326 from Beauty Base, once postage lands.</p>
      <h2 class="t-section">Which delivery charges we have actually checked</h2>
      <p>Of the ${ke.length} shops switched on today, ${es.length} have had their delivery charge read off their own delivery page: ${es.map(t=>t.name).join(", ")}. The other ${ts.length} carry a figure that came from research and has not yet been checked against the shop itself. Every listing from those ${ts.length} says so, in the same line as the charge.</p>
      <p>That matters because delivery decides the ranking. So the word cheapest is now withheld whenever the gap between first place and second is smaller than a delivery charge we have not confirmed. Those listings still appear, still in price order, and the leader is still marked. It is labelled lowest total instead, because on figures like that we do not actually know which of the two is cheaper, and saying we do would be the whole problem in one word.</p>
      <h2 class="t-section">Being straight with you</h2>
      <p>If we do not know something, we say so instead of filling the gap with a guess. ${np.length} of the ${W.length} shops researched so far sit switched off, most of them waiting on a delivery cost or on a way to read their listings at all. Take Manchester Ouds. Their site advertises free postage over \xA350 but never prints what it charges below that. They are switched on, and their listings carry the words delivery not stated instead of a made up number, which also means they can never come out cheapest however low the bottle price is. ${vi.length} shops sit in that state today: ${vi.map(t=>t.name).join(", ")}. Sounds fussy over one missing figure. But a blank postage cost quietly counted as zero would shove a shop to the top of every result as the cheapest, and it would be a lie.</p>
      <p>Nothing here is a paid placement. No shop buys its way up. We earn commission on ${fn.length} of them, and on those the link still lands exactly where it would have anyway. Those links are marked, and our <a href="#" data-page="affiliate">affiliate disclosure</a> names the shops.</p>
      <h2 class="t-section">About the photos</h2>
      <p>Every product photo loads straight from the shop's own website. PriceSniffs does not copy them, save them, or put them on its own server. Your browser fetches that picture from Justmylook or Allbeauty exactly as it would if you were stood on their page, and it sits beside a link sending you to buy from them. Fragrance Click told us in writing we may use theirs, so we note that. For the rest we say plainly that we have no such permission. Any shop that wants us to stop, whether that is Notino or Harvey Nichols or anyone else, we stop, the day they ask.</p>
      <h2 class="t-section">Finding what you want</h2>
      <p>Filter by bottle size, by strength, by price bracket from under \xA320 up past \xA3300, by what is on offer, by what is in stock. Pick 50ml and the strength list narrows to what actually comes in 50ml, so Eau de Parfum and Eau de Toilette only stay on screen if a 50ml bottle exists. You can never tap something and land on an empty page. Sort by price, low to high or high to low, or run through it A to Z.</p>
      <h2 class="t-section">Say hello</h2>
      <p>I post about fragrance on <a href="https://www.tiktok.com/@yannysniffs" target="_blank" rel="noopener">TikTok</a> and <a href="https://www.instagram.com/yannysniffs" target="_blank" rel="noopener">Instagram</a> as yannysniffs. Come and tell me what I have got wrong, or which shop should be the ${rp(ke.length+1)}. Zimaya was added because someone asked.</p>`},{id:"how-it-works",title:"How PriceSniffs works",short:"How It Works",body:`
      <p>PriceSniffs compares fragrance prices across UK shops so you can see what a
      bottle really costs before you buy it.</p>

      <h2 class="t-section">Delivery is counted</h2>
      <p>Every price includes standard delivery to a UK mainland address, and we
      work out whether your order is large enough to qualify for free postage.
      Boots posts free once you spend \xA325 and charges \xA33.95 below that. Harvey
      Nichols wants \xA3300, which one bottle will never reach, so its listings
      always carry \xA35.95 on top. That is why a bottle priced at \xA324.99 can cost
      you more than one priced at \xA326.</p>
      <p>Not every one of those charges has been read off the shop's own
      delivery page. ${es.length} of the ${ke.length} shops
      we fetch from have been; the remaining ${ts.length} carry
      a researched figure instead, and every listing of theirs is marked not
      confirmed with the shop. Where the difference between the top two prices is
      smaller than one of those unconfirmed charges, we do not call either of
      them the cheapest, because we would be guessing at which one is.</p>

      <h2 class="t-section">Reductions come from the shop</h2>
      <p>When you see a previous price and a percentage saving, that figure is the
      shop's own. We never calculate one ourselves. Percentages round down, so a
      saving of 19.6 per cent shows as 19 per cent and never as 20. A countdown
      appears only when the shop has published a closing time for the offer. We
      never invent one.</p>

      <h2 class="t-section">Membership rates are not the headline</h2>
      <p>Superdrug posts free at \xA320 for Health and Beautycard holders and at \xA325
      for everyone else, so we quote \xA325. The Perfume Shop, The Fragrance Shop,
      Selfridges and LOOKFANTASTIC all run schemes of their own. We mention them,
      but we never build a members only rate into the headline price, because it
      is not a price you can pay unless you have already joined.</p>

      <h2 class="t-section">Sold out stays at the bottom</h2>
      <p>Listings a shop has marked unavailable sit at the end of the results and
      can never be shown as the cheapest option, however low the price. Where we
      could not read the stock figure at all we say so rather than guess, and that
      listing drops below the ones we could confirm.</p>

      <h2 class="t-section">Ratings are the shop's own</h2>
      <p>Where a star rating appears beside a shop's price, it is the rating that
      shop publishes on its own product page, read from there and shown as is. We
      do not write reviews, collect them, or combine one shop's rating with
      another's. Where a shop publishes none, none is shown.</p>

      <h2 class="t-section">Position is not for sale</h2>
      <p>Results are ordered by availability and then by price. Nothing else. No
      shop can pay to appear higher, and commission never moves a listing. Read
      our <a href="#" data-page="affiliate">affiliate disclosure</a>.</p>`},{id:"affiliate",title:"Affiliate disclosure",short:"Affiliate Disclosure",body:`
      <p>PriceSniffs earns commission when you buy through some of the links on
      this site. It costs you nothing and does not change the price you pay.</p>

      <h2 class="t-section">Which links earn commission</h2>
      <p>${fn.length} of the ${ke.length} shops listed today pay
      us commission on a purchase made after clicking through from here:
      ${fn.map(t=>t.name).join(", ")}. Those programmes run through
      ${ap.join(" and ")}. Every link to one of those shops is marked
      "Affiliate link" on the shop's row, under its name,
      on the page, before you click, and is also flagged to search engines as
      sponsored. Links to every other shop carry no tracking and earn nothing.</p>
      <p>This list is generated from the same registry that decides which shops
      appear at all, so it changes the moment a programme is approved or
      withdrawn rather than whenever someone remembers to update this page.</p>

      <h2 class="t-section">What happens when you click</h2>
      <p>A commissioned link takes you to the shop by way of the affiliate
      network, which records that you came from PriceSniffs so that a purchase
      can be matched to us. The network may set a cookie on its own or the
      shop's site to do that; those cookies are the network's and the shop's,
      governed by their policies, and PriceSniffs never sees them. Nothing is
      set on this site. See our <a href="#" data-page="cookies">cookies page</a>.</p>

      <h2 class="t-section">What commission does not touch</h2>
      <p>Commission has no bearing on the order of results, on which shops we
      include, or on the prices we show. Position is decided by stock and by
      delivered price. We will not take payment for placement inside the results.
      If we ever run a paid placement it will sit outside the results and be
      labelled as advertising.</p>

      <h2 class="t-section">Why we tell you this</h2>
      <p>UK advertising rules, the CAP Code administered by the Advertising
      Standards Authority, require affiliate relationships to be obvious before
      you click, not buried in a policy page. That is why the marker sits on the
      link itself and a note also appears at the bottom of every screen.</p>

      <p class="meta">Last updated ${O.updated}.</p>`},{id:"privacy",title:"Privacy notice",short:"Privacy",body:`
      <p>This notice sets out what personal data ${O.name} collects, why we
      collect it, who processes it for us, and what you can ask us to do about
      it. It is written to meet UK GDPR and the Data Protection Act 2018.</p>

      <h2 class="t-section">Who we are</h2>
      <p>PriceSniffs is run by ${O.operator?`${O.operator}, one person`:"one person"} trading as ${O.legalName}, not a
      registered company. You can reach us at
      <a href="mailto:${O.privacyEmail}">${O.privacyEmail}</a> for
      anything to do with your data. Our full business details are on the
      <a href="#" data-page="terms">terms page</a>.</p>

      <h2 class="t-section">The short version</h2>
      <p>Browsing, searching and filtering happen entirely in your browser
      against a fixed catalogue, and none of it is sent to us or stored by us.
      Three things do leave your browser, each only when you choose to use it:
      messages you type to Virtual Yanny, the details you give when you create
      an account, and anything you email us. Nothing on this site tracks you,
      profiles you or shows you advertising.</p>

      <h2 class="t-section">What we collect, and why</h2>
      <ul>
        <li><strong>Your display preferences.</strong> Dark or light theme,
        mobile or desktop layout and tiles per row are saved on your own device
        only, using your browser's local storage. They never leave it and we
        never see them. Listed in full on the <a href="#" data-page="cookies">cookies page</a>.</li>
        <li><strong>Virtual Yanny, the chat.</strong> Questions about prices,
        stock, sizes, notes, delivery, deals and budgets are answered inside
        your browser from the catalogue the page already holds; nothing you
        type for those leaves your device. An open question, such as a
        request for something that smells a certain way, is sent with the
        catalogue extract it needs to our chat service, which runs on
        ${O.chatHost}, and is answered by an AI model run by
        ${O.chatProvider} as well, so it goes to one company and no
        further. Our chat service does
        not store your messages and keeps no record of the conversation; the
        copy you see is held in your browser's session storage and is gone
        when the tab closes, or the moment you press Clear. The AI provider
        handles what it receives under its own terms, and we cannot control
        that, so please do not type personal details, yours or anyone else's,
        into the chat. Nothing is sent until you press send.</li>
        <li><strong>Anything you send us.</strong> If you email us, whether
        through the contact form or directly, we keep that message and your
        address so that we can reply, the same as any inbox. The forms on this
        site open your own email app; nothing is submitted to a server of ours.</li>
        <li><strong>If you create an account.</strong> Signing up is optional
        and takes your email address and a password, which our account
        provider, ${O.accountsProvider}, uses to create your login and
        send you a verification email. Once verified, you can save fragrances
        to a wishlist, which stores which fragrance you saved, when, and an
        optional target price you typed in yourself, never one we set. You can
        use the price comparison fully without ever creating an account.</li>
        <li><strong>Trustpilot reviews.</strong> On a shop's page you may see
        a button offering that shop's Trustpilot rating. Nothing loads from
        Trustpilot until you press it; when you do, your browser fetches their
        widget from their servers under Trustpilot's own privacy policy.</li>
      </ul>
      <p>We never see your payment details. Buying happens on the shop's own
      site, under their privacy policy rather than ours.</p>

      <h2 class="t-section">Who processes it for us</h2>
      <ul>
        <li><strong>${O.hosting}</strong> serves the site. Serving any
        website involves the host handling standard connection information,
        such as IP addresses, to deliver the page. That is governed by GitHub's
        own privacy statement; we do not receive or store it.</li>
        <li><strong>${O.chatHost}</strong> both hosts the chat service
        and runs the AI model that writes the answers to open chat questions,
        as described above. Catalogue questions never reach it at all.</li>
        <li><strong>${O.accountsProvider}</strong> holds account data,
        your email, login and wishlist, if you create an account. We do not run
        a server of our own. Row level security on that database means only
        you, signed in as yourself, can read or change your own account data;
        we cannot read your password, and no PriceSniffs code path ever asks
        for one.</li>
        <li><strong>Affiliate networks</strong> receive nothing from this site.
        Once you click a commissioned link, the network records that you came
        from here on its own or the shop's site. See the
        <a href="#" data-page="affiliate">affiliate disclosure</a>.</li>
      </ul>
      <p>We do not sell personal data, and we do not share it with anyone else
      except where the law requires it.</p>

      <h2 class="t-section">Our lawful basis</h2>
      <p>For replying to messages you send us we rely on legitimate interests,
      namely being able to answer you. For the chat we rely on legitimate
      interests too, namely answering the question you chose to ask; you are in
      control of whether to send anything at all. For account data, your email,
      login and wishlist, we rely on contract: creating and maintaining the
      account you asked for. Where anything not strictly necessary would be
      stored in your browser we rely on your consent, given by the action that
      asks for it, and you can withdraw it whenever you like by clearing it.</p>

      <h2 class="t-section">Cookies and storage</h2>
      <p>We set no cookies. What we do store in your browser, and when, is listed
      key by key on the <a href="#" data-page="cookies">cookies page</a>.</p>

      <h2 class="t-section">How long we keep it</h2>
      <p>Emails are kept only as long as we need them to deal with what you have
      asked, then deleted. Chat messages are not kept by us at all. We do not
      keep search history, browsing history or any other record of your visit,
      because we never receive one. Account data is kept for as long as your
      account exists, and deleted when you delete your account from the Account
      page or ask us to close it.</p>

      <h2 class="t-section">Your rights</h2>
      <p>You can ask for a copy of your data, ask us to correct or delete it,
      object to what we are doing with it, ask us to restrict it, or ask for it in
      a portable format. Write to
      <a href="mailto:${O.privacyEmail}">${O.privacyEmail}</a> and we
      will reply within one month.</p>
      <p>If you are unhappy with how we have handled your data you can complain to
      the Information Commissioner's Office at
      <a href="https://ico.org.uk" rel="noopener" target="_blank">ico.org.uk</a>
      or by calling 0303 123 1113. If you are in the EU or EEA, the rights above
      apply to you in the same way, and you may also complain to your own data
      protection authority.</p>

      <p class="meta">Last updated ${O.updated}.</p>`},{id:"cookies",title:"Cookies and storage",short:"Cookies",body:`
      <p>PriceSniffs sets no cookies. This page lists everything the site does
      store in your browser, exactly when it is written, and what third parties
      may set once you leave this site or ask for their content.</p>

      <h2 class="t-section">Why there is no cookie banner</h2>
      <p>UK rules, the Privacy and Electronic Communications Regulations, require
      consent before storing anything on your device that is not strictly
      necessary for a service you have asked for. Nothing below is written until
      you take the action that needs it: choosing a theme, sending a chat
      message, signing in. There is no analytics, no advertising and no tracking
      of any kind, so there is nothing a banner would be asking you to accept.
      If that ever changes, consent will be asked for before anything is set,
      not after.</p>

      <h2 class="t-section">What this site stores, key by key</h2>
      <dl class="biz-details">
        ${Ai.map(t=>`<div class="biz-row"><dt><code>${t.key}</code></dt><dd>${t.kind}, written ${t.when}. Holds ${t.holds}.</dd></div>`).join("")}
      </dl>
      <p>Local storage stays until you clear it. Session storage is discarded
      when the tab closes. None of it is readable by us or by anyone else; it
      lives in your browser and is read back only by this site on your device.</p>

      <h2 class="t-section">Third parties</h2>
      <ul>
        <li><strong>Trustpilot.</strong> A shop's page may offer a button to
        show that shop's Trustpilot rating. Nothing is fetched from Trustpilot
        until you press it. When you do, their widget loads from their servers
        and may set cookies of its own, under Trustpilot's policy.</li>
        <li><strong>Affiliate networks.</strong> Clicking a link marked
        Affiliate link takes you to the shop by way of the network, which may
        set a cookie on its own or the shop's site to match a purchase to us.
        That happens after you have left PriceSniffs and is governed by the
        network's and the shop's policies. See the
        <a href="#" data-page="affiliate">affiliate disclosure</a>.</li>
        <li><strong>${O.accountsProvider}.</strong> If you sign in, its
        library keeps your sign in token in local storage as listed above, so
        that you stay signed in. It is removed when you sign out.</li>
        <li><strong>The shops themselves.</strong> Product photographs load
        directly from each shop's own servers, so those servers see the ordinary
        request your browser makes for an image. We send no identifying
        referrer with it.</li>
      </ul>

      <h2 class="t-section">Clearing it</h2>
      <p>Signing out removes the sign in token. Pressing Clear in the chat
      removes the conversation. Everything else is cleared from your browser's
      own settings, under site data for pricesniffs.space, and the site keeps
      working without any of it.</p>

      <p class="meta">Last updated ${O.updated}.</p>`},{id:"refunds",title:"Refunds and returns",short:"Refunds",body:`
      <p>PriceSniffs does not sell anything, so there is nothing to refund or
      return here. Every purchase you make after clicking through is a contract
      between you and that shop, on that shop's terms, and it is the shop that
      takes your money, sends the parcel and handles any refund.</p>

      <h2 class="t-section">Where your rights actually lie</h2>
      <p>Your rights are against the seller and they come from UK consumer law,
      not from us. For most goods bought online from a UK business you can
      cancel within fourteen days of receiving them without giving a reason,
      under the Consumer Contracts Regulations 2013. That right can be lost for
      sealed goods that are unsealed after delivery for hygiene reasons, which a
      shop may apply to an opened fragrance, so check the shop's own returns
      policy before you open a bottle you may want to send back. Goods that are
      faulty, not as described or not fit for purpose are covered separately by
      the Consumer Rights Act 2015, which gives you a right to a refund, repair
      or replacement from the seller.</p>
      <p>Independent guidance on all of this is available from
      <a href="https://www.citizensadvice.org.uk" rel="noopener" target="_blank">Citizens Advice</a>.
      This page is a plain summary, not legal advice.</p>

      <h2 class="t-section">What we can and cannot do</h2>
      <p>We cannot process, arrange or chase a refund, because we are not party
      to the sale and never hold your money. What we can do is fix our side: if
      a price, delivery charge or stock figure shown here was wrong, tell us the
      fragrance, the bottle size, the shop and the figure you saw, and we will
      check it the same day. <a href="mailto:${O.email}">${O.email}</a></p>

      <h2 class="t-section">Prices can move</h2>
      <p>Prices are collected every few hours and can change between our check
      and your visit to the shop. Every listing shows when we last looked. The
      price you pay is the one on the shop's site at checkout, which is why we
      say on every page to check it there before you buy.</p>

      <p class="meta">Last updated ${O.updated}.</p>`},{id:"terms",title:"Terms of use",short:"Terms",body:`
      <p>Using PriceSniffs means accepting these terms.</p>

      <h2 class="t-section">Who runs this site</h2>
      ${ki()}

      <h2 class="t-section">What PriceSniffs is</h2>
      <p>PriceSniffs is an information service. We do not sell fragrance, hold stock,
      take payments or send parcels. Any purchase is a contract between you and
      the shop, on their terms. See our
      <a href="#" data-page="refunds">refunds and returns page</a> for where
      your rights as a buyer actually lie.</p>

      <h2 class="t-section">How accurate the prices are</h2>
      <p>We work hard to show accurate prices, but we collect them periodically
      and they can change at any moment. Postage costs and the order values needed
      for free delivery are modelled from the published terms of the
      ${ke.length} shops we fetch from, and may not capture every promotion,
      Highlands surcharge or basket rule.
      <strong>Always check the price on the shop's own site before you buy.</strong>
      Every listing carries the time we last looked, down to the minute.</p>
      <p>We are not liable for losses caused by a price, postage cost or stock
      figure being wrong or out of date, except where the law does not let us
      exclude liability. Nothing in these terms limits your statutory rights
      as a consumer.</p>

      <h2 class="t-section">Virtual Yanny</h2>
      <p>The chat answers from this site's own data and can still be wrong. It
      is not advice of any kind, and a price it quotes is only ever the price a
      listing on this site showed at the time. Check the listing, and then the
      shop, before relying on anything it says.</p>

      <h2 class="t-section">The shops we list</h2>
      <p>Appearing here is not an endorsement, and being absent is not a
      criticism. We list established UK shops. We do not inspect individual
      parcels and we cannot guarantee the authenticity of goods sold by anyone
      else.</p>

      <h2 class="t-section">Fair use</h2>
      <p>Please do not scrape the site, overload it, try to disrupt it, or copy
      substantial parts of it without asking us first.</p>

      <h2 class="t-section">Our content</h2>
      <p>The design, wording and data compilations belong to ${O.legalName}.
      Brand names, product names and trade marks belong to their owners and appear
      here only to identify products. Where we show a shop's or a house's logo, it
      is for the same reason and on the same terms: to say whose price or whose
      bottle you are looking at. We are not affiliated with, endorsed by or
      sponsored by any of them.</p>

      <h2 class="t-section">Product images</h2>
      <p>Every product image here is the retailer's or the brand's own
      photograph, loaded by your browser directly from their own servers. We do
      not copy, host, crop, recolour or otherwise alter any of them, and each
      one sits beside a link to buy that product from the shop it came from.</p>
      <p>Each image remains the property of whoever created it. We show them on
      one of three grounds, recorded per shop: that shop's affiliate terms
      permit it, or the picture comes from the brand's own shop, or we are
      linking to the shop's own image without a licence having been granted.
      Today ${sp.length} of the ${ns.length} shops whose
      photographs appear fall under the first two, and ${op.length}
      under the third. Where a shop has given us no image we can use, we show a
      plain marker saying so rather than substituting a picture of something
      else.</p>
      <p>If you are a retailer or brand and would rather we did not show your
      photography, tell us and we will stop for your shop.
      <a href="mailto:${O.email}">${O.email}</a></p>

      <h2 class="t-section">Logos</h2>
      <p>A shop's or a house's logo appears beside a link to them, to identify
      them. Most are loaded by your browser directly from that owner's own
      servers; a small number are files whose published licence puts them in
      the public domain, and those we host. We do not crop, recolour or
      otherwise alter any of them, and where we have no logo we can use we
      draw our own initials tile instead. Today ${ip} shops and houses
      carry a logo we show, ${cp} of them a file in the public domain
      that we host ourselves and the rest loaded directly from that owner's
      own site.</p>
      <p>If you would rather we did not show yours, tell us and we will stop.
      <a href="mailto:${O.email}">${O.email}</a></p>

      <h2 class="t-section">Changes and governing law</h2>
      <p>We may revise these terms, and the current version always sits here.
      These terms are governed by the law of England and Wales, and the courts
      of England and Wales have jurisdiction, without taking away any right you
      have as a consumer to bring a claim where you live.</p>

      <p class="meta">Last updated ${O.updated}.</p>`},{id:"contact",title:"Contact and feedback",short:"Contact",body:`
      <p>We would far rather hear about a wrong price than not hear about it. Send
      us the fragrance, the bottle size, the shop and the figure you saw on their
      site, and we will go and check it the same day.</p>

      <h2 class="t-section">Get in touch</h2>
      <p>One inbox for everything, wrong prices, feedback, privacy and data
      requests, and general questions: <a href="mailto:${O.email}">${O.email}</a></p>

      <h2 class="t-section">If you run a shop</h2>
      <p>Write to the address above if you want to be listed, corrected or
      removed, and we will come back to you.</p>

ry notes now say "Delivery not included" instead of the vaguer "Plus delivery"']},{version:"v3.16.0",date:"27 to 31 Aug 2026",title:"Honest bottle sizes, a sign-up fix, and more brands linked to their own sites",points:["When a bottle size can't be confirmed, the site now says so plainly instead of guessing at a number that could be wrong","Confirmed and added French Avenue's delivery charge for the first time","Resolved more disputes over a fragrance's concentration (EDP, EDT and so on) using the perfume house's own stated word instead of leaving them unclear","Connected 21 more brands to their own website, and untangled four that had been wrongly split apart","Fixed a broken email confirmation link during sign-up being silently ignored instead of telling you something went wrong"]},{version:"v3.15.0",date:"26 Aug 2026",title:"Fairer reference prices on deals, and cleaner duplicate listings",points:["A deal's reference price is now taken from the brand itself rather than from shops copying each other, and only shown as a saving when what other shops actually charge backs it up","The brand's own price is now shown alongside the lowest price found, colour-coded to show whether you're paying more or less","Fragrance notes are now read correctly from more of the ways shops describe them, including multi-word notes like Lily of the Valley that were being broken apart","Multiple listings for the exact same fragrance at one shop are now shown as a single entry instead of several a reader couldn't tell apart","The price history chart now explains plainly when there is nothing to show instead of leaving blank space, and only plots prices you could actually have paid at the time"]},{version:"v3.14.0",date:"25 Aug 2026",title:"Corrected brand names on the site, and a fairer check on deal prices",points:["Fixed three retailers' own shop names, and a generic default label, that were wrongly showing up as the fragrance brand","Connected 47 more brands to their own website, and marked the nine that don't have one","Fixed fragrance names in browsing and search grids being cut down to only the part every product on the page shared","Added scent notes for 524 more listings, read from information the shops had already published",`Stopped showing an inflated "was" price on a deal once what other shops are actually charging shows it isn't real`]},{version:"v3.13.0",date:"22 Aug 2026",title:"Every fragrance links out to its house and to Fragrantica, and duplicate brands merged",points:["Every fragrance page now links straight to the brand's own official site and to its Fragrantica page, instead of only offering that from the brand directory",'Merged 21 more pairs of brands that were showing twice purely from spelling \u2014 "Abercrombie & Fitch" beside "Abercrombie and Fitch", accented spellings beside unaccented ones \u2014 so a house always has one page','Armaf products now show their sub-line again (Club De Nuit, Derby, Delicacy and the rest), which had been lost when the 51 separate "Armaf - \u2026" entries were merged into the one real house',"Connected 26 more brands to their official website, and corrected 14 links that pointed at an international storefront when the house has a UK one","Zara now shows real prices rather than only appearing in listings",'Fixed two bugs that were throwing away fragrance notes the shops had already published \u2014 marketing copy mentioning "top notes" was being read instead of the real list, and mood words were being recorded as if they were notes','Browser tab titles are now consistent across the whole site: plain "PriceSniffs" on the home page, and "PriceSniffs: \u2026" everywhere else']},{version:"v3.12.0",date:"21 Aug 2026",title:"An honest note where a retailer has no Trustpilot rating hooked up",points:["Retailer pages with no Trustpilot rating connected now say so plainly, instead of just leaving that part of the page blank"]},{version:"v3.11.0",date:"20 Aug 2026",title:"Today's Deals gets its own tab, and four new retailers go live",points:["Today's Deals moved out of the Explore menu and into its own tab in the main navigation, between Home and Explore","Added a sort menu to search and browse results, including a way to sort by bottle size","Bottle size filtering now groups into five simple ranges instead of a separate option for every exact millilitre","Four more retailers went live: Avon, Riiffs Perfumes, Perfumeo and FragranceHub","Fixed several UK brand website links that were wrongly labelled as international, and connected 7 more brands to their official site"]},{version:"v3.10.0",date:"19 Aug 2026",title:"Product photos are back, and the price chart gets a range picker",points:["Photos are now showing for thousands of products that had none before \u2014 roughly half the catalogue was missing a picture the shop had actually published all along","Fixed two separate bugs that were splitting or wrongly merging listings for the same fragrance, including Swiss Arabian's Shaghaf Oud and Jimmy Choo's I Want Choo Le Parfum","The price history chart on a fragrance page can now be switched between this week, this month and this year, and starts from when that fragrance was first tracked instead of opening with empty space","Brand website links now say upfront whether they lead to a UK site or an international one","Skincare items like face and eye serums no longer show up mixed in with fragrances"]},{version:"v3.9.0",date:"18 Aug 2026",title:"Accounts and wishlists go live, and duplicate listings merged",points:["Accounts went live \u2014 sign up, verify your email, and save fragrances to a wishlist, built earlier and switched on now","Rewrote the privacy notice to honestly explain what creating an account involves, since it previously said flatly that there was no account to create","Found that one shop had been publishing its own internal stock numbers in the barcode field, which was wrongly stopping genuinely identical bottles at different shops from being shown as one product \u2014 around 50 duplicate listings are now merged, and 40 more products now show more than one shop's price","The Deals page no longer advertises a discount on a fragrance we have no real photo of; the same deal still appears everywhere else on the site"]},{version:"v3.8.0",date:"17 Aug 2026",title:"Fragrance pages now show up in search, and Virtual Yanny learns who a scent is for",points:["Fixed a bug that told search engines every one of the site's fragrance pages was a duplicate of the homepage, so none of them could be found on their own in a search result \u2014 each page now says clearly what it actually is",'A broken or outdated link now shows a proper "page not found" screen with a working search box, instead of silently showing the homepage as if nothing were wrong',"Added a skip-to-content link, a back-to-top button, a print-friendly layout for fragrance pages, and a working show/hide button on the password field when creating an account",'Virtual Yanny now understands "perfume oil" as a genuine strength rather than losing those listings, and no longer describes an ungraded fragrance as though "Not stated" were a real kind of perfume',"Virtual Yanny can now answer who a fragrance is marketed for \u2014 women's, men's or unisex \u2014 read from the product's own title, and says plainly how much of the catalogue actually states this rather than guessing at the rest"]},{version:"v3.7.0",date:"16 Aug 2026",title:"Virtual Yanny understands how people actually ask",points:['Virtual Yanny now answers plainly typed requests like "whats a good perfume for a man" or "something sweet" from the real catalogue, instead of falling back on a general reply',"Virtual Yanny now takes every part of a request into account at once, so asking for a perfume for a woman under \xA330 that smells sweet is answered on all three counts rather than on the price alone",'Everyday scent words like "sweet" now match the notes the catalogue really uses, instead of turning up almost nothing','Virtual Yanny now works out who a fragrance is for even when you do not spell it out with the word "for"','Budget wording like "30 quid" or "something \xA330ish" is now understood',"Added a stop button that genuinely cuts an answer off, in place of send while one is on its way","Your conversation now survives closing and reopening the chat and refreshing the page, with a Clear chat button for when you want it gone","Virtual Yanny no longer waits on its slowest source before replying, so one slow answer can no longer hold up the rest","Virtual Yanny starts waking up the moment you reach for the chat button, so there is less waiting after a quiet spell","Fixed suggestion questions being answered from the site's own pages instead of from real listings"]},{version:"v3.6.0",date:"15 Aug 2026",title:"Cleaner product names, and Escentual's real delivery cost",points:["Fixed the garbled accented characters still left in some product names, including several Herm\xE8s and Lanc\xF4me fragrances","Product names no longer show the bottle size twice, once in the name and again on the label beside it","Accented and corrupted text is now cleaned the moment a shop's data arrives, and everything already stored has been repaired too","Price checking can now ask a shop for its UK price list, rather than accepting whatever currency it happens to be offered","Corrected Escentual's delivery charge, which was more than a pound below what the shop's own delivery page states","Cleared Escentual's wrong-currency prices from our stored data again, after an automatic price update had quietly put back the ones removed on 13 August"]},{version:"v3.5.0",date:"14 Aug 2026",title:"Virtual Yanny learns to answer almost anything",points:["Virtual Yanny now answers stock, scent-note and bottle-size questions by reading the real catalogue instead of guessing","Virtual Yanny now answers delivery, deals, budget, comparison, brand and coverage questions the same way","Virtual Yanny's note-based suggestions now take your whole request into account instead of just the first scent note it spotted","Virtual Yanny now says plainly when it has nothing to go on, instead of recommending a fragrance that is not actually listed",'Improved how Virtual Yanny works out what you are actually asking, fixing cases like a plain "any discounts?" being misread']},{version:"v3.4.0",date:"13 Aug 2026",title:"Virtual Yanny goes live, two retailers taken offline over currency",points:["Virtual Yanny, a chatbot that can answer questions about the site, went live","Found that Escentual's entire price list was on the wrong scale \u2014 around 44% too high across the board \u2014 fixed the underlying bug, and took the shop offline until its real prices can be reconfirmed","Took Nicchia Luxury UK offline too, after being unable to establish that it actually charges in pounds",'Delivery costs that have never been verified are now clearly labelled as such, and a listing can no longer be shown as "Cheapest" when an unverified delivery figure is what decides it',"Fixed Virtual Yanny denying knowledge of a fragrance the site's own data clearly had","Sped up how quickly Virtual Yanny answers a straightforward price question","Made Virtual Yanny's suggestions read more naturally and stopped it repeating the same note recommendation more than once",`Removed Virtual Yanny's "pick a category first" buttons \u2014 it now works out what you are asking directly`,"Fixed Virtual Yanny showing raw matching percentages instead of a plain answer","Fixed products showing as sold out when other shops genuinely had them in stock","Fixed multi-bottle gift sets being priced as though they were a single small bottle","Fixed air fresheners and body sprays from certain ranges being listed alongside actual perfume","Fixed garbled accented characters appearing in some product names","Fixed duplicated wording on product cards, where a fragrance's own name repeated its brand, size and strength back at you","Fixed more scheduling bugs in the automatic price updates, so a run that times out no longer throws away prices it had already gathered"]},{version:"v3.3.0",date:"12 Aug 2026",title:"New look, and MyBeauty.Boutique's prices corrected",points:["Found that MyBeauty.Boutique's affiliate price feed had been showing wrong \u2014 usually too high \u2014 prices on most of its listings, and switched that shop over to reading its real prices straight from its own website","Refreshed the site's colours, backgrounds and shared building blocks \u2014 buttons, fields, tabs, section headings, filter chips \u2014 for a calmer, more consistent look across every page","Escentric Molecules is now a confirmed UK retailer with a real delivery charge, and confirmed delivery costs for two more retailers that had not been checked before","Fixed Middle Eastern-exclusive fragrances that were genuinely in stock and priced but were not appearing anywhere in the comparison","Fixed a bug where a retailer's own shop name was showing as the fragrance brand instead of the real brand, on Emirates Oud and Oud Arabian","Fixed three separate bugs that were quietly creating duplicate listings for the same fragrance","Fixed a bug that was dropping real products from the catalogue because of accented characters and corrupted text in retailer data feeds","Fixed Glorious Beauty's Buy buttons, which were pointing at a broken page on our own site instead of the retailer's","Top Deals Today no longer advertises a saving on something that is actually out of stock","The back button now returns you to where you actually came from, instead of always landing in the same place","Fixed retailer initials that were hard to read against their background colour in light mode","Corrected several outdated figures on the About page","Fixed a scheduling problem that was cutting some automatic price-update runs short before they finished"]},{version:"v3.2.0",date:"11 Aug 2026",title:"Emirates Oud live, honest delivery labelling, and a cleaner catalogue",points:["Emirates Oud is now fully live, with a confirmed standard delivery charge read from their own policy pages","Applied to join a wide batch of new UK retailer and brand partner programmes, several already added as placeholders ready to go live once approved, including a new confirmed partnership with Nicchia Luxury UK",'A handful of retailers whose exact delivery charge is not published are now shown with delivery clearly marked "not stated" rather than hidden entirely \u2014 and such a shop can never appear as the cheapest option, since that price is not the whole story','Fixed a bug where fragrance names starting with "Oud" \u2014 a very common word in Middle Eastern perfumery \u2014 were losing their first word and being mislabelled by concentration instead of by name',"Merged a wide batch of brands that were showing as separate entries purely from spelling differences (Al Haramain, Lattafa, Arabiyat, Kilian and more), so a brand page always shows everything from that house together","Cleaned up leftover junk fragments and duplicate spellings in the notes section","Sold-out products no longer show a shop name underneath them, since that shop is not actually where you would buy it",'Added an "In stock only" filter on retailer pages, and a combined "All Notes" view alongside the existing top/middle/base picker','Renamed Deals to "Top Deals Today", now refreshed on a fixed schedule a few times a day rather than reshuffling constantly, and now publishing right on the hour instead of running late',"Retailer and price data now refreshes on a real six-hourly cadence, after fixing a scheduling bug that was silently discarding a full hour of freshly gathered prices","Rewrote this update history itself in plain language instead of engineering shorthand","Price history now plots one point per day, with an unchanged price carried forward as a flat line instead of leaving a gap","Fixed the price history chart's dots so they stay perfectly round at any screen width, and added date labels along the bottom",`Added a proper "Available at" heading above current listings, matching the site's other section headings`]},{version:"v3.1.0",date:"6 Aug 2026",title:"Cleanup and correctness pass",points:["Improved brand matching, so common alternate names and abbreviations point to the same fragrance instead of splitting into duplicates","Re-checked and corrected a number of retailer links across the site","Tightened filtering so household products no longer show up alongside fragrances","Rewrote the legal pages in full, with no placeholder text remaining"]},{version:"v3.0.0",date:"4 to 5 Aug 2026",title:"Explore navigation, brands, and filters",points:["Added a proper Explore section: Brands, Deals, Retailers, Notes and Search","Added filters for size, concentration, price, type, sale status and stock \u2014 a filter only appears when it would actually return a result","Added a density control and more consistent card sizing for smoother browsing","Added a dedicated page for every brand and scent note, showing everywhere it is stocked and at what price","Brought on more retailers, widening geographic and brand coverage"]},{version:"v2.0.0",date:"3 Aug 2026",title:"PriceSniffs goes live",points:["Renamed from ScentDay to PriceSniffs, with a full visual redesign","Launched as an installable app \u2014 add it to your home screen on iOS or Android, no app store needed","Went live at pricesniffs.space","Set up automatic price updates that run around the clock","Started keeping an honest record of which product photos we actually have the right to show","Brought on our first live retail partners"]},{version:"v1.0.0",date:"1 Aug 2026",title:"First build: real prices, no invented numbers",points:["Built the price comparison engine and the first list of retailers from scratch","Tried several different ways of reading prices from each shop and kept whichever actually worked","Found that a lot of requests were being blocked before any content loaded, and worked out why","Replaced every placeholder figure with a real, checked one","Put limits in place to keep running costs predictable"]},{version:"v0.4.0",date:"2 Aug 2026",title:"Smarter, more resilient price checking",points:["Built a system that learns over time which method works best for each retailer","Added a fallback route for shops that block ordinary requests","Made sure an empty result never quietly looks the same as a broken one"]},{version:"v0.3.0",date:"1 to 2 Aug 2026",title:"First retail partnerships",points:["Joined an affiliate network and onboarded our first retail partners","Confirmed that partner pricing data comes from the retailer at no cost to readers \u2014 nothing is marked up","Moved away from reading pages directly wherever a retailer had not agreed to it","Started clearly labelling which retailers we do and do not yet have a live partnership with"]},{version:"v0.2.0",date:"1 Aug 2026",title:"An early, honest setback",points:["Tested the simplest possible approach against a dozen retailers","None of it worked \u2014 every request was blocked before any content loaded","Worked out why, and kept a record of it rather than papering over it","Realised the simple approach would never work against real, well-defended sites, and planned around that instead"]},{version:"v0.1.0",date:"1 Aug 2026",title:"Initial scaffold",points:["Built the first retailer list and price comparison layout","Set up the development and testing tools behind the site","Built a first demo page with placeholder data, before any prices were real","Started under the working name ScentDay, later renamed PriceSniffs"]}];var os=__psData(1),lp=__psData(2);function $i(t){return os[t]??[]}function Ri(t){return lp[t]??{reason:"never"}}function kt(t){return t.slice(0,10)}function Ci(t,e,r,n){let a=new Map,s=new Set;for(let f of t){let g=kt(f.at);if(f.priceGbp===null){s.add(g);continue}let m=a.get(g);(!m||f.priceGbp<m.priceGbp)&&a.set(g,{at:f.at, <script>
  // Offline shell only — see demo/sw.js for why the document fetch itself
  // stays network-first rather than served from this cache.
  //
  // Registered against the app's base, never the current URL. A visitor who
  // lands on /brands/lattafa is served this same document through 404.html,
  // and a bare 'sw.js' would resolve to /brands/sw.js, which the host answers
  // with that HTML fallback: registration then fails on the MIME type and the
  // offline shell never installs. Same derivation as basePath() in
  // demo/router.ts, which the bundle uses for routing; tests/serviceWorker
  // pins the two together. The scope is the base too, so the worker controls
  // every route rather than one subdirectory.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const path = location.pathname;
      const idx = path.indexOf('/index.html');
      const base = idx >= 0 ? path.slice(0, idx + 1) : '/';
      navigator.serviceWorker.register(base + 'sw.js', { scope: base });
    });
  }
</script>
