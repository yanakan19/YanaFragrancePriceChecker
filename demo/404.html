    .note-chip:hover { border-color: var(--accent); color: var(--accent); }
  }
  .note-chip.on { background: var(--accent-sf); border-color: var(--accent); color: var(--ink); }
  .note-chips-profile { margin-bottom: 12px; }
  .notes-none { font-size: 13.5px; color: var(--faint); margin: 0; }

  /* ── facets ────────────────────────────────────────────────────────────────
     The Filters toggle is one more cell in the .controls grid. Its panel
     opens underneath the row, full width: the browser's own dropdowns (the
     iPhone or Android picker on a phone, a plain menu on a computer) and
     checkboxes, one per facet. One per row on a phone, so a label such as
     "Eau de Parfum (EDP) (10,158)" is never clipped; as many as fit across a
     computer screen. It replaced a panel of one-tap pills, 17 to 30 of them
     stacked one per line, that ran to 950-1,500px on a phone. */
  .facets-toggle { position: relative; text-align: left; }
  .facets-toggle[aria-expanded="true"] { border-color: var(--ink-2); }
  .facets-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; margin-left: 2px;
    background: var(--accent); color: var(--accent-on);
    font-size: 11px; font-weight: 700; border-radius: 999px;
  }
  .facets-panel { display: flex; flex-direction: column; gap: 10px; margin: -6px 0 18px; }
  .facet-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 8px;
  }
  .facet-check { gap: 10px; }
  .facet-check input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
  .facet-check-label { flex: 1 1 auto; min-width: 0; }
  .facet-count { color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  .facets-clear { align-self: flex-start; }
  /* Why the panel carries a sentence about gender at all: the reading is
     derived from wording in a product's title, and most titles say nothing,
     so "Not stated" is by far the biggest option. Said plainly, once. */
  .facet-note { margin: 0; max-width: 60ch; }
  .notes-source { margin: 10px 0 0; }
  /* Same icon-then-label shape as .footer-link below, at the notes block's own
     caption size rather than the footer's fixed one, so "As published by X"
     reads as a quiet in-place link rather than a separate control. */
  .notes-source-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: inherit; text-decoration: none; font: inherit;
  }
  .notes-source-link .notes-source-ico { display: inline-flex; }
  .notes-source-link .notes-source-ico .ico { width: 12px; height: 12px; }
  .notes-source-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .notes-source-link:hover { color: var(--accent); }
  }

  /* ── full search ───────────────────────────────────────────────────────── */
  .search-big {
    display: flex; align-items: center; gap: 9px; margin: 4px 0 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 0 13px;
  }
  .search-big:focus-within { border-color: var(--accent); }
  /* The handoff pairs this field with a floating suggestion panel, squaring
     the field's bottom corners (12px 12px 0 0) against the panel's top ones
     while it is open. This app has no such panel: typing filters the results
     grid below in place rather than dropping a list over it, so the field
     keeps all four corners and there is nothing for it to join onto. */
  .search-big .ico { color: var(--faint); flex: none; width: 19px; height: 19px; }
  .search-big input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
    background: none; border: 0; padding: 12px 0; -webkit-appearance: none;
  }
  .search-big input:focus-visible { outline: none; }

  /* ── detail ────────────────────────────────────────────────────────────── */
  /* Link rank, at the top of every leaf page. */
  .back {
    display: inline-flex; align-items: center;
    background: none; border: 0; padding: 8px 6px 8px 0; margin-left: -6px;
    cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--accent-ink);
  }
  .back::before { content: "‹"; margin-right: 6px; font-size: 18px; line-height: 1; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .hero { padding: 6px 0 24px; border-bottom: 1px solid var(--line); }
  /* The art sits centred in its own band; the heading below it keeps the same
     left/right split as everywhere else so the product reads consistently. */
  .hero-art { display: flex; justify-content: center; margin-bottom: 16px; }
  /* Only the clamp is the hero's own: the name carries .t-page there and the
     brand and meta carry .t-eyebrow and .t-caption, same as everywhere else. */
  .hero .phead-name { -webkit-line-clamp: 3; }
  .hero-blurb { font-size: 13.5px; color: var(--faint); margin: 9px auto 0; max-width: 32ch; }

  /* Module 7: save a fragrance. Outline heart, unfilled, until .on — never
     shown at all unless accounts are actually configured, see its own
     comment in app.ts. */
  /* Secondary rank: saving is a real action, but it is never what the page
     is for -- that is the price below it. */
  .wishlist-toggle {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    margin: 12px auto 0; padding: 8px 18px;
    border-radius: 12px; border: 1px solid var(--line-firm);
    background: var(--surface-2); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .wishlist-toggle .ico { width: 16px; height: 16px; }
  .wishlist-toggle.on {
    border-color: var(--accent); color: var(--accent); background: var(--accent-sf);
  }
  .wishlist-toggle.on .ico { fill: var(--accent); }
  .wishlist-toggle:active { transform: scale(.96); }
  .wishlist-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wishlist-toggle[disabled] { opacity: .6; cursor: default; }

  /* The one number on the page a reader actually needs, in its own card so
     it cannot be mistaken for just another line of text. The 30px accent
     glow this used to carry is gone: elevation on this site is --shadow-lift,
     which is a real shadow in the light theme and a hairline in the dark one,
     and a bloom no other surface has was the box shouting on top of already
     being the largest type on the page.

     Two boxes now, where there was one: the manufacturer's price on the left
     and the lowest price here on the right, which is the argument this site
     exists to make, made in one glance. See priceBoxRow() in demo/app.ts for
     which of them renders when.

     The row is a flex line and not a two-column grid precisely because the
     left box is usually absent — only 874 of 14,836 products have a house
     price to show. With one child, `justify-content: center` plus the 280px
     cap below leaves the lowest-price box exactly where and how wide it was
     before this change; with two, they share the line. A grid would have had
     to be told about both cases. */
  .price-boxes {
    display: flex; justify-content: center; align-items: stretch;
    gap: 10px; margin: 18px 0 0;
  }
  /* `flex: 1 1 0` on both — equal width, not the 4:5 split this used to be
     (2026-08-26, owner's instruction: the two boxes disagreed on width and on
     their hero number's size, and both were asked to stop). The old split
     gave the wider column to whichever box carried the longer content, which
     was almost always the right one (a shop name beats a fixed four-letter
     label), but "the argument this site exists to make, made in one glance"
     reads as one argument, not a left box and a bigger right one — see the
     comment atop `.price-boxes`. Equal width moves the job of fitting a long
     shop name entirely onto `.price-box-from`'s own sizing below, since the
     column can no longer be widened to make room for one.
     min-width: 0 because a flex item's default `min-width: auto` refuses to
     shrink below its longest word, which is how a long shop name would push
     this row past the viewport. Side padding tightened from 20px to 8px for
     the same reason — every pixel not spent on padding is a pixel
     `.price-box-from` can use — and, unlike the old 430px-only tightening,
     applied at every width: the box is narrower than it used to be
     everywhere now, not just on a phone. */
  .price-box {
    flex: 1 1 0; min-width: 0; max-width: 280px;
    padding: 16px 8px 17px;
    border-radius: 16px; border: 1px solid var(--accent);
    background: var(--accent-sf);
  }
  .price-box-label { margin: 0; color: var(--accent-ink); }
  .price-box-amount { margin: 6px 0 0; color: var(--accent-ink); }
  .price-box-from { margin: 5px 0 0; color: var(--ink-2); }
  /* Green for the number a reader is meant to act on. --ok is already this
     app's "a saving, in stock, new" colour (.off, .now.sale, .tag.new), so
     this is the palette's existing meaning applied to the biggest instance of
     it rather than a new colour language; --ok-sf is its ground, measured in
     the palette block at the top of this file. Red stays on the left box
     because red here is the brand accent and never means "bad" — the note at
     the top of this file. */
  .price-box--best { border-color: var(--ok); background: var(--ok-sf); }
  .price-box--best .price-box-label,
  .price-box--best .price-box-amount { color: var(--ok); }
  /* `.price-box-caveat` lived here until 2026-08-26: the "too close to call"
     line, inside the box, under the number it qualified. The line is no longer
     rendered (owner's instruction — see lowestPriceBox in demo/app.ts), so the
     rule is gone with it rather than left behind matching nothing. The rule it
     described is still enforced, in the label above the number: "Lowest total
     price" instead of "Cheapest price" whenever the verdict is undecided. */
  /* Paired sizing. Until 2026-08-26 only the green box's number ever moved —
     34px alone, 28px beside an MSRP box — while the MSRP figure sat at
     `.t-price`'s own 20px the entire time, so the pair disagreed about how
     big their own headline number was even after the 28px step existed to
     make them agree on everything else. Now both step down together, to the
     same 24px, whenever a house figure is on the page.
     `.price-box--msrp .price-box-amount` needs no sibling combinator on that
     side: `houseCeilingBox()` returns nothing at all when there is no
     `houseCeiling` (demo/app.ts), so this class only ever exists already
     paired with the green box.

     Measured in Chromium, paired, each box is 160px wide (158px of
     `clientWidth`, 142px of content once the padding above is subtracted) at
     360px — narrower than the 173px/171px/155px this row gets at 1280px and
     1440px. That is the one place the old comment's "desktop is always
     tightest" claim needed re-checking rather than repeating: pinning .hero
     at 380px still makes desktop tighter than 768px or 390px, exactly as
     before, but a 360px phone turns out tighter still, by 13px of content,
     so the figures below are taken there rather than assumed from the
     desktop case alone. --font-num is monospace; the widest figure either
     box ever has to show is £745.00, the highest price this catalogue has
     ever presented as a "lowest price" (£220.00, Al Haramain Sheikh for Men,
     is the widest house figure, and renders identically — same seven
     characters). Cloned into a detached `.price-box-amount` at 24px and
     measured directly rather than scaled from the old 28px figure: 81.5px,
     against 142px of content at 360px. That leaves 60.5px to spare — room
     for a five-figure price before anything overflows.

     No stacking at any width. Stacked, the MSRP sits above the lowest price
     and reads as the headline figure, which is the one thing this arrangement
     must never say. */
  .price-box--msrp .price-box-amount,
  .price-box--msrp + .price-box--best .price-box-amount { font-size: 24px; }
  /* Nowrap always: a shop name is the one thing on this page that cannot be
     truncated or ellipsised — a reader has to be able to read which shop it
     is — so "from <shop>" and "Brand's Current Price" are guaranteed one
     line rather than merely observed to fit today's roster. Harmless when
     the green box is alone (up to 280px, the far more common case: 13,962 of
     14,836 products carry no houseCeiling — see houseCeilingBox), where
     `.t-caption`'s ordinary 13px already clears even the longest name with
     room to spare; the size step below only fires once the box is squeezed
     down to share the row with an MSRP box.

     That step: font-size 9.5px, sibling-scoped the same way the amount rule
     above is, and for the same reason (`.price-box--msrp` only exists
     paired). Measured in Chromium against "from The Fragrance Counter" (26
     characters — the longest "from <shop>" the 79-shop registry can
     produce, whether or not that shop is enabled today) at 9.5px: 131.7px of
     actual text, against the same 142px of content the amount figures above
     were measured at — the tightest column this row ever gets — leaving
     10.3px to spare. 11px, tried first, measures 152.8px however wide the
     column is (text width is a function of font-size alone) — 10.8px short
     of that same 142px.

     Deliberately not the class the "delivery not stated" caption carries:
     that branch of lowestPriceBox() is a full sentence explaining an
     absence, not a name, and squeezing a string four times as long onto one
     line would mean a size too small to read for a far less urgent fact. It
     keeps `.price-box-from`'s ordinary wrap; only the two single-line
     captions (`houseCeilingBox`'s, and lowestPriceBox's delivered-price
     branch) carry `--fit` — see demo/app.ts. */
  .price-box-from--fit { white-space: nowrap; }
  .price-box--msrp .price-box-from--fit,
  .price-box--msrp + .price-box--best .price-box-from--fit { font-size: 9.5px; }
  /* Smallest phones still in circulation (iPhone 13 mini is 375px) and, per
     the measurement above, the actual tightest case for this row — the gap
     still gives here on top of the tighter padding both boxes now carry at
     every width. */
  @media (max-width: 430px) {
    .price-boxes { gap: 8px; }
  }

  .hero-price.none { font-size: 19px; font-weight: 600; color: var(--ink-2); letter-spacing: -.01em; margin: 18px 0 0; }

  /* "Available at (N shops)" on the left, the freshness caption on the right —
     merged from two lines into one (owner's instruction, 2026-08-27; the second
     line used to carry the shop count and caption alone, under its own
     standalone "Available at" heading).

     `flex-wrap: wrap` rather than `nowrap`, which was tried first and measured
     worse: the two texts fought for the same line and each one wrapped
     internally, landing "AVAILABLE AT" itself mid-word beside a caption broken
     into three ragged fragments. `wrap` instead drops the caption to its own
     line as a whole — space-between still pins it to the right when it fits on
     the shared line, and to the left, alone, when it drops to its own.

     What that rule has to cope with changed on 2026-09-01, when the caption
     went from "delivery included where the shop states it, checked Xh ago" to
     "Updated Xh ago" (see detailView in demo/app.ts for why the dropped clause
     is not information lost). Re-measured off the live DOM at that date
     (Chromium 141, `white-space: nowrap`, no other text competing): the label
     still never exceeds 172.8px ("Available at (8 shops)", the most shops any
     product in the registry carries — see build-demo-catalogue.ts), but the
     caption fell from 386.9px to 111.1px, and stays 111.1px in its longest
     "Updated 30d ago" form. Both side by side now need ~294px including the
     10px column-gap, against the 358px `.detail-offers` measures at a 390px
     viewport and 328px at 360px — so the row that could never share one line
     on a phone now does at every width from 360 up, and only wraps at 320.
     `wrap` is kept exactly as it was: it is what makes 320 degrade instead of
     overflow. Neither shape overflows the viewport at any width measured (a
     wrapped line only grows the row's height, never its width). See
     priceBoxRow's own note for why the caption is dropped to nothing rather
     than reading "0 shops" when there is nothing to be available at. */
  .results-head {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
    row-gap: 4px; column-gap: 10px;
    padding: 18px 2px 8px;
  }
  .results-head .dim { color: var(--faint); }

  /* Every row carries the left edge in transparent, so marking the cheapest
     one recolours two pixels and moves nothing. */
  .offer {
    border-bottom: 1px solid var(--line);
    border-left: 2px solid transparent;
  }
  .offer.best { border-left-color: var(--accent); }
  .offers .offer:last-child { border-bottom: 0; }
  /* No row gap: the shop name and the stock line are one statement about one
     shop and were reading as two, which the price's own second line only made
     worse. The countdown, when there is one, is a separate statement and keeps
     its space via the adjacent-sibling rule below. */
  .offer-link {
    display: flex; flex-direction: column; gap: 3px;
    padding: 14px 10px; text-decoration: none; color: inherit;
  }
  .offer-bot + .offer-bot { margin-top: 4px; }
  .offer-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .offer-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  /* Tinted, not filled: the accent left edge already marks this row, and a
     solid red block beside it made the same point twice and outshouted the
     price it was pointing at. */
  .tag {
    margin-left: 8px; vertical-align: 1px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--accent-ink); background: var(--accent-sf); border-radius: 4px; padding: 2px 6px;
  }
  /* "Lowest total" / "Lowest item price": the leading row, on figures that do
     not settle the question. Neutral ink on a plain surface, so it cannot be
     mistaken at a glance for the accent-coloured "Cheapest" it replaces —
     that swap is the entire point, and a tag that looked the same would undo
     it. */
  .tag.unsure { background: var(--surface-2); color: var(--ink-2); }
  /* The point-of-click affiliate marker: quiet, outlined, never the accent
     colour — it is a disclosure, not a badge of merit. */
  .tag.affiliate { background: transparent; color: var(--ink-2); border: 1px solid var(--line-firm); }
  /* `flex-wrap: wrap` lets the struck-through RRP drop above the price instead
     of forcing the row wider than the viewport. `white-space: nowrap` keeps
     each figure whole, so before this the only way a row could fit was for
     .offer-top to grow, and at 320px a shop name with no break opportunity in
     it plus an RRP plus a price simply did not: Zimaya Royal Paragon's
     MyBeauty.Boutique row (an RRP £34.99 beside £24.98) pushed the document's
     scrollWidth to 352 against a 320 clientWidth. MyBeauty.Boutique is the
     unbreakable name the catalogue happens to contain, and .del-note's own
     note above already records it as the case that pushes this row hardest.
     Wrapping is the honest fix: the RRP is the least important figure in the
     group, so it is the one that should move. `justify-content: flex-end`
     keeps both lines on the right edge .now and .del-note already share. On
     any width where the row fits — every viewport from 360 up, measured — no
     wrap happens and nothing about the row changes. */
  .price {
    display: flex; flex-wrap: wrap; justify-content: flex-end;
    align-items: baseline; gap: 8px; white-space: nowrap;
  }
  .was { font-size: 12.5px; color: var(--faint); text-decoration: line-through; font-variant-numeric: tabular-nums; }
  /* .now is a flex item of .price, which blockifies it (a flex item is always
     laid out as a block box, whatever display it was given) and sizes it to
     its own widest line — here, almost always .del-note's, since the note
     text is normally wider than the price digits above it. .del-note is
     right-aligned within that box (see below), but the price digits are a
     plain text node with no alignment of their own, so — absent this rule —
     they sat flush with .now's *left* edge while the note sat flush with its
     right, on a box wider than either line: two prices reading as one
     misaligned column. Measured (Chromium 141, scripts/screenshot.ts) on
     /fragrance/ean-6085010044712 at 1280/1440/1920/390/360: every row now has
     its price and its note sharing one right edge (e.g. Perfume Click's
     "£26.75" and "Includes £2.95 delivery" both end at x=364.0 at 390px);
     before this rule the price sat 15-80px short of that edge depending on
     how much shorter the price text was than the note beside it. */
  .now { text-align: right; }
  /* The house-anchored comparison (demo/app.ts's offerRow, houseAnchorFor) is
     never this shop's own claim, so it is never struck through the way a
     genuine "was" price is — a line-through on a figure the shop never stated
     would read as its own former price, exactly the misattribution this
     exists to avoid. A dotted underline says "reference point" without
     saying "this shop's own history".

     Only .off.anchor is left here. The row's .was.anchor ("£37.99 at Armaf")
     was removed on 2026-08-26 at the owner's request, leaving .price with a
     single child on every row that carries an anchor — which the flex rule
     above already handles, since one item in a flex row simply sits at its
     start and the gap has nothing to apply to. The percentage keeps the
     dotted underline for the same reason it always had it: it is still a
     comparison against a figure this shop never published. */
  .off.anchor { text-decoration: none; border-bottom: 1px dotted var(--faint); padding-bottom: 1px; }
  .now.sale { color: var(--ok); }

  .offer-bot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sep { margin: 0 5px; color: var(--faint); }
  /* The row's second line: what the price contains on the left, how it
     compares on the right (offerRow in demo/app.ts). The comparison never
     shrinks or wraps; the facts wrap instead. */
  .offer-bot .facts { min-width: 0; }
  .offer-bot .facts > span { white-space: nowrap; }
  .offer-bot .off { flex: 0 0 auto; }
  .off { font-size: 11.5px; font-weight: 700; color: var(--ok); white-space: nowrap; }
  /* A shop charging more than the house's own price. Same sentence, same
     figure, opposite direction — so it must not arrive in the saving colour.
     --warn is the ink this stylesheet already uses for "there is something
     here you would not want to miss" (.del-note.excl, .ends) rather than for
     an error, which is exactly the weight this claim carries: it is a fact
     about the price, not a fault. Never --ok, and never green-on-green with
     `.now.sale`, which offerRow withholds from these rows for the same
     reason. */
  .off.over { color: var(--warn); }
  .ends { font-size: 11.5px; color: var(--warn); font-weight: 500; }

  /* Sold out reads as sold out by dropping to --faint, not by fading the
     whole row: opacity on text that is already the quietest ink on the page
     is how a row stops clearing AA. The price goes quiet with it, since it
     is not a price anyone can act on. */
  .offer.unavail .shop, .offer.unavail .now, .offer.unavail .was { color: var(--faint); }
  .offer.unavail .now { font-weight: 600; }
  /* The shops with no listing at all for this fragrance, not even a sold out
     one, as one wrapping line of names (unavailableShopsLine in demo/app.ts).
     This replaced `.offer.unavail-elsewhere`, which gave each of those shops a
     full offer row: 50-plus rows of name-and-a-dash, in the same furniture as
     the real offers above, to say nothing at all about a price.

     Deliberately quieter than .unavail above, which is the same distinction
     the old rows made: a sold out shop is at least confirmed to carry the
     bottle, one of these has never been seen selling it. line-height 1.7
     because this paragraph is a list of link targets and not prose — the
     extra leading is what keeps two wrapped lines of underlined names from
     reading as one block. */
  .unavail-shops {
    margin: 0; color: var(--faint); line-height: 1.7;
  }
  /* Underlined rather than coloured: --faint on --accent would fail contrast,
     and colouring these would make a shop that does not stock the bottle the
     most eye-catching thing under the chart. The underline says "link", the
     ink says "not the point of this page".

     A `<button>` since 2026-08-26 (it now routes to the shop's own retailer
     page rather than out to its homepage — see unavailableShopsLine in
     demo/app.ts), reset back to the plain underlined-text look the old `<a>`
     had: left un-reset, a browser's own button chrome (border, background,
     padding) would turn this comma-separated line into a row of grey boxes. */
  .unavail-shop {
    background: none; border: 0; padding: 0; margin: 0; font: inherit;
    cursor: pointer;
    color: inherit; text-decoration: underline;
    text-decoration-color: var(--line-firm); text-underline-offset: 2px;
  }
  .unavail-shop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .unavail-shop:hover { color: var(--ink-2); text-decoration-color: currentColor; }
  }
  /* A shop with no retailer page to send a reader to (no live offer anywhere
     in the catalogue, or disabled outright) — plain text among the linked
     names rather than a button that would open an empty "0 fragrances here"
     page. Same ink as the rest of the line; the missing underline is the
     only thing that tells the two apart. */
  .unavail-shop-plain { color: inherit; }

  .gone-head {
    margin: 32px 0 16px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  /* "Available at" leads .detail-offers with nothing above it in that
     column — the separator line and the gap it implies both belong between
     two sections, not floating above the first one. Still true now that
     "Available at" shares its element with .results-head (see that rule's
     own comment): the merged row is the same first child the standalone
     heading used to be. */
  .detail-offers > .gone-head:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  /* Why a group of shops is listed at all, where the heading alone would
     otherwise read as a claim about availability. */
  .group-note {
    margin: 7px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--faint);
  }

  /* ── price history chart ───────────────────────────────────────────────── */
  .history-block { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); }
  /* Heading and range control share a row, control to the right on a wide
     card and wrapping under the heading when there is no room for both. */
  .history-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
  }
  .history-head > .gone-head { margin: 0; padding: 0; border: 0; }
  .history-scopes { display: flex; gap: 4px; }
  .history-scope {
    font: inherit; font-size: 12px; line-height: 1;
    padding: 5px 9px; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--ink-2);
    border: 1px solid var(--line);
  }
  .history-scope:hover:not([disabled]) { border-color: var(--accent); color: var(--ink); }
  .history-scope.is-on {
    background: var(--accent-sf); border-color: var(--accent); color: var(--accent);
    font-weight: 600;
  }
  /* A range this fragrance has too little data to draw is shown and refused,
     rather than hidden — a missing "This week" reads as a bug, a greyed one
     reads as an answer. */
  .history-scope[disabled] { opacity: .4; cursor: not-allowed; }
  /* What sits under the "Price history" heading when there are not two real
     prices to draw a line between (see priceHistoryGapMessage in
     src/services/priceHistoryGaps.ts for the three sentences this shows).
     Same size and colour as .notes-none, the other "we do not have that"
     sentence on this page, so a reader who has seen one recognises the other. */
  .history-empty { font-size: 13.5px; color: var(--faint); margin: 8px 0 0; line-height: 1.5; }
  .history-chart { position: relative; margin-top: 10px; }
  .history-svg { width: 100%; height: 160px; display: block; overflow: visible; }
  /* --chart-band carries its own alpha, so no opacity multiplier: the fill
     under the live line is a named chart token rather than the accent
     surface dimmed by half, which drifted whenever accent-sf moved. */
  .history-area { fill: var(--chart-band); opacity: 1; stroke: none; }
  .history-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  /* HTML buttons laid over the svg, not shapes inside it — see
     priceHistoryChart's own comment for why: the svg stretches non-uniformly
     to fill the card, which warps an SVG circle's fill into an ellipse the
     moment its aspect ratio departs from the viewBox's. A fixed-pixel-sized
     div with border-radius: 50% has no such dependency and stays perfectly
     round at any chart width. */
  .history-dot {
    position: absolute; transform: translate(-50%, -50%);
    width: 8px; height: 8px; border-radius: 50%; padding: 0;
    background: var(--bg); border: 2px solid var(--accent); cursor: pointer;
    outline: none; transition: width .12s ease, height .12s ease; z-index: 2;
  }
  .history-dot:hover, .history-dot:focus-visible { width: 13px; height: 13px; background: var(--accent); }
  /* The live/current price point. Pulses to read as "this one is now", the
     rest of the line as settled history — purely additive, never the only
     way the current point is distinguishable (it is also simply the last,
     rightmost, largest dot). Respects the app-wide reduced-motion rule at
     the bottom of this file, which strips all animation outright. */
  .history-dot-last { width: 11px; height: 11px; background: var(--accent); }
  .history-dot-live { animation: history-pulse 1.8s ease-in-out infinite; }
  /* A day with no price at all. Grey rather than accent, and smaller, so a
     run of them reads as the absence it is and never competes with the real
     line — the colour is the whole signal here, so it also says "No price
     recorded" in its tooltip and its aria-label rather than relying on hue
     alone, which a colour-blind or monochrome reader would lose. Sits on the
     chart floor; that is a position, not a price of zero. */
  .history-dot-nodata { width: 7px; height: 7px; border-color: var(--faint); opacity: .55; }
  .history-dot-nodata:hover, .history-dot-nodata:focus-visible {
    width: 11px; height: 11px; background: var(--faint); opacity: 1;
  }
  @keyframes history-pulse {
    0%, 100% { width: 11px; height: 11px; opacity: 1; }
    50% { width: 15px; height: 15px; opacity: .65; }
  }
  .history-tip {
    position: absolute; z-index: 5; pointer-events: none;
    background: var(--surface-2); border: 1px solid var(--line-firm);
    border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.4;
    box-shadow: var(--shadow); white-space: nowrap;
    /* Horizontal position is set directly as `left` in JS (clamped to the
       chart's own bounds — see positionHistoryTip), not centred by transform:
       a dot at either edge of the chart needs the tip to stay put rather than
       overflow. Only the vertical lift above the dot stays a transform. */
    transform: translateY(calc(-100% - 12px));
  }
  .history-tip b { color: var(--ink); font-size: 13px; }
  .history-tip span { display: block; color: var(--faint); }
  /* One label per sampled day, positioned the same way the dots above it
     are — percent left, matched to the same xPct so a label always sits
     directly under the day it names. */
  .history-xaxis { position: relative; height: 16px; margin-top: 4px; }
  .history-xlabel {
    position: absolute; top: 0; transform: translateX(-50%);
    font: 400 11px/1.4 var(--font-num); font-variant-numeric: tabular-nums;
    color: var(--faint); white-space: nowrap;
  }
  /* The first and last labels sit on the chart's own edges, so centring them
     hung half of each outside it and made the page wider than a phone. */
  .history-xlabel:first-child { transform: none; }
  .history-xlabel:last-child:not(:first-child) { transform: translateX(-100%); }

  /* ── settings and documents ────────────────────────────────────────────── */
  /* The not-found view's escape routes. A row that wraps rather than a
     three-up grid, because there are four of them and the count is the count. */
  .notfound-links {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0;
  }
  .doc { padding: 4px 0 8px; }
  .doc h1 { margin: 8px 0 16px; }
  /* Business details and the storage-key list: a definition list laid out
     as label / value rows, stacking on narrow screens. */
  .biz-details { margin: 0 0 12px; display: grid; gap: 10px; }
  .biz-row { display: grid; grid-template-columns: 12em 1fr; gap: 6px 14px; align-items: baseline; }
  .biz-row dt { color: var(--faint); font-size: 13px; }
  .biz-row dd { margin: 0; }
  .biz-row code { font-size: 12.5px; overflow-wrap: anywhere; }
  @media (max-width: 560px) { .biz-row { grid-template-columns: 1fr; gap: 2px; } }
  .doc h2 { margin: 24px 0 7px; }
  .doc p, .doc li { font-size: 14px; color: var(--ink-2); line-height: 1.62; }
  .doc p { margin: 0 0 11px; }
  .doc ul { margin: 0 0 11px; padding-left: 20px; }
  .doc li { margin-bottom: 6px; }
  .doc a { color: var(--accent); }
  .doc strong { color: var(--ink); font-weight: 650; }
  .doc .meta { font-size: 12.5px; color: var(--faint); margin-top: 22px; }
  /* Bordered all the way round rather than striped down one edge. A left bar
     is the standard callout decoration and it also carries its meaning in
     colour alone; a full border in the same colour states it once, on the
     whole element, the way the box actually is a distinct thing. */
  .doc .draft {
    background: var(--surface); border: 1px solid var(--warn);
    padding: 12px 14px; border-radius: 9px; font-size: 13px;
  }
  .doc .draft strong { color: var(--warn); }

  /* Settings content sits centred in the available height on both layouts,
     rather than pinned to the top, but never fights scrolling: min-height
     only asks for the space, it never clips content taller than the
     viewport. */
  .settings-doc {
    display: flex; flex-direction: column; align-items: center;
    min-height: calc(100vh - 220px); justify-content: center; text-align: center;
  }
  .settings-doc h1 { align-self: center; }
  .settings-doc h2, .settings-doc .foot-links, .settings-doc .foot-legal { align-self: stretch; }

  .seg-group { width: 100%; max-width: 360px; margin-top: 14px; }
  .seg-label { margin: 0 0 6px; text-align: left; }
  .seg {
    display: flex; background: var(--surface); border: 1px solid var(--line);
    border-radius: 11px; padding: 3px; gap: 3px;
  }
  .seg-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 6px; border: 0; border-radius: 8px; cursor: pointer;
    background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2);
  }
  /* Same "you are here" as the two tab rows: --ink text over a 2px --accent
     edge. Inset rather than a border so the segment keeps its own radius and
     nothing in the track moves as the selection changes. */
  .seg-btn.on {
    background: var(--surface-2); color: var(--ink);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg-btn:active { transform: scale(.97); }
  .seg-icon svg { display: block; }

  .settings-note { margin: 12px 0 0; text-align: center; }

  .contact-form {
    width: 100%; max-width: 360px; margin-top: 12px;
    display: flex; flex-direction: column; gap: 12px; text-align: left;
  }
  /* The label above a field is a caption; the field's own text is the one
     16px field size. */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font: 400 13px/1.4 var(--font-sans); color: var(--ink-2); }
  .field select, .field textarea, .field input {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; resize: vertical;
  }
  .field select:focus-visible, .field textarea:focus-visible, .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* Primary rank, and the only one on the page. */
  .contact-send {
    align-self: flex-start; display: inline-flex; align-items: center;
    background: var(--accent); color: var(--accent-on);
    border: 1px solid var(--accent); border-radius: 12px; padding: 10px 20px;
    font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .contact-send:hover, .contact-send:active {
    background: var(--accent-press); border-color: var(--accent-press);
  }
  .contact-send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The one-line privacy note under each form and at sign up. */
  .form-privacy { margin: 8px 0 0; color: var(--faint); line-height: 1.5; }
  .form-privacy .link-btn { font: inherit; }
  .contact-confirm {
    width: 100%; max-width: 360px; margin-top: 10px; font-size: 12.5px; color: var(--ok); text-align: left;
  }

  /* ── account (Module 7) ────────────────────────────────────────────────── */
  .account-note {
    width: 100%; max-width: 360px; margin: 8px 0 14px; font-size: 13.5px;
    color: var(--ink-2); text-align: left;
  }
  /* The Settings entry point into /account — no top bar slot for it yet, see
     the entry row's own comment in app.ts. */
  .account-entry {
    display: flex; align-items: center; gap: 9px;
    width: 100%; max-width: 360px; margin-bottom: 18px; padding: 11px 14px;
    text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    transition: border-color .15s ease;
  }
  .account-entry svg { margin-left: auto; color: var(--faint); flex: none; width: 18px; height: 18px; }
  @media (hover: hover) {
    .account-entry:hover { border-color: var(--accent); }
  }
  .account-entry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* One tap straight to the profile. These used to be <details> that expanded
     to reveal a link which then opened a new tab — two interactions and a lost
     tab to reach a page the reader had already asked for. */
  .social {
    display: flex; align-items: center; gap: 9px;
    width: 100%; max-width: 360px; margin-top: 10px; padding: 11px 14px;
    text-align: left; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-weight: 600; color: var(--ink);
    transition: border-color .15s ease;
  }
  .social svg { color: var(--accent); flex: none; }
  .social-handle { margin-left: auto; font-weight: 500; color: var(--faint); }
  @media (hover: hover) {
    .social:hover { border-color: var(--accent); }
  }
  .social:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── brand sheet ───────────────────────────────────────────────────────── */
  .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; }
  .sheet {
    position: fixed; z-index: 31; left: 50%; transform: translateX(-50%);
    bottom: 0; width: 100%; max-width: var(--sheet-col);
    background: var(--bg); border-top: 1px solid var(--line-firm);
    border-radius: 16px 16px 0 0; padding: 8px 8px calc(18px + env(safe-area-inset-bottom));
    max-height: 70vh; overflow-y: auto;
  }
  .sheet-title {
    font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
    color: var(--faint); margin: 10px 10px 8px;
  }
  .brand-opt {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-radius: 9px; padding: 12px 10px;
    font: inherit; font-size: 15.5px; color: var(--ink);
  }
  .brand-opt.on { color: var(--accent); font-weight: 650; }
  .brand-opt.on::after { content: " ✓"; }
  .brand-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ── settings: about (condensed, was a page-wide footer before) ──────────── */
  .foot-line { font-size: 13.5px; color: var(--ink-2); margin: 0 0 14px; }
  .foot-line a { color: var(--accent); }
  .foot-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px 16px; margin-bottom: 16px; }
  .foot-legal { font-size: 11.5px; color: var(--faint); line-height: 1.65; margin: 0; }
  .foot-legal.dimmer { opacity: .82; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── view transition ─────────────────────────────────────────────────────
     #view's content is replaced wholesale on every navigation, so the wrapper
     render() puts round each fresh view is a new element every time and a CSS
     animation on it just plays -- no retriggering logic needed. That wrapper
     now carries .ps-rise itself (see behaviour 1 in the motion section);
     there is nothing left to declare here. It was a third rise keyframe with
     its own .32s and its own cubic-bezier, doing what the primitive already
     does at --dur-3 on --ease-standard. */

  /* ── desktop layout ───────────────────────────────────────────────────────
     Same markup, a different arrangement: a genuinely wider page, a browse
     grid instead of a single column, and a two column detail view. Everything
     here hangs off [data-layout="desktop"], set on <html> by demo/app.ts, a
     name distinct from data-mode (the colour theme) on purpose. */
  :root[data-layout="desktop"] .intro { padding-top: 56px; }
  :root[data-layout="desktop"] .hero-wordmark { font-size: 46px; }
  /* The page itself now runs edge to edge, but a line of prose stretched
     across a whole ultrawide window stops being readable, so the mission
     line keeps its own measure regardless of how wide .app gets. */
  :root[data-layout="desktop"] .hero-mission { max-width: 640px; }
  /* One row, wide enough here that the phrases fit on it, separated by a
     hairline rather than restacked as columns — a divider says "related but
     distinct" more quietly than a grid gap does. */
  :root[data-layout="desktop"] .intro-points {
    flex-direction: row; justify-content: center; gap: 0;
    margin: 30px auto 0;
  }
  :root[data-layout="desktop"] .intro-points span:not(:first-child) {
    margin-left: 26px; padding-left: 26px; border-left: 1px solid var(--line);
  }

  :root[data-layout="desktop"] .pop-item { width: 168px; }

  /* Desktop takes the reader's chosen column count literally: equal tracks
     filling the page width, rather than the narrow layout's "fit as many as
     will go". minmax(0, 1fr) rather than plain 1fr so a long unbroken word
     cannot push a track wider than its share and skew the whole row. */
  :root[data-layout="desktop"] .tile-grid {
    grid-template-columns: repeat(var(--per-row, 5), minmax(0, 1fr));
  }

  /* Settings and the legal pages are read top to bottom, not scanned, so they
     keep a comfortable line length instead of stretching the full page width. */
  :root[data-layout="desktop"] .doc { max-width: 640px; margin-inline: auto; }

  /* The offers scroll with the page; the price rail beside them is pinned.
     380px flat rather than minmax(280px, 380px): the rail holds a picture, a
     name and a price box whose widths were tuned once, and letting the column
     breathe between two figures only meant they were tuned for one of them.

     top clears the sticky bar (--bar-h) and then the 20px the handoff asks
     for. The rail can run long -- art, heading, price and the notes block all
     stack in it -- so it is capped to the window and scrolls inside itself
     past that, rather than being pinned at a height it cannot honour. */
  :root[data-layout="desktop"] .detail-grid {
    display: grid; grid-template-columns: 380px minmax(0, 1fr);
    gap: 8px 28px; align-items: start;
  }
  :root[data-layout="desktop"] .hero {
    text-align: center; border-bottom: 0; padding: 6px 24px 24px 0;
    position: sticky; top: calc(var(--bar-h) + 20px);
    max-height: calc(100vh - var(--bar-h) - 40px); overflow-y: auto;
  }
  :root[data-layout="desktop"] .hero-blurb { margin-inline: auto; }
  :root[data-layout="desktop"] .detail-offers {
    border-left: 1px solid var(--line); padding: 0 0 24px 28px;
  }


  /* Houses read direct from their own storefronts. Visually distinct from the
     comparison tiles on purpose: these carry no UK price and must not be
     mistaken for an offer you can act on. */
  /* .house-note, .house-group, .house-group h3 and .house-count used to
     style a houses page that no longer exists -- nothing in any view has
     emitted those class names for some time. Removed rather than left to be
     re-adopted: the h3 among them was a 17px section heading, which is a
     fourth size for a role the type scale settled at 15px, and dead CSS is
     exactly how a collapsed scale quietly comes apart again. The house card
     itself (.house-card, .house-name, .house-price, .house-caveat) is live
     and untouched. */
  .house-grid {
    list-style: none; margin: 0; padding: 0;
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }
  .house-card a {
    display: flex; flex-direction: column; gap: 6px; height: 100%;
    padding: 10px; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface);
  }
  /* Gated like every sibling component: an ungated :hover sticks on touch. */
  @media (hover: hover) {
    .house-card a:hover { border-color: var(--accent); }
  }
  .house-card a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent);
  }
  .house-img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: contain;
    border-radius: 10px; background: #fff;
  }
  .house-img-none { display: block; background: var(--line); }
  .house-name {
    font-size: 13px; line-height: 1.3; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .house-price { font-size: 13px; font-weight: 700; }
  .house-caveat { font-size: 11px; color: var(--faint); }


  /* ── keeping long lists cheap ──────────────────────────────────────────────
     Browse-all builds tens of thousands of nodes, and laying out and painting
     every one of them up front is what made the app feel slow. content-visibility
     lets the browser skip all rendering work for anything scrolled out of view,
     and contain-intrinsic-size gives it a size to reserve meanwhile so the
     scrollbar does not jump around as items are realised.

     The sizes are deliberate estimates of a rendered card, not exact: being
     roughly right is enough to keep the scrollbar stable, and being wrong only
     costs a small correction when the item scrolls in. */
  .tile-grid > li,
  .house-grid > li {
    content-visibility: auto;
  }
  .tile-grid > li { contain-intrinsic-size: auto 260px; }
  .house-grid > li { contain-intrinsic-size: auto 210px; }

  /* The sentinel that pulls in the next chunk. Occupies a row so the observer
     has something with height to intersect with. */
  .grid-more {
    grid-column: 1 / -1; min-height: 8px; list-style: none;
  }


  /* A hot-linked image that failed to load. The img removes itself, so this
     just has to make the empty box look deliberate rather than broken. */
  .art.art-failed {
    background: var(--surface-2);
    border: 1px dashed var(--line);
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ── site footer ────────────────────────────────────────────────────────
     Narrow and quiet on purpose: it is a credit line, not a navigation
     surface, so it takes as little vertical room as the two touch targets
     allow and stays out of the way of everything above it. */
  /* Wraps rather than overflows: the footer carries three links and a credit
     line, which is more than fits on one row at 375px. */
  .site-footer {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px 12px;
    margin-top: 28px; padding: 12px 16px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--faint);
  }
  .footer-credit { white-space: nowrap; font-weight: 600; }
  .footer-social {
    display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end;
    gap: 8px 16px;
  }
  .footer-link {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--faint); text-decoration: none; font-size: 11.5px; font-weight: 600;
  }
  .footer-link .ico { width: 14px; height: 14px; }
  .footer-link:hover, .footer-link:focus-visible { color: var(--accent); }

  /* ── Virtual Yanny ─────────────────────────────────────────────────────── */
  /* bottom uses the same calc(18px + env(safe-area-inset-bottom)) the brand
     sheet already relies on below. Without it, a plain `bottom: 18px` sits
     inside the iOS home-indicator safe area, so Safari's own bottom chrome —
     which grows and shrinks as the page scrolls — periodically overlaps and
     hides the button instead of sitting above it. */
  .yanny-launcher {
    position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 60;
    width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line-firm);
    background: var(--surface); box-shadow: var(--shadow), 0 4px 18px rgba(0,0,0,.25);
    font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .15s ease;
  }
  .yanny-launcher:hover, .yanny-launcher:focus-visible { transform: scale(1.06); }
  .yanny-launcher:active { transform: scale(.94); }
  .yanny-launcher:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  /* Hidden rather than removed while the panel is open — its position is
     exactly where the panel visually "came from", which is worth keeping. */
  .yanny-launcher[data-open] { display: none; }

  .yanny-panel {
    position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 61;
    width: min(380px, calc(100vw - 24px)); height: min(600px, calc(100vh - 100px));
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); border: 1px solid var(--line-firm); border-radius: 20px;
    box-shadow: var(--shadow), 0 12px 40px rgba(0,0,0,.35);
  }
  @media (max-width: 480px) {
    /* A floating card with that much dead space around it on a phone reads
       as a mistake, not a design choice — full sheet instead. 100dvh rather
       than 100vh: the layout viewport (100vh) is sized as if Safari's
       chrome were always hidden, so a panel that height overshoots the
       actually-visible area by however much chrome is showing at that
       moment, and the composer at its bottom edge ends up under it. dvh
       tracks the real visible viewport as that chrome grows and shrinks. */
    .yanny-panel { right: 0; bottom: 0; width: 100%; max-width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; border: 0; }
    /* Full screen, so its header must clear the status bar and notch, and
       in landscape every edge must clear the notch and rounded corners. */
    .yanny-panel .yanny-head {
      padding-top: calc(14px + var(--safe-top));
      padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right));
    }
    .yanny-panel .yanny-body { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    .yanny-panel .yanny-composer, .yanny-panel .yanny-foot {
      padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
    }
    /* A phone's whole screen is the chat: bubbles can use more of it. */
    .yanny-panel .yanny-msg, .yanny-panel .yanny-source { max-width: 90%; }
  }

  .yanny-head {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 14px 14px 14px 18px; border-bottom: 1px solid var(--line);
  }
  .yanny-head-mark { font-size: 20px; flex: none; }
  .yanny-head-text { flex: 1; min-width: 0; }
  .yanny-head-name { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .yanny-head-sub { margin: 1px 0 0; font-size: 11.5px; color: var(--faint); }
  .yanny-head-note { margin: 4px 0 0; font-size: 11px; line-height: 1.4; color: var(--faint); }
  .yanny-close {
    flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: none;
    color: var(--faint); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .yanny-close:hover, .yanny-close:focus-visible { color: var(--accent); }
  .yanny-close:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .yanny-close .ico { width: 18px; height: 18px; }

  /* Clear chat. The quiet pill this site already uses for a secondary
     control — same tokens as the old agent chips, sized to sit level with the
     close button beside it — because it is not the thing anyone came to the
     panel to press. Armed, it borrows the accent the same way every other
     "this one is live" state here does, so the change of colour and the
     change of label say the same thing twice. */
  .yanny-clear {
    flex: none; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
    padding: 5px 10px; border-radius: 20px; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--line); color: var(--faint);
  }
  .yanny-clear:hover { color: var(--ink-2); border-color: var(--line-firm); }
  .yanny-clear.armed { color: var(--accent-ink); border-color: var(--accent); }
  .yanny-clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* overscroll-behavior: reaching the end of the conversation must not start
     scrolling the page underneath the panel. */
  .yanny-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px; }

  /* The strip that stands in for the composer while the backend is being
     checked or is not answering. It sits exactly where the composer would,
     so the conversation above it never moves between states. */
  .yanny-foot {
    flex: none; display: flex; align-items: center; gap: 8px; margin: 0;
    border-top: 1px solid var(--line); font-size: 12.5px; color: var(--faint);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }

  /* A stopped turn, deliberately not a message bubble: it is a note about
     the conversation rather than a turn in it, so a truncated answer can
     never be read as a short one. */
  .yanny-stopped {
    margin: 0 0 10px; font-size: 12.5px; line-height: 1.45; color: var(--faint);
    font-style: italic; padding-left: 2px;
  }

  .yanny-unavailable {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 10px; padding: 24px;
  }
  .yanny-unavailable-mark { font-size: 40px; opacity: .6; }
  .yanny-unavailable p { margin: 0; font-size: 13.5px; color: var(--ink-2); max-width: 26ch; }
  .yanny-checking { height: 100%; display: flex; align-items: center; justify-content: center; }

  /* overflow-wrap: a long product id or an unbroken pasted string must wrap
     inside the bubble rather than push the panel sideways on a phone. */
  .yanny-msg {
    max-width: 84%; margin: 0 0 10px; padding: 9px 13px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .yanny-msg.user { margin-left: auto; background: var(--accent); color: var(--accent-on); border-bottom-right-radius: 4px; }
  .yanny-msg.bot { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  /* Links to the site's own pages inside an answer: the accent ink every
     other in-text link uses, underlined so they read as links without
     relying on colour alone. */
  .yanny-msg a.yanny-link { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
  .yanny-msg a.yanny-link:hover { text-decoration-thickness: 2px; }
  .yanny-msg a.yanny-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
  /* A turn that went wrong is marked as such — a coloured edge and a mark —
     so it is never mistaken for a short answer. */
  .yanny-msg.bot.is-error { border-color: var(--accent); border-left-width: 3px; }
  .yanny-msg.bot.is-error::before { content: "⚠️ "; }

  .yanny-splash { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 12.5px; color: var(--faint); }
  .yanny-spinner {
    width: 13px; height: 13px; flex: none; border-radius: 50%;
    border: 2px solid var(--line-firm); border-top-color: var(--accent);
    animation: yanny-spin .7s linear infinite;
  }
  @keyframes yanny-spin { to { transform: rotate(360deg); } }

  .yanny-source { margin: -6px 0 10px 4px; font-size: 11px; color: var(--faint); max-width: 84%; }

  /* The opening state of an empty chat. Centred in the body's own space
     rather than pinned above the composer, so it reads as an invitation
     sitting in the room the conversation is about to fill — and it vanishes
     the moment there is a real first message. Deliberately not interactive:
     no buttons, no hover, no cursor change. The three examples are quoted
     because they are things to say, not controls to press. */
  .yanny-empty {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 8px 4px;
  }
  .yanny-empty-lead {
    margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); max-width: 30ch;
  }
  .yanny-empty-eg {
    margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 7px;
  }
  .yanny-empty-eg li { font-size: 13px; line-height: 1.4; color: var(--faint); font-style: italic; }

  /* Bottom padding includes the safe area too: on the mobile full-sheet
     panel the composer sits at the true screen edge, right where the home
     indicator lives. */
  .yanny-composer {
    flex: none; display: flex; gap: 8px; border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .yanny-composer input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px;
  }
  .yanny-composer input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .yanny-composer button {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--accent-on); font-size: 16px; cursor: pointer;
  }
  .yanny-composer button:disabled { opacity: .5; cursor: default; }
  .yanny-composer button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The stop button is the same button in the same place, so it inherits
     everything above — including `color: var(--accent-on)`, which is exactly
     the colour asked for and is already defined once per theme state. On the
     dark theme --accent-on is #0B0405, a near-black; on the light theme it
     is #FFFFFF. Both are declared in all four blocks at the top of this file
     (:root, [data-mode="light"], the prefers-color-scheme fallback for
     [data-mode="system"], and the [data-theme] override the host can stamp),
     so the square is right under every setting including the default "match
     my device" with nothing stamped at all — and it will stay right if the
     palette is ever re-tinted, which a hardcoded #000/#fff would not. The
     square itself is fill: currentColor, so it just follows.

     Centred with flex because the send glyph it replaces is text and was
     centred by the button's own line box; an <svg> is not. */
  .yanny-composer .yanny-stop { display: flex; align-items: center; justify-content: center; }
  .yanny-composer .yanny-stop .ico { width: 15px; height: 15px; }

  /* ── the design system page ────────────────────────────────────────────────
     Deliberately built out of the type roles, surfaces and lines this file
     already defines, and introducing no colour, no size and no radius of its
     own. A style guide that needed a private stylesheet to look right would be
     evidence against the system it documents. Everything below is layout: a
     grid for the token rows, a wrap for the icon set, and nothing else.

     .ds-chip has no background of its own either — designView paints each one
     inline with `var(--token)`, which is what makes a swatch the token rather
     than a picture of it. */
  .design-doc .ds-section { margin-top: 34px; }
  .design-doc .ds-section > .t-body { margin: 8px 0 16px; max-width: 62ch; }
  .design-doc .seg { margin-bottom: 10px; }
  .ds-resolved { margin: 0; }
  .ds-group { margin-top: 20px; }
  .ds-group-title { margin: 0 0 4px; }
  .ds-group-note { margin: 0 0 10px; max-width: 62ch; }
  .ds-table {
    display: flex; flex-direction: column; gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .ds-row {
    display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 4px 12px;
    align-items: center; padding: 10px 12px; background: var(--surface);
  }
  /* A row with no swatch keeps the same two text columns, so a name lines up
     down the page whether or not it has a colour to show. */
  .ds-row:not(:has(.ds-chip)) { grid-template-columns: minmax(0, 1fr) auto; }
  .ds-row:not(:has(.ds-chip)) .ds-role { grid-column: 1 / -1; }
  .ds-row .ds-role { grid-column: 2 / -1; }
  .ds-chip {
    grid-row: span 2; width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--line-firm);
  }
  /* Alpha tokens sit over a chequer, so a translucent value reads as one
     rather than as whatever happens to be behind it. */
  .ds-chip.is-alpha {
    background-image:
      linear-gradient(45deg, var(--line-firm) 25%, transparent 25%, transparent 75%, var(--line-firm) 75%),
      linear-gradient(45deg, var(--line-firm) 25%, transparent 25%, transparent 75%, var(--line-firm) 75%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px;
  }

  }
  .ds-value { color: var(--ink-2); text-align: right; white-space: nowrap; }
  .ds-role { margin: 0; }
  .ds-contrast-demo {
    grid-row: span 2; display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-firm);
    font: 700 14px/1 var(--font-sans);
  }
  .ds-pass { color: var(--ok); font-weight: 600; }
  .ds-fail { color: var(--warn); font-weight: 600; }
  .ds-type { display: grid; gap: 4px 12px; padding: 14px 12px; background: var(--surface); }
  .ds-type > p { margin: 0; }
  .ds-type .ds-value { text-align: left; white-space: normal; }
  .ds-gap { margin: 12px 0 0; max-width: 62ch; }
  .ds-lift-demo { padding: 18px 0 4px; }
  .ds-lift {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 120px; padding: 18px 20px; border-radius: 12px;
    background: var(--surface); box-shadow: var(--shadow-lift);
    font: 600 15px/1.3 var(--font-sans); color: var(--ink);
  }
  .ds-icons { display: flex; flex-wrap: wrap; gap: 10px; }
  .ds-icon {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 92px; margin: 0; padding: 14px 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .ds-icon .ico { width: 22px; height: 22px; }
  .ds-icon figcaption { text-align: center; overflow-wrap: anywhere; }

  /* The reveal sits inside the field's own box rather than beside it, so the
     input keeps the full width every other field has. */
  .pw-field { position: relative; display: block; }
  .pw-field input { width: 100%; padding-right: 62px; }
  .pw-reveal {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    padding: 6px 9px; border-radius: 7px;
    background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--line-firm);
    font: 600 12px/1 var(--font-sans); cursor: pointer;
  }
  .pw-reveal:hover { color: var(--ink); border-color: var(--accent); }
  .pw-reveal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── skip link ───────────────────────────────────────────────────────────
     Parked above the viewport rather than hidden, so it keeps its place in
     the tab order and drops into view the moment it takes focus. */
  .skip-link {
    position: fixed; top: 0; left: 50%; transform: translate(-50%, -140%);
    z-index: 100; padding: 10px 16px;
    background: var(--accent); color: var(--accent-on);
    border-radius: 0 0 10px 10px; text-decoration: none;
    font: 600 14px/1 var(--font-sans);
  }
  .skip-link:focus-visible {
    transform: translate(-50%, 0);
    outline: 2px solid var(--ink); outline-offset: 2px;
  }
  /* The landmark takes focus programmatically, so it must not draw a ring
     around the whole page when it does. */
  #view:focus { outline: none; }

  /* ── back to top ─────────────────────────────────────────────────────────
     The catalogue lists run to thousands of tiles, so the top of the page can
     be a very long way up. Hidden until there is a meaningful distance to
     travel, and it is a real button in the tab order rather than a decoration
     that only a mouse can reach. Bottom-left: the chat launcher already owns

  .to-top {
    position: fixed; left: 18px; bottom: 18px; z-index: 30;
    display: none; align-items: center; gap: 7px;

  .ps-dialog-msg { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: var(--ink-2); }

rs 200, but none of the nine ways of asking published any currency at all \u2014 no Shopify.currency in the theme, no /meta.json, and /en-gb /gb /uk /en-uk all 404. /products.json also 404s everywhere, so this is not a confirmed Shopify storefront either. A genuinely silent storefront, not evidence either way."],["beauty-the-shop-uk",`Ships from Madrid, Spain. Whether UK orders are actually GBP-priced has not been confirmed. Currency probe attempted twice, 2026-08-19 (run 32256970672 job 96080822225, and run 32257466936 job 96082441277, roughly 7 minutes apart): both got "COULD NOT ASK: robots.txt did not answer at https://beautytheshop.com" \u2014 no request was made either time. A repeated failure like this reads as the shop refusing or rate-limiting this address rather than a fluke; per the probe's own standard the right response is to leave it alone rather than probe harder. Not a currency finding, and a documented Apify candidate for whoever next takes on scraping this shop directly \u2014 a plain HTTP client cannot even read its robots.txt.`],["nicchia-luxury-uk",`An Italian storefront (nicchialuxury.com) whose own shipping policy states its threshold in dollars ("Free express delivery over 140 USD"), and whose storefront was measured publishing EUR on 2026-08-13 (parseShopCurrency, Price verification run 4, job 94426059278). Its stored prices are NOT those euro figures \u2014 live/stored across all 6,843 keyable listings is a constant 1.3490 (99.9% of the 4,383 listings at or above \xA350 sit within 1% of it), where relabelled euros would give 1.0 \u2014 so the feed is not republishing the storefront in the wrong unit; it is that euro list divided by a fixed factor. No sterling price list was found at any address tried (run 5, job 94428122841: /en-gb answered USD; /gb, /uk, /en-uk none). Whether 1.3490 was ever a real exchange rate was not established, and nothing measured suggests this shop takes sterling at all. It ran enabled with 4,032 offer rows live on that unproven declaration until 2026-08-13. Its stored snapshot went on holding all 6,843 of those figures in priceGbp for three days after that \u2014 disabling a shop stops it being published, it does not touch the file \u2014 and they were cleared on 2026-08-16 by npm run quarantine:prices, each amount kept as nativePrice under currency 'unknown', the only label the measurements above support: not the euros the storefront quotes, not pounds, and not a converted anything. CatalogueStore.write now refuses to store a sterling figure against any id on this list, so no routine run can put them back. Evidence refreshed 2026-08-19 (currency probe, run 32257210189, job 96081595191): /products.json now returns a real Shopify payload \u2014 this is confirmed Shopify, the route that WOULD serve it \u2014 but every request shape still settles EUR. Asked ?country=GB the theme labels the price GBP while settling EUR at a computed rate of 0.8729568, a live Shopify-Markets conversion of the same euro figure, not a second genuine sterling list; this is a different mechanism from the Awin feed's fixed 1.3490 divisor above, but the same underlying fact: no GBP price list independent of a euro one has been found here by any route tried.`],["carethy","Listed here on the day it was added, before anyone had opened the shop \u2014 which is the only moment at which this list can be complete. Everything known about carethy.co.uk is one row of a Microsoft Shopping results page; its checkout currency has not been looked at, and a .co.uk domain is not evidence of sterling (uk.zimayaperfumes.com quotes dollars). No claim is made that it prices in anything in particular. Currency probe, run 32254829111 job 96074001578, 2026-08-19: robots.txt answers with a 10s crawl-delay and no disallow; the bare origin answers 200, but none of the nine ways of asking published any currency at all, and /products.json 404s everywhere too. Now a genuinely silent storefront rather than an unopened one \u2014 still no basis for sterling."],["scentsational","scentsational.com quotes this US runner USD by default and at every request shape tried (currency probe, run 32255905250 job 96077421762, 2026-08-19): origin, ?country=GB, both localisation cookies and Accept-Language en-GB all settle USD; /en-gb, /gb, /uk, /en-uk all 404, so there is no market-prefix address to try instead. /products.json 404s everywhere too, so this is not a confirmed Shopify storefront either. Unlike escentual, no request this repo knows how to make has found a GBP reading anywhere on this shop."],["parfumdreams-uk","Currency probe, run 32256361673 job 96078874562, 2026-08-19: robots.txt answers with no disallow, and the bare origin answers 200, but none of the nine ways of asking published any currency at all \u2014 no Shopify.currency, no /meta.json, and /en-gb /gb /uk /en-uk all 404. /products.json also 404s everywhere. A .co.uk domain is not evidence of sterling pricing on its own (uk.zimayaperfumes.com quotes dollars) \u2014 this storefront is simply silent about its currency rather than confirming anything."],["fragrancedirect","Currency probe, run 32256534104 job 96079423648, 2026-08-19: robots.txt answers with no disallow, and the bare origin answers 200, but none of the nine ways of asking published any currency at all \u2014 no Shopify.currency, no /meta.json, and /en-gb /gb /uk /en-uk all 404. /products.json also 404s everywhere. A .co.uk domain is not evidence of sterling pricing on its own (uk.zimayaperfumes.com quotes dollars) \u2014 this storefront is simply silent about its currency rather than confirming anything."],["cosmetify","Currency probe, run 32256674382 job 96079949118, 2026-08-19: robots.txt answers with no disallow, and the bare origin answers 200, but none of the nine ways of asking published any currency at all \u2014 no Shopify.currency, no /meta.json, and /en-gb /gb /uk /en-uk all 404. /products.json also 404s at every address tried, so this is not a confirmed Shopify storefront either. A genuinely silent storefront, not a foreign-currency one."],["escentual",`The shop is a UK shop and it charges in pounds; what was published here was dollars. Measured 2026-08-15 from a GitHub Actions runner (currency probe, run 31880556596, job 95002418010, commit a735ef6): escentual.com/meta.json says it SETTLES in GBP, while its theme quoted that runner USD at its own published rate of 1.38605. Asked ?country=GB \u2014 or holding the localization=GB cookie a country selector sets \u2014 the same storefront quotes GBP at rate 1. The difference is not cosmetic: /products.json served 39.00 for nuxe-reve-de-miel-ultra-comforting-body-cream at the origin and 28.00 under ?country=GB, and the Calvin Klein Obsession 125ml this repo held at "\xA357.00" came back 40.95 GBP. That is what the offline measurement of 2026-08-13 (commit 86c4660) was seeing when it found this shop 1.452x fragrance-click over 132 products and 1.443x mybeauty-boutique over 213, where those two agree with each other at 1.000, and when a hand check from the UK read \xA340.25 against our \xA357.00. Nothing in this repo ever applied a rate; the shop applied one and we wrote the result down as pounds. Nor may anyone undo it that way: 57 / 1.38605 is 41.12 and the GBP list says 40.95, because a Shopify market rounds its own prices. It ran enabled with 2,542 offer rows live until 2026-08-13. WHAT WOULD TAKE IT OFF THIS LIST: the bar above is a checkout, and a checkout is exactly what has not been reached \u2014 no basket has been made at this shop and none should be made casually. What is held instead is a storefront price list the shop labels GBP, settling GBP, at no conversion, in two independent documents (the theme and the product page's schema.org priceCurrency), reproducible in a minute by dispatching price-verify.yml with currency_probe and currency_probe_require_gbp. A human may decide that clears the bar. This id stays here until one does, and the deciding is the point: it is not a thing to infer from a green tick.`],["harrods","Currency probe, run 98, job 96415230154, 2026-08-20T11:52Z: every one of the nine ways of asking got HTTP 403 on both the meta signal and the bare page, uniformly \u2014 the same clean block this file already has on Selfridges (see its own entry above). A 403 answers nothing about currency; it is not evidence for sterling any more than against it. A famous UK department store is not the same claim as a measured sterling price list \u2014 Nicchia Luxury ran enabled on a less careful version of that same assumption for three days (see its own entry above). One positive sterling reading \u2014 which will need residential retrieval given this block, per docs/INGESTION.md's usual escalation \u2014 is what would remove this id."],["next","Listed here on the day it was added, before anyone had opened the shop. Everything known about next.co.uk's fragrance department comes from WebSearch snippets; its checkout currency has not been read. A .co.uk domain is not evidence of sterling pricing on its own \u2014 uk.zimayaperfumes.com quotes dollars. One positive sterling reading from a currency probe is what would remove this id."],["sephora-uk","Currency probe, run 99, job 96416155239, 2026-08-20T11:56Z: every one of the nine ways of asking got meta 404 / home 403, uniformly \u2014 the same clean block as Harrods' entry above, not a mixed reading. A 403/404 pair answers nothing about currency either way. Sephora UK is a UK-launched storefront of a larger international group, and this registry has already seen a UK-branded shop quote the wrong currency to this tooling by default and settle GBP only on request (see escentual's and fragrancehub's own entries above) \u2014 one more reason not to assume either way. One positive sterling reading is what would remove this id."],["house-of-fraser","Listed here on the day it was added, before anyone had opened the shop. Everything known about houseoffraser.co.uk comes from WebSearch sn
