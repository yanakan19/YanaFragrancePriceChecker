# Fly.io config for the Virtual Yanny backend.
#
# Deployed only by hand or by .github/workflows/deploy-yanny.yml, always
# from the REPO ROOT (the image needs `demo/` and `src/`, which sit above
# this folder — see Dockerfile's header):
#
#   flyctl deploy . --config YanaFreeAPIMerger/fly.toml \
#                   --dockerfile YanaFreeAPIMerger/Dockerfile --remote-only
#
# ── Changing the app name ────────────────────────────────────────────────
# Fly app names are globally unique across all of Fly, so this one may
# already be taken by someone else. If `flyctl apps create` reports it as
# unavailable, change `app` below to anything free and change nothing else:
# the deploy workflow reads the name from this file, and the public
# hostname is always <app>.fly.dev. This is deliberately a different app
# from `yanny-freellmapi`, the model router — that one is already live and
# is not touched by any of this.
app = "virtual-yanny-backend"

# London: the site, its prices and its readers are all UK-facing.
primary_region = "lhr"

# ── Non-secret configuration ─────────────────────────────────────────────
# These three are public facts and belong in the repo. The fourth env var
# the server reads, FREELLMAPI_API_KEY, is a credential and is NEVER set
# here — it reaches the container only as a Fly secret (`flyctl secrets
# set`), which is stored encrypted by Fly and injected at runtime. Putting
# it in this file would publish it: this repo is public.
[env]
  PORT = "8080"
  FREELLMAPI_BASE_URL = "https://yanny-freellmapi.fly.dev"
  AGENT_TIMEOUT_SECONDS = "25"

[http_service]
  # Must match PORT above and ENV PORT in the Dockerfile.
  internal_port = 8080
  # The widget calls this API from an HTTPS page (pricesniffs.space), so a
  # plain-HTTP origin would be blocked by the browser as mixed content.
  # Fly terminates TLS on *.fly.dev automatically; this makes it mandatory.
  force_https = true
  auto_start_machines = true
  # "suspend" rather than "stop": the machine's memory is snapshotted and
  # restored in well under a second, so an idle backend costs nothing but
  # the first reader after a quiet spell does not sit through a cold boot.
  # That matters slightly more now than it used to: the site modules are
  # imported once per process, so a resumed machine keeps the parse it has
  # already paid for, where a full stop/start would pay it again on the
  # next reader's question.
  auto_stop_machines = "suspend"
  # 0 lets the machine idle down when nobody is chatting. Set this to 1 if
  # the widget's 6-second health-check timeout (demo/virtualYanny.ts) ever
  # proves too tight on the first request after an idle period — that is
  # the only symptom this would fix, and it costs a machine running 24/7.
  min_machines_running = 0

  # Liveness only, and deliberately so. /api/health always answers HTTP 200
  # — including when it is reporting `ok:false` because the shared upstream
  # router is rate-limited or unreachable (see server/index.js: every
  # failure there is a fact in the body, never a 5xx). So this check tells
  # Fly "the process is up", which is the right thing for Fly to restart
  # machines over. It deliberately does NOT tell Fly "the chatbot works" —
  # that would hand a third party's rate limit the power to take this app
  # down. The semantic check, which reads the JSON body, runs once after
  # each deploy in .github/workflows/deploy-yanny.yml instead.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # ── Why 512 MB and not the 256 MB default ──────────────────────────────
  # Measured, not guessed, and measured again after this app stopped
  # leaking.
  #
  # This used to say 1gb, sized around server/siteData.js re-importing the
  # site's ~15 MB of generated TypeScript on every question under a
  # cache-busted specifier — every one of those a module Node's loader pins
  # for the life of the process. That is fixed: the site modules are now
  # imported once per process (see that file's header for why loading once
  # is the honest answer here and how staleness is reported instead), and
  # what is left is a single flat parse cost rather than a slope.
  #
  # Numbers behind the 512, all taken by driving buildSiteDataBlock() in a
  # loop on this repo's checkout under Node 22 with a ~15 MB catalogue,
  # reading peak RSS from the kernel's own VmHWM and sampling heapUsed
  # after a forced full GC:
  #
  #                        before            after
  #   heapUsed, boot        6.6 MB           6.7 MB
  #   heapUsed, 1 question  209.0 MB         67.7 MB
  #   heapUsed, 50 q        6,530.6 MB       67.8 MB
  #   retained per question +129.0 MB        +0.002 MB
  #   peak RSS, whole run   7,131.6 MB       393.6 MB
  #
  # After the fix, peak RSS landed at 393.6–397.2 MB over five runs of 50
  # to 200 questions and did not move after the first question. 512 MB
  # leaves ~115 MB of headroom over that, and swap below cushions the rest.
  # 256 MB is still not enough: the one-time import of the catalogue peaks
  # well past it.
  #
  # What would make this wrong: the catalogue growing. Peak RSS here is
  # dominated by transpiling and parsing demo/catalogue.generated.ts once,
  # so it tracks that file's size. Re-measure if it passes ~20 MB, and
  # raise this to 1gb if peak RSS gets within ~50 MB of the limit. These
  # figures come from a dev container, not from Fly — nobody has been able
  # to reach Fly from the environment that wrote them.
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"

# Kept as a cushion for the one-time import spike at the first question,
# so a transient peak pages out instead of getting the process OOM-killed
# mid-answer.
swap_size_mb = 512
