# Fly.io config for FreeLLMAPI (the router), using the official published
# image directly — no need to clone/build its source.
#
# Usage (from anywhere, this file is self-contained):
#   flyctl launch --config freellmapi.fly.toml --no-deploy
#   flyctl volumes create freellmapi_data --size 1 --app <the-app-name-it-picks>
#   flyctl secrets set ENCRYPTION_KEY=<generate one, see below> --app <app-name>
#   flyctl deploy --config freellmapi.fly.toml
#
# Generate an encryption key (PowerShell):
#   $Bytes = New-Object Byte[] 32
#   [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($Bytes)
#   -join ($Bytes | ForEach-Object { "{0:x2}" -f $_ })

app = "" # flyctl fills this in / prompts on first launch — leave blank
primary_region = "lhr" # London — closest to UK South, change if you prefer

[build]
  image = "ghcr.io/tashfeenahmed/freellmapi:latest"

[env]
  PORT = "3001"
  NODE_ENV = "production"

[mounts]
  source = "freellmapi_data"
  destination = "/app/server/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false   # keep it always-on, don't let it sleep
  auto_start_machines = true
  min_machines_running = 1

  # IMPORTANT: FreeLLMAPI's dashboard has its own login gate, but this still
  # exposes the router to the public internet by default on Fly. Consider
  # restricting access (Fly private networking / IP allowlist) once it's up,
  # since the raw dashboard shouldn't be casually reachable by anyone.

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
