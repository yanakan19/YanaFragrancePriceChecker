<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="PriceSniffs">
  <!-- Site background (--bg, dark theme) -->
  <rect width="1080" height="1080" fill="#0A0A0B"/>
  <!-- Magnifying glass in the site accent (--accent, dark theme), the same mark as demo/favicon.svg.
       Scaled about the centre so the handle tip stays inside the circle most profile pictures crop to. -->
  <g transform="translate(540 540) scale(1.15) translate(-540 -540)">
  <circle cx="478" cy="478" r="196" fill="none" stroke="#FF3B41" stroke-width="58"/>
  <line x1="636" y1="636" x2="796" y2="796" stroke="#FF3B41" stroke-width="72" stroke-linecap="round"/>
  <!-- A perfume bottle inside the lens (--ink) -->
  <g fill="#F7F7F8">
    <rect x="452" y="366" width="52" height="42" rx="9"/>
    <rect x="463" y="402" width="30" height="26"/>
    <rect x="398" y="422" width="160" height="164" rx="34"/>
  </g>
  </g>
</svg>
