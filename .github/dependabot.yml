# Dependabot version updates, monthly and small (docs/FUTUREPROOFING-PLAN.md B3).
#
# Pull requests open against the live branch, which is the repository's default
# branch, and nothing merges by itself: the owner or an agent reads each one.
# npm majors are ignored on purpose (vitest, playwright, typescript, esbuild
# each get their own planned job with a full test run); minor and patch updates
# come as one grouped pull request. Actions majors are allowed, since a new
# major is how a Node runtime deprecation arrives.
#
# Dependabot alerts and security updates are a separate switch in the
# repository settings (docs/OWNER-STEPS.md 7e step 2).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'actions'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'npm'
