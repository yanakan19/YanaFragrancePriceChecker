name: Deploy Virtual Yanny worker

# Deploys workers/yanny/ to Cloudflare Workers (free plan) and pushes the
# provider keys into the Worker's encrypted secret store.
#
# ── Why this is manual-only ──────────────────────────────────────────────
# There is no `push` trigger on purpose. This branch is the live site's
# deploy branch and the crawl commits to it every hour; the Worker holds no
# catalogue (the browser sends the data it needs with each question), so
# there is nothing in those commits for it to pick up. Deploying is a
# decision, so it takes a button. Re-run it when workers/yanny/ or
# demo/yanny/prompt.js or demo/yanny/scoring.js change.
#
# ── Secrets this needs (Settings -> Secrets and variables -> Actions) ─────
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers"
#                          template. Never printed.
#   CLOUDFLARE_ACCOUNT_ID  from the Workers overview page (not a secret in
#                          the strict sense, but kept there for one place).
#   GROQ_API_KEY and/or GEMINI_API_KEY (and CEREBRAS_API_KEY,
#   OPENROUTER_API_KEY if used): the free-tier provider keys. Each present
#   one is pushed to the Worker; absent ones are skipped.
#
# ── What it never does ───────────────────────────────────────────────────
# Print a key, write one to the checkout, or put one in an image. Keys go
# from the GitHub secret straight into `wrangler secret put` over stdin.
on:
  workflow_dispatch:

concurrency:
  group: deploy-yanny
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm the Cloudflare secrets are present
        run: |
          set -euo pipefail
          missing=0
          [ -n "${CLOUDFLARE_API_TOKEN}" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set. Create an API token at dash.cloudflare.com -> My Profile -> API Tokens with the 'Edit Cloudflare Workers' template, and add it as a repository secret."; missing=1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. It is shown on the Workers & Pages overview page of the Cloudflare dashboard."; missing=1; }
          if [ -z "${GROQ_API_KEY}" ] && [ -z "${GEMINI_API_KEY}" ] && [ -z "${CEREBRAS_API_KEY}" ] && [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::No provider key is set. Add at least one of GROQ_API_KEY (console.groq.com) or GEMINI_API_KEY (aistudio.google.com) as a repository secret. Both have free tiers."
            missing=1
          fi
          [ "${missing}" -eq 0 ] || exit 1
          echo "Secrets present."

      # The Worker is deployed from the repo root because it imports two
      # files from demo/yanny/ (see workers/yanny/wrangler.toml).
      - name: Deploy the Worker
        id: deploy
        run: |
          set -euo pipefail
          out="$(npx --yes wrangler@4 deploy --config workers/yanny/wrangler.toml 2>&1)"
          echo "${out}"
          url="$(printf '%s' "${out}" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -n 1 || true)"
          if [ -z "${url}" ]; then
            echo "::error::Deployed, but could not find the workers.dev URL in wrangler's output. Open Workers & Pages in the dashboard to read it."
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # Each key goes over stdin, straight from the environment. Only keys
      # that are set are pushed; a Worker with fewer providers still works.
      - name: Push the provider keys as Worker secrets
        run: |
          set -euo pipefail
          for name in GROQ_API_KEY GEMINI_API_KEY CEREBRAS_API_KEY OPENROUTER_API_KEY; do
            value="${!name}"
            if [ -n "${value}" ]; then
              printf '%s' "${value}" | npx --yes wrangler@4 secret put "${name}" --config workers/yanny/wrangler.toml >/dev/null
              echo "${name}: set"
            else
              echo "${name}: not provided, skipped"
            fi
          done

      # /api/health reports facts, never a 5xx, so the body is read rather
      # than the status. All three of ok, configured and at least one
      # reachable provider have to be true before this counts as live.
      - name: Verify the Worker reports healthy
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          body=""
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -sS --max-time 15 "${URL}/api/health" 2>/dev/null || true)"
            if printf '%s' "${body}" | jq -e '.ok == true' >/dev/null 2>&1; then break; fi
            echo "attempt ${attempt}: ${body:-no response}"
            [ "${attempt}" -eq 6 ] || sleep 10
          done
          echo "Health: ${body}"
          printf '%s' "${body}" | jq -e '.ok == true' >/dev/null || {
            echo "::error::The Worker is deployed but not healthy. configured=false means no provider key reached it; providersReachable=0 means the keys were rejected or the model ids in workers/yanny/wrangler.toml are not ones the provider serves. The 'providers' list in the body says which."
            exit 1
          }
          {
            echo "### Virtual Yanny worker is live"
            echo ""
            echo "- URL: \`${URL}\`"
            echo "- Health: \`${body}\`"
            echo ""
            echo "**Remaining step:** set \`VIRTUAL_YANNY_API_BASE_URL\` in \`demo/virtualYanny.ts\` to \`'${URL}'\`, run \`npm run demo\`, and commit."
          } >> "$GITHUB_STEP_SUMMARY"
