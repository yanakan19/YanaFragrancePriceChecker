name: Price verification

# Checks the prices the site publishes against what each shop's own storefront
# charges right now, and commits the resulting drift report.
#
# ── Why this is its own workflow rather than a step in "Catalogue crawl" ─────
# Two reasons, both practical rather than tidiness.
#
# The crawl's job takes 70-80 minutes and sits in `concurrency: catalogue` with
# `cancel-in-progress: false`, so a dispatch aimed at it during a scheduled run
# waits for that run to finish, and a second dispatch behind it silently
# cancels the first. Verification is a five-minute read-only pass; making it
# queue behind an hour-long harvest would mean one measurement per hour on a
# task whose whole value is verify → fix → re-verify.
#
# And a bare dispatch of that workflow falls through to its "Crawl" step, which
# has a 0% live success rate by design (see the comment on it) and fails the
# run — runs #166 and #167 both died exactly that way while the diagnostic
# they were dispatched for had already succeeded. A separate workflow has no
# such fall-through: the only thing it can do is the thing it was asked for.
#
# ── What it may and may not do ───────────────────────────────────────────────
# It writes no price anywhere. It commits exactly one file,
# data/price-verification-report.json, which nothing else in the build reads.
# That file is deliberately outside demo/, so committing it does not trigger
# "Deploy site" — a measurement must never be able to republish the site as a
# side effect.
#
# It does not run against the affiliate feeds and needs no secret: every
# request it makes is to a public storefront, so AWIN_FEED_LIST_URL is neither
# passed nor available here.
on:
  # ── Why this has a schedule at all ──────────────────────────────────────────
  # It did not, and the consequence was measurable: dispatch-only meant it ran
  # when somebody remembered, and by 2026-08-25 nobody had since the 12th.
  # data/price-verification-report.json sat thirteen days old while the
  # catalogue underneath it turned over twelve times a day.
  #
  # That is the wrong shape for this particular check. Its whole subject is
  # drift — the gap between what we publish and what a shop charges — which is
  # a quantity that grows silently with time and cannot be noticed from inside
  # the catalogue. A drift measurement nobody runs is a drift measurement that
  # reports nothing.
  #
  # Weekly rather than daily: it reads real storefronts at a deliberate pace
  # (240s per shop, robots.txt and every registry gap honoured), so it is the
  # heaviest read-only pass in the repo, and drift is a slow enough quantity
  # that seven days still catches it long before a reader would. Sunday 04:40
  # UTC, off the even hours the catalogue cron uses and off the image check's
  # 03:20, so the three never contend for a runner.
  schedule:
    - cron: '40 4 * * 0'
  workflow_dispatch:
    inputs:
      shop:
        description: 'Limit to one retailer id (e.g. mybeauty-boutique). Empty checks every enabled retailer.'
        type: string
        default: ''
      sample:
        description: 'Product pages to fetch per shop on the page-fetch route. The products.json route ignores this and checks every listing.'
        type: string
        default: '30'
      seed:
        description: 'Sampling seed. Keep it fixed to re-measure the same listings after a fix.'
        type: string
        default: '20260812'
      budget_ms:
        description: 'Per-shop time budget in ms.'
        type: string
        default: '240000'
      commit_report:
        description: 'Commit data/price-verification-report.json. Turn off for a throwaway probe.'
        type: boolean
        default: true
      reprice_dry_run:
        description: 'Instead of verifying, dry-run the storefront re-price and report what it would change. Writes no price and commits nothing.'
        type: boolean
        default: false
      currency_probe:
        description: 'Instead of verifying, ask the shop named in "shop" what currency it quotes, at its origin and at each UK market address. Writes nothing.'
        type: boolean
        default: false
      currency_probe_products:
        description: 'Products.json rows to print per address during the currency probe. 0 skips it.'
        type: string
        default: '3'
      currency_probe_product_url:
        description: "Optional product page on the shop's own domain, to read its schema.org priceCurrency. Never an affiliate link — the script refuses any host that is not the retailer's."
        type: string
        default: ''
      currency_probe_require_gbp:
        description: 'Fail the run unless the shop published a sterling price list. Turn this on when the run is meant to BE the evidence; leave it off to look.'
        type: boolean
        default: false
      shipping_probe:
        description: "Instead of verifying, read the shop named in \"shop\" its own delivery page and report what it states. Proposes nothing and writes no registry change."
        type: boolean
        default: false
      brand_site_probe:
        description: "Instead of verifying, follow every official-brand-site link in demo/brandSites.ts and report which are dead or land somewhere other than the published address. Writes nothing."
        type: boolean
        default: false
      brand_site_probe_brand:
        description: 'Limit the brand sweep to one brand key (e.g. armaf). Empty checks every entry.'
        type: string
        default: ''
      brand_site_probe_limit:
        description: 'Cap the brand sweep at N distinct URLs. 0 checks all of them.'
        type: string
        default: '0'
      brand_site_probe_require_all_ok:
        description: 'Fail the run if any brand link is broken or lands off its published address. Leave off to look; turn on when the run is meant to BE the evidence.'
        type: boolean
        default: false
      apify_blob_probe:
        description: "Instead of verifying, render the shop named in \"shop\" through the Apify actor and scan the HTML for a JS-hydration state blob (__NEXT_DATA__ etc). Needs APIFY_TOKEN. Writes nothing; prints redacted findings only."
        type: boolean
        default: false
      apify_blob_probe_url:
        description: "Optional page to render instead of the shop's first catalogue.sections URL."
        type: string
        default: ''
      amazon_probe:
        description: 'Instead of verifying, measure amazon.co.uk honestly: read its robots.txt, obey it literally, and only fetch what it permits. Ignores "shop". Writes nothing, stores no price.'
        type: boolean
        default: false

permissions:
  contents: write

# Its own group, so it never queues behind or cancels the harvest. Two
# verification runs at once would double the request rate at every shop, which
# is the one thing this pass must not do.
concurrency:
  group: price-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Measured budget: 29 enabled retailers x a 240s per-shop cap is a 116
    # minute worst case in theory, but only shops that answer spend anything
    # near their cap. 45 minutes covers the realistic pass with room, and a
    # verification run that overruns it has gone wrong in a way that wants
    # looking at rather than more time.
    timeout-minutes: 45

    # See the identical block in catalogue-daily.yml's `crawl` job, and
    # scripts/signed-commit.sh, for what these two do. GITHUB_TOKEN is what
    # lets a commit be created through GitHub's API and come back Verified;
    # SIGNED_COMMITS is the no-code-change off switch (a repository variable
    # set to `off`). This workflow's only commit — "Price verification:
    # measured drift", one small JSON report — is one of the four
    # small-payload call sites the design covers.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNED_COMMITS: ${{ vars.SIGNED_COMMITS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # continue-on-error so a shop that hangs or a route that throws still
      # leaves the report and the log behind. A partial measurement is useful;
      # a red run with no output is not.
      # Rehearsal for the correction the scheduled crawl will apply for real.
      # storefront-reprice.ts writes the largest retailer on the site, so it
      # gets to be watched doing nothing first: --dry-run reads the storefront,
      # keys every listing and reports exactly what it would change, without
      # touching a snapshot or committing anything.
      - name: Dry-run the storefront re-price
        if: ${{ inputs.reprice_dry_run && !inputs.currency_probe && !inputs.shipping_probe && !inputs.brand_site_probe && !inputs.apify_blob_probe && !inputs.amazon_probe }}
        run: |
          npm run storefront:reprice -- --dry-run \
            ${{ inputs.shop && format('--shop={0}', inputs.shop) || '' }}

      # The evidence step for src/config/retailers.ts's CURRENCY_UNCONFIRMED
      # list. Six retailers sit off the site waiting on one fact each — what
      # the shop charges in — and the environment those entries were written
      # in has no outbound network, so nobody there can find out. This runner
      # can. It writes nothing and commits nothing; its whole product is its
      # log and, with currency_probe_require_gbp on, its exit code.
      #
      # Deliberately NOT continue-on-error, unlike the verification step
      # below. A probe that is meant to stand as proof has to be able to fail:
      # a green tick on a step that cannot go red proves nothing at all.
      - name: Probe what currency a storefront quotes
        if: ${{ inputs.currency_probe }}
        run: |
          npm run currency:probe -- \
            --shop=${{ inputs.shop }} \
            --products=${{ inputs.currency_probe_products || '3' }} \
            ${{ inputs.currency_probe_product_url && format('--product={0}', inputs.currency_probe_product_url) || '' }} \
            ${{ inputs.currency_probe_require_gbp && '--require-gbp' || '' }}

      # The other half of bringing a shop back. A recovered retailer with an
      # invented delivery cost is worse than one left off: delivered price is
      # the site's default sort key, so a delivery figure that is too low
      # sorts the shop to the top as falsely cheapest, which is the same harm
      # as a wrong price wearing a different hat.
      #
      # scripts/shipping-discover.ts already knows how to find and read a
      # shop's own delivery page, and `--shop=` is never rationed and never
      # filtered by `enabled` — so it works for exactly the switched-off shops
      # whose figures nobody can check. Run without --write, so it reports
      # what the page says and changes nothing.
      - name: Read a shop's own delivery page
        if: ${{ inputs.shipping_probe }}
        run: npm run shipping:discover -- --shop=${{ inputs.shop }}

      # The confirmation pass demo/brandSites.ts asks for in its own comments.
      # Most of that file's URLs came from web-search snippets gathered in
      # network-blocked sessions and were never opened; three separate comment
      # blocks in it say as much. Each one renders as an "official site" link
      # on a brand page, so a wrong entry sends a reader somewhere this site
      # vouched for — the known case being a UK reader handed a house's UAE
      # storefront. This runner can actually follow them.
      #
      # Not continue-on-error, for the same reason as the currency probe: with
      # require_all_ok on, this run's own exit code is the evidence, and a step
      # that cannot go red proves nothing. It writes nothing and commits
      # nothing; fixing an entry stays a human judgement.
      - name: Follow every brand's official-site link
        if: ${{ inputs.brand_site_probe }}
        run: |
          npm run brand:probe -- \
            ${{ inputs.brand_site_probe_brand && format('--brand={0}', inputs.brand_site_probe_brand) || '' }} \
            --limit=${{ inputs.brand_site_probe_limit || '0' }} \
            ${{ inputs.brand_site_probe_require_all_ok && '--require-all-ok' || '' }}

      # The unchecked hypothesis behind Selfridges, John Lewis, Zara and
      # Superdrug: the actor tier proved retrieval for the bot-defended majors
      # (see each entry's own comment and src/catalogue/apifyActor.ts), but
      # `parseListings` reads only schema.org JSON-LD and their category pages
      # carry none. Their rendered HTML might carry the same product data in a
      # framework hydration blob instead — cheaper to extract from than a
      # second general parser, if it is there and if it holds prices. This
      # answers that for one shop's one category page per dispatch.
      #
      # Not continue-on-error: with only one page rendered, a failure here is
      # the whole answer for this dispatch, not a partial one to paper over.
      - name: Probe an Apify actor render for a hydration blob
        if: ${{ inputs.apify_blob_probe }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
        run: |
          npm run apify:blob-probe -- \
            --shop=${{ inputs.shop }} \
            ${{ inputs.apify_blob_probe_url && format('--url={0}', inputs.apify_blob_probe_url) || '' }}

      # Amazon UK, exactly once per dispatch, exactly as honestly as every
      # other shop in this registry: robots.txt read and obeyed literally,
      # only the paths it permits fetched, no challenge bypassing and no
      # escalation beyond the plain BROWSER_HEADERS fetch tier — see
      # scripts/amazon-probe.ts's own header for the full reasoning and the
      # registry entry's own comment for the licensing/PA-API blockers this
      # does not touch. Not continue-on-error, for the same reason as the
      # other read-then-report probes above: this run's own log is the whole
      # deliverable.
      - name: Measure amazon.co.uk honestly
        if: ${{ inputs.amazon_probe }}
        run: npm run amazon:probe

      - name: Verify prices against live storefronts
        if: ${{ !inputs.reprice_dry_run && !inputs.currency_probe && !inputs.shipping_probe && !inputs.brand_site_probe && !inputs.apify_blob_probe && !inputs.amazon_probe }}
        continue-on-error: true
        run: |
          npm run price:verify -- \
            ${{ inputs.shop && format('--shop={0}', inputs.shop) || '' }} \
            --sample=${{ inputs.sample || '30' }} \
            --seed=${{ inputs.seed || '20260812' }} \
            --budget-ms=${{ inputs.budget_ms || '240000' }}

      - name: Commit the drift report
        if: ${{ (inputs.commit_report || github.event_name == 'schedule') && !inputs.reprice_dry_run && !inputs.currency_probe && !inputs.shipping_probe && !inputs.brand_site_probe && !inputs.apify_blob_probe && !inputs.amazon_probe }}
        run: |
          ./scripts/commit-and-push.sh \
            "Price verification: measured drift $(date -u +%Y-%m-%dT%H:%MZ)" \
            data/price-verification-report.json
