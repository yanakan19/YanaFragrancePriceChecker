name: Layout check (Safari engine)

# Runs tests/layoutConsistency.test.ts in WebKit, the engine inside Safari,
# with iPhone 13 settings. The same test runs in Chromium on every crawl; this
# is the half that catches what only Safari does differently, which is where
# the filters were reported looking wrong on an iPhone. The WebKit half of
# tests/listFiltersBrowser.test.ts (the Filters panel on an iPhone) runs with it.
# It also checks the "Select your country" pop-up fits an iPhone screen, for a
# visitor who has chosen no country; every other page is checked as a returning
# visitor, with the UK saved, so the pop-up is not over it (launchWebkit in
# scripts/a11y-audit.ts).
#
# Only on a change to the page's own source or to the test, never on a price
# crawl: a harvest changes data, not layout, and the page it builds is checked
# by the Chromium run already.
on:
  push:
    branches: [claude/scentday-retailer-registry-h92tth]
    paths:
      - 'demo/app.ts'
      - 'demo/template.html'
      # The Filters button, its chips and its panel (owner's revamp, 6 Oct 2026).
      - 'demo/filterUi.ts'
      - 'demo/listFilters.ts'
      - 'demo/tabPanels.ts'
      - 'scripts/build-demo.ts'
      # The browser launch both engines use (the saved country every test
      # browser starts with), and the pop-up that asks a visitor with none.
      - 'scripts/a11y-audit.ts'
      - 'demo/regionWelcome.ts'
      - 'src/config/regions.ts'
      - 'tests/layoutConsistency.test.ts'
      - 'tests/listFiltersBrowser.test.ts'
      - 'tests/support/filterPanel.ts'
      - '.github/workflows/layout-webkit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layout-webkit
  cancel-in-progress: true

jobs:
  webkit:
    # Pinned like the crawl (ubuntu-latest moves to Ubuntu 26 on 2026-10-19,
    # and `playwright install --with-deps` names packages per release).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        timeout-minutes: 10
        run: scripts/retry.sh 3 npm ci

      # Retried like every other browser download (scripts/retry.sh): a CDN
      # blip here used to fail the check.
      - name: Install WebKit
        timeout-minutes: 10
        run: scripts/retry.sh 2 npx playwright install --with-deps webkit

      # The page is built at deploy time and not committed (2026-10-04), and
      # the test skips itself when there is no demo/index.html, so it is
      # built here first.
      - name: Build the page
        timeout-minutes: 10
        run: npm run demo

      # The layout rules, and the Filters panel driven as on an iPhone: a tap
      # on several options, the page held still behind it, Escape and focus.
      - name: Layout rules and the Filters panel in WebKit with iPhone settings
        timeout-minutes: 15
        env:
          LAYOUT_BROWSER: webkit
        run: npx vitest run tests/layoutConsistency.test.ts tests/listFiltersBrowser.test.ts
