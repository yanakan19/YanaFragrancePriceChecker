name: Deploy site

# Builds the site from the branch's tip and publishes it to GitHub Pages behind
# the custom domain in demo/CNAME.
#
# ── Built here, not committed (2026-10-04) ───────────────────────────────────
# The page (demo/index.html, demo/404.html), its hashed data files (demo/data/),
# demo/sitemap.xml and demo/ads.txt are the output of `npm run demo`, and this
# job builds them from what the branch does commit: the source, and the
# generated modules (demo/*.generated.ts) the crawl rebuilds from its harvest.
# They used to be committed by every crawl, and the content-hashed data files
# were most of the repository's growth: about 32 of the 57 MB added on
# 2026-10-04, because a new name every build defeats git's delta compression.
# scripts/generated-files.txt lists them as "deploy" (built here, gitignored,
# never committed).
#
# The build is checked before anything is uploaded (the page's stamp matches
# the source it was built from, every data file it names exists, the deep-link
# copy is identical, every fixed address has a page of its own so Pages answers
# it 200 and not 404 (scripts/build-route-pages.ts), the sitemap is not empty).
# A build or check that fails
# stops this job before `upload-pages-artifact`, so the site stays on the last
# good deployment: Pages never publishes an empty or half-built folder.
#
# ── Why `workflow_run` and not just `push` ───────────────────────────────────
# GitHub does not start a workflow from a push made with the built-in
# GITHUB_TOKEN (to stop workflows triggering each other forever), and the crawl
# and the fragrance links job push with exactly that token. Chaining off their
# *completion* sidesteps that, because the trigger is the finished run rather
# than its push. It runs whether or not the run succeeded: the harvest commits
# prices well before the later steps that can fail.
#
# ── Only when the page could change (owner decision, 2026-10-06) ─────────────
# Until 6 October every finished crawl run deployed, the half hourly ticks
# that skip in seconds included: 86 deploys on 5 October, about 50 of them
# rebuilding the same page. Now the `decide` job (scripts/deploy-decision.mjs,
# under a minute, no install) reads back build-state.json from the live site,
# the commit and the dashboard's hidden and removed list the live page was
# built from, and the `deploy` job runs only when a file that can change the
# page (the push filter's folders below) changed since that commit, or the
# list changed, or the record cannot be read. A push or a run by hand always
# deploys. Every check also compares the dashboard's list, so a "Remove" or
# "Show again" reaches the build at the next finished crawl run: the outside
# scheduler starts one every half hour (OWNER-STEPS 7a), so within about half
# an hour, as before. The schedule below is a second path for when that
# scheduler stops (GitHub runs few of its own ticks: 23% of the crawl's
# arrived). A deploy that failed is retried by the next check.
#
# ── Which pushes deploy ──────────────────────────────────────────────────────
# Any push to the branch except the folders that cannot change the page (data,
# docs, tests, social posts, the apps, the database migrations, Markdown and
# other workflows). This used to be `demo/**` only, which was enough while a
# change to src/ came with a rebuilt, committed demo/index.html; now a change
# to src/ or to the build scripts must start a deploy by itself.
on:
  push:
    branches: [claude/scentday-retailer-registry-h92tth]
    paths:
      - '**'
      - '!data/**'
      - '!docs/**'
      - '!tests/**'
      - '!social/**'
      - '!apps/**'
      - '!supabase/**'
      - '!**/*.md'
      - '!.github/**'
      - '.github/workflows/deploy-pages.yml'
      - 'data/note-groups.json'
      - 'data/note-group-overrides.json'
      - 'data/note-not-a-note.json'
      - 'data/note-descriptions.json'
      - 'data/note-icons-manifest.json'
  workflow_run:
    workflows: ['Catalogue crawl', 'Fragrance links daily']
    types: [completed]
  # A second path for the dashboard's list and a retry of a failed deploy
  # (finished crawl runs are the first). Off the hour and half hour, when
  # GitHub's queue is longest; GitHub runs only some of its ticks.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # The decide job cancels a deploy run stuck waiting for a runner
  # (scripts/deploy-watchdog.mjs).
  actions: write

jobs:
  # Light: a checkout of commits and trees only, plain node, two small fetches.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      overrides: ${{ steps.decide.outputs.overrides }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '22'

      # Deploy #1165 (2026-10-06) waited almost four hours for a runner it
      # never got, holding the pages group, and ten deploys behind it were
      # replaced: the site stayed four hours behind. A job's timeout counts
      # only once a runner has it, so this ends such a wait instead.
      - name: Cancel an older deploy stuck waiting for a runner
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-watchdog.mjs

      - id: decide
        name: Decide whether the page could have changed
        timeout-minutes: 3
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/deploy-decision.mjs decide

  deploy:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Only one deployment at a time. A deployment already running is left to
    # finish, and only the newest waiting one runs after it (GitHub keeps one
    # waiting job per group), which is GitHub's own advice for Pages:
    # cancelling deploy-pages mid deployment can leave the next one refused
    # while the cancelled one is still "in progress" on GitHub's side. Every
    # run builds the branch's tip, so the one that runs last always publishes
    # the newest prices. The group is on this job, not the workflow
    # (2026-10-06), so every run's decide job runs at once and can cancel a
    # deploy stuck waiting for a runner (deploy-watchdog.mjs above).
    concurrency:
      group: pages
      cancel-in-progress: false
    # Checkout, install and build take about three minutes; the deployment
    # itself under one. A failed or stuck run is healed by the next (the
    # half hourly check deploys again while the live record is behind).
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # On a workflow_run the default checkout is the commit the *triggering*
      # run started from, which is older than the prices that run just pushed.
      # Naming the branch takes its current tip instead.
      #
      # Full history without file contents (a blobless partial clone): the
      # sitemap dates the about, legal and list pages by the last commit that
      # touched their source (`git log -1 -- <path>`, scripts/build-sitemap.ts),
      # which needs commits and trees but no old blobs. A shallow clone would
      # date every one of them today.
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        timeout-minutes: 10
        run: scripts/retry.sh 3 npm ci

      # tsc, the bundle, the page and its data files, then the sitemap
      # (package.json). Reads the committed demo/*.generated.ts; never replays
      # the price history, which the crawl does before it commits them.
      # SITE_OVERRIDES_FETCH: the build reads the developer dashboard's public
      # list of hidden and removed brands and shops from the database, leaves
      # removed ones out of the data and hidden ones out of the sitemap, and
      # switches the cookieless visit counter on once migration 0007 exists.
      # Until then it answers "not set up" and the page is the one built
      # before the dashboard. A database that does not answer never fails the
      # build (scripts/siteBuild.ts).
      - name: Build the site
        timeout-minutes: 10
        env:
          SITE_OVERRIDES_FETCH: '1'
        run: npm run demo

      - name: Check the build before publishing it
        timeout-minutes: 5
        run: |
          # The freshness check passes a folder with no page at all ("nothing
          # to check"), so the page's existence is asserted first. It then
          # exits 0 only when demo/index.html carries the stamp of the source
          # on disk and every data file it names is in demo/data.
          test -s demo/index.html
          npx tsx scripts/check-demo-freshness.ts
          cmp demo/index.html demo/404.html
          # A page of its own for every fixed address (/about is demo/about.html),
          # so the host answers it 200 and not the 404.html fallback: present,
          # from this build, with its own title and canonical.
          npx tsx scripts/build-route-pages.ts --check
          test -s demo/sitemap.xml
          grep -q '<urlset' demo/sitemap.xml
          ls -la demo/index.html demo/404.html demo/sitemap.xml demo/data

      # What this deployment is built from, published beside the page for the
      # next run's `decide` job: the commit checked out above and the hidden
      # and removed list's fingerprint as `decide` read it.
      - name: Record what this deployment is built from
        timeout-minutes: 2
        env:
          OVERRIDES: ${{ needs.decide.outputs.overrides }}
        run: node scripts/deploy-decision.mjs record demo/build-state.json

      - uses: actions/configure-pages@v5
        timeout-minutes: 5

      - uses: actions/upload-pages-artifact@v3
        timeout-minutes: 10
        with:
          path: demo

      - id: deployment
        timeout-minutes: 10
        uses: actions/deploy-pages@v4
