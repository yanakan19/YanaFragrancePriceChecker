name: Catalogue crawl

# Runs every two hours and commits the resulting snapshots. The commit is the
# audit trail: the diff shows exactly which products a shop added, dropped or
# repriced since the last run.
#
# Two-hourly rather than hourly, because hourly was never real. A full run now
# takes 71-79 minutes end to end (measured: run #153 finished in 70m48s, run
# #158 reached its harvest commit at 68m04s and was still working), so an
# hourly cron asks for a run to start while the previous one is still going.
# The concurrency group below then holds the new one pending, and a *third*
# tick arriving cancels the one waiting. The delivered cadence between
# 2026-08-11 22:39Z and 2026-08-12 10:01Z was already 1h46m-2h18m between runs
# (#153 through #159) rather than the hourly this cron claimed — so this is the
# schedule matching what the pipeline actually does, not a reduction in
# service. It also leaves ~40 minutes of slack between the end of one run and
# the start of the next, which is what stops a slow run stacking at all.
#
# The three periodic steps below (Awin sync, Top Deals, shipping discovery) no
# longer key off the clock reading a particular hour. They did, and it broke:
# a scheduled run starts when a runner is free, not when the cron said, and
# once the drift settled on odd hours those steps skipped every cycle in
# silence. They now gate on time elapsed since they last ran, so the cadence
# holds however late a run starts. See each step for its own threshold.
#
# --allow-metered below is a no op unless APIFY_PROXY_PASSWORD or APIFY_TOKEN
# is set. Both are now set: this comment used to end "and neither currently
# is", which stopped being true when APIFY_TOKEN was added, and the warning it
# then gave — watch the cost closely, the actor tier runs about ten times the
# proxy's per-page cost — turned out to be the right warning ignored. The $5
# monthly free credit ran out on 2026-08-21, mid-month, and the first anyone
# knew was Apify's billing email.
#
# What changed as a result: scripts/catalogue-harvest.ts now asks Apify what
# the month has cost before it spends anything, and switches both metered
# tiers off for the run once the credit is at 90% or gone (see
# src/catalogue/apifyUsage.ts). That check is free and consumes no compute
# units. It is a backstop, not a budget — it can only stop the next run, so
# the per-run cap in apifyActor.ts still does the actual rationing.
#
# The five shops that need the actor tier (Boots, Selfridges, John Lewis,
# Superdrug, Zara) therefore go quiet for the rest of a month whose credit is
# spent, and resume when it resets. Every other shop is unaffected: the
# sitemap/JSON-LD route costs nothing.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      crawl:
        description: 'Run the legacy section-URL crawl. Off by default — see the Crawl step for why, and read it before ticking this.'
        type: boolean
        default: false
      source:
        description: 'Applies to the legacy crawl above only: live crawls the shops, fixtures replays saved pages.'
        type: choice
        options: [live, fixtures]
        default: live
      dry_run:
        description: 'Applies to the legacy crawl above only. Fetch and report without writing.'
        type: boolean
        default: false
      probe:
        description: 'Run the adaptive retrieval probe instead of the crawl.'
        type: boolean
        default: false
      probe_shop:
        description: 'Limit the probe to one retailer id (e.g. very). Bypasses that retailer''s own enabled flag, so a disabled candidate can be probed without switching it on — see catalogue-probe.ts. Empty probes every enabled shop, same as the schedule.'
        type: string
        default: ''
      harvest:
        description: 'Harvest real listings through each shop sitemap.'
        type: boolean
        default: false
      harvest_max:
        description: 'Product pages to fetch per shop during a harvest.'
        type: string
        default: '40'
      harvest_shop:
        description: 'Limit the harvest to one retailer id (e.g. lookfantastic). Empty runs every enabled shop, same as the schedule.'
        type: string
        default: ''
      harvest_gap_min:
        description: 'Floor on the delay between requests, in ms, on top of the registry/robots.txt gap. Use for a gentler deep run against one shop after a normal-pace run got throttled.'
        type: string
        default: ''
      harvest_refresh_share:
        description: 'Share of each shop budget (0-1) spent re-pricing listings already held, oldest first, rather than discovering new ones. Empty uses the scheduled default.'
        type: string
        default: ''
      allow_metered:
        description: 'Retry genuinely blocked shops through the Apify proxy (APIFY_PROXY_PASSWORD) and, for shops that stay at zero, a real-browser Apify actor render (APIFY_TOKEN). Each fires independently only if its own secret is set. Costs money — the actor tier roughly ten times more per page than the proxy tier.'
        type: boolean
        default: false
      shipping_discover:
        description: "Read disabled shops' own delivery pages and report what they say. Writes a report only, never the registry."
        type: boolean
        default: false
      shipping_raw_shop:
        description: 'Debug: also record the full extracted text of every delivery page fetched for this one retailer id, not just the regex-matched sentences. Empty runs the ordinary discover pass only.'
        type: string
        default: ''
      awin_feed_sync:
        description: 'Sync every affiliate-feed retailer against the Awin Feed List Download URL. Requires the AWIN_FEED_LIST_URL secret.'
        type: boolean
        default: false
      awin_memberships:
        description: 'Report which Awin advertisers this account has actually been accepted onto, and which of those are missing from the registry. Reads only; writes and commits nothing.'
        type: boolean
        default: false
      awin_feed_diag_shop:
        description: 'Debug: print the column headers and price-ish column values for one product in one Awin retailer feed (e.g. mybeauty-boutique). Never writes anything, never prints the feed URL or a full row. Empty runs no diagnostic.'
        type: string
        default: ''
      awin_feed_diag_match:
        description: 'Debug: substring of product_name to match for awin_feed_diag_shop.'
        type: string
        default: ''
      awin_feed_diag_sku:
        description: 'Debug: exact merchant_product_id to match for awin_feed_diag_shop, as an alternative or addition to awin_feed_diag_match.'
        type: string
        default: ''
      deals_refresh:
        description: 'Force a Top Deals Today snapshot without waiting for its normal ~6 hourly cadence.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Two crawls writing snapshots at once would race and lose listings.
  group: catalogue
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Measured from the runs themselves, not guessed. Every number below is a
    # step duration read off the GitHub jobs API.
    #
    # Run #153 (2026-08-12 00:08Z) is the last run that finished cleanly, and
    # it only just did: 70m48s of a 75-minute cap, of which harvest 56m43s,
    # houses 7m09s, rebuild 50s, commit 61s, image check 4m47s. Four minutes of
    # slack.
    #
    # Runs #154-#158 then took the same pipeline past the cap. #158 is the
    # clearest: harvest 59m14s, houses 6m48s, rebuild 56s, commit 66s — it did
    # reach "Commit harvested prices" and pushed e17cff6 at 09:24:23Z, 68m04s
    # in — and was then killed at 09:31:10Z, exactly 75 minutes after the job
    # started, six minutes into the image check. #155, #156 and #157 each ran
    # 75.3-75.5 minutes wall clock and stopped at the same cap. So the thing
    # that cancelled them was this timeout, not the concurrency group: none of
    # them was ever cancelled while pending, each got a runner immediately and
    # used all 75 minutes of it.
    #
    # #157 is the expensive case and the reason for the size of the number
    # below. It was an 06:00 tick, so it also paid for "Discover shipping
    # terms" (5m34s), the Awin sync (56s) and Top Deals (13s) before the
    # harvest even started. Harvest then took 59m12s and the job died inside
    # "Harvest houses direct" — before the commit. That run harvested for an
    # hour and saved none of it, and it needed roughly 86 minutes to have
    # saved any.
    #
    # 100 minutes covers that worst measured case with ~14 minutes of headroom
    # for the catalogue's steady growth, and still fits inside the two-hour
    # cron above with ~20 minutes to spare, so a long run cannot stack into the
    # next tick. It is not papering over a hang: every cancelled run inspected
    # here showed steady progress right up to the cutoff, never a step stuck
    # doing nothing.
    #
    # ── Run #180, and why this number is now a ceiling rather than a dial ─────
    # The paragraph above used to end "the two steps that can genuinely run
    # long are separately capped below, so this ceiling should never be what
    # stops a run again." It was wrong about which steps those were. #180
    # (2026-08-13 20:34:27Z-22:14:47Z, cancelled at exactly 100 minutes) was
    # killed inside "Harvest via sitemap", which had no cap, after "Discover
    # shipping terms" — also uncapped — had taken 48m05s of the run. Both now
    # have one.
    #
    # What that run cost, precisely: shipping 48m05s, Awin sync 2m19s, deals
    # 10s, then harvest from 21:26:08Z until the cap landed at 22:14:44Z. The
    # first three committed as they went (2e0f82b, 0387614, e8012e5); the
    # harvest did not, because a job timeout cancels the running step and every
    # step after it, so "Commit harvested prices" never ran. Six shops' worth of
    # freshly stored prices were on disk and were thrown away.
    #
    # This number is now bounded from both sides and should not be raised
    # again. Above: the two-hourly cron. A run may not exceed 120 minutes
    # without stacking into the next tick, and the ~20 minutes between 100 and
    # 120 is the margin that keeps a slow run from doing so. Below: the sum of
    # the step caps that have to fit inside it — worst case ~19 minutes of
    # setup and periodic stages, 60 for the harvest, 15 for houses, ~3 for the
    # rebuild and push, which reaches "Commit harvested prices" at ~97 minutes
    # even if every capped step exhausts its full budget at once.
    #
    # So the run no longer needs more time; it needs the work to fit. If a
    # stage genuinely outgrows its budget, the fix is to shrink or split that
    # stage, not to move this line. What this cap now protects is only the
    # tail — and losing the tail costs a report, not a harvest.
    timeout-minutes: 100

    steps:
      # fetch-depth: 0 is load-bearing, not a nicety. actions/checkout@v4
      # defaults to a shallow clone (depth 1) — fine for every other step
      # here, which only ever look at the working tree — but
      # scripts/build-price-history.ts replays the *entire* commit history of
      # data/catalogue via `git log`/`git show` to reconstruct a real price
      # history. Against a depth-1 clone it would silently see only this run's
      # single commit, rebuild demo/priceHistory.generated.ts from just that
      # one point, and never accumulate history from here on — with no error,
      # nothing failing, just a chart that quietly never grows past one dot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The crawl must not ship if the reconciliation logic is broken. A bad
      # diff here corrupts firstSeenAt for every listing, and that cannot be
      # recovered from a later run: the NEW badge would be wrong for a week.
      - name: Test before crawling
        run: npm test

      # Tries several retrieval strategies per shop, ordered by what has worked
      # before, and commits what it learned so tomorrow starts smarter.
      #
      # Both Apify credentials are passed unconditionally, same reasoning as
      # the harvest step below: catalogue-probe.ts checks for each itself and
      # simply leaves proxied-fetch or browser-render unavailable, with a
      # clear log line, when its secret is absent. Neither is required for
      # the free strategies to run normally.
      - name: Adaptive probe
        if: ${{ inputs.probe }}
        env:
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          npm run probe -- \
            ${{ inputs.probe_shop && format('--shop={0}', inputs.probe_shop) || '' }}

      - name: Commit what the probe learned
        if: ${{ inputs.probe }}
        run: |
          ./scripts/commit-and-push.sh \
            "Probe: what the crawler learned $(date -u +%Y-%m-%d)" \
            data/strategy-memory.json

      # Reads each shop's own delivery page and records what it says.
      #
      # Covers every enabled shop whose delivery rule is not confirmed, plus
      # every shop with no rate at all. It used to cover only the second group,
      # which meant 20 of the 22 enabled shops carrying an unverified delivery
      # figure had never been fetched by this step once — the population that
      # decides most of the site's "Cheapest" labels was the population it
      # skipped.
      #
      # --write promotes confidence to 'confirmed' for a shop whose page agrees
      # with the figure the registry already holds, and records
      # standardRateNotPublished for a shop whose page states delivery terms
      # and names no flat rate. Both write the URL and the sentence into
      # shipping.source. It still cannot introduce a figure the registry does
      # not hold, and it still cannot pick a side when page and registry
      # disagree: delivered price is the default sort, so a wrong-low delivery
      # charge makes a shop falsely win it, and a human reads the quoted
      # sentence and types that number. See scripts/shipping-discover.ts and
      # src/catalogue/shippingRegistryPatch.ts.
      #
      # Twice a day rather than hourly: a shop revises its delivery terms a few
      # times a year, so checking every hour would be 24 times the requests to
      # learn the same thing. 06:00 and 18:00 UTC are picked off the hourly
      # schedule below rather than by adding a second cron, because two crons
      # both firing at those hours would run the whole harvest twice.
      - name: Discover shipping terms
        if: ${{ inputs.shipping_discover || github.event_name == 'schedule' }}
        run: |
          # Age based, same reasoning as the two steps below: scheduling drift
          # means the clock is never read at the hour the cron named. Twelve
          # hourly here rather than six, which is the cadence this step was
          # always meant to have — shops rewrite delivery terms maybe twice a
          # year, so this is deliberately the least frequent thing in the job.
          MARKER=data/shipping-discover-marker.txt
          NOW=$(date -u +%s)
          LAST=0
          if [ -f "$MARKER" ]; then LAST=$(cat "$MARKER" 2>/dev/null || echo 0); fi
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          AGE=$(( NOW - LAST ))
          if [ -n "${{ inputs.shipping_raw_shop }}" ]; then
            npm run shipping:discover -- --raw=${{ inputs.shipping_raw_shop }}
          elif [ "${{ inputs.shipping_discover }}" = "true" ] || [ "$AGE" -ge 39600 ]; then
            # --budget=10 rations the sweep. Measured, not guessed: this step
            # took 3m59s on run #172 (09:06:10Z-09:10:09Z) when its population
            # was two shops, and 48m05s on #180 (20:35:23Z-21:23:28Z) — the
            # first scheduled run after 6b56632 widened it to every enabled
            # shop whose rule is not confirmed — covering 49 shops and 714
            # fetched pages. That is ~59s a shop, so ten shops is ~10 minutes.
            #
            # A step cap would not have helped here and is deliberately not
            # what this uses. scripts/shipping-discover.ts writes the registry
            # patch and the report *after* its loop, so a sweep killed at
            # minute 47 of 48 records nothing at all: this work has to be small
            # enough to finish, not interruptible. Rationing makes each run
            # finish and turns coverage into a rotation — every shop is still
            # reached, over a few cycles rather than all in one. A shop revises
            # its delivery terms a few times a year, so nobody reading the site
            # can tell the difference. Before 6b56632 these shops were checked
            # never; a rotation is not a regression against that.
            #
            # `timeout` is a backstop against a single shop hanging, not the
            # budget: 900s is roughly 50% over the ten-shop estimate. It wraps
            # only the discovery, so the verification below runs either way —
            # a step-level cap would skip it and let the commit step publish an
            # unverified retailers.ts.
            if timeout 900 npm run shipping:discover -- --write --budget=10; then
              echo "Shipping discovery finished; marking the cycle done."
              DISCOVERED=yes
            else
              echo "::warning::Shipping discovery did not finish within its 15 minute backstop. Nothing was recorded for this cycle, and the marker is left alone so the next scheduled run retries the same shops."
              DISCOVERED=no
            fi
            # A registry the run has just edited has to still compile and still
            # satisfy the registry tests before it is committed. If it does
            # not, the edit is thrown away rather than pushed: a broken
            # retailers.ts takes the whole site down.
            #
            # Runs unconditionally, including after the backstop fired: the
            # point is that nothing reaches the commit step below unverified,
            # and a half-finished run is exactly when that matters most.
            if ! npm run typecheck || ! npx vitest run tests/registry.test.ts; then
              echo "Registry edits failed verification — reverting them."
              git checkout -- src/config/retailers.ts
            fi
            # Only a completed sweep advances the eleven-hour clock. Writing it
            # after a killed run would rotate the queue past shops nothing
            # looked at and hide the failure for eleven hours.
            if [ "$DISCOVERED" = yes ]; then echo "$NOW" > "$MARKER"; fi
          else
            echo "Last shipping discovery was $(( AGE / 3600 )) hours ago, under the eleven hour threshold — skipping."
          fi

      # No-ops when the step above skipped: commit-and-push.sh exits cleanly
      # when nothing changed.
      - name: Commit the shipping report
        if: ${{ inputs.shipping_discover || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Shipping terms: what each delivery page says $(date -u +%Y-%m-%d)" \
            data/shipping-discovery-report.json data/shipping-discover-marker.txt \
            data/shipping-discover-state.json \
            src/config/retailers.ts

      # Every affiliate-feed retailer (adapter: 'affiliate-feed' in
      # src/config/retailers.ts — Fragrance Click UK, MyBeauty.Boutique and The
      # Beauty Store UK today) against the Awin Feed List Download URL.
      #
      # On the same roughly 6-hourly cadence as Top Deals below, and
      # deliberately ordered *before* it. Those three shops hold 9,820 of the
      # catalogue's 14,857 listings — 66% — and a feed sync refreshes every one
      # of them in a single download rather than page by page. So this step is
      # what actually delivers "the whole listing set refreshed every six
      # hours" for most of the site, and running it first means the deals
      # snapshot below is picked from those fresh prices rather than the
      # previous window's.
      #
      # It was 06:00/18:00 only, which left two thirds of the catalogue on a
      # 12-hour refresh. Awin regenerates a feed roughly daily, so 6-hourly is
      # still far short of wasteful — an unchanged feed costs one HTTP request
      # and stops there, because the rebuild only runs when the sync genuinely
      # changed something.
      #
      # A no-op, not a failure, when AWIN_FEED_LIST_URL is unset — see
      # scripts/awin-feed-sync.ts's own header comment.
      - name: Sync Awin product feeds
        if: ${{ inputs.awin_feed_sync || github.event_name == 'schedule' }}
        env:
          AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
        run: |
          # Gated on "long enough since the last one", not on the clock reading
          # exactly 00/06/12/18. A scheduled run does not start when it is
          # scheduled: GitHub defers them under load, and this workflow's own
          # runs started at 22:33, 01:19, 04:04 and 07:16 on a two hourly cron.
          # `date -u +%H` reads the moment the runner got to this line, so the
          # old exact-hour test skipped the sync on four consecutive cycles and
          # would have gone on skipping it indefinitely — the drift never lands
          # back on an even hour by itself. It took the storefront reprice down
          # with it, which is why MyBeauty.Boutique stayed roughly seventy per
          # cent overstated with a working fix already merged.
          #
          # The marker is written here rather than derived from a commit,
          # because the sync legitimately produces no commit when a feed has
          # not changed, and an age derived from the last commit would then
          # grow without bound and fire the sync every single run.
          MARKER=data/feed-sync-marker.txt
          NOW=$(date -u +%s)
          LAST=0
          if [ -f "$MARKER" ]; then LAST=$(cat "$MARKER" 2>/dev/null || echo 0); fi
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          AGE=$(( NOW - LAST ))
          # Five hours, not six: with a two hourly cron the eligible run lands
          # at roughly six hour spacing, and a six hour threshold would push
          # every other attempt just under the line and stretch it to eight.
          if [ "${{ inputs.awin_feed_sync }}" = "true" ] || [ "$AGE" -ge 18000 ]; then
            npm run awin:feed-sync
            # Ordering here is load-bearing in both directions. The sync
            # overwrites each feed retailer's snapshot with whatever the feed
            # currently says, so a correction applied before it would be
            # silently discarded — both steps would still report success. And
            # the rebuild below has to see the corrected prices, not the
            # feed's. See scripts/storefront-reprice.ts.
            #
            # A failure here is contained rather than fatal, but it cannot be
            # ignored either: the sync has already replaced the snapshot with
            # raw feed prices, and for a retailer flagged
            # storefrontIsPriceAuthority those are the prices measured wrong on
            # seven listings in ten. Publishing them because the correction
            # crashed would be worse than publishing nothing new, so the
            # snapshot is rolled back to the last corrected state and the
            # rebuild is skipped. The harvest below still runs: this must not
            # be able to take the whole job down, which is what an unguarded
            # failure in a step this late would do.
            if npm run storefront:reprice; then
              if ! git diff --quiet -- data/catalogue data/awin-feed-sync-state.json; then
                npm run catalogue:demo
                npm run catalogue:history
                npm run demo
              fi
              echo "$NOW" > "$MARKER"
            else
              echo "::warning::storefront reprice failed. Reverting the feed sync so uncorrected feed prices are not published, and leaving the previous snapshot in place."
              git checkout -- data/catalogue data/awin-feed-sync-state.json || true
            fi
          else
            echo "Last feed sync was $(( AGE / 60 )) minutes ago, under the five hour threshold — skipping."
          fi

      - name: Commit synced Awin feeds
        if: ${{ inputs.awin_feed_sync || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Awin feed sync: $(date -u +%Y-%m-%d)" \
            data/catalogue data/awin-feed-sync-state.json data/storefront-reprice-report.json \
            data/feed-sync-marker.txt \
            demo/catalogue.generated.ts \
            demo/priceHistory.generated.ts demo/index.html demo/404.html

      # Manual-only debug aid: prints the column headers and the values of
      # price-ish columns for one matched product row in one named Awin
      # retailer's feed. Writes nothing, commits nothing. Only ever prints
      # column names and one product's price-ish values — see
      # scripts/awin-feed-diag.ts's own header comment for what it withholds
      # and why (never the feed URL, never a full row).
      # Answers "which programmes have accepted me" from the feed list's own
      # membershipStatus column, rather than from the feed *count*, which is
      # the thing that reads like an answer and is not one: the sync logs "N
      # feed(s) visible on this Awin account", and visible is not joined.
      # Reads only — writes nothing, commits nothing, prints no feed URL.
      - name: Awin memberships
        if: ${{ inputs.awin_memberships }}
        env:
          AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
        run: npm run awin:memberships

      - name: Awin feed diagnostic
        if: ${{ inputs.awin_feed_diag_shop != '' }}
        env:
          AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
        run: |
          npm run awin:feed-diag -- \
            "--shop=${{ inputs.awin_feed_diag_shop }}" \
            ${{ inputs.awin_feed_diag_match && format('"--match={0}"', inputs.awin_feed_diag_match) || '' }} \
            ${{ inputs.awin_feed_diag_sku && format('"--sku={0}"', inputs.awin_feed_diag_sku) || '' }}

      # "Top Deals Today" moves on its own fixed 6-hourly cadence rather than
      # every hourly tick like everything else — see scripts/build-deals.ts's
      # own header comment for why.
      #
      # Ordered here, near the top of the run, for a specific reason: the
      # sitemap harvest below takes ~38 minutes. With this step after it, the
      # 00:00 tick did not actually publish its deals until ~00:45, so a
      # snapshot named for midnight went live three quarters of an hour late,
      # four times a day. Running it here instead publishes within a couple of
      # minutes of the hour, against the Awin feeds just synced above plus the
      # scraped prices committed by the previous hourly run — which finished
      # around :48 of the previous hour, so nothing it reads is more than an
      # hour old, and the two thirds of the catalogue that comes from feeds is
      # seconds old. Fresh and on time beats fresher and late for a snapshot
      # whose whole purpose is a fixed publication time.
      #
      # The rebuild only happens if the snapshot actually changed: an unchanged
      # deals list costs nothing further.
      - name: Refresh Top Deals Today
        if: ${{ inputs.deals_refresh || github.event_name == 'schedule' }}
        run: |
          # Age based for the same reason as the feed sync above: a scheduled
          # run starts when a runner is free, not when the cron said, so an
          # exact-hour test skips silently and indefinitely once the drift
          # settles on odd hours. Deals are meant to move on a six hourly
          # cadence so a reader is not watching the list reshuffle mid visit
          # (see scripts/build-deals.ts) — that intent is preserved here, it is
          # just measured in elapsed time rather than read off the clock.
          MARKER=data/deals-refresh-marker.txt
          NOW=$(date -u +%s)
          LAST=0
          if [ -f "$MARKER" ]; then LAST=$(cat "$MARKER" 2>/dev/null || echo 0); fi
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          AGE=$(( NOW - LAST ))
          if [ "${{ inputs.deals_refresh }}" = "true" ] || [ "$AGE" -ge 18000 ]; then
            npm run deals:build
            if ! git diff --quiet -- demo/deals.generated.ts; then
              npm run demo
            fi
            echo "$NOW" > "$MARKER"
          else
            echo "Last deals refresh was $(( AGE / 60 )) minutes ago, under the five hour threshold — skipping."
          fi

      - name: Commit refreshed deals
        if: ${{ inputs.deals_refresh || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Top Deals Today: $(date -u +%Y-%m-%d)" \
            demo/deals.generated.ts data/deals-refresh-marker.txt demo/index.html demo/404.html

      # The route the probe proved works: ask the sitemap instead of guessing.
      # This is now what runs every night, not just on request. The plain
      # `catalogue` crawl below has never returned a single listing from these
      # shops live — every listing this project has ever shown came from the
      # sitemap route, so the schedule has to use it, not the older path.
      #
      # "Never returned a listing" rather than the "never once succeeded" this
      # comment used to claim: the step itself has exited 0 seven times, and
      # the distinction turns out to matter. See the Crawl step's own comment
      # below for the seven runs, what they actually wrote, and why that is not
      # a reason to keep dispatching it.
      #
      # --allow-metered is harmless to pass even with neither secret
      # configured: the harvest script checks for APIFY_PROXY_PASSWORD and
      # APIFY_TOKEN itself and simply skips the tier whose secret is absent,
      # logging that it did so. Both tiers only ever fire for shops the
      # cheaper route(s) before them returned nothing for — see
      # src/catalogue/apifyActor.ts and this step's own comment in
      # scripts/catalogue-harvest.ts for why a residential IP (the proxy) and
      # a real browser (the actor) fix genuinely different failures, and are
      # gated independently so either secret can be added on its own.
      #
      # The actor tier's budget (MAX_ACTOR_PAGES_PER_RUN, currently 10) is
      # shared across every shop that reaches it in one run, spent in
      # RETAILERS' own list order with no rotation. Once real usage exists,
      # a shop late in that order could starve every run if more shops need
      # rendering than the budget covers — worth watching once APIFY_TOKEN is
      # actually set, not a problem yet while the tier has never fired for
      # real.
      #
      # Budget and refresh share.
      #
      # This was --max=120 --refresh-share=0.7 for a few hours on 2026-08-11,
      # on an estimate that it would cost "about 6 extra minutes" per run. That
      # estimate was wrong, and the real cost showed up directly rather than as
      # a rounding error: run #143's harvest step took 63 minutes (was ~38),
      # and the run was killed by the 75-minute job timeout before it could
      # commit anything. #144, the run right after it, was killed the same way
      # and committed nothing at all — a full hour of crawling, discarded. Both
      # failures landed the same week five more shops (the delivery-not-stated
      # group plus Emirates Oud) were added to the same sweep, which was never
      # accounted for in the original estimate.
      #
      # Pulled back to --max=70 --refresh-share=0.4: a shop sees 28 of its
      # listings re-priced per run (was 18 before the regression, 84 during
      # it), 168 in a 6-hour window. That is a real improvement over the
      # original 108, just a much smaller one than 120/0.7 claimed — and
      # unlike that number, a run at this size has actually been observed to
      # finish and commit. Re-measure before raising it again, on the size of
      # the shop list as it stands at the time, not the list from whenever
      # this comment was last true.
      #
      # The feed sync above is unaffected by any of this: it refreshes its
      # 9,820 listings completely every 6 hours regardless of what this step
      # does, and is what genuinely delivers a 6-hourly refresh for that part
      # of the catalogue.
      #
      # ── Why this step is capped, and why that is not a loss ──────────────────
      # This is the step run #180 died in, and it is the reason this whole
      # pattern is here. #180 harvested from 21:26:08Z to 22:14:44Z — 48m36s —
      # and its log shows it had already stored LOOKFANTASTIC (55 active), The
      # Fragrance Counter (27), ScentStore (15), Glorious Beauty (49), BellaVita
      # Luxury (27) and Oud Arabian (173) before the job's own 100-minute cap
      # landed mid-way through Manchester Ouds. Every one of those was on disk.
      # None of it was committed, because a job timeout cancels the step and
      # every step after it, so "Commit harvested prices" was never reached.
      # The catalogue stayed at the previous run's state and 48 minutes of real
      # harvesting went in the bin.
      #
      # scripts/catalogue-harvest.ts calls store.write() inside its per-shop
      # loop, so the shops it has finished are durable the moment they finish —
      # this step was already resumable, and nothing was resuming it. A step cap
      # plus continue-on-error is the whole fix: the cap ends the harvest while
      # there is still time to publish, continue-on-error lets the job carry on,
      # and the commit step below saves the shops that did complete. Same
      # pattern, same reasoning, as the two steps that already carry one.
      # src/catalogue/store.ts writes via a rename so a shop cut off mid-write
      # leaves the previous snapshot rather than a truncated file.
      #
      # 60 minutes is what the run can afford, not what the harvest wants. The
      # job cap is 100 and cannot go higher — see its comment — so the budget is
      # 100 minus everything that has to happen before this step (checkout,
      # tests and the three periodic stages: ~19 minutes when all of them fire
      # at their own caps) minus everything that has to happen after it to reach
      # the commit (houses at its 15-minute cap, ~1m20s rebuild, ~1m30s push):
      # 100 - 19 - 18 = 63, less a margin. The harvest has been measured at
      # 52m56s (#179), 53m21s (#177), 53m46s (#176), 54m04s (#178) and 59m05s
      # (#172), so 60 clears every observed run — but only just, and #172 is
      # within a minute of it. If truncation starts showing up in the warning
      # below on ordinary runs, the answer is a smaller --max or --refresh-share
      # here, or shops split across runs: it is not a higher cap, because the
      # two-hourly cron is what bounds the job and there is nothing left to give.
      - name: Harvest via sitemap
        id: harvest
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        continue-on-error: true
        timeout-minutes: 60
        env:
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          npm run harvest -- \
            --max=${{ inputs.harvest_max || '70' }} \
            --refresh-share=${{ inputs.harvest_refresh_share || '0.4' }} \
            ${{ inputs.harvest_shop && format('--shop={0}', inputs.harvest_shop) || '' }} \
            ${{ inputs.harvest_gap_min && format('--gap-min={0}', inputs.harvest_gap_min) || '' }} \
            ${{ (inputs.allow_metered || github.event_name == 'schedule') && '--allow-metered' || '' }}

      # The Middle Eastern houses sell direct rather than through the UK shops
      # above, so nothing in the sitemap harvest reaches them. This reads their
      # own storefronts with no API key (Shopify's public products.json where
      # they run it, sitemap + JSON-LD otherwise) and records what it genuinely
      # got, including "nothing" — see scripts/houses-harvest.ts.
      #
      # Never fails the job: a house refusing us is a fact to record, not a
      # reason to lose the retailer harvest that already succeeded above.
      #
      # continue-on-error alone was not enough, because a *job* timeout ignores
      # it — it cancels the step and every step after it. That is precisely how
      # run #157 lost an entire hour of harvesting: the sitemap harvest had
      # finished successfully at 07:18:58Z, this step was still going at
      # 07:27:47Z when the job's own cap landed, and "Commit harvested prices"
      # was never reached. The step timeout is what makes the promise in the
      # paragraph above actually hold: houses have taken 6m48s (#158) and 7m09s
      # (#153), so 15 minutes is roughly double the observed cost, and a house
      # that hangs past it now costs this run its house data and nothing else.
      - name: Harvest houses direct
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        continue-on-error: true
        timeout-minutes: 15
        run: npm run houses

      - name: Rebuild the app from harvested prices
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          npm run catalogue:demo
          npm run catalogue:history
          npm run demo

      - name: Commit harvested prices
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Harvest: real prices $(date -u +%Y-%m-%d)" \
            data/catalogue demo/catalogue.generated.ts demo/priceHistory.generated.ts \
            demo/index.html demo/404.html \
            data/houses data/house-sourcing-report.json

      # Deliberately after the commit above, and deliberately a warning rather
      # than a failure.
      #
      # After, because the ordering is the point: whatever the harvest managed
      # is published first, and only then does the run say the harvest was
      # short. A step that failed the job here would put us back where #180 was.
      #
      # A warning, because a truncated harvest is a degraded run, not a broken
      # one — the shops that completed are live, and the ones that did not are
      # first in line next cycle. Failing on it would paint the workflow red
      # every time the catalogue outgrew a budget, and this file already has the
      # argument for why that is worse than useless: runs #166 and #167 went red
      # for something nobody needed to act on, and "a red run that means nothing
      # trains everyone to ignore the red."
      #
      # `outcome` rather than `conclusion`: continue-on-error rewrites
      # conclusion to success, and outcome is what still holds the real result.
      - name: Note an incomplete harvest
        if: ${{ (inputs.harvest || github.event_name == 'schedule') && steps.harvest.outcome == 'failure' }}
        run: |
          echo "::warning::The sitemap harvest did not run to completion — it hit its 60 minute cap or exited non-zero. Whatever it had already stored per shop has been committed by the step above; the shops it did not reach keep their previous prices and are picked up by the next run. Check the harvest step's log for where it stopped."

      # No product photo is ever downloaded or hosted here — every tile links
      # straight to the retailer's own image URL (see demo/photo.ts) — so a
      # retailer reshuffling their CDN silently breaks a tile with nothing
      # else here noticing. This is a report only: it does not change what a
      # fragrance's photoUrl is, only records which ones stopped resolving.
      #
      # Bounded and best-effort for the same reason as the houses step above,
      # and with more cause: this is the last step in the run, it is a report
      # nothing else reads yet, and its cost grows with the catalogue rather
      # than staying put. It took 4m47s on run #153 and was still going 6m47s
      # in on #158 — by then 24,276 distinct URLs, up with every listing added.
      # #158 had already committed its harvest when this step was cancelled, so
      # the only thing the job timeout actually destroyed there was this
      # report, and it marked the whole run "cancelled" to do it.
      #
      # Two passes now, not one. The broken-link sweep is scoped to only the
      # retailers whose photos an `imageBasis` actually lets a reader see (see
      # scripts/image-link-check.ts's header) and separates a real HTTP
      # response from a connection failure that is ours, never counting the
      # second as broken — the first version of this report conflated them and
      # called 20,317 of its own dropped connections "broken images". The
      # second pass is Bug 2's referer-sensitivity sample: it fetches a sample
      # of each shown retailer's images once with a pricesniffs.space referer
      # and once with none, because that second, refererless request is what
      # this site's own <img referrerpolicy="no-referrer"> tags actually send
      # (demo/photo.ts) — a host that only serves the first would show a real
      # reader a broken tile. Its report is committed here too, since this is
      # the one step of this file scripts/image-link-check.ts's owner may
      # touch; the scheduled "Commit image link report" step below still
      # handles data/image-link-report.json on its own.
      #
      # 20 minutes, up from 15, for the second pass's requests; still
      # best-effort, and a run that overruns it loses these two reports rather
      # than its status.
      - name: Check image links
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          npm run images:check
          npm run images:check -- --referer-check
          ./scripts/commit-and-push.sh \
            "Image referer check: $(date -u +%Y-%m-%d)" \
            data/image-referer-report.json

      - name: Commit image link report
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Image links: $(date -u +%Y-%m-%d)" \
            data/image-link-report.json

      # Kept for manual comparison against the old guessed-URL approach and for
      # --source=fixtures testing. Deliberately never runs on schedule.
      #
      # Now behind its own `crawl` input rather than "nothing else was picked".
      # That fall-through is what made every bare dispatch end red: this step's
      # condition used to be satisfied by *not* asking for a probe or a
      # harvest, so a dispatch sent purely to run the Awin feed diagnostic, or
      # a shipping discover, or a one-off deals refresh, fell through to a live
      # crawl it had never asked for and failed on it. Runs #166 and #167
      # (2026-08-12 22:19Z and 22:22Z) are both exactly that: "Awin feed
      # diagnostic" succeeded, every other step skipped, and step 21 "Crawl"
      # failed and took the run down with it. Scheduled runs never hit it —
      # `github.event_name != 'schedule'` excluded them — so the whole thing
      # was invisible unless you dispatched. A red run that means nothing is
      # worse than no run: it trains everyone to ignore the red.
      #
      # Why this is gated rather than deleted. The comment here used to say the
      # crawl "has a 0% success rate against the live shops" and the one above
      # the harvest said it "has never once succeeded live". The first is true,
      # the second is not, and the difference is the reason the step stays:
      #
      #   - It has exited 0 seven times, all live dispatches between
      #     2026-08-05 and 2026-08-11 (runs #30, #31, #34, #44, #129, #138,
      #     #142 — #142's step conclusion read straight off the jobs API is
      #     "success"). Each produced a real commit; `git log --grep='^Catalogue: '`
      #     lists all seven.
      #   - It has never returned a listing. Every one of those seven runs is
      #     recorded in data/catalogue/{escentual,scentstore}.json as
      #     `"status": "ok", "listingsSeen": 0` — HTTP 200 carrying no product
      #     markup. The other 16 shops failed outright every time. So the
      #     commits are empty bookkeeping, and docs/SPIKE-RESULTS.md's 0% is
      #     the accurate figure.
      #   - Those seven exit-0s were an artefact, not a capability. A shop
      #     returning nothing counts as ok only while it holds nothing:
      #     COLLAPSE_FLOOR in src/catalogue/crawl.ts refuses a write that drops
      #     below half the held listings and marks the run failed. escentual
      #     and scentstore were the only two shops still holding an empty
      #     snapshot. Once the sitemap harvest filled them the guard started
      #     firing on them too, which is why #167 logs "0 shops crawled, 18
      #     failed" and catalogue-run.ts's `if (ok === 0)` exits 1.
      #
      # So against live shops this can now only fail, and gating it on an
      # explicit tick is what stops that failure landing on people who did not
      # ask for it. It is not dead code: --source=fixtures still replays the
      # eight snapshots under data/catalogue that carry real fixture listings
      # (boots, notino-uk, john-lewis and five others, 7-9 listings each), and
      # that is the path that exercises crawl.ts end to end. Deleting the step
      # would take that with it. Untick-by-default, keep the code.
      - name: Crawl
        if: ${{ inputs.crawl }}
        run: |
          npm run catalogue -- \
            --source=${{ inputs.source || 'live' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild the app from the new snapshots
        if: ${{ inputs.crawl && !inputs.dry_run }}
        run: |
          npm run catalogue:demo
          npm run demo

      - name: Commit what changed
        if: ${{ inputs.crawl && !inputs.dry_run }}
        run: |
          ./scripts/commit-and-push.sh \
            "Catalogue: $(date -u +%Y-%m-%d)" \
            data/catalogue demo/catalogue.generated.ts demo/index.html demo/404.html

      # Keep the failure loud. A crawl that quietly stops working leaves stale
      # prices on the site, which is worse than showing nothing.
      - name: Report failure
        if: failure()
        run: echo "::error::Catalogue crawl failed. Prices on the site are now stale."
