name: Catalogue crawl

# Runs at the top of every hour and commits the resulting snapshots. The
# commit is the audit trail: the diff shows exactly which products a shop
# added, dropped or repriced since the last run.
#
# Hourly is genuinely free right now: the sitemap harvest against the four
# working shops costs nothing, and --allow-metered below is a no op unless
# the APIFY_PROXY_PASSWORD secret is set, which it currently is not. If that
# secret is ever added, every hourly tick would retry the blocked shops
# through the paid residential proxy, multiplying that cost by roughly 24
# compared to the old once a day schedule — worth revisiting the cadence at
# that point rather than assuming this comment still holds.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'live crawls the shops, fixtures replays saved pages'
        type: choice
        options: [live, fixtures]
        default: live
      dry_run:
        description: 'Fetch and report without writing. Use this the first time.'
        type: boolean
        default: false
      probe:
        description: 'Run the adaptive retrieval probe instead of the crawl.'
        type: boolean
        default: false
      harvest:
        description: 'Harvest real listings through each shop sitemap.'
        type: boolean
        default: false
      harvest_max:
        description: 'Product pages to fetch per shop during a harvest.'
        type: string
        default: '40'
      allow_metered:
        description: 'Retry genuinely blocked shops through the Apify proxy. Requires the APIFY_PROXY_PASSWORD secret. Costs money.'
        type: boolean
        default: false
      shipping_discover:
        description: "Read disabled shops' own delivery pages and report what they say. Writes a report only, never the registry."
        type: boolean
        default: false
      awin_feed_sync:
        description: 'Sync every affiliate-feed retailer against the Awin Feed List Download URL. Requires the AWIN_FEED_LIST_URL secret.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Two crawls writing snapshots at once would race and lose listings.
  group: catalogue
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Measured, not guessed: the "Harvest via sitemap" step alone took 38m55s
    # on run #122 (2026-08-10) and 25m29s on run #123 the same day — politeness
    # delays across a dozen shops make this inherently slow and genuinely
    # variable, not stuck. At the old 45-minute cap that variance meant a
    # scheduled run was cancelled mid-pipeline more often than it finished (6
    # of the 8 runs immediately before this change), almost always partway
    # through "Harvest houses direct" or the rebuild — after the slow part had
    # already happened, but before "Commit harvested prices" could run. The
    # harvest was real and complete; it was just never saved, so the site
    # quietly went a full hour without the fresher data that hour's run had
    # already gathered. 75 minutes gives the slowest observed run (~49
    # minutes end to end, reconstructed from its own step timings) real
    # headroom, including room for the catalogue's steady growth to make the
    # rebuild and image-check steps a little slower over time, without
    # papering over an actual hang: every cancelled run inspected while
    # diagnosing this showed steady progress right up to the cutoff, never a
    # step stuck doing nothing, so there was no runaway process here to guard
    # against — only too little time for real, finite work.
    timeout-minutes: 75

    steps:
      # fetch-depth: 0 is load-bearing, not a nicety. actions/checkout@v4
      # defaults to a shallow clone (depth 1) — fine for every other step
      # here, which only ever look at the working tree — but
      # scripts/build-price-history.ts replays the *entire* commit history of
      # data/catalogue via `git log`/`git show` to reconstruct a real price
      # history. Against a depth-1 clone it would silently see only this run's
      # single commit, rebuild demo/priceHistory.generated.ts from just that
      # one point, and never accumulate history from here on — with no error,
      # nothing failing, just a chart that quietly never grows past one dot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The crawl must not ship if the reconciliation logic is broken. A bad
      # diff here corrupts firstSeenAt for every listing, and that cannot be
      # recovered from a later run: the NEW badge would be wrong for a week.
      - name: Test before crawling
        run: npm test

      # Tries several retrieval strategies per shop, ordered by what has worked
      # before, and commits what it learned so tomorrow starts smarter.
      - name: Adaptive probe
        if: ${{ inputs.probe }}
        run: npm run probe

      - name: Commit what the probe learned
        if: ${{ inputs.probe }}
        run: |
          ./scripts/commit-and-push.sh \
            "Probe: what the crawler learned $(date -u +%Y-%m-%d)" \
            data/strategy-memory.json

      # Reads each disabled shop's own delivery page, because the flat standard
      # rate is what keeps them disabled and it is not findable by research —
      # shops advertise the free-over threshold and bury the rate below it.
      #
      # Report only. This step cannot enable a retailer or set standardGbp:
      # delivered price is the default sort, so a wrong-low delivery charge
      # makes a shop falsely win it. A human reads the quoted sentence and
      # types the number. See scripts/shipping-discover.ts.
      #
      # Twice a day rather than hourly: a shop revises its delivery terms a few
      # times a year, so checking every hour would be 24 times the requests to
      # learn the same thing. 06:00 and 18:00 UTC are picked off the hourly
      # schedule below rather than by adding a second cron, because two crons
      # both firing at those hours would run the whole harvest twice.
      - name: Discover shipping terms
        if: ${{ inputs.shipping_discover || github.event_name == 'schedule' }}
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ inputs.shipping_discover }}" = "true" ] || [ "$HOUR" = "06" ] || [ "$HOUR" = "18" ]; then
            npm run shipping:discover
          else
            echo "Not a 06:00 or 18:00 UTC tick (currently ${HOUR}:00) — skipping."
          fi

      # No-ops when the step above skipped: commit-and-push.sh exits cleanly
      # when nothing changed.
      - name: Commit the shipping report
        if: ${{ inputs.shipping_discover || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Shipping terms: what each delivery page says $(date -u +%Y-%m-%d)" \
            data/shipping-discovery-report.json

      # Every affiliate-feed retailer (adapter: 'affiliate-feed' in
      # src/config/retailers.ts — Fragrance Click UK today) against the Awin
      # Feed List Download URL. Twice a day, same reasoning and the same
      # 06:00/18:00 UTC slots as shipping discovery just above: Awin
      # regenerates a feed roughly daily, so checking it hourly would be 24
      # times the requests to learn the same thing, and both already share
      # this schedule rather than each claiming their own cron.
      #
      # A no-op, not a failure, when AWIN_FEED_LIST_URL is unset — see
      # scripts/awin-feed-sync.ts's own header comment. The rebuild only
      # runs when the sync actually changed something, so an unchanged feed
      # costs one HTTP request and nothing else.
      - name: Sync Awin product feeds
        if: ${{ inputs.awin_feed_sync || github.event_name == 'schedule' }}
        env:
          AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ inputs.awin_feed_sync }}" = "true" ] || [ "$HOUR" = "06" ] || [ "$HOUR" = "18" ]; then
            npm run awin:feed-sync
            if ! git diff --quiet -- data/catalogue data/awin-feed-sync-state.json; then
              npm run catalogue:demo
              npm run catalogue:history
              npm run demo
            fi
          else
            echo "Not a 06:00 or 18:00 UTC tick (currently ${HOUR}:00) — skipping."
          fi

      - name: Commit synced Awin feeds
        if: ${{ inputs.awin_feed_sync || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Awin feed sync: $(date -u +%Y-%m-%d)" \
            data/catalogue data/awin-feed-sync-state.json demo/catalogue.generated.ts \
            demo/priceHistory.generated.ts demo/index.html demo/404.html

      # The route the probe proved works: ask the sitemap instead of guessing.
      # This is now what runs every night, not just on request. The plain
      # `catalogue` crawl below has never once succeeded live against these
      # shops — every listing this project has ever shown came from the
      # sitemap route, so the schedule has to use it, not the older path.
      #
      # --allow-metered is harmless to pass even with no secret configured:
      # the harvest script checks for APIFY_PROXY_PASSWORD itself and simply
      # skips proxied retrieval if it is absent, logging that it did so. It
      # only ever fires for shops the free route returned nothing for.
      - name: Harvest via sitemap
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        env:
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
        run: |
          npm run harvest -- \
            --max=${{ inputs.harvest_max || '60' }} \
            ${{ (inputs.allow_metered || github.event_name == 'schedule') && '--allow-metered' || '' }}

      # The Middle Eastern houses sell direct rather than through the UK shops
      # above, so nothing in the sitemap harvest reaches them. This reads their
      # own storefronts with no API key (Shopify's public products.json where
      # they run it, sitemap + JSON-LD otherwise) and records what it genuinely
      # got, including "nothing" — see scripts/houses-harvest.ts.
      #
      # Never fails the job: a house refusing us is a fact to record, not a
      # reason to lose the retailer harvest that already succeeded above.
      - name: Harvest houses direct
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        continue-on-error: true
        run: npm run houses

      - name: Rebuild the app from harvested prices
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          npm run catalogue:demo
          npm run catalogue:history
          npm run demo

      - name: Commit harvested prices
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Harvest: real prices $(date -u +%Y-%m-%d)" \
            data/catalogue demo/catalogue.generated.ts demo/priceHistory.generated.ts \
            demo/index.html demo/404.html \
            data/houses data/house-sourcing-report.json

      # No product photo is ever downloaded or hosted here — every tile links
      # straight to the retailer's own image URL (see demo/photo.ts) — so a
      # retailer reshuffling their CDN silently breaks a tile with nothing
      # else here noticing. This is a report only: it does not change what a
      # fragrance's photoUrl is, only records which ones stopped resolving.
      - name: Check image links
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: npm run images:check

      - name: Commit image link report
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Image links: $(date -u +%Y-%m-%d)" \
            data/image-link-report.json

      # Kept for manual comparison against the old guessed-URL approach and
      # for --source=fixtures testing. Deliberately never runs on schedule:
      # it has a 0% success rate against the live shops (see
      # docs/SPIKE-RESULTS.md) and would just fail the job every night.
      - name: Crawl
        if: ${{ !inputs.probe && !inputs.harvest && github.event_name != 'schedule' }}
        run: |
          npm run catalogue -- \
            --source=${{ inputs.source || 'live' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild the app from the new snapshots
        if: ${{ !inputs.dry_run && !inputs.probe && !inputs.harvest && github.event_name != 'schedule' }}
        run: |
          npm run catalogue:demo
          npm run demo

      - name: Commit what changed
        if: ${{ !inputs.dry_run && !inputs.probe && !inputs.harvest && github.event_name != 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Catalogue: $(date -u +%Y-%m-%d)" \
            data/catalogue demo/catalogue.generated.ts demo/index.html demo/404.html

      # Keep the failure loud. A crawl that quietly stops working leaves stale
      # prices on the site, which is worse than showing nothing.
      - name: Report failure
        if: failure()
        run: echo "::error::Catalogue crawl failed. Prices on the site are now stale."
