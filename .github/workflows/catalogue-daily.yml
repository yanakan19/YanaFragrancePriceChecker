name: Catalogue crawl

# Runs every three hours and commits the resulting snapshots. The commit is
# the audit trail: the diff shows exactly which products a shop added,
# dropped or repriced since the last run.
#
# Two-hourly, not three, was the schedule from 2026-08-12 to 2026-08-26. The
# reasoning below for going two-hourly was sound at the time (measured then:
# 68-79 minutes end to end) and stopped being true as the pipeline grew a
# local render tier, storefront repricing and more periodic steps alongside
# it: measured over runs #309-#336 (2026-08-23 to 08-26), a clean run now
# takes 87-98 minutes, not 71-79. Against a two-hour cron that leaves as
# little as ~22 minutes of slack instead of the ~40 the schedule was tuned
# for, and the concurrency group's own failure mode below — "the new run
# holds pending, and a *third* tick arriving cancels the one waiting" — was no
# longer the rare case. Counted over that same window: 8 of 30 scheduled runs
# (26.7%) ended cancelled this way. Three-hourly restores the margin the
# reasoning always called for: 90-105 minutes of slack behind a 90-98 minute
# run, comfortably ahead of the next tick.
#
# This is not a cut in service, for the same reason the 2026-08-12 move
# wasn't: a nominal cadence nobody actually receives is not real service. That
# 30-run window nominally offered 12 ticks/day but only delivered 19 clean
# runs against 30 attempts (63.3%) once cancellations and the sitemap-gate
# failures fixed the same day are counted — effectively ~7.6 clean
# runs/day. Three-hourly offers 8 ticks/day with the margin to land nearly
# all of them, which is a higher delivered rate, not a lower one.
#
# The three periodic steps below (Awin sync, Top Deals, shipping discovery) no
# longer key off the clock reading a particular hour. They did, and it broke:
# a scheduled run starts when a runner is free, not when the cron said, and
# once the drift settled on odd hours those steps skipped every cycle in
# silence. They now gate on time elapsed since they last ran, so their own
# cadence holds however late a run starts, and none of it changes with this
# move to three-hourly either. See each step for its own threshold.
#
# --allow-metered below is a no op unless APIFY_PROXY_PASSWORD or APIFY_TOKEN
# is set. Both are now set: this comment used to end "and neither currently
# is", which stopped being true when APIFY_TOKEN was added, and the warning it
# then gave — watch the cost closely, the actor tier runs about ten times the
# proxy's per-page cost — turned out to be the right warning ignored. The $5
# monthly free credit ran out on 2026-08-21, mid-month, and the first anyone
# knew was Apify's billing email.
#
# What changed as a result: scripts/catalogue-harvest.ts now asks Apify what
# the month has cost before it spends anything, and switches both metered
# tiers off for the run once the credit is at 90% or gone (see
# src/catalogue/apifyUsage.ts). That check is free and consumes no compute
# units. It is a backstop, not a budget — it can only stop the next run, so
# the per-run cap in apifyActor.ts still does the actual rationing.
#
# The five shops that need the actor tier (Boots, Selfridges, John Lewis,
# Superdrug, Zara) therefore go quiet for the rest of a month whose credit is
# spent, and resume when it resets. Every other shop is unaffected: the
# sitemap/JSON-LD route costs nothing.
#
# ── 2026-09-01: the schedule was starving itself, not colliding with itself ──
# The reasoning above sizes the crawl comfortably inside its own concurrency
# group — it does not explain why the cadence it delivers falls so far short
# of what "every three hours" promises. Measured off every schedule-event run
# since the three-hourly cron in 1b009d0c took effect (run #339,
# 2026-08-26T12:53:27Z, through run #364, 2026-09-01T00:25:12Z — 131.7 hours,
# read from the GitHub Actions API, not guessed): 21 schedule-triggered runs
# landed against ~44 ticks a strict 3-hourly cron should have fired in that
# span — a 48% delivery rate. The 20 gaps between those 21 runs range 2h34m
# (runs #359→#360) to 14h43m (runs #349→#350), mean 6h35m, median 5h03m —
# both roughly double the nominal 3h.
#
# None of this is the concurrency group. A prior investigation (not itself
# recorded in this file — taken as given here, not rechecked) already found
# the concurrency group idle at 5 of 6 sampled missing-tick times, with the
# 6th inconsistent with GitHub's documented queueing behaviour. The run
# durations measured in this same window independently point the same way:
# the 20 completed runs took 76m56s-96m34s, mean 86m44s — even the longest
# leaves ~83 minutes of slack behind a 180-minute cron, so a run still going
# when the next tick is due is not the common case.
#
# What the pattern does match, exactly, is GitHub's own documented behaviour
# for the `schedule` trigger: "The schedule event can be delayed during
# periods of high loads of GitHub Actions workflow runs. High load times
# include the start of every hour. If the load is sufficiently high enough,
# some queued jobs may be dropped." (GitHub Docs, "Events that trigger
# workflows", under the `schedule` heading —
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows.)
# `cron: '0 */3 * * *'` fires at minute 0 every time: literally every one of
# this workflow's ~44 expected ticks in the measured window landed on the
# exact high-load instant GitHub's own docs name — which the two other
# scheduled workflows in this repo already avoid (image-check.yml fires at
# :20, price-verify.yml at :40).
#
# The fix below is the candidate the owner asked to be evaluated: fire far
# more often (hourly, at a non-zero minute so each attempt is not itself
# aimed at the worst instant of the hour) and add a cheap guard that only
# lets a real harvest through once enough time has genuinely passed since
# the last one committed. A dropped tick under the old cron cost 3+ hours of
# staleness, sometimes 14; under this one it costs at most the wait to the
# next hourly attempt, because there are now ~8x as many chances to catch a
# tick GitHub is willing to deliver.
#
# ── Why a separate job, not an early-exit step inside `crawl` ──────────────
# `guard` below runs on every trigger and decides whether `crawl` runs at
# all, via `needs`/`if`, rather than an early exit inside the job. That
# split is deliberate: an early exit inside `crawl` would still have to pay
# for checkout, `npm ci` and the Chromium install for the local-render tier
# before discovering it should skip. A separate job means a skipped hour
# costs one runner boot and one read-only API call — no checkout, no
# dependencies — and it never enters the `catalogue` concurrency group at
# all, so an hourly skip-check can never queue behind, or get cancelled
# ahead of, a real harvest still in flight. `permissions: contents: read` on
# `guard` reflects that it only ever reads.
#
# The guard reads the timestamp of the most recent commit that touched
# data/harvest-cursor.json — the file "Commit harvested prices" writes on
# every harvest attempt, truncated or not — via the GitHub commits API, not
# a marker file. A marker file is what every other age-gated step in this
# job already uses (Discover shipping terms, Sync Awin product feeds,
# Refresh Top Deals Today below), and it is the wrong shape specifically
# here: those steps gate themselves, written by the same process that reads
# them, inside a job already committed to running this trigger. This gate
# decides whether the job runs at all, before checkout — a marker file
# would not even be checked out yet to read, and adding one more
# committed-but-fragile state file to depend on is exactly the shape of
# incident docs/DECISIONS.md's D10/D12 already are. Commit history cannot
# drift out of sync with what actually happened; it is what happened.
#
# 150 minutes (9000s), not 180: gating on the previous harvest's commit time
# (necessarily its completion, not its start — the file is only written
# once, at the end) means the achieved start-to-start interval is threshold
# plus that run's own duration, roughly 150 + 87 = 237 minutes in the common
# case — closer to the original 3-hour design than 180 would be (180 + 87 =
# 267 minutes). It also stays comfortably above the 76-97 minute range runs
# are actually measured at, so the guard does not routinely fire while a run
# it should be waiting on is still in progress.
#
# If the API read itself fails (rate limit, outage, network hiccup) the
# guard runs the harvest in full rather than guess a skip — see the step
# below. Guessing wrong in the "skip" direction is the one thing this design
# exists to stop happening silently.
#
# ── The cost, honestly ──────────────────────────────────────────────────
# `guard` adds 24 job-starts/day at GitHub's 1-minute billing floor: ~24
# billable minutes/day this did not cost before, for a runner boot and one
# curl call each.
#
# `crawl` itself is now capped by the 150-minute guard rather than by
# whichever ticks happen to land, so its ceiling is real: at most one
# harvest every ~237 minutes if every hourly attempt after the threshold
# landed, ~6.1/day — below the 8/day this cron was already provisioned and
# budgeted for at the 2026-08-26 three-hourly move, and above what it has
# actually been delivering (21 runs / 5.49 days ≈ 3.8/day, measured this
# window). So the worst case does not exceed the budget this schedule was
# already sized against; the realistic case is a meaningful recovery toward
# it, not past it. None of the per-shop Apify spend changes: the actor
# tier's own 20-hour marker gate (data/metered-harvest-marker.txt) and the
# independent age gates on shipping discovery, Awin sync and deals all cap
# themselves on elapsed time already, regardless of how often the outer job
# runs.
on:
  schedule:
    # Hourly, 15 minutes past the hour — not on it. See the section above:
    # every prior tick fired at minute 0, GitHub's own documented worst
    # instant to ask for a runner. `guard` below decides which of these 24
    # daily attempts actually does anything.
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      crawl:
        description: 'Run the legacy section-URL crawl. Off by default — see the Crawl step for why, and read it before ticking this.'
        type: boolean
        default: false
      source:
        description: 'Applies to the legacy crawl above only: live crawls the shops, fixtures replays saved pages.'
        type: choice
        options: [live, fixtures]
        default: live
      dry_run:
        description: 'Applies to the legacy crawl above only. Fetch and report without writing.'
        type: boolean
        default: false
      probe:
        description: 'Run the adaptive retrieval probe instead of the crawl.'
        type: boolean
        default: false
      probe_shop:
        description: 'Limit the probe to one retailer id (e.g. very). Bypasses that retailer''s own enabled flag, so a disabled candidate can be probed without switching it on — see catalogue-probe.ts. Empty probes every enabled shop, same as the schedule.'
        type: string
        default: ''
      harvest:
        description: 'Harvest real listings through each shop sitemap.'
        type: boolean
        default: false
      harvest_max:
        description: 'Product pages to fetch per shop during a harvest.'
        type: string
        default: '40'
      harvest_shop:
        description: 'Limit the harvest to one retailer id (e.g. lookfantastic). Empty runs every enabled shop, same as the schedule.'
        type: string
        default: ''
      harvest_gap_min:
        description: 'Floor on the delay between requests, in ms, on top of the registry/robots.txt gap. Use for a gentler deep run against one shop after a normal-pace run got throttled.'
        type: string
        default: ''
      harvest_refresh_share:
        description: 'Share of each shop budget (0-1) spent re-pricing listings already held, oldest first, rather than discovering new ones. Empty uses the scheduled default.'
        type: string
        default: ''
      allow_metered:
        description: 'Retry genuinely blocked shops through the Apify proxy (APIFY_PROXY_PASSWORD) and, for shops that stay at zero, a real-browser Apify actor render (APIFY_TOKEN). Each fires independently only if its own secret is set. Costs money — the actor tier roughly ten times more per page than the proxy tier.'
        type: boolean
        default: false
      shipping_discover:
        description: "Read disabled shops' own delivery pages and report what they say. Writes a report only, never the registry."
        type: boolean
        default: false
      shipping_raw_shop:
        description: 'Debug: also record the full extracted text of every delivery page fetched for this one retailer id, not just the regex-matched sentences. Empty runs the ordinary discover pass only.'
        type: string
        default: ''
      awin_feed_sync:
        description: 'Sync every affiliate-feed retailer against the Awin Feed List Download URL. Requires the AWIN_FEED_LIST_URL secret.'
        type: boolean
        default: false
      awin_memberships:
        description: 'Report which Awin advertisers this account has actually been accepted onto, and which of those are missing from the registry. Reads only; writes and commits nothing.'
        type: boolean
        default: false
      awin_feed_diag_shop:
        description: 'Debug: print the column headers and price-ish column values for one product in one Awin retailer feed (e.g. mybeauty-boutique). Never writes anything, never prints the feed URL or a full row. Empty runs no diagnostic.'
        type: string
        default: ''
      awin_feed_diag_match:
        description: 'Debug: substring of product_name to match for awin_feed_diag_shop.'
        type: string
        default: ''
      awin_feed_diag_sku:
        description: 'Debug: exact merchant_product_id to match for awin_feed_diag_shop, as an alternative or addition to awin_feed_diag_match.'
        type: string
        default: ''
      deals_refresh:
        description: 'Rebuild the app (catalogue, price history, Top Deals Today) from the catalogue already on the branch, without harvesting first. Deals no longer have a cadence gate of their own to skip — they are rebuilt with the catalogue on every scheduled run — so this is for a deals refresh outside the schedule.'
        type: boolean
        default: false
      tiktok_probe:
        description: 'TikTok Shop pilot: run the bounded Affiliate API credential probe (two read-only calls against the owner''s own creator account). Requires the TIKTOK_APP_KEY / TIKTOK_APP_SECRET / TIKTOK_REFRESH_TOKEN secrets — without them it logs what is missing and exits cleanly. Never runs on schedule; see docs/TIKTOK-SHOP-PLAN.md.'
        type: boolean
        default: false
      capture_render_shop:
        description: 'Debug: save the rendered HTML of one retailer id''s section page(s) verbatim to data/render-capture/<shop>/ and commit it, so a parser gap (e.g. notino-uk) can be fixed against real bytes instead of guessed at. Renders only this one shop — never on schedule, never any other shop in the same dispatch. See src/catalogue/renderCapture.ts.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # Decides whether `crawl` below does real work this trigger. See the dated
  # section above this file's `on:` block for the measurement and the
  # reasoning behind every number here. Deliberately outside the `catalogue`
  # concurrency group and does not check out the repo — see that section for
  # why both are load-bearing, not incidental.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
    steps:
      - name: Decide whether a real harvest is due
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A manual dispatch is a human asking for this run specifically —
          # including the capture_render_shop debug path, which is
          # dispatch-only already — so it is never gated here, whatever the
          # commit history says.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "Not a scheduled tick (event: ${{ github.event_name }}) — runs in full."
            exit 0
          fi
          # data/harvest-cursor.json is written by "Commit harvested prices"
          # on every harvest attempt, complete or truncated by its own
          # deadline — see that step's comment. Reading its commit history
          # rather than a marker file is deliberate; see the dated section
          # above `on:`.
          RESP=$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits?path=data/harvest-cursor.json&sha=${{ github.ref_name }}&per_page=1") || RESP=""
          # `|| LAST_ISO=""` matters under GitHub's default `bash -eo
          # pipefail {0}`: a malformed-but-non-empty $RESP makes jq itself
          # exit non-zero, and pipefail propagates that through the pipe, so
          # without this the step would abort right here — failing CLOSED —
          # instead of falling through to the empty-string branch below,
          # which is the one place this gate is meant to fail open.
          LAST_ISO=$(printf '%s' "$RESP" | jq -r '.[0].commit.committer.date // empty' 2>/dev/null) || LAST_ISO=""
          if [ -z "$LAST_ISO" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not read the last harvest commit's timestamp from the GitHub API — running in full rather than guessing a skip."
            exit 0
          fi
          LAST_EPOCH=$(date -u -d "$LAST_ISO" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE=$(( NOW_EPOCH - LAST_EPOCH ))
          # 150 minutes — see the dated section above `on:` for why this
          # number and not 180.
          THRESHOLD=9000
          if [ "$AGE" -ge "$THRESHOLD" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "Last harvest commit (data/harvest-cursor.json) was $(( AGE / 60 )) minutes ago — due, running in full."
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Last harvest commit was $(( AGE / 60 )) minutes ago, under the 150 minute threshold — skipping this tick."
          fi

  crawl:
    needs: guard
    # `always()` overrides the default implicit success() gate that `needs`
    # adds — load-bearing here: if `guard` fails outright (a runner
    # provisioning problem, not the API read failing closed inside it,
    # which already runs in full on error), a schedule tick should simply
    # be skipped and retried next hour, but a workflow_dispatch must never
    # be skipped by any state of the guard job. The event-type check does
    # not depend on `guard` having succeeded at all, only on what its
    # output says when it did.
    if: always() && (github.event_name != 'schedule' || needs.guard.outputs.should-run == 'true')
    runs-on: ubuntu-latest
    concurrency:
      # Two crawls writing snapshots at once would race and lose listings.
      # Scoped to this job, not the whole workflow, so `guard` above never
      # competes for it — an hourly skip-check must never queue behind, or
      # get cancelled ahead of, a real harvest already running.
      group: catalogue
      cancel-in-progress: false
    # Measured from the runs themselves, not guessed. Every number below is a
    # step duration read off the GitHub jobs API.
    #
    # Run #153 (2026-08-12 00:08Z) is the last run that finished cleanly, and
    # it only just did: 70m48s of a 75-minute cap, of which harvest 56m43s,
    # houses 7m09s, rebuild 50s, commit 61s, image check 4m47s. Four minutes of
    # slack.
    #
    # Runs #154-#158 then took the same pipeline past the cap. #158 is the
    # clearest: harvest 59m14s, houses 6m48s, rebuild 56s, commit 66s — it did
    # reach "Commit harvested prices" and pushed e17cff6 at 09:24:23Z, 68m04s
    # in — and was then killed at 09:31:10Z, exactly 75 minutes after the job
    # started, six minutes into the image check. #155, #156 and #157 each ran
    # 75.3-75.5 minutes wall clock and stopped at the same cap. So the thing
    # that cancelled them was this timeout, not the concurrency group: none of
    # them was ever cancelled while pending, each got a runner immediately and
    # used all 75 minutes of it.
    #
    # #157 is the expensive case and the reason for the size of the number
    # below. It was an 06:00 tick, so it also paid for "Discover shipping
    # terms" (5m34s), the Awin sync (56s) and Top Deals (13s) before the
    # harvest even started. Harvest then took 59m12s and the job died inside
    # "Harvest houses direct" — before the commit. That run harvested for an
    # hour and saved none of it, and it needed roughly 86 minutes to have
    # saved any.
    #
    # 100 minutes covers that worst measured case with ~14 minutes of headroom
    # for the catalogue's steady growth, and fits inside the cron above with
    # margin to spare — ~20 minutes at the two-hourly cadence this number was
    # first set against, ~80 now that 2026-08-26 moved the cron to
    # three-hourly (see that comment for why) — so a long run cannot stack
    # into the next tick. It is not papering over a hang: every cancelled run
    # inspected
    # here showed steady progress right up to the cutoff, never a step stuck
    # doing nothing.
    #
    # ── Run #180, and why this number is now a ceiling rather than a dial ─────
    # The paragraph above used to end "the two steps that can genuinely run
    # long are separately capped below, so this ceiling should never be what
    # stops a run again." It was wrong about which steps those were. #180
    # (2026-08-13 20:34:27Z-22:14:47Z, cancelled at exactly 100 minutes) was
    # killed inside "Harvest via sitemap", which had no cap, after "Discover
    # shipping terms" — also uncapped — had taken 48m05s of the run. Both now
    # have one.
    #
    # What that run cost, precisely: shipping 48m05s, Awin sync 2m19s, deals
    # 10s, then harvest from 21:26:08Z until the cap landed at 22:14:44Z. The
    # first three committed as they went (2e0f82b, 0387614, e8012e5); the
    # harvest did not, because a job timeout cancels the running step and every
    # step after it, so "Commit harvested prices" never ran. Six shops' worth of
    # freshly stored prices were on disk and were thrown away.
    #
    # ── 2026-08-26: measured against the real 3-hourly runs, and split rather
    # than just raised ─────────────────────────────────────────────────────
    # The paragraph above said this number was "bounded from both sides and
    # should not be raised again", with the step-cap side pencilled at
    # "~19 minutes of setup and periodic stages ... ~3 for the rebuild and
    # push, which reaches 'Commit harvested prices' at ~97 minutes". Both
    # estimates were guesses, and the real numbers, read off the jobs API for
    # every scheduled run since the three-hourly cron started (#333-#340,
    # 2026-08-25 22:19Z-2026-08-26 17:51Z), are worse:
    #
    #   run   total    setup+periodic   harvest   houses   rebuild  commit
    #   #333  71m46s   1m22s (none fired)  56m01s   8m29s    5m48s   0m06s
    #   #334  87m52s   16m56s (shipping)   56m05s   8m32s    6m05s   0m10s
    #   #335  89m25s   22m59s (ship+awin)  56m10s   3m08s    5m49s   0m09s
    #   #336  86m50s   16m51s (shipping)   56m05s   8m12s    5m54s   0m07s
    #   #339  96m24s   25m11s (ship+awin)  56m25s   8m06s    6m31s   0m09s
    #   #340  93m15s   16m54s (shipping)   56m05s   8m19s    5m58s   5m59s
    #
    # #339 is the run this file's own comment used as the trigger for this
    # section: 96m24s against a 100-minute cap is 3m36s of slack, not the
    # ~14 the old estimate claimed. And the setup+periodic figure the old
    # estimate called "~19 minutes" is 25m11s in #339 and #335 alike, every
    # time both shipping discovery (~15m13s, not the twice-daily rarity its
    # own comment describes — it has fired on every one of these six runs,
    # a discrepancy worth someone chasing separately, not fixed here) and the
    # Awin sync (~7-8m) land in the same run. #340's commit step is the other
    # surprise: 5m59s, not the "~1m30s push" the old estimate assumed — a
    # rebase-and-retry cycle in commit-and-push.sh, not a hang.
    #
    # Add those up worst-case — 25m setup+periodic, 60m harvest cap, 15m
    # houses cap, 6m31s rebuild, 5m59s commit — and the sum is 112m30s. That
    # is past 100 already, without assuming anything exotic: it is six
    # numbers this file has now separately measured, just not all in the same
    # run yet. So the promise "this cap now protects only the tail" was not
    # actually true: run #339 shows the tail (rebuild, then the commit that
    # used to be named "Commit harvested prices") sitting close enough behind
    # the harvest that a slightly worse combination of the same measured
    # numbers lands the job's own timeout inside the rebuild step, or inside
    # the commit step while it is mid-push — and a job timeout cancels
    # whichever step is running, finished or not. That is run #180 again,
    # just relocated from inside the harvest to inside the step that used to
    # come safely after it.
    #
    # The fix is not a bigger number chasing a worst case that will keep
    # growing with the catalogue — it is removing the dependency between the
    # two. "Commit harvested prices" (below) now runs immediately after
    # "Harvest houses direct", before the rebuild, and commits only the raw
    # snapshots: data/catalogue, data/houses, and the report/marker/cursor
    # files. Both the sitemap harvest and the house harvest already write
    # store.write() per shop/house as they go (see their own step comments),
    # so by the time this step runs, everything either of them finished is
    # already durable on disk in the form this commit publishes verbatim —
    # nothing here waits on the rebuild to make it safe to push. The rebuild
    # and the demo-asset commit move after it, into a new "Commit rebuilt
    # app" step, carrying only demo/catalogue.generated.ts,
    # demo/priceHistory.generated.ts, demo/index.html, demo/404.html and
    # demo/sitemap.xml. If the job's cap lands anywhere in that tail now, the
    # harvested prices are already pushed; what is lost is a same-day demo
    # rebuild, which the next scheduled run repeats for free from the
    # catalogue this step just committed. That is the guarantee run #180 and
    # run #157 both broke, now held by construction rather than by a number
    # staying ahead of the catalogue's growth.
    #
    # The rebuild step also gets its own step timeout and continue-on-error
    # for the same reason houses got one after run #157: a job timeout
    # ignores continue-on-error on the steps around it, but a step timeout
    # lets the ones after it still run. 10 minutes against an observed
    # 5m48s-6m31s is roughly double.
    #
    # The number itself still moves, because the split does not make the cap
    # irrelevant — it only makes what the cap can cost small. 120 minutes
    # covers the 112m30s worst case above with margin for the same steady
    # growth the old 100 was sized against, and still fits far inside the
    # cron's 180-minute ceiling (60 minutes of slack behind the next tick,
    # more than the ~20 the schedule was ever tuned to need). If a future
    # reader is tempted to raise it again to buy more slack for the tail,
    # the split above means that slack no longer protects data — it only
    # decides how often a run ends green instead of a harmless "cancelled"
    # during the rebuild. Shrink or split a stage that outgrows its budget;
    # don't chase this number for that.
    timeout-minutes: 120

    steps:
      # fetch-depth: 0 is load-bearing, not a nicety. actions/checkout@v4
      # defaults to a shallow clone (depth 1) — fine for every other step
      # here, which only ever look at the working tree — but
      # scripts/build-price-history.ts replays the *entire* commit history of
      # data/catalogue via `git log`/`git show` to reconstruct a real price
      # history. Against a depth-1 clone it would silently see only this run's
      # single commit, rebuild demo/priceHistory.generated.ts from just that
      # one point, and never accumulate history from here on — with no error,
      # nothing failing, just a chart that quietly never grows past one dot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Chromium for the local render tier — the free replacement for the Apify
      # actor, see src/catalogue/localBrowser.ts. Playwright was already a
      # dependency (scripts/generate-og-preview.ts drives it for the site's own
      # preview image); this installs the browser binary it needs, which the
      # runner does not ship.
      #
      # --with-deps because a bare ubuntu runner is missing several shared
      # libraries Chromium links against, and --only-shell because nothing here
      # needs a headed browser. Roughly a minute, cached between runs by the
      # setup-node npm cache above only for the npm half — the browser download
      # is its own ~120 MB and is not cached, which is the price of the tier
      # and still cheaper than the alternative it replaces.
      #
      # continue-on-error: a runner that cannot install a browser should lose
      # the render tier, not the harvest. localBrowser.ts reports an
      # unavailable browser per URL rather than throwing, so the run degrades
      # to the free routes exactly as it did before this tier existed.
      - name: Install Chromium for the local render tier
        continue-on-error: true
        run: npx playwright install --with-deps --only-shell chromium

      # The crawl must not ship if the reconciliation logic is broken. A bad
      # diff here corrupts firstSeenAt for every listing, and that cannot be
      # recovered from a later run: the NEW badge would be wrong for a week.
      - name: Test before crawling
        run: npm test

      # Tries several retrieval strategies per shop, ordered by what has worked
      # before, and commits what it learned so tomorrow starts smarter.
      #
      # Both Apify credentials are passed unconditionally, same reasoning as
      # the harvest step below: catalogue-probe.ts checks for each itself and
      # simply leaves proxied-fetch or browser-render unavailable, with a
      # clear log line, when its secret is absent. Neither is required for
      # the free strategies to run normally.
      - name: Adaptive probe
        if: ${{ inputs.probe }}
        env:
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          npm run probe -- \
            ${{ inputs.probe_shop && format('--shop={0}', inputs.probe_shop) || '' }}

      - name: Commit what the probe learned
        if: ${{ inputs.probe }}
        run: |
          ./scripts/commit-and-push.sh \
            "Probe: what the crawler learned $(date -u +%Y-%m-%d)" \
            data/strategy-memory.json

      # Reads each shop's own delivery page and records what it says.
      #
      # Covers every enabled shop whose delivery rule is not confirmed, plus
      # every shop with no rate at all. It used to cover only the second group,
      # which meant 20 of the 22 enabled shops carrying an unverified delivery
      # figure had never been fetched by this step once — the population that
      # decides most of the site's "Cheapest" labels was the population it
      # skipped.
      #
      # --write promotes confidence to 'confirmed' for a shop whose page agrees
      # with the figure the registry already holds, and records
      # standardRateNotPublished for a shop whose page states delivery terms
      # and names no flat rate. Both write the URL and the sentence into
      # shipping.source. It still cannot introduce a figure the registry does
      # not hold, and it still cannot pick a side when page and registry
      # disagree: delivered price is the default sort, so a wrong-low delivery
      # charge makes a shop falsely win it, and a human reads the quoted
      # sentence and types that number. See scripts/shipping-discover.ts and
      # src/catalogue/shippingRegistryPatch.ts.
      #
      # Twice a day rather than hourly: a shop revises its delivery terms a few
      # times a year, so checking every hour would be 24 times the requests to
      # learn the same thing. 06:00 and 18:00 UTC are picked off the hourly
      # schedule below rather than by adding a second cron, because two crons
      # both firing at those hours would run the whole harvest twice.
      - name: Discover shipping terms
        if: ${{ inputs.shipping_discover || github.event_name == 'schedule' }}
        run: |
          # Age based, same reasoning as the two steps below: scheduling drift
          # means the clock is never read at the hour the cron named. Twelve
          # hourly here rather than six, which is the cadence this step was
          # always meant to have — shops rewrite delivery terms maybe twice a
          # year, so this is deliberately the least frequent thing in the job.
          MARKER=data/shipping-discover-marker.txt
          NOW=$(date -u +%s)
          LAST=0
          if [ -f "$MARKER" ]; then LAST=$(cat "$MARKER" 2>/dev/null || echo 0); fi
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          AGE=$(( NOW - LAST ))
          if [ -n "${{ inputs.shipping_raw_shop }}" ]; then
            npm run shipping:discover -- --raw=${{ inputs.shipping_raw_shop }}
          elif [ "${{ inputs.shipping_discover }}" = "true" ] || [ "$AGE" -ge 39600 ]; then
            # --budget=10 rations the sweep. Measured, not guessed: this step
            # took 3m59s on run #172 (09:06:10Z-09:10:09Z) when its population
            # was two shops, and 48m05s on #180 (20:35:23Z-21:23:28Z) — the
            # first scheduled run after 6b56632 widened it to every enabled
            # shop whose rule is not confirmed — covering 49 shops and 714
            # fetched pages. That is ~59s a shop, so ten shops is ~10 minutes.
            #
            # Rationing turns coverage into a rotation — every shop is still
            # reached, over a few cycles rather than all in one. A shop revises
            # its delivery terms a few times a year, so nobody reading the site
            # can tell the difference. Before 6b56632 these shops were checked
            # never; a rotation is not a regression against that.
            #
            # `timeout` is a backstop against the process genuinely hanging,
            # not the routine way this step ends. It used to be the latter:
            # scripts/shipping-discover.ts wrote the registry patch and the
            # report only *after* its loop finished, so from 2026-08-25T12:43
            # onward every scheduled cycle hit this exact 900s kill mid-batch
            # (runs #334, #340, #341, #342 — read from their job logs) and lost
            # everything it had already found, including a real checkout quote
            # for Kayali that then existed only in this job's own ephemeral
            # log. scripts/shipping-discover.ts now writes each shop's outcome,
            # registry write and rotation-ledger stamp the instant that shop
            # finishes (src/catalogue/shippingDiscoveryReport.ts), and stops
            # itself with room to spare at its own 840s internal ceiling — see
            # that file and SHOP_TIME_CEILING_MS's doc comment there for the
            # single chronically slow shop (John Lewis, ~446s of AbortError
            # retries) that was eating roughly half the budget every cycle.
            # `timeout 900` here now exists for the case that internal ceiling
            # cannot cover: the node process itself wedged rather than one
            # request timing out. It wraps only the discovery, so the
            # verification below runs either way — a step-level cap would skip
            # it and let the commit step publish an unverified retailers.ts.
            if timeout 900 npm run shipping:discover -- --write --budget=10; then
              echo "Shipping discovery finished; marking the cycle done."
              DISCOVERED=yes
            else
              echo "::warning::Shipping discovery hit the job's 900s outer backstop — the process itself did not stop in time, which its own 840s internal ceiling is meant to prevent and should now be rare. Whatever it had already recorded per-shop before the kill is still on disk (data/shipping-discovery-report.json, data/shipping-discover-state.json, and any registry write already applied) and the commit step below still runs; the marker is left alone so the next scheduled run retries sooner rather than waiting the full eleven hours."
              DISCOVERED=no
            fi
            # A registry the run has just edited has to still compile and still
            # satisfy the registry tests before it is committed. If it does
            # not, the edit is thrown away rather than pushed: a broken
            # retailers.ts takes the whole site down.
            #
            # Runs unconditionally, including after the backstop fired: the
            # point is that nothing reaches the commit step below unverified,
            # and a half-finished run is exactly when that matters most.
            if ! npm run typecheck || ! npx vitest run tests/registry.test.ts; then
              echo "Registry edits failed verification — reverting them."
              git checkout -- src/config/retailers.ts
            fi
            # Only a run that finished under its own steam — a full batch, or
            # an orderly self-stop on its own 840s ceiling — advances the
            # eleven-hour clock. Either way `report.finish()` ran and the
            # shops actually read are already stamped in the state file
            # individually; DISCOVERED=no means the outer `timeout 900` had to
            # kill the process, which the marker being left alone retries
            # sooner rather than waiting the full eleven hours.
            if [ "$DISCOVERED" = yes ]; then echo "$NOW" > "$MARKER"; fi
          else
            echo "Last shipping discovery was $(( AGE / 3600 )) hours ago, under the eleven hour threshold — skipping."
          fi

      # No-ops when the step above skipped: commit-and-push.sh exits cleanly
      # when nothing changed.
      - name: Commit the shipping report
        if: ${{ inputs.shipping_discover || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Shipping terms: what each delivery page says $(date -u +%Y-%m-%d)" \
            data/shipping-discovery-report.json data/shipping-discover-marker.txt \
            data/shipping-discover-state.json \
            src/config/retailers.ts

      # Every affiliate-feed retailer (adapter: 'affiliate-feed' in
      # src/config/retailers.ts — Fragrance Click UK, MyBeauty.Boutique and The
      # Beauty Store UK today) against the Awin Feed List Download URL.
      #
      # On the same roughly 6-hourly cadence as Top Deals below, and
      # deliberately ordered *before* it. Those three shops hold 9,820 of the
      # catalogue's 14,857 listings — 66% — and a feed sync refreshes every one
      # of them in a single download rather than page by page. So this step is
      # what actually delivers "the whole listing set refreshed every six
      # hours" for most of the site, and running it first means the deals
      # snapshot below is picked from those fresh prices rather than the
      # previous window's.
      #
      # It was 06:00/18:00 only, which left two thirds of the catalogue on a
      # 12-hour refresh. Awin regenerates a feed roughly daily, so 6-hourly is
      # still far short of wasteful — an unchanged feed costs one HTTP request
      # and stops there, because the rebuild only runs when the sync genuinely
      # changed something.
      #
      # A no-op, not a failure, when AWIN_FEED_LIST_URL is unset — see
      # scripts/awin-feed-sync.ts's own header comment.
      - name: Sync Awin product feeds
        if: ${{ inputs.awin_feed_sync || github.event_name == 'schedule' }}
        env:
          AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
        run: |
          # Gated on "long enough since the last one", not on the clock reading
          # exactly 00/06/12/18. A scheduled run does not start when it is
          # scheduled: GitHub defers them under load, and this workflow's own
          # runs started at 22:33, 01:19, 04:04 and 07:16 on a two hourly cron.
          # `date -u +%H` reads the moment the runner got to this line, so the
          # old exact-hour test skipped the sync on four consecutive cycles and
          # would have gone on skipping it indefinitely — the drift never lands
          # back on an even hour by itself. It took the storefront reprice down
          # with it, which is why MyBeauty.Boutique stayed roughly seventy per
          # cent overstated with a working fix already merged.
          #
          # The marker is written here rather than derived from a commit,
          # because the sync legitimately produces no commit when a feed has
          # not changed, and an age derived from the last commit would then
          # grow without bound and fire the sync every single run.
          MARKER=data/feed-sync-marker.txt
          NOW=$(date -u +%s)
          LAST=0
          if [ -f "$MARKER" ]; then LAST=$(cat "$MARKER" 2>/dev/null || echo 0); fi
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          AGE=$(( NOW - LAST ))
          # Five hours, not six: with a two hourly cron the eligible run lands
          # at roughly six hour spacing, and a six hour threshold would push
          # every other attempt just under the line and stretch it to eight.
          if [ "${{ inputs.awin_feed_sync }}" = "true" ] || [ "$AGE" -ge 18000 ]; then
            npm run awin:feed-sync
            # Ordering here is load-bearing in both directions. The sync
            # overwrites each feed retailer's snapshot with whatever the feed
            # currently says, so a correction applied before it would be
            # silently discarded — both steps would still report success. And
            # the rebuild below has to see the corrected prices, not the
            # feed's. See scripts/storefront-reprice.ts.
            #
            # A failure here is contained rather than fatal, but it cannot be
            # ignored either: the sync has already replaced the snapshot with
            # raw feed prices, and for a retailer flagged
            # storefrontIsPriceAuthority those are the prices measured wrong on
            # seven listings in ten. Publishing them because the correction
            # crashed would be worse than publishing nothing new, so the
            # snapshot is rolled back to the last corrected state and the
            # rebuild is skipped. The harvest below still runs: this must not
            # be able to take the whole job down, which is what an unguarded
            # failure in a step this late would do.
            if npm run storefront:reprice; then
              if ! git diff --quiet -- data/catalogue data/awin-feed-sync-state.json; then
                npm run catalogue:demo
                npm run catalogue:history
                npm run demo
              fi
              echo "$NOW" > "$MARKER"
            else
              echo "::warning::storefront reprice failed. Reverting the feed sync so uncorrected feed prices are not published, and leaving the previous snapshot in place."
              git checkout -- data/catalogue data/awin-feed-sync-state.json || true
            fi
          else
            echo "Last feed sync was $(( AGE / 60 )) minutes ago, under the five hour threshold — skipping."
          fi

      - name: Commit synced Awin feeds
        if: ${{ inputs.awin_feed_sync || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Awin feed sync: $(date -u +%Y-%m-%d)" \
            data/catalogue data/awin-feed-sync-state.json data/storefront-reprice-report.json \
            data/feed-sync-marker.txt \
            demo/catalogue.generated.ts \
            demo/priceHistory.generated.ts demo/index.html demo/404.html demo/sitemap.xml

      # Manual-only debug aid: prints the column headers and the values of
      # price-ish columns for one matched product row in one named Awin
      # retailer's feed. Writes nothing, commits nothing. Only ever prints
      # column names and one product's price-ish values — see
      # scripts/awin-feed-diag.ts's own header comment for what it withholds
      # and why (never the feed URL, never a full row).
      # Answers "which programmes have accepted me" from the feed list's own
      # membershipStatus column, rather than from the feed *count*, which is
      # the thing that reads like an answer and is not one: the sync logs "N
      # feed(s) visible on this Awin account", and visible is not joined.
      # Reads only — writes nothing, commits nothing, prints no feed URL.
      - name: Awin memberships
        if: ${{ inputs.awin_memberships }}
        env:
          AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
        run: npm run awin:memberships

      - name: Awin feed diagnostic
        if: ${{ inputs.awin_feed_diag_shop != '' }}
        env:
          AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
        run: |
          npm run awin:feed-diag -- \
            "--shop=${{ inputs.awin_feed_diag_shop }}" \
            ${{ inputs.awin_feed_diag_match && format('"--match={0}"', inputs.awin_feed_diag_match) || '' }} \
            ${{ inputs.awin_feed_diag_sku && format('"--sku={0}"', inputs.awin_feed_diag_sku) || '' }}

      # ── TikTok Shop pilot probe — dispatch-only, by design ────────────────
      # The first live step of docs/TIKTOK-SHOP-PLAN.md, deliberately shaped
      # like the debug steps above rather than the harvest: explicit dispatch
      # only, never on schedule, bounded to exactly two read-only calls
      # against the owner's own TikTok creator account (profile + showcase),
      # and it writes a redacted report under data/tiktok/ for a human to
      # read — no listings, no parsing, no effect on the catalogue or the
      # demo. D8 keeps TikTok off by default; this step honours that by never
      # being part of any scheduled run. The three secrets exist only after
      # the owner completes the Partner Center signup (plan §6); until then
      # the script logs exactly which secret is missing and exits 0, so
      # dispatching early is a readable answer rather than a red run.
      - name: TikTok Shop probe
        if: ${{ inputs.tiktok_probe }}
        env:
          TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
          TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: npm run tiktok:probe

      - name: Commit the TikTok probe report
        if: ${{ inputs.tiktok_probe }}
        run: |
          ./scripts/commit-and-push.sh \
            "TikTok probe: what the Affiliate API answered $(date -u +%Y-%m-%d)" \
            data/tiktok

      # "Top Deals Today" used to be built HERE, near the top of the run and
      # ahead of the harvest, on its own 5-hour age gate. It is now built in
      # "Rebuild the app from harvested prices" below, straight after
      # `npm run catalogue:demo`, on every run that rebuilds the catalogue.
      # See that step for the reasoning; the short version is that
      # demo/deals.generated.ts stopped being an independent snapshot on
      # 2026-08-26 and became half of a consistent pair with
      # demo/catalogue.generated.ts, and a pair cannot be regenerated on two
      # different cadences.
      #
      # The `deals_refresh` dispatch input survives the move: it no longer
      # skips an age gate (there is none) but still opts a non-harvest
      # dispatch into the rebuild step, so a deals-only refresh is still one
      # dispatch away.

      # The route the probe proved works: ask the sitemap instead of guessing.
      # This is now what runs every night, not just on request. The plain
      # `catalogue` crawl below has never returned a single listing from these
      # shops live — every listing this project has ever shown came from the
      # sitemap route, so the schedule has to use it, not the older path.
      #
      # "Never returned a listing" rather than the "never once succeeded" this
      # comment used to claim: the step itself has exited 0 seven times, and
      # the distinction turns out to matter. See the Crawl step's own comment
      # below for the seven runs, what they actually wrote, and why that is not
      # a reason to keep dispatching it.
      #
      # --allow-metered is harmless to pass even with neither secret
      # configured: the harvest script checks for APIFY_PROXY_PASSWORD and
      # APIFY_TOKEN itself and simply skips the tier whose secret is absent,
      # logging that it did so. Both tiers only ever fire for shops the
      # cheaper route(s) before them returned nothing for — see
      # src/catalogue/apifyActor.ts and this step's own comment in
      # scripts/catalogue-harvest.ts for why a residential IP (the proxy) and
      # a real browser (the actor) fix genuinely different failures, and are
      # gated independently so either secret can be added on its own.
      #
      # The actor tier's budget (MAX_ACTOR_PAGES_PER_RUN, currently 10) is
      # shared across every shop that reaches it in one run, spent in
      # RETAILERS' own list order with no rotation. Once real usage exists,
      # a shop late in that order could starve every run if more shops need
      # rendering than the budget covers — worth watching once APIFY_TOKEN is
      # actually set, not a problem yet while the tier has never fired for
      # real.
      #
      # Budget and refresh share.
      #
      # This was --max=120 --refresh-share=0.7 for a few hours on 2026-08-11,
      # on an estimate that it would cost "about 6 extra minutes" per run. That
      # estimate was wrong, and the real cost showed up directly rather than as
      # a rounding error: run #143's harvest step took 63 minutes (was ~38),
      # and the run was killed by the 75-minute job timeout before it could
      # commit anything. #144, the run right after it, was killed the same way
      # and committed nothing at all — a full hour of crawling, discarded. Both
      # failures landed the same week five more shops (the delivery-not-stated
      # group plus Emirates Oud) were added to the same sweep, which was never
      # accounted for in the original estimate.
      #
      # Pulled back to --max=70 --refresh-share=0.4: a shop sees 28 of its
      # listings re-priced per run (was 18 before the regression, 84 during
      # it), 168 in a 6-hour window. That is a real improvement over the
      # original 108, just a much smaller one than 120/0.7 claimed — and
      # unlike that number, a run at this size has actually been observed to
      # finish and commit. Re-measure before raising it again, on the size of
      # the shop list as it stands at the time, not the list from whenever
      # this comment was last true.
      #
      # The feed sync above is unaffected by any of this: it refreshes its
      # 9,820 listings completely every 6 hours regardless of what this step
      # does, and is what genuinely delivers a 6-hourly refresh for that part
      # of the catalogue.
      #
      # ── Why this step is capped, and why that is not a loss ──────────────────
      # This is the step run #180 died in, and it is the reason this whole
      # pattern is here. #180 harvested from 21:26:08Z to 22:14:44Z — 48m36s —
      # and its log shows it had already stored LOOKFANTASTIC (55 active), The
      # Fragrance Counter (27), ScentStore (15), Glorious Beauty (49), BellaVita
      # Luxury (27) and Oud Arabian (173) before the job's own 100-minute cap
      # landed mid-way through Manchester Ouds. Every one of those was on disk.
      # None of it was committed, because a job timeout cancels the step and
      # every step after it, so "Commit harvested prices" was never reached.
      # The catalogue stayed at the previous run's state and 48 minutes of real
      # harvesting went in the bin.
      #
      # scripts/catalogue-harvest.ts calls store.write() inside its per-shop
      # loop, so the shops it has finished are durable the moment they finish —
      # this step was already resumable, and nothing was resuming it. A step cap
      # plus continue-on-error is the whole fix: the cap ends the harvest while
      # there is still time to publish, continue-on-error lets the job carry on,
      # and the commit step below saves the shops that did complete. Same
      # pattern, same reasoning, as the two steps that already carry one.
      # src/catalogue/store.ts writes via a rename so a shop cut off mid-write
      # leaves the previous snapshot rather than a truncated file.
      #
      # 60 minutes is what the run can afford, not what the harvest wants. The
      # job cap is 100 and cannot go higher — see its comment — so the budget is
      # 100 minus everything that has to happen before this step (checkout,
      # tests and the three periodic stages: ~19 minutes when all of them fire
      # at their own caps) minus everything that has to happen after it to reach
      # the commit (houses at its 15-minute cap, ~1m20s rebuild, ~1m30s push):
      # 100 - 19 - 18 = 63, less a margin. The harvest has been measured at
      # 52m56s (#179), 53m21s (#177), 53m46s (#176), 54m04s (#178) and 59m05s
      # (#172), so 60 clears every observed run — but only just, and #172 is
      # within a minute of it. If truncation starts showing up in the warning
      # below on ordinary runs, the answer is a smaller --max or --refresh-share
      # here, or shops split across runs: it is not a higher cap. The job's own
      # 100-minute ceiling is still the real constraint on this budget, not the
      # cron above it — three-hourly since 2026-08-26 leaves the job cap far
      # more room than it needs, but the ceiling stays where run #180 set it
      # (see its comment) rather than growing just because the cron did.
      #
      # ── This cap does not stop the harvest, and never did ────────────────────
      # Discovered on run #330 (job 97881335331). The step is recorded as
      # running 16:29:02Z-17:29:15Z, its full 60 minutes, and then:
      #
      #   - data/harvest-report.json from that run carries per-shop finishedAt
      #     stamps going on to 17:42:09Z, thirteen minutes after the step ended;
      #   - the job's own cleanup at 17:44:59Z logs "Terminate orphan process:
      #     pid (5125) (npm run harvest --max=70 --refresh-share=0.4)" and
      #     "Terminate orphan process: pid (5170) (chrome-headless-shell)".
      #
      # A step timeout cancels the *step*. The process it started carried on for
      # 15m44s, unsupervised, through "Harvest houses direct" and then through
      # "Rebuild the app from harvested prices" — which reads data/catalogue
      # while the orphan was still writing to it — and was finally killed
      # mid-shop by the runner's orphan sweep. That race is why that run's
      # report says complete:false and has no end-of-run summary in the log.
      #
      # --run-minutes below is the actual bound. The harvest now stops itself
      # on a shop boundary, caps the last shop's crawl at whatever is left,
      # finishes its report, disposes Chromium and exits — with the rebuild
      # getting a catalogue nobody is writing to. This cap stays as the
      # backstop for a hang the deadline cannot reach.
      - name: Harvest via sitemap
        id: harvest
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        continue-on-error: true
        timeout-minutes: 60
        env:
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          # ── Why the metered tiers are not offered on every run ─────────────
          # They used to be: --allow-metered was passed on every scheduled
          # tick, twelve a day, each one able to spend up to
          # MAX_ACTOR_PAGES_PER_RUN (10) actor renders. That is a ceiling of
          # ~120 renders a day against a $5 monthly credit, and it is how that
          # credit was gone by 2026-08-21 with three weeks of the month left.
          #
          # Nothing about those five shops needs that rate. The actor tier
          # exists for Boots, Selfridges, John Lewis, Superdrug and Zara —
          # fragrance retailers whose catalogues do not turn over in two hours.
          # Rendering them once a day keeps the data as current as anything
          # else on the site (the free sitemap route still runs every tick for
          # every other shop) at a twelfth of the ceiling.
          #
          # Age based rather than clock based, and a marker file rather than a
          # cron hour, for exactly the reason the deals refresh above is: a
          # scheduled run starts when a runner is free, so an exact-hour test
          # skips silently once the drift settles on odd hours. 20 hours, not
          # 24, so a day's run cannot be pushed out of its slot by accumulated
          # drift and skipped altogether.
          #
          # An explicit allow_metered dispatch always wins — asking for it by
          # hand is a decision, not a schedule.
          MARKER=data/metered-harvest-marker.txt
          NOW=$(date -u +%s)
          LAST=0
          if [ -f "$MARKER" ]; then LAST=$(cat "$MARKER" 2>/dev/null || echo 0); fi
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          AGE=$(( NOW - LAST ))
          METERED=""
          if [ "${{ inputs.allow_metered }}" = "true" ]; then
            METERED="--allow-metered"
            echo "Metered tiers offered: asked for explicitly by dispatch."
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$AGE" -ge 72000 ]; then
            METERED="--allow-metered"
            echo "Metered tiers offered: last metered run was $(( AGE / 3600 )) hours ago."
            echo "$NOW" > "$MARKER"
          else
            echo "Metered tiers NOT offered: last metered run was $(( AGE / 3600 ))h ago, under the 20 hour threshold."
          fi
          # The harvest still asks Apify what the month has cost before it
          # spends anything, and declines the tiers itself if the credit is
          # gone — see src/catalogue/apifyUsage.ts. This gate bounds how often
          # it is even offered; that one bounds what it may do when it is.
          # ── --run-minutes: the harvest's own deadline ──────────────────────
          # 56, inside this step's 60, because the step cap does not actually
          # stop this process — see the block above this step for run #330's
          # orphaned harvest and the four minutes of margin this leaves.
          #
          # The sweep is ordered longest-unasked-first (see
          # src/catalogue/harvestCursor.ts), so stopping on a deadline no
          # longer starves anyone: the shops this run does not reach are the
          # ones the next run asks first. Run #330's report is the before
          # picture — 36 planned, 25 reported, and the same eleven at the tail
          # every run, one of them (avon) carrying a five-day-old snapshot.
          #
          # ── --shop-minutes: no one shop eats the sweep ─────────────────────
          # The longest shops in run #330 were Debenhams at 392s (718 URLs
          # discovered, 0 priced) and Riiffs at 390s, so 6 minutes trims those
          # two by seconds and bounds the next shop that grows past them. It is
          # a ceiling, not a target: the run's own deadline lowers it further
          # for the last shop of a sweep.
          npm run harvest -- \
            --max=${{ inputs.harvest_max || '70' }} \
            --refresh-share=${{ inputs.harvest_refresh_share || '0.4' }} \
            --run-minutes=56 \
            --shop-minutes=6 \
            ${{ inputs.harvest_shop && format('--shop={0}', inputs.harvest_shop) || '' }} \
            ${{ inputs.harvest_gap_min && format('--gap-min={0}', inputs.harvest_gap_min) || '' }} \
            $METERED

      # The Middle Eastern houses sell direct rather than through the UK shops
      # above, so nothing in the sitemap harvest reaches them. This reads their
      # own storefronts with no API key (Shopify's public products.json where
      # they run it, sitemap + JSON-LD otherwise) and records what it genuinely
      # got, including "nothing" — see scripts/houses-harvest.ts.
      #
      # Never fails the job: a house refusing us is a fact to record, not a
      # reason to lose the retailer harvest that already succeeded above.
      #
      # continue-on-error alone was not enough, because a *job* timeout ignores
      # it — it cancels the step and every step after it. That is precisely how
      # run #157 lost an entire hour of harvesting: the sitemap harvest had
      # finished successfully at 07:18:58Z, this step was still going at
      # 07:27:47Z when the job's own cap landed, and "Commit harvested prices"
      # was never reached. The step timeout is what makes the promise in the
      # paragraph above actually hold: houses have taken 6m48s (#158) and 7m09s
      # (#153), so 15 minutes is roughly double the observed cost, and a house
      # that hangs past it now costs this run its house data and nothing else.
      - name: Harvest houses direct
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        continue-on-error: true
        timeout-minutes: 15
        run: npm run houses

      # ── Split from the rebuild, 2026-08-26 ──────────────────────────────
      # This used to be the second half of a step named "Commit harvested
      # prices" that ran after the rebuild below, committing the raw
      # snapshots and the generated demo bundle together. See the job
      # timeout's own comment above for why that ordering was the residual
      # version of run #180's bug: the rebuild has no step cap of its own,
      # runs #333-#340 measured it at 5m48s-6m31s, and a job timeout landing
      # inside it (or inside the push that followed) would cancel the commit
      # before it ran, exactly as happened to the harvest itself in #180.
      #
      # Moved here, immediately after both harvest steps and before the
      # rebuild, this step now depends on nothing that can hang or overrun.
      # scripts/catalogue-harvest.ts and scripts/houses-harvest.ts both call
      # store.write() per shop/house as they go (see each step's own
      # comment), so whatever either finished — including a harvest cut off
      # mid-sweep by its own run-minutes deadline, or a house step that hit
      # its 15-minute cap — is already sitting on disk in exactly the form
      # this step publishes. Nothing below this line can make that data any
      # safer than it already is; it can only delay publishing it.
      #
      # data/metered-harvest-marker.txt rides along deliberately: the
      # once-a-day gate on the metered tiers is only a gate if the marker
      # survives the run that set it. Uncommitted, every run would read a
      # missing marker as "never", offer the tiers every tick, and the
      # gate would be decorative.
      #
      # data/harvest-cursor.json for exactly the same reason, and it is the
      # more load-bearing of the two: it records which shops this run
      # asked, and the sweep is ordered longest-unasked-first from it.
      # Uncommitted, every run would start from an empty cursor, fall back
      # to the same never-live-then-registry order, and starve the same
      # eleven shops it starved before — the rotation would be decorative.
      - name: Commit harvested prices
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Harvest: real prices $(date -u +%Y-%m-%d)" \
            data/catalogue data/houses data/house-sourcing-report.json \
            data/metered-harvest-marker.txt \
            data/harvest-cursor.json \
            data/harvest-report.json

      # Deliberately after the commit above, and deliberately a warning rather
      # than a failure.
      #
      # After, because the ordering is the point: whatever the harvest managed
      # is published first, and only then does the run say the harvest was
      # short. A step that failed the job here would put us back where #180 was.
      #
      # A warning, because a truncated harvest is a degraded run, not a broken
      # one — the shops that completed are live, and the ones that did not are
      # first in line next cycle. Failing on it would paint the workflow red
      # every time the catalogue outgrew a budget, and this file already has the
      # argument for why that is worse than useless: runs #166 and #167 went red
      # for something nobody needed to act on, and "a red run that means nothing
      # trains everyone to ignore the red."
      #
      # `outcome` rather than `conclusion`: continue-on-error rewrites
      # conclusion to success, and outcome is what still holds the real result.
      - name: Note an incomplete harvest
        if: ${{ (inputs.harvest || github.event_name == 'schedule') && steps.harvest.outcome == 'failure' }}
        run: |
          echo "::warning::The sitemap harvest did not run to completion — it hit its 60 minute cap or exited non-zero. Whatever it had already stored per shop has been committed by the step above; the shops it did not reach keep their previous prices and are picked up by the next run. Check the harvest step's log for where it stopped."

      # ── The rebuild and its own commit, after the raw data is already safe ──
      # Split out of what used to be a single "Commit harvested prices" step,
      # see that step's own comment above for why. This step's own timeout and
      # continue-on-error exist for the same reason "Harvest houses direct"
      # got them after run #157: a *job* timeout ignores continue-on-error on
      # the steps around it and cancels everything outstanding, but a *step*
      # timeout lets the ones after it still run. Measured at 5m48s-6m31s
      # across runs #333-#340, so 10 minutes is roughly double the observed
      # cost — generous room without leaving a genuine hang free to eat the
      # rest of the job's budget the way the un-timed version of this step
      # used to.
      #
      # A failed or timed-out rebuild costs one cycle of stale demo output,
      # nothing more: the catalogue data it reads was already committed above,
      # and the next scheduled run rebuilds from whatever is on the branch by
      # then regardless of what happened here.
      #
      # ── Why `deals:build` is in here now, and not before the harvest ──
      # It used to run near the top of the job, ahead of the harvest, on a
      # 5-hour age gate, so that a snapshot could publish within minutes of
      # the hour instead of ~45 minutes into the run. That ordering broke
      # twice on 2026-09-01 in the same way, and the second time it wedged the
      # branch: run #368 built demo/deals.generated.ts at 17:31 (124b610c),
      # its own harvest landed at 18:36 (03d2c375) and moved Al Haramain
      # L'Aventure Femme 100ml (ean-6291100137565) to £45 on the house's own
      # storefront, and the deals file — an hour older than the catalogue
      # beside it — was still striking through Perfume Click's £50. The next
      # run's "Test before crawling" then failed on
      # tests/dealsBrandDirect.test.ts, as it should, and no harvest could
      # start at all.
      #
      # This is not a scheduling accident that a longer gap would fix. Until
      # 2026-08-26 the deals snapshot depended only on `wasPrice` — a shop's
      # own published figure — so an old snapshot was merely old, never
      # wrong, and a cadence of its own was free. wasPriceCredibility.ts's
      # test zero made a deal depend on `CatalogueEntry.houseCeiling` as well,
      # which lives in demo/catalogue.generated.ts. From that day the two
      # files are one consistent pair: rebuild the catalogue without the
      # deals and the older file can assert a saving the newer one refutes.
      # A pair cannot be regenerated on two different cadences, so deals now
      # move on the catalogue's, which is the coarsest cadence that keeps them
      # honest. 4f3ddc97 (src/services/dealCandidates.ts) made each build
      # honest about the catalogue in front of it; this makes sure the build
      # sees the catalogue this run just harvested.
      #
      # The anti-reshuffle intent behind the old cadence (see
      # scripts/build-deals.ts's header) survives as far as that allows: the
      # list now moves every three hours with the cron rather than every six,
      # which is still nothing like the per-tick churn that comment was
      # written against.
      #
      # Ordered immediately after `catalogue:demo` deliberately: those two
      # commands write the pair, and everything between them is time in which
      # a step timeout could commit one without the other. Adjacent, that
      # window is seconds out of a ~6 minute step.
      #
      # Still after "Commit harvested prices" above, which is the protection
      # that must not move: raw harvested prices are published first and
      # nothing derived from them can cost us an hour of crawling.
      - name: Rebuild the app from harvested prices
        if: ${{ inputs.harvest || inputs.deals_refresh || github.event_name == 'schedule' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm run catalogue:demo
          npm run deals:build
          npm run catalogue:history
          npm run demo

      # Committed separately from the raw snapshots above on purpose — see
      # that step's comment. A no-op, not a failure, when the rebuild above
      # did not run to completion: commit-and-push.sh skips paths that do not
      # exist and reports "Nothing changed" when nothing did, so a rebuild cut
      # off by its own step timeout simply leaves the previous demo bundle
      # live until the next run regenerates it.
      - name: Commit rebuilt app
        if: ${{ inputs.harvest || inputs.deals_refresh || github.event_name == 'schedule' }}
        run: |
          # demo/testCount.generated.ts rides along here rather than with the
          # raw snapshots above: "Test before crawling", near the top of this
          # job, runs `npm test` unconditionally, and
          # scripts/testCountReporter.ts rewrites this file as a side effect
          # whenever the count it holds no longer matches what the suite just
          # ran. It is generated demo output, same category as everything
          # else in this list, not a raw harvest fact — it would be just as
          # stale sitting uncommitted in the raw-snapshot step above, and this
          # step runs on every scheduled tick regardless of which other
          # inputs fired, so it is still picked up within a day either way.
          # demo/deals.generated.ts rides along here rather than in a commit
          # of its own, which is where it used to be. It is generated demo
          # output like everything else in this list, and — since test zero —
          # it is only meaningful next to the demo/catalogue.generated.ts it
          # was built from, so committing the two apart is the thing that
          # went wrong on 2026-09-01. One commit, one consistent pair.
          ./scripts/commit-and-push.sh \
            "Rebuild demo: $(date -u +%Y-%m-%d) harvest" \
            demo/catalogue.generated.ts demo/priceHistory.generated.ts \
            demo/deals.generated.ts \
            demo/testCount.generated.ts \
            demo/index.html demo/404.html demo/sitemap.xml

      # ── Debug: capture one shop's rendered HTML, manual-only ────────────────
      # Built for notino-uk specifically: it renders a real 694,649-byte
      # /fragrance/?page=1 page and parseListings() gets zero listings out of
      # it — a parser gap, not the bot wall its own subsections show (those
      # come back 403 at a few hundred bytes, the shape already known to
      # src/catalogue/renderRefusal.ts). Nobody can fix that parser blind: the
      # rendered HTML this pipeline sees is never kept anywhere past the run
      # that produced it, and the sandbox this project is developed in cannot
      # fetch a shop itself — the egress proxy refuses every retailer domain
      # outright. This dispatch is one CI-side capture of the real bytes, so
      # the parser can be fixed against them next pass rather than guessed at.
      #
      # Wired through the existing render path, not a new fetch route:
      # `--shop=` limits the whole harvest to the one named retailer, exactly
      # as `harvest_shop` above does for an ordinary dispatch, and
      # `--capture-render-shop=` (src/catalogue/renderCapture.ts) only decides
      # what to do with a render that path already performs — save it,
      # verbatim, capped in size — never how or when a render is attempted.
      # scripts/catalogue-harvest.ts refuses to run at all if the two flags
      # ever name different shops, so this cannot silently widen into "every
      # shop" the way a missing `--shop=` would.
      #
      # `if:` names only this input, deliberately not joined with
      # `github.event_name == 'schedule'` the way every periodic step above
      # is: a capture is a one-off request for evidence, not a recurring job,
      # and it must never fire on its own.
      #
      # The `git checkout` after the harvest call is not cleanup for its own
      # sake: this step's only job is the captured HTML, and running
      # `npm run harvest` to get it incidentally rewrites
      # data/harvest-cursor.json, data/harvest-report.json and (had the shop
      # priced anything) data/catalogue/<shop>.json the same way any harvest
      # dispatch does. None of that is this step's to publish — it was not
      # asked for, and an uncommitted change sitting in the working tree when
      # commit-and-push.sh's rebase-and-retry loop runs below is exactly the
      # kind of stray state that loop exists to not have to reason about.
      # Discarding it here keeps this dispatch's effect on the branch to
      # exactly one thing: the capture.
      - name: Capture rendered HTML for one shop
        if: ${{ inputs.capture_render_shop != '' }}
        run: |
          npm run harvest -- \
            --shop=${{ inputs.capture_render_shop }} \
            --capture-render-shop=${{ inputs.capture_render_shop }} \
            --run-minutes=5 --shop-minutes=5
          git checkout -- data/catalogue data/harvest-cursor.json data/harvest-report.json \
            data/metered-harvest-marker.txt 2>/dev/null || true

      - name: Commit captured render
        if: ${{ inputs.capture_render_shop != '' }}
        run: |
          ./scripts/commit-and-push.sh \
            "Capture rendered HTML: ${{ inputs.capture_render_shop }} $(date -u +%Y-%m-%d)" \
            data/render-capture

      # ── The image link check moved out of this job, 2026-08-25 ─────────
      # It used to run here, last, after the harvest had committed. It could
      # not finish. This job's cap is 100 minutes and the comment on that cap
      # explains why the number cannot move; the step caps inside it reach
      # "Commit harvested prices" at ~97 minutes in the worst case, leaving
      # this check ~3 of the 20 minutes it asked for.
      #
      # What that cost, measured on the runs: data/image-link-report.json last
      # committed 2026-08-19, and data/image-referer-report.json never
      # committed in this repo's history at all. Runs #317, #320, #321 and
      # #323 each ran to exactly 100 minutes and died here — four of ten runs
      # ending "cancelled" for a report, with the harvest itself safely
      # committed twenty minutes earlier every time.
      #
      # It is now .github/workflows/image-check.yml, daily on its own
      # schedule, in its own concurrency group, with 40 minutes to itself. See
      # that file's header. Nothing was lost from this job by the move: the
      # check never wrote a price or changed a listing, only a report under
      # data/ that the build does not read.

      # Kept for manual comparison against the old guessed-URL approach and for
      # --source=fixtures testing. Deliberately never runs on schedule.
      #
      # Now behind its own `crawl` input rather than "nothing else was picked".
      # That fall-through is what made every bare dispatch end red: this step's
      # condition used to be satisfied by *not* asking for a probe or a
      # harvest, so a dispatch sent purely to run the Awin feed diagnostic, or
      # a shipping discover, or a one-off deals refresh, fell through to a live
      # crawl it had never asked for and failed on it. Runs #166 and #167
      # (2026-08-12 22:19Z and 22:22Z) are both exactly that: "Awin feed
      # diagnostic" succeeded, every other step skipped, and step 21 "Crawl"
      # failed and took the run down with it. Scheduled runs never hit it —
      # `github.event_name != 'schedule'` excluded them — so the whole thing
      # was invisible unless you dispatched. A red run that means nothing is
      # worse than no run: it trains everyone to ignore the red.
      #
      # Why this is gated rather than deleted. The comment here used to say the
      # crawl "has a 0% success rate against the live shops" and the one above
      # the harvest said it "has never once succeeded live". The first is true,
      # the second is not, and the difference is the reason the step stays:
      #
      #   - It has exited 0 seven times, all live dispatches between
      #     2026-08-05 and 2026-08-11 (runs #30, #31, #34, #44, #129, #138,
      #     #142 — #142's step conclusion read straight off the jobs API is
      #     "success"). Each produced a real commit; `git log --grep='^Catalogue: '`
      #     lists all seven.
      #   - It has never returned a listing. Every one of those seven runs is
      #     recorded in data/catalogue/{escentual,scentstore}.json as
      #     `"status": "ok", "listingsSeen": 0` — HTTP 200 carrying no product
      #     markup. The other 16 shops failed outright every time. So the
      #     commits are empty bookkeeping, and docs/SPIKE-RESULTS.md's 0% is
      #     the accurate figure.
      #   - Those seven exit-0s were an artefact, not a capability. A shop
      #     returning nothing counts as ok only while it holds nothing:
      #     COLLAPSE_FLOOR in src/catalogue/crawl.ts refuses a write that drops
      #     below half the held listings and marks the run failed. escentual
      #     and scentstore were the only two shops still holding an empty
      #     snapshot. Once the sitemap harvest filled them the guard started
      #     firing on them too, which is why #167 logs "0 shops crawled, 18
      #     failed" and catalogue-run.ts's `if (ok === 0)` exits 1.
      #
      # So against live shops this can now only fail, and gating it on an
      # explicit tick is what stops that failure landing on people who did not
      # ask for it. It is not dead code: --source=fixtures still replays the
      # eight snapshots under data/catalogue that carry real fixture listings
      # (boots, notino-uk, john-lewis and five others, 7-9 listings each), and
      # that is the path that exercises crawl.ts end to end. Deleting the step
      # would take that with it. Untick-by-default, keep the code.
      - name: Crawl
        if: ${{ inputs.crawl }}
        run: |
          npm run catalogue -- \
            --source=${{ inputs.source || 'live' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild the app from the new snapshots
        if: ${{ inputs.crawl && !inputs.dry_run }}
        run: |
          npm run catalogue:demo
          npm run demo

      - name: Commit what changed
        if: ${{ inputs.crawl && !inputs.dry_run }}
        run: |
          ./scripts/commit-and-push.sh \
            "Catalogue: $(date -u +%Y-%m-%d)" \
            data/catalogue demo/catalogue.generated.ts demo/index.html demo/404.html demo/sitemap.xml

      # Keep the failure loud. A crawl that quietly stops working leaves stale
      # prices on the site, which is worse than showing nothing.
      - name: Report failure
        if: failure()
        run: echo "::error::Catalogue crawl failed. Prices on the site are now stale."
