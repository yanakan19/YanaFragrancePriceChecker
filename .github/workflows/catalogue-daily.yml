name: Catalogue crawl

# Runs at the top of every hour and commits the resulting snapshots. The
# commit is the audit trail: the diff shows exactly which products a shop
# added, dropped or repriced since the last run.
#
# Hourly is genuinely free right now: the sitemap harvest against the four
# working shops costs nothing, and --allow-metered below is a no op unless
# the APIFY_PROXY_PASSWORD secret is set, which it currently is not. If that
# secret is ever added, every hourly tick would retry the blocked shops
# through the paid residential proxy, multiplying that cost by roughly 24
# compared to the old once a day schedule — worth revisiting the cadence at
# that point rather than assuming this comment still holds.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'live crawls the shops, fixtures replays saved pages'
        type: choice
        options: [live, fixtures]
        default: live
      dry_run:
        description: 'Fetch and report without writing. Use this the first time.'
        type: boolean
        default: false
      probe:
        description: 'Run the adaptive retrieval probe instead of the crawl.'
        type: boolean
        default: false
      harvest:
        description: 'Harvest real listings through each shop sitemap.'
        type: boolean
        default: false
      harvest_max:
        description: 'Product pages to fetch per shop during a harvest.'
        type: string
        default: '40'
      allow_metered:
        description: 'Retry genuinely blocked shops through the Apify proxy. Requires the APIFY_PROXY_PASSWORD secret. Costs money.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Two crawls writing snapshots at once would race and lose listings.
  group: catalogue
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # A full walk of twelve shops with politeness delays takes a while, but it
    # should never run for an hour.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The crawl must not ship if the reconciliation logic is broken. A bad
      # diff here corrupts firstSeenAt for every listing, and that cannot be
      # recovered from a later run: the NEW badge would be wrong for a week.
      - name: Test before crawling
        run: npm test

      # Tries several retrieval strategies per shop, ordered by what has worked
      # before, and commits what it learned so tomorrow starts smarter.
      - name: Adaptive probe
        if: ${{ inputs.probe }}
        run: npm run probe

      - name: Commit what the probe learned
        if: ${{ inputs.probe }}
        run: |
          git config user.name 'scentday-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/strategy-memory.json
          if git diff --cached --quiet; then
            echo 'Nothing new learned.'
            exit 0
          fi
          git commit -m "Probe: what the crawler learned $(date -u +%Y-%m-%d)"
          git push

      # The route the probe proved works: ask the sitemap instead of guessing.
      # This is now what runs every night, not just on request. The plain
      # `catalogue` crawl below has never once succeeded live against these
      # shops — every listing this project has ever shown came from the
      # sitemap route, so the schedule has to use it, not the older path.
      #
      # --allow-metered is harmless to pass even with no secret configured:
      # the harvest script checks for APIFY_PROXY_PASSWORD itself and simply
      # skips proxied retrieval if it is absent, logging that it did so. It
      # only ever fires for shops the free route returned nothing for.
      - name: Harvest via sitemap
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        env:
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
        run: |
          npm run harvest -- \
            --max=${{ inputs.harvest_max || '60' }} \
            ${{ (inputs.allow_metered || github.event_name == 'schedule') && '--allow-metered' || '' }}

      - name: Rebuild the app from harvested prices
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          npm run catalogue:demo
          npm run demo

      - name: Commit harvested prices
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          git config user.name 'scentday-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/catalogue demo/catalogue.generated.ts demo/index.html
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m "Harvest: real prices $(date -u +%Y-%m-%d)"
          git push

      # No product photo is ever downloaded or hosted here — every tile links
      # straight to the retailer's own image URL (see demo/photo.ts) — so a
      # retailer reshuffling their CDN silently breaks a tile with nothing
      # else here noticing. This is a report only: it does not change what a
      # fragrance's photoUrl is, only records which ones stopped resolving.
      - name: Check image links
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: npm run images:check

      - name: Commit image link report
        if: ${{ inputs.harvest || github.event_name == 'schedule' }}
        run: |
          git config user.name 'scentday-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/image-link-report.json
          if git diff --cached --quiet; then
            echo 'No change in broken image links.'
            exit 0
          fi
          git commit -m "Image links: $(date -u +%Y-%m-%d)"
          git push

      # Kept for manual comparison against the old guessed-URL approach and
      # for --source=fixtures testing. Deliberately never runs on schedule:
      # it has a 0% success rate against the live shops (see
      # docs/SPIKE-RESULTS.md) and would just fail the job every night.
      - name: Crawl
        if: ${{ !inputs.probe && !inputs.harvest && github.event_name != 'schedule' }}
        run: |
          npm run catalogue -- \
            --source=${{ inputs.source || 'live' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild the app from the new snapshots
        if: ${{ !inputs.dry_run && !inputs.probe && !inputs.harvest && github.event_name != 'schedule' }}
        run: |
          npm run catalogue:demo
          npm run demo

      - name: Commit what changed
        if: ${{ !inputs.dry_run && !inputs.probe && !inputs.harvest && github.event_name != 'schedule' }}
        run: |
          git config user.name 'scentday-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/catalogue demo/catalogue.generated.ts demo/index.html
          if git diff --cached --quiet; then
            echo 'No catalogue changes today.'
            exit 0
          fi
          git commit -m "Catalogue: $(date -u +%Y-%m-%d)"
          git push

      # Keep the failure loud. A crawl that quietly stops working leaves stale
      # prices on the site, which is worse than showing nothing.
      - name: Report failure
        if: failure()
        run: echo "::error::Catalogue crawl failed. Prices on the site are now stale."
