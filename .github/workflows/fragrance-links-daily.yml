name: Fragrance links daily

# Finds direct links for each perfume's own page on its brand's official site
# and on Fragrantica, 30 minutes a day, picking up where the previous day
# stopped. Order: the perfumes shown first on the site (front page rail, Top
# 50, deals), then the top of every brand, note and shop list, then the rest
# by number of shops. See scripts/resolve-fragrance-links.ts.
#
# Perfumes without a found link keep the fallback (brand homepage, Fragrantica
# search), so a short or failed run never breaks a page.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Time budget in minutes'
        default: '30'

permissions:
  contents: write

# The catalogue crawl's group, shared on purpose (2026-10-04): both used to
# commit demo/index.html, demo/404.html and demo/data (now built at deploy
# time instead), and in the same group the two never race each other's push. This run waits while a crawl is going, and
# the crawl's guard skips a tick while an older run of its own is going (see
# scripts/crawl-guard.sh), so a waiting run here is not cancelled by the
# crawl's next tick. A manual crawl dispatch that arrives while this run
# waits does replace it (GitHub keeps one waiting run per group); the next
# day's run picks up where this one would have started.
concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '22'
          cache: npm

      # Retried with backoff (scripts/retry.sh): a registry blip should not
      # cost the run. npm ci starts from an empty node_modules each time.
      - name: Install dependencies
        timeout-minutes: 10
        run: scripts/retry.sh 3 npm ci

      # Exits 0 when the budget runs out, and on rate limits it backs off and
      # ends early rather than failing.
      - name: Resolve links
        timeout-minutes: 40
        run: npm run links:resolve -- --minutes ${{ inputs.minutes || '30' }}

      # The crawl pushes to this branch most hours, so this run's three files
      # are laid on top of the newest commit rather than the one it started
      # from, which keeps the push a fast forward.
      #
      # The page is not rebuilt here any more (2026-10-04): it is built by
      # deploy-pages.yml, which runs when this workflow completes and builds
      # from the branch tip, these links included. All three files are
      # "incoming" in scripts/generated-files.txt, so a push conflict keeps
      # the other side and never needs a rebuild (and this shallow checkout
      # could not replay the price history for one).
      #
      # data/fragrantica-link-review.json is not copied over: people edit it
      # (a page rejected, a gender corrected) and the run only adds the gender
      # of pages it saw for the first time. scripts/merge-page-genders.ts adds
      # those to the latest file and leaves everything else in it alone.
      - name: Lay the links on the latest commit
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/links"
          cp data/fragrance-links.json data/fragrance-links-seen.json data/fragrantica-link-review.json demo/fragranceLinks.generated.ts "$RUNNER_TEMP/links/"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          cp "$RUNNER_TEMP/links/fragrance-links.json" "$RUNNER_TEMP/links/fragrance-links-seen.json" data/
          cp "$RUNNER_TEMP/links/fragranceLinks.generated.ts" demo/
          npx tsx scripts/merge-page-genders.ts "$RUNNER_TEMP/links/fragrantica-link-review.json" data/fragrantica-link-review.json

      - name: Commit and push
        timeout-minutes: 15
        run: |
          ./scripts/commit-and-push.sh \
            "Fragrance links: $(date -u +%Y-%m-%d)" \
            data/fragrance-links.json data/fragrance-links-seen.json \
            data/fragrantica-link-review.json demo/fragranceLinks.generated.ts
