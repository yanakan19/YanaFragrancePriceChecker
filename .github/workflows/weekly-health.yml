name: Weekly health

# Once a week, write a health summary into the job summary, headed by a ranked
# list of the worst cases: which shops answered the last harvest (and which were
# not reached, hit their time budget or errored), each shop's share of listings
# over 24 and 48 hours old, products with no photo, the most stocked products
# whose Fragrantica link is the fallback search, the deploy output against its
# budget (read off the live build-state.json), the slowest crawl run against its
# limit, how every workflow did over the last 7 days (runs, failures, median /
# 90th / longest minutes), and whether the Supabase project answers a read
# (which also keeps a free project from pausing).
# Code: scripts/weekly-health.ts, tested in tests/weeklyHealth.test.ts.
# Plan: docs/FUTUREPROOFING-PLAN.md C1, A6, E1.
#
# Reads the Actions API with the built in token and the committed harvest
# report; commits nothing (so no concurrency group with the crawl) and sends
# nothing: no email. Open the run and read its "Summary" page.
on:
  schedule:
    # Mondays 06:37 UTC, off the hour on purpose (minute 0 is GitHub's busiest).
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: scripts/retry.sh 3 npm ci

      # The catalogue module the photo and link checks read (not committed;
      # replayed from the committed snapshots and build record, as the deploy does).
      - name: Build the catalogue
        timeout-minutes: 8
        run: npx tsx scripts/ensure-catalogue-built.ts

      - name: Write the weekly summary
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/weekly-health.ts
