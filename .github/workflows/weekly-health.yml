name: Weekly health

# Once a week, write a health summary into the job summary: which shops
# answered the last harvest (and which hit their time budget, errored or still
# show listings over 48 hours old), how every workflow did over the last 7 days
# (runs, failures, median / 90th / longest minutes), and whether the Supabase
# project answers a read (which also keeps a free project from pausing).
# Code: scripts/weekly-health.ts, tested in tests/weeklyHealth.test.ts.
# Plan: docs/FUTUREPROOFING-PLAN.md C1, A6, E1.
#
# Reads the Actions API with the built in token and the committed harvest
# report; commits nothing (so no concurrency group with the crawl) and sends
# nothing: no email. Open the run and read its "Summary" page.
on:
  schedule:
    # Mondays 06:37 UTC, off the hour on purpose (minute 0 is GitHub's busiest).
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: scripts/retry.sh 3 npm ci

      - name: Write the weekly summary
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/weekly-health.ts
